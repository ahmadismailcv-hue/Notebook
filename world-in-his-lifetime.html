 villages, farmed taro and yams, fished, and were developing distinct local pottery styles and chiefly societies. Contact continued with Tonga and Samoa to the east and with islands to the west. There are no written records.","events":[{"y":600,"approx":true,"t":"Post-Lapita village societies continue, with distinct regional pottery styles."}],"link":null,"evidence":"sparse"},"Vanuatu":{"polity":"Independent island communities descended from Lapita settlers","summary":"Vanuatu's islands had been settled about 3,000 years earlier by Lapita people. Its communities farmed, fished and traded between islands, and many separate languages developed. Societies were organised around local leaders and graded ranks. Evidence for this period comes only from archaeology.","events":[{"y":600,"approx":true,"t":"Island farming communities continue; no specific dated events are known."}],"link":null,"evidence":"sparse"},"Solomon Is.":{"polity":"Independent Papuan and Austronesian island communities","summary":"The main Solomon Islands had been settled by Papuan-speaking peoples for tens of thousands of years, and Austronesian Lapita descendants lived in the islands and eastern groups such as Santa Cruz. People farmed taro and yams, fished, and traded by canoe. No written records exist for this period.","events":[{"y":600,"approx":true,"t":"Canoe-borne exchange links island communities; evidence is archaeological only."}],"link":null,"evidence":"sparse"},"New Caledonia":{"polity":"Independent chiefdoms (ancestors of the Kanak)","summary":"New Caledonia had been settled about 3,000 years earlier by Lapita people; the type site that gave the Lapita culture its name lies here. Their descendants, ancestors of the Kanak, lived in villages growing yams and taro on terraced and irrigated fields, and fishing. There are no written records, and the period is known only through archaeology.","events":[{"y":600,"approx":true,"t":"Post-Lapita village farming societies continue; no dated events are known."}],"link":null,"evidence":"sparse"},"Antarctica":{"polity":"No human presence","summary":"Antarctica was entirely uninhabited and unknown to any human society. It would not be sighted until 1820.","events":[{"y":600,"approx":true,"t":"No humans; the continent remains unknown."}],"link":null,"evidence":"sparse"},"Fr. S. Antarctic Lands":{"polity":"No human presence","summary":"The Kerguelen, Crozet and other southern Indian Ocean islands had no human inhabitants and were unknown to any society; they were first sighted by Europeans in the 1770s. Only seabirds, seals and penguins lived there.","events":[{"y":600,"approx":true,"t":"No humans; the islands are home only to seabirds and seals."}],"link":null,"evidence":"sparse"},"Albania":{"polity":"Eastern Roman (Byzantine) Empire: provinces of Epirus Nova and Praevalitana","summary":"Still Roman territory, governed from Constantinople, with Dyrrachium (Durrës) as the key Adriatic port and bishopric. Latin- and Greek-speaking Christian communities lived alongside older Illyrian-descended populations. Avar and Slav raids shook the interior from the 580s, and towns shrank toward hilltop forts. The Komani-Kruja burial culture suggests a surviving local Christian population.","events":[{"y":582,"approx":false,"t":"Avar capture of Sirmium opens the western Balkans to deeper Avar and Slav raiding."},{"y":600,"approx":true,"t":"Komani-Kruja hilltop cemeteries show a romanised Christian population persisting in the interior."},{"y":610,"approx":false,"t":"Heraclius becomes emperor; imperial control of the Balkan interior weakens as forces shift east."}],"link":null,"evidence":"sparse"},"Austria":{"polity":"Bavarian duchy (Agilolfings) under Frankish overlordship; Alpine Slavs and Avars in the east","summary":"The west was held by the Bavarians under Agilolfing dukes such as Garibald I and Tassilo I, nominally subject to the Franks. Alpine Slavs, often under Avar domination, settled the eastern Alps and Danube lands. Roman towns such as Lauriacum and Virunum had faded. At Bregenz the Irish monk Columbanus briefly preached to pagan Alamanni.","events":[{"y":592,"approx":true,"t":"Duke Tassilo I of Bavaria campaigns against Slavs in the eastern Alps."},{"y":610,"approx":true,"t":"Columbanus and his companions work at Bregenz on Lake Constance before moving on to Italy."},{"y":623,"approx":true,"t":"Slavs rise against the Avars under Samo; his realm may have reached the lands north of the Danube."}],"link":null,"evidence":"moderate"},"Belarus":{"polity":"Baltic-speaking tribes and arriving Slavs (no state)","summary":"No written sources describe this region in these decades. Archaeology shows small farming and forest communities of Baltic-speaking peoples, such as the Bancer-Tushemlya culture, living in unfortified and hillfort settlements. Early Slavic groups were probably beginning to move in from the south. Religion was local and pagan; trade with the wider world was slight.","events":[{"y":600,"approx":true,"t":"Bancer-Tushemlya culture: small hillforts and cremation burials across the upper Dnieper and Neman basins."}],"link":null,"evidence":"sparse"},"Belgium":{"polity":"Merovingian Franks (Neustria and Austrasia)","summary":"This was part of the old Frankish heartland: Tournai had been an early Merovingian seat. The land was split between Neustria and Austrasia during the civil wars of Fredegund and Brunhild, then reunited under Chlothar II (613) and Dagobert I. Christianity was patchy in the countryside, and missionaries such as Amand worked among pagans along the Scheldt.","events":[{"y":584,"approx":false,"t":"Chilperic I of Neustria is murdered; Fredegund rules for her infant son Chlothar II."},{"y":613,"approx":false,"t":"Chlothar II becomes sole Frankish king after Brunhild's execution."},{"y":629,"approx":false,"t":"Dagobert I becomes king of all the Franks."},{"y":630,"approx":true,"t":"Amand begins missionary work around Ghent and the Scheldt valley."}],"link":null,"evidence":"moderate"},"Bosnia and Herz.":{"polity":"Eastern Roman Empire in name (Dalmatia hinterland); Slav and Avar settlement","summary":"This was the inland part of the Roman province of Dalmatia, with small towns, mines, and late Roman basilicas. From the 580s Avar and Slav raids disrupted the region, and by the early 600s imperial control had largely collapsed. Slavic groups settled the valleys. Written sources are almost silent, so the picture comes mainly from archaeology and abandoned churches.","events":[{"y":582,"approx":false,"t":"Fall of Sirmium to the Avars exposes the Dalmatian interior to raids."},{"y":614,"approx":true,"t":"Avar and Slav attacks on Dalmatia culminate around the fall of Salona; inland Roman life largely ends."}],"link":null,"evidence":"sparse"},"Bulgaria":{"polity":"Eastern Roman Empire (Thrace and Moesia), under Avar and Slav pressure","summary":"This was Roman Thrace and Moesia, close to Constantinople and heavily fortified along the Danube. Avar and Slav raids, especially from the 580s, ravaged towns. Emperor Maurice fought back in the 590s, but his order for troops to winter north of the Danube caused the mutiny of 602 that put Phocas on the throne. After about 615 imperial control here shrank to the coasts and fortresses.","events":[{"y":586,"approx":true,"t":"Avars and Slavs raid deep into Thrace and Moesia, taking several Danube and Black Sea towns."},{"y":593,"approx":false,"t":"Maurice's general Priscus crosses the Danube against the Slavs."},{"y":602,"approx":false,"t":"Army on the Danube mutinies; Phocas marches on Constantinople and Maurice is killed."},{"y":626,"approx":false,"t":"Avar-led armies pass through Thrace to besiege Constantinople."}],"link":null,"evidence":"moderate"},"Croatia":{"polity":"Eastern Roman Empire (Dalmatia and Istria), collapsing before Avars and Slavs","summary":"Roman Dalmatia, centred on Salona, remained Christian and Latin-speaking under Constantinople, and its bishops corresponded with Pope Gregory I. From the late 500s Avar and Slav raids devastated the interior. Salona fell around 614, and survivors are traditionally said to have sheltered in Diocletian's palace at Split. Croats arrived around Heraclius' reign according to a later, disputed Byzantine account.","events":[{"y":593,"approx":false,"t":"Pope Gregory I opposes the election of Maximus as bishop of Salona, a dispute lasting until 599."},{"y":614,"approx":true,"t":"Salona falls to Avars and Slavs; refugees settle in Diocletian's palace at Split (date disputed)."},{"y":626,"approx":true,"t":"Croats settle in Dalmatia under Heraclius, according to the 10th-century De Administrando Imperio (disputed)."}],"link":null,"evidence":"moderate"},"Czechia":{"polity":"Slavic tribes; core of Samo's realm (c. 623–658)","summary":"Slavic farmers of the Prague-type culture lived in small villages, many under Avar domination. Around 623 a Frankish merchant named Samo led the Wends in revolt against the Avars and became their king, ruling for some 35 years. Bohemia or Moravia was likely at the heart of his realm. Our main source is the Frankish Chronicle of Fredegar.","events":[{"y":600,"approx":true,"t":"Prague-type culture: Slavic sunken-floor houses and cremation burials across Bohemia and Moravia."},{"y":623,"approx":true,"t":"Samo leads the Wends against the Avars and is chosen king."},{"y":631,"approx":true,"t":"Samo defeats Dagobert I's Frankish army at Wogastisburg (location unknown)."}],"link":null,"evidence":"moderate"},"Denmark":{"polity":"Danish chieftains and petty kings (Late Germanic Iron Age)","summary":"Jutland and the islands were held by chieftains and petty kings; the Danes were already a known people. Great halls such as those at Lejre and Gudme show wealthy elites, gift-giving, and pagan cult. Farming, cattle, and trade in gold, glass, and weapons tied the region to the Continent. Written sources are almost absent; later legends like Beowulf echo this era.","events":[{"y":600,"approx":true,"t":"Royal hall complex at Lejre on Zealand in use as a seat of power."},{"y":600,"approx":true,"t":"Animal-style gold bracteates and weapons in rich graves and hoards reflect a warrior elite."}],"link":null,"evidence":"sparse"},"Estonia":{"polity":"Finnic-speaking communities (no state)","summary":"Finnic-speaking farmers, fishers, and hunters lived in small communities, with hillforts and stone-grave cemeteries. There were no towns or written records. Iron-working and contacts across the Baltic with Scandinavia are visible in grave goods. Religion was local and pagan. Almost everything known comes from archaeology.","events":[{"y":600,"approx":true,"t":"Hillforts and stone-grave cemeteries mark local Finnic power centres; Scandinavian goods appear in burials."}],"link":null,"evidence":"sparse"},"Finland":{"polity":"Finnic and Sámi communities (no state)","summary":"Coastal and southwestern Finland held Finnic farming and fishing communities, while Sámi hunters and reindeer-herders ranged across the interior and north. Archaeologists call this the Merovingian period, marked by weapons and jewellery showing contacts with Sweden and the eastern Baltic. There were no towns, kings, or writing. Evidence is almost entirely archaeological.","events":[{"y":600,"approx":true,"t":"Merovingian-period cemeteries in southwest Finland contain swords and jewellery from Scandinavian contacts."}],"link":null,"evidence":"sparse"},"France":{"polity":"Merovingian Franks (Neustria, Austrasia, Burgundy, Aquitaine)","summary":"Gaul was ruled by Merovingian kings whose kingdoms fought bitter civil wars, driven partly by the rivalry of Queens Fredegund and Brunhild. Chlothar II reunited the realm in 613 and issued the Edict of Paris, and his son Dagobert I ruled from Paris over a wealthy, Catholic kingdom. Gregory of Tours wrote his Histories, and Columbanus founded Luxeuil.","events":[{"y":587,"approx":false,"t":"Treaty of Andelot between Guntram of Burgundy and Childebert II."},{"y":590,"approx":true,"t":"Columbanus founds the monastery of Luxeuil in the Vosges."},{"y":594,"approx":true,"t":"Gregory of Tours, author of the Histories, dies."},{"y":613,"approx":false,"t":"Brunhild is executed by Chlothar II, who becomes sole king of the Franks."},{"y":614,"approx":false,"t":"Chlothar II issues the Edict of Paris, setting terms with bishops and nobles."},{"y":629,"approx":false,"t":"Dagobert I becomes king of all the Franks and rules from Paris."}],"link":null,"evidence":"rich"},"Germany":{"polity":"Merovingian Franks (Austrasia) with subject Alamanni, Bavarians and Thuringians; independent Saxons","summary":"The Rhineland around Cologne, Mainz, and Trier formed part of Frankish Austrasia, with Christian bishops and surviving Roman towns. Further east, Alamanni, Bavarians, and Thuringians lived under dukes who owed the Franks loose allegiance, while the Saxons in the north stayed pagan and independent. Dagobert I was made king of Austrasia in 623 and later fought Samo's Slavs.","events":[{"y":612,"approx":false,"t":"Theuderic II defeats his brother Theudebert II near Zülpich and Tolbiac."},{"y":623,"approx":false,"t":"Chlothar II makes his son Dagobert I king of Austrasia."},{"y":631,"approx":true,"t":"Bulgar refugees from Avar Pannonia shelter in Bavaria and are massacred on Dagobert's orders."},{"y":632,"approx":true,"t":"After the defeat by Samo, Dagobert appoints Radulf duke of Thuringia to guard against the Wends."}],"link":null,"evidence":"moderate"},"Greece":{"polity":"Eastern Roman (Byzantine) Empire, with Slav settlement inland","summary":"Greece was Roman territory ruled from Constantinople, and Greek-speaking and Christian. Thessalonica was the great city of the region, while Athens and Corinth had shrunk. From the 580s Slavs, often linked with the Avars, raided and settled much of the interior and the Peloponnese, while the empire held the coasts and fortified cities. Heraclius became emperor in 610.","events":[{"y":586,"approx":true,"t":"Avars and Slavs besiege Thessalonica, which credits its deliverance to Saint Demetrius."},{"y":587,"approx":true,"t":"Slavs occupy much of the Peloponnese, according to the later Chronicle of Monemvasia (disputed)."},{"y":610,"approx":false,"t":"Heraclius overthrows Phocas and becomes emperor."},{"y":616,"approx":true,"t":"Slavic groups besiege Thessalonica by land and sea; the city holds."}],"link":null,"evidence":"moderate"},"Hungary":{"polity":"Avar Khaganate (heartland in the Carpathian Basin)","summary":"The Carpathian Basin was the centre of the Avar Khaganate, a steppe empire ruled by a khagan, with Gepids, Slavs, and other subject peoples. Under Bayan I the Avars took Sirmium in 582 and extorted heavy tribute from Constantinople. After their failed siege of Constantinople in 626, the khaganate faced revolts by Slavs and Bulgars. Rich warrior graves reflect their wealth.","events":[{"y":582,"approx":false,"t":"Khagan Bayan I takes Sirmium after a long siege."},{"y":599,"approx":false,"t":"Byzantine general Priscus defeats the Avars near Viminacium."},{"y":626,"approx":false,"t":"The Avar khagan leads a failed siege of Constantinople with Slav and Persian allies."},{"y":631,"approx":true,"t":"Civil war between Avars and Bulgars over the khaganate; the defeated Bulgars flee west."}],"link":null,"evidence":"moderate"},"Iceland":{"polity":"Uninhabited","summary":"Iceland had no human population in these decades as far as any evidence shows. Irish hermits (papar) are reported there only by the monk Dicuil around 825, describing visits of the 790s; any earlier presence is speculation. The island remained untouched wilderness of birch woods, birds, and seals until Norse settlement around 870.","events":[{"y":600,"approx":true,"t":"No archaeological trace of human presence; Irish monastic seafaring is attested elsewhere but not here."}],"link":null,"evidence":"sparse"},"Ireland":{"polity":"Irish kingdoms (Uí Néill and many others)","summary":"Ireland was a patchwork of small kingdoms under over-kings such as the Uí Néill, with a rich law tradition and an already Christian elite. Monasticism flourished: Columba founded Iona and died there in 597, and Columbanus left Bangor for the Continent around 590, founding Luxeuil and Bobbio. Irish scholars debated the date of Easter, and Latin learning thrived.","events":[{"y":575,"approx":true,"t":"Convention of Druim Cett between the Uí Néill and Dál Riata, attended by Columba."},{"y":590,"approx":true,"t":"Columbanus leaves Bangor for Gaul with twelve companions."},{"y":597,"approx":false,"t":"Columba dies on Iona."},{"y":632,"approx":true,"t":"Cummian's letter on the Easter controversy urges Irish churches to adopt the Roman reckoning."}],"link":null,"evidence":"moderate"},"Italy":{"polity":"Lombard kingdom and duchies; Byzantine Exarchate of Ravenna; papal Rome","summary":"Italy was divided after the Lombards invaded in 568. Lombard kings ruled from Pavia, with powerful dukes at Spoleto and Benevento, while Byzantium held Ravenna, Rome, Naples, and the south. Pope Gregory I (590–604) organised Rome's defence, food supply, and missions. Queen Theodelinda supported Catholicism, and Columbanus founded Bobbio.","events":[{"y":568,"approx":false,"t":"The Lombards under Alboin invade Italy."},{"y":590,"approx":false,"t":"Gregory I becomes pope; Agilulf becomes Lombard king."},{"y":593,"approx":false,"t":"Agilulf besieges Rome; Gregory negotiates the city's survival."},{"y":609,"approx":true,"t":"The Pantheon in Rome is consecrated as a church by Pope Boniface IV."},{"y":614,"approx":true,"t":"Columbanus founds the monastery of Bobbio with Lombard royal support."}],"link":null,"evidence":"rich"},"Kosovo":{"polity":"Eastern Roman Empire (Dardania), giving way to Slav settlement","summary":"This was the Roman province of Dardania, with towns such as Ulpiana (refounded by Justinian as Justiniana Secunda) and important mines. From the 580s Avar and Slav incursions destroyed or emptied many sites, and imperial control faded in the early 600s. Slavic groups settled the land. Written evidence is thin, so the picture relies mostly on archaeology.","events":[{"y":586,"approx":true,"t":"Avar and Slav raids sweep through the central Balkans."},{"y":615,"approx":true,"t":"Urban life at Ulpiana and other Dardanian towns has largely ended."}],"link":null,"evidence":"sparse"},"Latvia":{"polity":"Baltic and Finnic tribes (no state)","summary":"Baltic-speaking peoples, ancestors of the later Curonians, Semigallians, Selonians, and Latgalians, lived alongside Finnic Livonians near the coast. They farmed, fished, and traded amber, living in villages and hillforts. There were no towns or written records, and religion was local and pagan. Our knowledge comes almost entirely from archaeology.","events":[{"y":600,"approx":true,"t":"Hillforts and rich warrior burials show emerging local elites along the Daugava and coast."}],"link":null,"evidence":"sparse"},"Lithuania":{"polity":"Baltic tribes (no state)","summary":"Baltic-speaking peoples lived in farming villages and hillforts, with cremation and inhumation cemeteries showing weapons, horse gear, and ornaments. The amber coast linked them to Scandinavia and, more distantly, to the Roman world. There were no towns or writing, and religion was pagan. Tribal names such as Samogitians are attested only centuries later.","events":[{"y":600,"approx":true,"t":"Hillfort building and horse burials mark warrior elites among the Baltic tribes."}],"link":null,"evidence":"sparse"},"Luxembourg":{"polity":"Merovingian Franks (Austrasia)","summary":"The region lay in Austrasia, the eastern Frankish kingdom, near the old Roman city of Trier with its bishops. Villages of Frankish and romanised farmers worked the land, and row-grave cemeteries show a Christianising rural society. Its kings were caught up in the wars between Brunhild's heirs and Neustria until Chlothar II reunited the realm. Local written detail is scarce.","events":[{"y":613,"approx":false,"t":"Austrasia passes to Chlothar II after the fall of Brunhild."},{"y":623,"approx":false,"t":"Dagobert I becomes king of Austrasia, which includes the Trier region."}],"link":null,"evidence":"sparse"},"Macedonia":{"polity":"Eastern Roman Empire (Macedonia and Dardania), with growing Slav settlement","summary":"This upper Vardar region belonged to the Roman provinces of Macedonia and Dardania. Towns such as Stobi and Heraclea Lyncestis declined sharply in the late 500s as Avar and Slav raids hit the Balkans. By the early 600s Slavic tribes, later named in Byzantine sources, had settled widely, while the empire clung to Thessalonica to the south. Evidence is fragmentary.","events":[{"y":586,"approx":true,"t":"Avar and Slav raids reach the region during the push toward Thessalonica."},{"y":610,"approx":true,"t":"Stobi and Heraclea Lyncestis are largely abandoned as urban centres."},{"y":616,"approx":true,"t":"Slavic tribes from the Macedonian interior join attacks on Thessalonica."}],"link":null,"evidence":"sparse"},"Moldova":{"polity":"Slavic (Antes) communities under Avar and steppe pressure","summary":"Slavic farmers of the Penkovka culture, probably the Antes of Byzantine writers, lived in small villages of sunken houses. Steppe nomads and the Avars dominated the open lands. There were no towns or kings recorded here. Byzantine historians mention the Antes as allies of the empire, but sources say almost nothing specific about this territory.","events":[{"y":602,"approx":false,"t":"The Avars send a force against the Antes, allies of Byzantium, according to Theophylact Simocatta."}],"link":null,"evidence":"sparse"},"Montenegro":{"polity":"Eastern Roman Empire (Praevalitana), giving way to Slav settlement","summary":"This was the Roman province of Praevalitana, with Doclea as an inland centre and small coastal towns on the Adriatic. Raids by Avars and Slavs from the 580s undermined Roman life in the interior, and Slavs settled there in the early 600s. Coastal towns survived longer under Byzantine control. Written sources are very thin.","events":[{"y":600,"approx":true,"t":"Doclea and other inland Roman towns decline under Avar and Slav pressure."},{"y":620,"approx":true,"t":"Slavic settlement spreads through the interior while coastal towns remain Byzantine."}],"link":null,"evidence":"sparse"},"Netherlands":{"polity":"Frisians in the north; Merovingian Franks in the south","summary":"Frisians lived on raised mounds (terpen) along the coast, trading cloth, cattle, and slaves across the North Sea, and remained pagan. The south lay within the Frankish realm. Around the Rhine fork, Dorestad was emerging as a trading centre, and Utrecht became a contested frontier point between Franks and Frisians. Written sources are scarce.","events":[{"y":600,"approx":true,"t":"Frisian terp settlements thrive on North Sea trade."},{"y":630,"approx":true,"t":"Dorestad emerges as a trading place; Frankish coins begin to be struck there."}],"link":null,"evidence":"sparse"},"Norway":{"polity":"Local chieftains and petty kingdoms (Merovingian period)","summary":"Norway was divided among chieftains controlling farms, fjords, and coastal routes. Boathouses, hillforts, and rich graves show a warrior aristocracy, and pagan cult centred on local halls. Iron, furs, and walrus or seal products may have been traded southward. There are no contemporary written sources, so everything is archaeological.","events":[{"y":600,"approx":true,"t":"Large boathouses and chieftains' graves along the western coast show maritime warrior elites."}],"link":null,"evidence":"sparse"},"Poland":{"polity":"Slavic tribes and Baltic peoples (no state)","summary":"Slavic communities of the Prague-Korchak culture spread across the region, living in small villages of sunken houses and practising cremation. Baltic-speaking peoples held the northeast, near the amber coast. There were no towns, kings, or writing, and religion was pagan. Byzantine and Frankish writers say little about this area, so the picture is archaeological.","events":[{"y":600,"approx":true,"t":"Prague-Korchak Slavic settlements spread across the Vistula and Oder basins."}],"link":null,"evidence":"sparse"},"Portugal":{"polity":"Suebic kingdom of Gallaecia, absorbed by the Visigoths in 585","summary":"In the north the Suebi ruled a Catholic kingdom from Braga, where Bishop Martin of Braga had strengthened the church. In 585 the Visigothic king Leovigild conquered it, and the whole region became part of Visigothic Spain. Lusitania in the south, with Mérida nearby, was already Visigothic. Romanised towns, estates, and bishoprics continued.","events":[{"y":579,"approx":true,"t":"Martin of Braga, missionary bishop to the Suebi, dies."},{"y":583,"approx":true,"t":"Suebic king Miro aids Leovigild's rebel son Hermenegild and dies soon after."},{"y":585,"approx":false,"t":"Leovigild conquers the Suebic kingdom and makes it a Visigothic province."},{"y":589,"approx":false,"t":"Former Suebic bishops join the Third Council of Toledo under Reccared."}],"link":null,"evidence":"moderate"},"Romania":{"polity":"Slavs and Avars north of the Danube; Byzantine Dobruja","summary":"North of the Danube, Slavic groups such as those led by Ardagast lived in villages of the Ipotești-Cândești culture, often under Avar overlordship, and raided the empire. In the 590s Emperor Maurice sent armies across the river against them. Dobruja, south of the Danube delta, remained Byzantine until the frontier collapsed in the early 600s. Byzantine historians give some detail.","events":[{"y":593,"approx":false,"t":"Byzantine general Priscus crosses the Danube and defeats the Slav leader Ardagast."},{"y":594,"approx":true,"t":"Maurice's brother Peter campaigns against Slavs north of the Danube."},{"y":602,"approx":false,"t":"Maurice orders the army to winter north of the Danube, triggering the mutiny that topples him."}],"link":null,"evidence":"moderate"},"Russia":{"polity":"Western Turks and emerging Khazars in the south; Old Great Bulgaria (c. 632); Finno-Ugric forest peoples","summary":"The southern steppe and north Caucasus were dominated by the Western Turkic Khaganate, out of which the Khazars emerged; Turkic or Khazar forces aided Heraclius against Persia in 627. Around 632 the Bulgar ruler Kubrat founded Old Great Bulgaria near the Sea of Azov. The vast forest zone held Finno-Ugric hunters and farmers, known only from archaeology.","events":[{"y":600,"approx":true,"t":"Imenkovo and other forest-zone cultures farm and hunt along the middle Volga and Kama."},{"y":627,"approx":false,"t":"Turkic forces, called Khazars by Byzantine writers, join Heraclius to besiege Tiflis."},{"y":632,"approx":true,"t":"Kubrat unites the Bulgars as Old Great Bulgaria north of the Black Sea and Sea of Azov."}],"link":null,"evidence":"moderate"},"Serbia":{"polity":"Eastern Roman Empire (Moesia, Dardania), contested by the Avars","summary":"This was the Danube frontier of the Roman Empire, guarded by Singidunum (Belgrade) and Viminacium, near Sirmium in the Avar sphere. Justiniana Prima, the city Justinian built near his birthplace, was still an archbishopric. Avar sieges and Slav raids from the 580s destroyed the frontier, and by about 615 most Roman towns were abandoned. Serbs arrived later under Heraclius, according to a disputed account.","events":[{"y":582,"approx":false,"t":"Sirmium falls to the Avars after a long siege."},{"y":584,"approx":true,"t":"Avars take Singidunum and raid along the Danube."},{"y":599,"approx":false,"t":"Priscus defeats the Avars near Viminacium."},{"y":615,"approx":true,"t":"Justiniana Prima (Caričin Grad) is abandoned."}],"link":null,"evidence":"moderate"},"Slovakia":{"polity":"Slavs under Avar rule; probably part of Samo's realm (c. 623–658)","summary":"Slavic farmers settled here in the 500s, living under Avar domination, with the Avar heartland just south across the Danube. Around 623 Samo led the Slavs in revolt against the Avars, and his realm may have included western parts of this land. There were no towns, and religion was pagan. The main written source is the Chronicle of Fredegar.","events":[{"y":600,"approx":true,"t":"Slavic villages of the Prague type spread along the river valleys under Avar overlordship."},{"y":623,"approx":true,"t":"Samo leads the Wends against the Avars and becomes king."}],"link":null,"evidence":"sparse"},"Slovenia":{"polity":"Alpine Slavs under Avar overlordship; old Roman Noricum and Pannonia","summary":"Roman towns such as Emona and Celeia had largely been abandoned by the late 500s. Alpine Slavs, often subject to the Avars, settled the valleys and clashed with the Bavarians. Fredegar mentions a Slavic duke Walluc around 631, sometimes linked to this region, possibly within Samo's orbit. Christianity survived only in remote pockets.","events":[{"y":592,"approx":true,"t":"Bavarian duke Tassilo I fights Slavs in the eastern Alps."},{"y":600,"approx":true,"t":"Alpine Slavs settle the former Roman Noricum region under Avar overlordship."},{"y":631,"approx":true,"t":"Fredegar records a Slavic 'Marca Vinedorum' under Duke Walluc."}],"link":null,"evidence":"sparse"},"Spain":{"polity":"Visigothic kingdom of Toledo (with Byzantine Spania in the southeast until c. 625)","summary":"The Visigoths ruled from Toledo. Leovigild absorbed the Suebic kingdom in 585, and his son Reccared converted from Arian to Catholic Christianity, uniting Goths and Hispano-Romans in faith. Isidore of Seville became the greatest scholar of the age. King Sisebut pressured Jews to convert, and Suinthila expelled the last Byzantine garrisons from the southeast coast.","events":[{"y":585,"approx":false,"t":"Leovigild conquers the Suebic kingdom in the northwest."},{"y":587,"approx":false,"t":"Reccared converts to Catholic Christianity."},{"y":589,"approx":false,"t":"Third Council of Toledo formally makes the Visigothic kingdom Catholic."},{"y":600,"approx":true,"t":"Isidore becomes bishop of Seville, writing the Etymologies over later decades."},{"y":612,"approx":true,"t":"Sisebut becomes king and orders the forced conversion of Jews."},{"y":625,"approx":true,"t":"Suinthila drives the last Byzantine forces from Spain."}],"link":null,"evidence":"rich"},"Sweden":{"polity":"Svear and Götar chieftains (Vendel period)","summary":"This is the Vendel period, named after rich boat burials at Vendel and Valsgärde in Uppland. The Svear around Uppsala, with its great royal mounds, and the Götar to the south were ruled by warrior chieftains. Helgö was a craft and trading centre, and Gotland raised picture stones. Religion was pagan, and no contemporary writing survives.","events":[{"y":600,"approx":true,"t":"Vendel and Valsgärde boat burials with helmets and weapons show a rich warrior elite."},{"y":600,"approx":true,"t":"Gamla Uppsala's great mounds and halls serve as a royal and cult centre."}],"link":null,"evidence":"sparse"},"Switzerland":{"polity":"Merovingian Franks (Burgundy) and Alamanni","summary":"The west belonged to the Frankish kingdom of Burgundy, with Romanised towns and bishops at places such as Lausanne. The north and east were settled by Alamanni, still largely pagan, under dukes subject to the Franks. Bishop Marius of Avenches wrote a chronicle, and the Irish monk Gallus settled as a hermit near Lake Constance, the origin of Saint Gall.","events":[{"y":594,"approx":true,"t":"Marius, bishop of Avenches and Lausanne and author of a chronicle, dies."},{"y":612,"approx":true,"t":"Gallus, a companion of Columbanus, stays behind as a hermit near Lake Constance."},{"y":613,"approx":false,"t":"Burgundy passes to Chlothar II after the fall of Brunhild."}],"link":null,"evidence":"moderate"},"Ukraine":{"polity":"Antes and other Slavs; Pontic steppe nomads; Old Great Bulgaria (c. 632)","summary":"In the forest-steppe lived the Antes, Slavic farmers of the Penkovka culture who sometimes allied with Byzantium. The steppe was crossed by nomads under Avar and Western Turkic power. Around 602 the Avars attacked the Antes, who disappear from the sources soon after. Around 632 the Bulgar ruler Kubrat formed Old Great Bulgaria on the Pontic steppe.","events":[{"y":602,"approx":false,"t":"The Avars attack the Antes, allies of Byzantium."},{"y":632,"approx":true,"t":"Kubrat unites the Bulgars and forms Old Great Bulgaria on the Pontic steppe."}],"link":null,"evidence":"moderate"},"United Kingdom":{"polity":"Anglo-Saxon kingdoms (Kent, East Anglia, Northumbria, etc.), British kingdoms, Picts and Dál Riata","summary":"England was split among Anglo-Saxon kingdoms, with British kingdoms in the west and north and Picts and Gaelic Dál Riata in Scotland. Pope Gregory I sent Augustine to Kent in 597, where Æthelberht converted. Rædwald of East Anglia was likely buried at Sutton Hoo around 625, and Edwin of Northumbria was baptised in 627. Iona's monks spread Christianity in the north.","events":[{"y":597,"approx":false,"t":"Augustine's mission reaches Kent; King Æthelberht soon accepts baptism."},{"y":603,"approx":true,"t":"Æthelfrith of Northumbria defeats Áedán of Dál Riata at Degsastan."},{"y":616,"approx":true,"t":"Rædwald defeats Æthelfrith at the River Idle and makes Edwin king of Northumbria."},{"y":625,"approx":true,"t":"The Sutton Hoo ship burial, probably Rædwald's, is made."},{"y":627,"approx":false,"t":"Edwin of Northumbria is baptised at York by Paulinus."}],"link":null,"evidence":"rich"},"Greenland":{"polity":"Probably uninhabited (gap between Early and Late Dorset)","summary":"Greenland appears to have been largely empty of people in these decades. Earlier Palaeo-Inuit groups, including the Greenlandic Dorset, had lived there before about the start of the common era, and Late Dorset people returned to the northwest around 800. Meanwhile Dorset Palaeo-Inuit hunted seals and walrus in nearby Arctic Canada. Evidence is purely archaeological and dating is uncertain.","events":[{"y":600,"approx":true,"t":"No firm archaeological evidence of human occupation; Dorset Palaeo-Inuit live in the Canadian Arctic nearby."}],"link":null,"evidence":"sparse"},"Saudi Arabia":{"polity":"Independent Arabian tribes and towns (Quraysh of Mecca, Aws and Khazraj of Yathrib); Muslim community at Medina from 622","summary":"The Hijaz had no state: Mecca, run by the Quraysh, was a sanctuary town and caravan hub around the Kaaba, while Yathrib (Medina) was an oasis of Arab and Jewish clans. Muhammad, born in Mecca, preached from c. 610, moved to Medina in 622 and by 632 led most of Arabia. Dates follow the traditional Islamic biographical sources, written down a century or more later.","events":[{"y":570,"approx":true,"t":"Muhammad is born in Mecca in the 'Year of the Elephant', when tradition says Abraha's Aksumite-backed army marched on the town."},{"y":610,"approx":true,"t":"Muhammad receives his first revelation in the cave of Hira near Mecca, according to tradition."},{"y":622,"approx":false,"t":"The Hijra: Muhammad and his followers move from Mecca to Yathrib (Medina), later year one of the Islamic calendar."},{"y":624,"approx":true,"t":"The Muslims of Medina defeat a larger Meccan force at Badr."},{"y":630,"approx":true,"t":"Mecca surrenders to Muhammad with little fighting, and the idols of the Kaaba are destroyed."},{"y":632,"approx":true,"t":"Muhammad dies in Medina; Abu Bakr becomes the first caliph and fights the Ridda wars against breakaway tribes."}],"link":"This was the homeland of Muhammad and the first Muslim community, at Mecca and Medina.","evidence":"moderate"},"Yemen":{"polity":"Former Himyarite kingdom under Aksumite rule (Abraha), then a Sasanian Persian province from c. 570s","summary":"Himyar, once a Jewish-ruled kingdom, had fallen to Christian Aksum in the 520s, and the general Abraha ruled at Sanaa. In the 570s a Persian expedition invited by Sayf ibn Dhi Yazan drove out the Aksumites, and Persian governors ruled through the local 'Abna'. The famous Marib dam was failing, and the old South Arabian kingdoms had faded.","events":[{"y":570,"approx":true,"t":"Abraha, Aksumite ruler of Yemen, leads his traditional expedition north toward Mecca and dies soon after."},{"y":575,"approx":true,"t":"A Sasanian force under Wahriz, backing Sayf ibn Dhi Yazan, expels the Aksumites and makes Yemen a Persian client."},{"y":628,"approx":true,"t":"Badhan, the Persian governor of Yemen, accepts Islam after Khosrow II's fall, according to Islamic tradition."},{"y":632,"approx":true,"t":"Al-Aswad al-Ansi leads a revolt in Yemen claiming prophethood and is killed shortly before or after Muhammad's death."}],"link":"Yemen's Persian governor and many tribes submitted to Muhammad c. 628–631, and he sent envoys and teachers such as Mu'adh ibn Jabal there.","evidence":"moderate"},"Oman":{"polity":"Azd tribes under the Julanda family, with Sasanian garrisons on the coast","summary":"Oman was home to Azd Arab tribes led by the Julanda family, while Sasanian Persia controlled coastal ports such as Sohar and parts of the irrigated interior. The region lived from date farming, copper and Indian Ocean trade. Written sources are thin and mostly from later Islamic histories.","events":[{"y":600,"approx":true,"t":"Sasanian Persia holds coastal Oman, sharing power with the Julanda rulers of the Azd inland."},{"y":630,"approx":true,"t":"Jayfar and Abd, sons of al-Julanda, accept Islam after Muhammad's envoy Amr ibn al-As arrives, according to tradition."},{"y":632,"approx":true,"t":"Some Omani tribes break away after Muhammad's death and are brought back in the Ridda wars."}],"link":"The Julanda rulers of Oman accepted Islam c. 630 through Muhammad's envoy Amr ibn al-As, according to tradition.","evidence":"sparse"},"United Arab Emirates":{"polity":"Azd and other Arab tribes on the edge of Sasanian-influenced Oman","summary":"This coast was part of greater Oman, with tribal Arab groups, oasis farming at places like Tawam (Buraimi/Al Ain), and the market town of Dibba. Sasanian influence reached the coast. A Christian monastery on Sir Bani Yas island shows a Church of the East presence around this era. Written evidence is very sparse.","events":[{"y":600,"approx":true,"t":"Dibba serves as a major market and port for the Omani coast."},{"y":610,"approx":true,"t":"A Church of the East monastery operates on Sir Bani Yas island, dated by archaeology to roughly the 7th–8th centuries."},{"y":633,"approx":true,"t":"Muslim forces defeat rebel tribes at Dibba during the Ridda wars, according to later Islamic histories."}],"link":"As part of the Oman region, its tribes came under the Julanda's submission to Muhammad c. 630 and fought in the Ridda wars after 632.","evidence":"sparse"},"Qatar":{"polity":"Beth Qatraye, a Christian Arab region within Sasanian-influenced eastern Arabia (al-Bahrayn)","summary":"Qatar formed part of the Syriac-speaking Christian region of Beth Qatraye in the Church of the East, under Sasanian influence. Pearl-diving, fishing and pastoralism supported small settlements. Later Beth Qatraye produced writers such as Isaac of Nineveh. Evidence for the period is sparse.","events":[{"y":600,"approx":true,"t":"Beth Qatraye bishoprics belong to the Church of the East under Sasanian authority."},{"y":629,"approx":true,"t":"Al-Mundhir ibn Sawa, ruler in al-Bahrayn (eastern Arabia), accepts Islam after Muhammad's envoy al-Ala al-Hadrami arrives, according to tradition."}],"link":"Eastern Arabia, including this area, submitted to Muhammad's envoy al-Ala al-Hadrami c. 629, according to tradition.","evidence":"sparse"},"Kuwait":{"polity":"Arab tribes on the Sasanian frontier of southern Mesopotamia","summary":"The Kuwait coast lay at the southern edge of Sasanian Mesopotamia, with Kazima as a known watering place and anchorage. Bedouin tribes such as the Bakr ibn Wa'il moved through the area. Archaeology on Failaka island shows a Christian settlement roughly from this era. Written evidence is sparse.","events":[{"y":600,"approx":true,"t":"Kazima serves as a stopping place on routes between Arabia and Sasanian Iraq."},{"y":633,"approx":true,"t":"Khalid ibn al-Walid defeats the Persian commander Hormuz at Kazima, the 'Battle of Chains', opening the conquest of Iraq."}],"link":null,"evidence":"sparse"},"Iraq":{"polity":"Sasanian Empire (capital Ctesiphon), with the Lakhmid Arab client kingdom at al-Hira until c. 602","summary":"Mesopotamia was the rich farming heart of the Sasanian Empire and home to its capital Ctesiphon. Large Christian (Church of the East) and Jewish communities lived here, and the Babylonian Talmud's academies flourished. Khosrow II ended the Lakhmid client kingdom of al-Hira c. 602, weakening the desert frontier. The war with Byzantium ended in defeat and civil strife after 628.","events":[{"y":602,"approx":true,"t":"Khosrow II deposes and kills al-Nu'man III, ending the Lakhmid kingdom of al-Hira."},{"y":609,"approx":true,"t":"Arab tribes led by the Bakr ibn Wa'il defeat a Persian force at Dhi Qar; the date is disputed, c. 604–611."},{"y":627,"approx":false,"t":"Heraclius defeats the Persian army near Nineveh in December and advances toward Ctesiphon."},{"y":628,"approx":false,"t":"Khosrow II is overthrown and killed in Ctesiphon; his son Kavad II makes peace and dies within months amid plague."},{"y":637,"approx":true,"t":"Arab Muslim armies win at al-Qadisiyya and take Ctesiphon."}],"link":"The end of the Lakhmids and the Arab victory at Dhi Qar weakened Persia's Arabian frontier, which Muslim armies crossed soon after 632.","evidence":"moderate"},"Iran":{"polity":"Sasanian Empire (Hormizd IV, Khosrow II, then rapid succession)","summary":"Iran was the core of the Sasanian Empire, with Zoroastrianism as the state faith and great fire temples such as Adur Gushnasp in Atropatene. Khosrow II won a vast war against Byzantium after 602 but lost it in 622–628, and was killed in 628. Many short reigns followed until Yazdegerd III took the throne in 632.","events":[{"y":590,"approx":false,"t":"The general Bahram Chobin rebels and Hormizd IV is killed; Khosrow II flees to Byzantium."},{"y":591,"approx":false,"t":"With help from the Byzantine emperor Maurice, Khosrow II defeats Bahram Chobin and regains the throne."},{"y":624,"approx":false,"t":"Heraclius invades Atropatene and sacks the fire temple of Adur Gushnasp at Takht-i Sulaiman."},{"y":628,"approx":false,"t":"Khosrow II is deposed and killed; his son Kavad II makes peace with Byzantium."},{"y":632,"approx":false,"t":"Yazdegerd III, the last Sasanian king, comes to the throne after years of civil strife."}],"link":"Islamic tradition says Muhammad sent a letter inviting Khosrow II to Islam c. 628, which the king tore up.","evidence":"moderate"},"Syria":{"polity":"Byzantine Empire (provinces of Syria and Phoenicia), with Ghassanid Arab allies; Persian occupation c. 611–628","summary":"Syria was a rich Byzantine land of cities such as Antioch, Damascus and Bostra, split between Chalcedonian and Miaphysite Christians. The Ghassanid Arab federation guarded the desert frontier until Byzantium arrested its king al-Mundhir in 581/582 and the federation broke up. Persia occupied Syria from c. 611 until Heraclius regained it in 628–630.","events":[{"y":582,"approx":true,"t":"Byzantium arrests the Ghassanid king al-Mundhir and exiles him, and the Ghassanid federation splinters."},{"y":611,"approx":false,"t":"Persian armies under Shahrbaraz take Antioch."},{"y":613,"approx":false,"t":"Damascus falls to the Persians."},{"y":630,"approx":true,"t":"After the peace of 628, Byzantine rule is restored across Syria as Persian troops withdraw."},{"y":636,"approx":false,"t":"Arab Muslim armies defeat the Byzantines at the Yarmuk, opening Syria to Muslim rule."}],"link":"Meccan caravans traded in Syria, and tradition says the young Muhammad visited Bostra and met the monk Bahira.","evidence":"moderate"},"Lebanon":{"polity":"Byzantine Empire (province of Phoenicia), under Persian occupation c. 613–628","summary":"The Lebanese coast held Byzantine port cities such as Tyre, Sidon and Beirut, the last still recovering from the earthquake and tsunami of 551. Silk and purple-dye industries continued, and monastic communities grew in the mountains, among them the followers of Saint Maron. Persia occupied the area during the great war, and Byzantium regained it after 628.","events":[{"y":570,"approx":true,"t":"Beirut, its famous law school moved to Sidon after the 551 earthquake, slowly rebuilds."},{"y":613,"approx":true,"t":"Persian forces occupy the Phoenician coast during their conquest of Syria and Palestine."},{"y":629,"approx":true,"t":"Byzantine authority returns after the Persian withdrawal under the peace of 628."}],"link":null,"evidence":"moderate"},"Israel":{"polity":"Byzantine Empire (Palaestina Prima and Secunda), under Persian occupation 614–c. 628","summary":"This land was part of Byzantine Palestine, governed from Caesarea, with Christian pilgrimage sites and a large Jewish population in Galilee centred on Tiberias. Some Jews, led by Benjamin of Tiberias, backed the Persian invasion of 614 in hope of relief from Byzantine restrictions. After Heraclius's victory, Jews faced reprisals and forced conversion orders.","events":[{"y":614,"approx":false,"t":"The Persian army under Shahrbaraz conquers Palestine, aided by Jewish fighters from Galilee."},{"y":617,"approx":true,"t":"Persia hands control back to Christians, ending a brief Jewish administration of Jerusalem."},{"y":630,"approx":false,"t":"Heraclius passes through Tiberias, hosted by Benjamin of Tiberias, on his way to restore the True Cross."},{"y":634,"approx":false,"t":"Arab Muslim forces defeat a Byzantine army at Dathin near Gaza, beginning the conquest of Palestine."}],"link":"The Qur'an's Sura al-Rum refers to the Byzantine defeat 'in the nearest land', usually linked to the Persian conquest of Syria and Palestine c. 613–614.","evidence":"moderate"},"Palestine":{"polity":"Byzantine Empire (Palaestina Prima), under Persian occupation 614–c. 628","summary":"Jerusalem, Bethlehem and Gaza were Byzantine Christian centres full of churches, monasteries and pilgrims; Gaza was also a market for Arabian caravans. The Persian sack of Jerusalem in 614, with the loss of the True Cross, shocked the Christian world. Heraclius returned the Cross to Jerusalem in 630, shortly before the Muslim conquest.","events":[{"y":614,"approx":false,"t":"Persian forces take Jerusalem after a siege, massacre many inhabitants, and carry the True Cross to Ctesiphon."},{"y":624,"approx":true,"t":"In Medina, the Muslim direction of prayer changes from Jerusalem to Mecca, according to tradition."},{"y":630,"approx":true,"t":"Heraclius restores the True Cross to Jerusalem in a triumphal ceremony (dated 629 or 630)."},{"y":637,"approx":true,"t":"Jerusalem surrenders to the caliph Umar's forces (date c. 637–638)."}],"link":"Jerusalem was the early Muslims' first direction of prayer, and Meccan traders, including Muhammad's ancestor Hashim per tradition, traded at Gaza.","evidence":"rich"},"Jordan":{"polity":"Byzantine Empire (Palaestina Tertia and Arabia), with Ghassanid Arab allies; Persian occupation c. 614–628","summary":"Jordan's towns, such as Madaba, Gerasa and Ayla (Aqaba), were Byzantine Christian centres with richly mosaicked churches. The desert edge was policed by Arab allies, especially the Ghassanids, whose federation weakened after 582. Persia held the region during the great war. It was the first Byzantine land where Muslim and Byzantine armies met.","events":[{"y":614,"approx":true,"t":"Persian forces occupy the region during their conquest of Palestine."},{"y":629,"approx":false,"t":"A Muslim force sent by Muhammad is defeated at Mu'ta by Byzantine troops and Arab allies; Zayd ibn Haritha is killed."},{"y":630,"approx":true,"t":"During the Tabuk expedition, Ayla, Adhruh and nearby towns agree to pay tribute to Muhammad, according to tradition."},{"y":636,"approx":false,"t":"Byzantium is defeated at the Yarmuk, on the modern Jordan–Syria border."}],"link":"Muslim and Byzantine forces first fought at Mu'ta in 629, and Ayla and other towns submitted to Muhammad during the Tabuk expedition of 630.","evidence":"moderate"},"Turkey":{"polity":"Byzantine (Eastern Roman) Empire, capital Constantinople","summary":"Anatolia and Constantinople formed the heart of the Byzantine Empire, a Greek-speaking Christian state ruled by Maurice, then the usurper Phocas, then Heraclius from 610. Persian armies raided deep into Anatolia and reached Chalcedon, across from the capital. In 626 Constantinople survived a joint Avar and Persian siege. Heraclius then struck into Persia and won the war.","events":[{"y":602,"approx":false,"t":"The army mutinies and Phocas overthrows and kills the emperor Maurice, giving Khosrow II a pretext for war."},{"y":610,"approx":false,"t":"Heraclius sails from Carthage, overthrows Phocas and becomes emperor."},{"y":615,"approx":true,"t":"A Persian army reaches Chalcedon, across the Bosporus from Constantinople."},{"y":622,"approx":false,"t":"Heraclius leaves Constantinople to campaign against Persia through Anatolia and the Caucasus."},{"y":626,"approx":false,"t":"Constantinople withstands a combined siege by the Avars and a Persian army waiting at Chalcedon."}],"link":"The Qur'an's Sura al-Rum speaks of the Byzantines' defeat and coming victory, and tradition says Muhammad sent a letter to Heraclius c. 628.","evidence":"rich"},"Cyprus":{"polity":"Byzantine Empire; self-governing (autocephalous) Church of Cyprus","summary":"Cyprus was a prosperous Byzantine island of coastal cities such as Paphos, Kourion and Amathus, with its own independent church. It escaped the Persian invasion and took in refugees from Syria and Egypt. John the Almsgiver, born at Amathus, became Patriarch of Alexandria and returned to die on Cyprus. Arab raids began only after 640.","events":[{"y":610,"approx":true,"t":"John the Almsgiver of Amathus becomes Chalcedonian Patriarch of Alexandria, famous for his charity."},{"y":619,"approx":true,"t":"John the Almsgiver flees the Persian advance on Egypt and dies in his home town of Amathus."},{"y":630,"approx":true,"t":"Archbishop Arcadius of Cyprus takes part in Heraclius's efforts to reunite the churches through monoenergism."}],"link":null,"evidence":"moderate"},"N. Cyprus":{"polity":"Byzantine Empire; the island's capital Constantia (Salamis) lay here","summary":"Northern Cyprus held the island's capital, Constantia (old Salamis), seat of the archbishop, and coastal towns such as Lapethos (Lambousa). The area shared in Byzantine trade and church life and was spared the Persian invasion. The 'David Plates', silver dishes made in Constantinople c. 629–630 and later found at Lambousa, show the island's wealth.","events":[{"y":600,"approx":true,"t":"Constantia serves as the island's capital and archiepiscopal seat, with large basilicas."},{"y":630,"approx":true,"t":"Silver plates showing the life of King David are made in Constantinople; they were later buried at Lambousa."}],"link":null,"evidence":"moderate"},"Armenia":{"polity":"Divided between the Byzantine Empire and Sasanian Persia (Persarmenia); Armenian noble houses","summary":"Armenia was ruled by noble families such as the Bagratunis and Mamikonians under two empires. The treaty of 591 gave Byzantium most of it, but Persia regained it after 602. The Armenian Church rejected the Council of Chalcedon and broke with the Georgian Church in 607. Heraclius's armies crossed Armenia in the 620s.","events":[{"y":591,"approx":false,"t":"Khosrow II cedes most of Armenia to Byzantium in return for Maurice's help in regaining his throne."},{"y":607,"approx":true,"t":"A council at Dvin under Catholicos Abraham I confirms the Armenian Church's break with the Georgian Church."},{"y":623,"approx":true,"t":"Heraclius campaigns through Armenia against Persian forces during his counter-offensive."},{"y":632,"approx":true,"t":"Catholicos Ezr accepts communion with the Byzantine church at Theodosiopolis (date c. 631–633)."}],"link":null,"evidence":"moderate"},"Azerbaijan":{"polity":"Caucasian Albania (Aghvank) under Sasanian rule, with the Mihranid princes","summary":"This land was Caucasian Albania, a Christian kingdom under Persian overlordship with its capital at Partaw (Barda); it is distinct from Iranian Azerbaijan (Atropatene) to the south. The Persians fortified the Caspian passes against steppe peoples. Heraclius wintered here in 624–625, and Western Turk and Khazar raiders swept in during 627–628. The Mihranid family rose to rule.","events":[{"y":624,"approx":false,"t":"Heraclius winters his army in Caucasian Albania after striking into Persian Atropatene."},{"y":627,"approx":true,"t":"Western Turks (with Khazars) break through the Caspian passes and raid Albania as Byzantine allies."},{"y":630,"approx":true,"t":"The Mihranid prince Varaz Grigor rules Albania under weakening Persian authority."}],"link":null,"evidence":"sparse"},"Georgia":{"polity":"Kartli (Iberia) under princes caught between Byzantium and Persia; Lazica (Egrisi) under Byzantium","summary":"Kartli, centred on Tbilisi and Mtskheta, was a Christian principality led by presiding princes (erismtavari) after Persia ended its monarchy. Western Georgia (Lazica) was a Byzantine client. The Jvari church near Mtskheta was built in these years. In 607 the Georgian Church under Kyrion I sided with Chalcedon and broke with Armenia.","events":[{"y":588,"approx":true,"t":"Guaram I becomes presiding prince of Kartli with Byzantine backing."},{"y":600,"approx":true,"t":"The Jvari church is built above Mtskheta (c. 590–605)."},{"y":607,"approx":true,"t":"The Georgian Church under Catholicos Kyrion I breaks with the Armenian Church over Chalcedon."},{"y":627,"approx":false,"t":"Heraclius and the Western Turks besiege Tbilisi; the pro-Persian prince Stephen I is killed and Adarnase I is installed."}],"link":null,"evidence":"moderate"},"Egypt":{"polity":"Byzantine Empire; Persian occupation c. 619–629","summary":"Egypt was Byzantium's granary, its grain feeding Constantinople. Most Egyptians followed the Coptic Miaphysite church, which rejected the imperial Chalcedonian church based in Alexandria. Persia conquered Egypt in 618–619 and held it for a decade. After Byzantine return, the patriarch Cyrus, called al-Muqawqis in Arabic sources, persecuted the Copts, whose patriarch Benjamin I went into hiding.","events":[{"y":618,"approx":true,"t":"Persian forces invade Egypt and take Alexandria in 619, cutting Constantinople's grain supply."},{"y":623,"approx":true,"t":"Benjamin I becomes Coptic patriarch of Alexandria."},{"y":629,"approx":true,"t":"Persian troops leave Egypt under the peace of 628, and Byzantine rule returns."},{"y":631,"approx":true,"t":"Heraclius appoints Cyrus as patriarch and governor; the Coptic patriarch Benjamin flees into hiding."},{"y":639,"approx":false,"t":"Amr ibn al-As leads an Arab Muslim army into Egypt."}],"link":"Tradition says Muhammad wrote to the ruler of Egypt, al-Muqawqis, who sent gifts including Maria the Copt, mother of Muhammad's son Ibrahim.","evidence":"moderate"},"Afghanistan":{"polity":"Hunnic successor kingdoms (Alkhon, Nezak) under Western Turkic overlordship; Sasanian Herat","summary":"A patchwork of Hunnic-descended principalities ruled Kabul, Kapisa and Zabul, while Bactria (Tokharistan) passed under Western Turkic princes after the Hephthalite collapse. Herat lay on the Sasanian frontier. Buddhism flourished alongside Hindu and Zoroastrian cults; the colossal Bamiyan Buddhas stood on a busy Silk Road route. Xuanzang described Bamiyan, Kapisa and the Turkic court at Kunduz c. 630.","events":[{"y":588,"approx":true,"t":"Sasanian general Bahram Chobin defeats a Turkic invasion near Herat in the First Perso-Turkic War."},{"y":600,"approx":true,"t":"The western Bamiyan Buddha is carved in this era; radiocarbon dates place its construction roughly 590s to 640s."},{"y":625,"approx":true,"t":"Western Turkic control of Tokharistan consolidated under Tong Yabghu, whose son Tardu Shad rules from Kunduz."},{"y":630,"approx":true,"t":"Xuanzang visits Tardu Shad at Kunduz, then Bamiyan and Kapisa on his way to India."}],"link":null,"evidence":"moderate"},"Pakistan":{"polity":"Rai dynasty of Sindh (Chach from c. 632); Hunnic and local rulers in Gandhara and the Punjab","summary":"Sindh was ruled from Aror by the Rai kings, whose last ruler Rai Sahasi II was succeeded by his Brahmin chamberlain Chach, according to the later Chachnama. Buddhism remained strong in Sindh, but Gandhara and Taxila were in decline, with many monasteries ruined when Xuanzang passed through. Multan's sun temple drew pilgrims; the port of Debal traded across the Arabian Sea.","events":[{"y":630,"approx":true,"t":"Xuanzang crosses Gandhara and Taxila, noting abandoned monasteries in a once-great Buddhist heartland."},{"y":632,"approx":true,"t":"Chach seizes the throne of Sindh after Rai Sahasi II's death, founding the Brahman dynasty (date per the Chachnama, disputed)."},{"y":636,"approx":true,"t":"First Arab naval raids from Bahrain and Oman reach Thana and Debal under Caliph Umar, just after the period."}],"link":"No direct contact with Muhammad is attested; Sindhi ports traded with Arabia and Oman, and the first Arab raids on Debal came c. 636, after 632.","evidence":"moderate"},"India":{"polity":"Harsha of Kannauj (north), Chalukyas of Badami (Deccan), Pallavas of Kanchi (southeast), Maitrakas of Valabhi (west)","summary":"After the Gupta collapse, regional dynasties competed. Harsha (r. 606–647) ruled the Ganges plain from Kannauj, patronising Nalanda and the poet Banabhatta. Pulakeshin II of the Chalukyas checked his advance south on the Narmada and fought the Pallavas Mahendravarman I and Narasimhavarman I. The Maitrakas made Valabhi a learning centre. Buddhism, Jainism and resurgent Shaiva and Vaishnava devotion coexisted; Xuanzang toured from c. 630.","events":[{"y":578,"approx":false,"t":"Badami Cave 3, dedicated to Vishnu under Chalukya king Mangalesha, is consecrated, as its inscription records."},{"y":606,"approx":false,"t":"Harsha succeeds his murdered brother Rajyavardhana at Thanesar and later makes Kannauj his capital; the Harsha era begins."},{"y":610,"approx":true,"t":"Pulakeshin II wins the Chalukya throne after civil war with his uncle Mangalesha."},{"y":619,"approx":true,"t":"Pulakeshin II defeats Harsha on the Narmada; dates proposed range from c. 618 to c. 634."},{"y":630,"approx":true,"t":"Narasimhavarman I succeeds Mahendravarman I, the Pallava king, dramatist and builder of early rock-cut temples."},{"y":634,"approx":false,"t":"Ravikirti's Aihole inscription celebrates Pulakeshin II's victories, including over Harsha."}],"link":"No direct contact is attested; western Indian ports such as Bharuch traded across the Arabian Sea with Arabian and Persian Gulf markets.","evidence":"rich"},"Nepal":{"polity":"Licchavi kingdom of the Kathmandu Valley (Amshuverman)","summary":"The Kathmandu Valley was ruled by the Licchavi dynasty, known mainly from Sanskrit inscriptions. Around 605 the powerful minister Amshuverman, a Thakuri noble, became de facto and then titled ruler, building the Kailashkut palace. The valley was a Hindu and Buddhist centre and a trade link between India and Tibet. Tradition that his daughter Bhrikuti married Songtsen Gampo is legendary.","events":[{"y":590,"approx":true,"t":"Shivadeva I reigns as Licchavi king with Amshuverman as his chief minister (mahasamanta)."},{"y":605,"approx":true,"t":"Amshuverman becomes effective ruler; his inscriptions use a new era and later royal titles."},{"y":621,"approx":true,"t":"Amshuverman dies around this time; Licchavi succession becomes contested, with Tibetan involvement later."}],"link":null,"evidence":"moderate"},"Bhutan":{"polity":"Unknown local hill societies (no recorded state)","summary":"There are essentially no written records for this land in 570–632. It was inhabited by Himalayan hill and valley peoples whose political organisation is unknown. Bhutanese tradition credits the Tibetan king Songtsen Gampo with founding the temples of Kyichu and Jambay Lhakhang in the 7th century, but this is later tradition, and Buddhism became established only afterwards.","events":[{"y":630,"approx":true,"t":"Rise of the Tibetan Empire under Songtsen Gampo to the north; its reach into this region is undocumented."}],"link":null,"evidence":"sparse"},"Bangladesh":{"polity":"Gauda kingdom of Shashanka (west), Samatata and Vanga (east and south)","summary":"The western delta formed part of Gauda, whose king Shashanka ruled from Karnasuvarna and fought Harsha's family; Buddhist sources call him a persecutor, a charge now debated. Pundravardhana (Mahasthangarh) was an old urban centre. Eastern Samatata had its own kings. Rice agriculture, river trade and both Buddhist monasteries and Hindu temples defined the region.","events":[{"y":606,"approx":true,"t":"Shashanka of Gauda is blamed for killing Rajyavardhana of Thanesar, prompting Harsha's alliance with Bhaskaravarman of Kamarupa."},{"y":619,"approx":false,"t":"A Ganjam inscription shows Shashanka still ruling as overlord, with influence reaching Odisha."},{"y":625,"approx":true,"t":"Shashanka dies; Gauda fragments and is later contested by Harsha and Bhaskaravarman."},{"y":638,"approx":true,"t":"Xuanzang visits Pundravardhana and Samatata, describing many monasteries."}],"link":null,"evidence":"moderate"},"Sri Lanka":{"polity":"Anuradhapura kingdom (Aggabodhi I, Aggabodhi II and successors)","summary":"The island was ruled from Anuradhapura by Sinhala kings recorded in the Culavamsa chronicle, which dates them only approximately. After the long reigns of Aggabodhi I and II, the throne became unstable, with rival claimants backed by South Indian Tamil mercenaries. Theravada monasteries such as the Mahavihara and Abhayagiri dominated religious life; ports like Mantai were hubs of Indian Ocean trade.","events":[{"y":575,"approx":true,"t":"Aggabodhi I begins a long reign, remembered for irrigation tanks and monastic patronage."},{"y":608,"approx":true,"t":"Aggabodhi II succeeds; the chronicle records further reservoir building and religious donations."},{"y":620,"approx":true,"t":"Succession wars begin, with short reigns and claimants relying on South Indian troops."}],"link":"No direct contact is attested; the island was a hub of Indian Ocean trade frequented by Persian and other western merchants.","evidence":"moderate"},"Kazakhstan":{"polity":"Western Turkic Khaganate (steppe and Zhetysu)","summary":"The steppes and the Seven Rivers region were the heartland of the Western Turkic Khaganate, ruled by the Ashina clan over the On Ok tribal confederation. Nomadic pastoralism dominated, while Sogdian merchants settled towns along the Talas and Chu routes. The khagans traded silk diplomatically with Byzantium and fought Persia. Tong Yabghu (r. c. 618–628) brought the khaganate to its peak before it fractured.","events":[{"y":576,"approx":true,"t":"Death of Istämi, founder of the western branch; his son Tardu succeeds."},{"y":603,"approx":true,"t":"The Turkic Khaganate splits permanently into eastern and western realms after decades of rivalry."},{"y":627,"approx":false,"t":"Western Turkic forces ally with Heraclius against Persia and join the siege of Tbilisi."},{"y":630,"approx":true,"t":"Xuanzang passes through Talas (Taraz), describing its Sogdian traders."}],"link":null,"evidence":"moderate"},"Kyrgyzstan":{"polity":"Western Turkic Khaganate (royal camp at Suyab, Chu valley)","summary":"The Chu valley held Suyab, the main seat of the Western Turkic khagans, near modern Tokmok. Sogdian colonists built walled towns and traded silk, horses and metalwork, while Turkic nomads pastured the Tian Shan. Buddhism, Manichaeism, Christianity and Turkic Tengri worship coexisted. Xuanzang met Tong Yabghu here in 630, describing his silk-robed splendour.","events":[{"y":618,"approx":true,"t":"Tong Yabghu becomes khagan and rules a realm from the Tarim Basin to the Oxus from Suyab."},{"y":628,"approx":true,"t":"Tong Yabghu is murdered by his uncle; the khaganate splits into rival Dulu and Nushibi factions."},{"y":630,"approx":true,"t":"Xuanzang is received at Suyab by the khagan, usually identified as Tong Yabghu, though dating is debated."}],"link":null,"evidence":"moderate"},"Tajikistan":{"polity":"Sogdian towns (Panjikant) and Tokharistan principalities (Khuttal, Chaghaniyan) under Western Turkic overlordship","summary":"The north lay in Sogdiana, where towns like Panjikant were run by merchant aristocracies and Zoroastrian-style temples. The south belonged to the small principalities of upper Tokharistan, formerly Hephthalite and by the early 600s under Western Turkic overlords. Irrigated farming, mining in the Zarafshan and Pamir valleys, and caravan trade sustained the region; Buddhism survived in the south.","events":[{"y":570,"approx":true,"t":"Hephthalite power north of the Oxus has collapsed after defeat by the Turks and Sasanians c. 560."},{"y":600,"approx":true,"t":"Panjikant grows as a prosperous Sogdian town, with houses and temples later famous for wall paintings."},{"y":630,"approx":true,"t":"Xuanzang crosses Tokharistan's small states, all tributary to the Turkic prince at Kunduz."}],"link":null,"evidence":"moderate"},"Turkmenistan":{"polity":"Sasanian Empire (Merv province) and Turkic-held steppe","summary":"Merv was the Sasanian empire's great northeastern frontier city, with a marzban governor, a mint, and an East Syriac Christian metropolitan alongside Zoroastrian and Buddhist communities. Beyond the oases, the Karakum steppe and lands toward Khwarazm saw Turkic pressure. Merv profited from caravan trade but was a frontline in Persian-Turkic wars.","events":[{"y":588,"approx":true,"t":"Sasanian forces under Bahram Chobin repel a Turkic invasion of Khorasan in the First Perso-Turkic War."},{"y":590,"approx":false,"t":"Bahram Chobin rebels against Hormizd IV; Khosrow II regains the throne in 591 with Byzantine help."},{"y":619,"approx":true,"t":"The Second Perso-Turkic War sees Turkic raids into Khorasan, repelled by the Armenian general Smbat Bagratuni."}],"link":"Merv was a province of the Sasanian Empire, whose wars and collapse after 628 shaped the world around early Islam, though no direct contact is attested before 632.","evidence":"moderate"},"Uzbekistan":{"polity":"Sogdian city-states (Samarkand, Bukhara, Chach) and Khwarazm, under Western Turkic overlordship","summary":"Sogdiana's city-states, led by Samarkand and Bukhara, were ruled by local kings who often married into the Turkic royal clan and paid it tribute. Sogdian merchants dominated Silk Road trade from Byzantium to China, carrying silk, silver and their Aramaic-derived script. Zoroastrian-style worship predominated, alongside Buddhists, Manichaeans and Christians. Khwarazm on the lower Oxus had its own kings.","events":[{"y":568,"approx":false,"t":"The Sogdian envoy Maniakh leads a Turkic embassy to Constantinople to open direct silk trade, bypassing Persia."},{"y":600,"approx":true,"t":"Sogdian kings rule Samarkand and Bukhara as Turkic vassals, often through marriage ties with the Ashina clan."},{"y":630,"approx":true,"t":"Xuanzang passes the Iron Gate and visits Samarkand, describing a wealthy, mainly non-Buddhist city."}],"link":null,"evidence":"moderate"},"Mongolia":{"polity":"First (Göktürk) Turkic Khaganate, then Eastern Turkic Khaganate","summary":"The Orkhon steppe was the core of the Turkic Khaganate founded by Bumin in 552. Mounted pastoralists ruled a vast tribal confederation, using Sogdian scribes and Buddhist ideas. Civil war after 581 split the empire; the Eastern Turks alternately raided and submitted to Sui and Tang China. In 630 Tang forces captured the khagan Illig, ending the first Turkic empire in the east.","events":[{"y":572,"approx":true,"t":"Taspar Khagan succeeds Muqan and patronises Buddhism at the Turkic court."},{"y":582,"approx":true,"t":"The Bugut inscription, in Sogdian, is erected to commemorate Taspar Khagan."},{"y":583,"approx":true,"t":"Rivalries among Ashina khagans, encouraged by Sui diplomacy, split the Khaganate into eastern and western parts."},{"y":630,"approx":false,"t":"Tang general Li Jing defeats Illig Khagan; Taizong takes the title Heavenly Khagan."}],"link":null,"evidence":"moderate"}};

/* The Prophet's life, traditional chronology (sira). Dates are conventional, recorded 100+ years later. */
const SIRA = [
  { y: 570, approx: true, t: "Muhammad born in Mecca, the \"Year of the Elephant\". His father Abdullah has already died." },
  { y: 576, approx: true, t: "His mother Amina dies; he is raised by his grandfather Abd al-Muttalib, then his uncle Abu Talib." },
  { y: 595, approx: true, t: "Marries Khadija, a widowed Meccan merchant whose caravans he had managed." },
  { y: 610, approx: true, t: "First revelation in the cave of Hira, by tradition in Ramadan." },
  { y: 613, approx: true, t: "Begins preaching publicly in Mecca; opposition from Quraysh leaders grows." },
  { y: 615, approx: true, t: "A group of Muslims seeks refuge with the Christian Negus of Aksum (first Hijra)." },
  { y: 619, approx: true, t: "\"Year of Sorrow\": Khadija and Abu Talib both die, leaving him without his chief protector." },
  { y: 622, approx: false, t: "The Hijra: emigration from Mecca to Yathrib (Medina). Year 1 of the Islamic calendar." },
  { y: 624, approx: false, t: "Battle of Badr: the Medinan Muslims defeat a larger Meccan force." },
  { y: 625, approx: false, t: "Battle of Uhud: Meccan victory near Medina." },
  { y: 627, approx: false, t: "Battle of the Trench: the Meccan-led siege of Medina fails." },
  { y: 628, approx: false, t: "Treaty of Hudaybiyya with Quraysh; letters to neighbouring rulers are attributed to this period." },
  { y: 629, approx: false, t: "Raid on Mu'ta in Byzantine-allied territory east of the Dead Sea ends in retreat." },
  { y: 630, approx: false, t: "Mecca surrenders with little fighting; the Ka'ba is cleared of idols. Expedition to Tabuk." },
  { y: 631, approx: true, t: "\"Year of Delegations\": tribes across Arabia send envoys to Medina." },
  { y: 632, approx: false, t: "Farewell Pilgrimage; Muhammad dies in Medina. Abu Bakr becomes the first caliph." },
];

/* Simplified dominant sphere per modern country. Modern borders rarely match; this is a guide, not a border map. */
const SPHERES = {
  islam:   ["Muslim community (Medina)", "--c-islam"],
  arabia:  ["Arabian tribes", "--c-arabia"],
  byz:     ["Eastern Roman (Byzantine)", "--c-byz"],
  sas:     ["Sasanian Persia", "--c-sas"],
  latin:   ["Latin-Christian West", "--c-latin"],
  slav:    ["Avars & Slavs", "--c-slav"],
  north:   ["Norse, Finnic & Baltic peoples", "--c-north"],
  turk:    ["Turkic khaganates & Sogdia", "--c-turk"],
  india:   ["South Asian kingdoms", "--c-india"],
  china:   ["Sui / Tang China & Tibet", "--c-china"],
  eastasia:["Korea & Japan", "--c-eastasia"],
  seasia:  ["Southeast Asian states", "--c-seasia"],
  aksum:   ["Aksum & Nubia", "--c-aksum"],
  berber:  ["Berber kingdoms", "--c-berber"],
  meso:    ["Maya & Mesoamerica", "--c-meso"],
  andes:   ["Andean states", "--c-andes"],
  other:   ["Chiefdoms & non-state societies", "--c-other"],
  none:    ["No human settlement", "--c-none"],
};
const STATIC = {
  byz: ["Turkey","Greece","Cyprus","N. Cyprus","Tunisia","Libya","Albania"],
  latin: ["France","Spain","Portugal","United Kingdom","Ireland","Belgium","Netherlands","Germany","Switzerland","Luxembourg","Austria","Italy"],
  slav: ["Hungary","Serbia","Croatia","Bosnia and Herz.","Slovenia","Slovakia","Czechia","Poland","Romania","Bulgaria","Moldova","Ukraine","Belarus","Montenegro","Kosovo","Macedonia"],
  north: ["Norway","Sweden","Denmark","Finland","Estonia","Latvia","Lithuania","Russia"],
  turk: ["Kazakhstan","Kyrgyzstan","Uzbekistan","Tajikistan","Turkmenistan","Mongolia","Afghanistan"],
  sas: ["Iran","Iraq","Azerbaijan"],
  india: ["India","Pakistan","Nepal","Bangladesh","Sri Lanka","Bhutan"],
  china: ["China"],
  eastasia: ["Japan","North Korea","South Korea"],
  seasia: ["Myanmar","Thailand","Laos","Cambodia","Vietnam","Malaysia","Brunei","Indonesia","Philippines"],
  aksum: ["Ethiopia","Eritrea","Sudan","Djibouti"],
  berber: ["Algeria","Morocco"],
  meso: ["Mexico","Guatemala","Belize","Honduras","El Salvador"],
  andes: ["Peru","Bolivia"],
  none: ["Antarctica","Fr. S. Antarctic Lands","New Zealand","Iceland","Falkland Is.","Greenland","Bahamas"],
};
const STATIC_LOOKUP = {};
for (const [k, arr] of Object.entries(STATIC)) for (const n of arr) STATIC_LOOKUP[n] = k;

function sphereAt(name, y) {
  switch (name) {
    case "Saudi Arabia": return y >= 622 ? "islam" : "arabia";
    case "Yemen": return y >= 628 ? "islam" : y >= 575 ? "sas" : "aksum";        // Persian conquest c. 570–575; governor Badhan's submission c. 628
    case "Oman": case "United Arab Emirates": case "Qatar": case "Kuwait":
      return y >= 630 ? "islam" : "sas";                                      // Sasanian-influenced coast; allegiance to Medina c. 629–631
    case "Egypt": return (y >= 619 && y < 629) ? "sas" : "byz";               // Persian occupation 618/19–628/29
    case "Syria": case "Lebanon": case "Israel": case "Palestine": case "Jordan":
      return (y >= 613 && y < 629) ? "sas" : "byz";                           // Damascus 613, Jerusalem 614; evacuated 628–30
    case "Armenia": case "Georgia":
      return (y >= 591 && y < 604) || y >= 627 ? "byz" : "sas";               // 591 treaty; war from 603; Heraclius 627
  }
  return STATIC_LOOKUP[name] || "other";
}
const EVIDENCE = { rich: ["Well documented", "--c-rich"], moderate: ["Partly documented", "--c-moderate"], sparse: ["Mostly archaeology", "--c-sparse"] };
const LINK = { yes: ["Attested contact with Arabia", "--c-link"], no: ["No attested contact", "--c-nolink"] };

/* ---------- state ---------- */
const css = getComputedStyle(document.documentElement);
const col = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
let year = 610, mode = "sphere", selected = null, filterKey = null, playing = null;
try { const s = localStorage.getItem("wihl"); if (s) { const o = JSON.parse(s); if (o.year) year = o.year; if (o.mode) mode = o.mode; } } catch (e) {}
const save = () => { try { localStorage.setItem("wihl", JSON.stringify({ year, mode })); } catch (e) {} };
const AH = y => { const h = Math.round((y - 622) * 33 / 32); return h >= 0 ? (h + 1) + " AH" : Math.abs(h) + " BH"; };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* ---------- map ---------- */
const svg = d3.select("#map");
const features = topojson.feature(TOPO, TOPO.objects.countries).features.filter(f => f.properties.name);
const projection = d3.geoNaturalEarth1();
const path = d3.geoPath(projection);
const gRoot = svg.append("g");
const gGrat = gRoot.append("path").attr("class", "grat");
const gLand = gRoot.append("g");
const gPins = gRoot.append("g");
const nodes = gLand.selectAll("path").data(features).join("path")
  .attr("class", "country")
  .attr("tabindex", 0)
  .attr("role", "button")
  .attr("aria-label", d => d.properties.name)
  .on("click", (ev, d) => select(d.properties.name, false))
  .on("keydown", (ev, d) => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); select(d.properties.name, false); } })
  .on("mousemove", (ev, d) => showTip(ev, d))
  .on("mouseleave", () => tip.hidden = true);

function mainPolygon(f) {
  if (f.geometry.type !== "MultiPolygon") return f;
  let best = null, area = -1;
  for (const coords of f.geometry.coordinates) {
    const g = { type: "Feature", geometry: { type: "Polygon", coordinates: coords } };
    const a = d3.geoArea(g); if (a > area) { area = a; best = g; }
  }
  return best;
}
const anchors = new Map(features.map(f => [f.properties.name, mainPolygon(f)]));

let W = 0, H = 0, zoomK = 1;
const zoom = d3.zoom().scaleExtent([1, 12]).on("zoom", ev => {
  zoomK = ev.transform.k;
  gRoot.attr("transform", ev.transform);
  gLand.selectAll("path").attr("stroke-width", .5 / zoomK);
  drawPins();
});
svg.call(zoom);
function layout() {
  const r = svg.node().getBoundingClientRect(); W = r.width; H = r.height;
  svg.attr("viewBox", `0 0 ${W} ${H}`);
  projection.fitExtent([[8, 8], [W - 8, H - 8]], { type: "Sphere" });
  gGrat.attr("d", path(d3.geoGraticule10()));
  nodes.attr("d", path);
  zoom.translateExtent([[0, 0], [W, H]]).extent([[0, 0], [W, H]]);
  drawPins();
}
new ResizeObserver(layout).observe(svg.node());
d3.select("#zin").on("click", () => svg.transition().duration(300).call(zoom.scaleBy, 1.6));
d3.select("#zout").on("click", () => svg.transition().duration(300).call(zoom.scaleBy, 1 / 1.6));
d3.select("#zreset").on("click", () => svg.transition().duration(400).call(zoom.transform, d3.zoomIdentity));

/* ---------- colouring ---------- */
function keyFor(name) {
  const d = DATA[name];
  if (mode === "sphere") return sphereAt(name, year);
  if (mode === "evidence") return d?.evidence || "sparse";
  return d?.link ? "yes" : "no";
}
function table() { return mode === "sphere" ? SPHERES : mode === "evidence" ? EVIDENCE : LINK; }
function paint() {
  const T = table();
  nodes.attr("fill", d => col(T[keyFor(d.properties.name)][1]))
       .classed("sel", d => d.properties.name === selected)
       .classed("dim", d => filterKey && keyFor(d.properties.name) !== filterKey);
  nodes.filter(d => d.properties.name === selected).raise();
  renderLegend();
}
function renderLegend() {
  const T = table();
  const present = new Set(features.map(f => keyFor(f.properties.name)));
  const el = document.getElementById("legend");
  el.innerHTML = Object.entries(T).filter(([k]) => present.has(k)).map(([k, [label, v]]) =>
    `<button type="button" data-k="${k}" aria-pressed="${filterKey === k}"><i style="background:var(${v})"></i>${esc(label)}</button>`).join("")
    + (mode === "sphere" ? `<span>· simplified; modern borders</span>` : "");
  el.querySelectorAll("button").forEach(b => b.onclick = () => { filterKey = filterKey === b.dataset.k ? null : b.dataset.k; paint(); });
}

/* ---------- pins: places with events near the chosen year ---------- */
const WINDOW = 2;
function eventsNear(y) {
  const out = [];
  for (const [name, d] of Object.entries(DATA)) for (const e of d.events || []) if (Math.abs(e.y - y) <= WINDOW) out.push({ name, ...e });
  return out.sort((a, b) => Math.abs(a.y - y) - Math.abs(b.y - y) || a.y - b.y);
}
function drawPins() {
  if (!W) return;
  const names = [...new Set(eventsNear(year).map(e => e.name))];
  const pts = names.map(n => { const a = anchors.get(n); if (!a) return null; const c = path.centroid(a); return isFinite(c[0]) ? { n, c } : null; }).filter(Boolean);
  const r = 3.2 / zoomK;
  gPins.selectAll("circle.pin").data(pts, d => d.n).join("circle")
    .attr("class", d => "pin" + (d.n === "Saudi Arabia" ? " arabia" : ""))
    .attr("cx", d => d.c[0]).attr("cy", d => d.c[1]).attr("r", r).attr("stroke-width", 1.2 / zoomK);
  const mecca = projection([39.83, 21.42]);
  gPins.selectAll("circle.pulse").data([mecca]).join("circle").attr("class", "pulse")
    .attr("cx", d => d[0]).attr("cy", d => d[1]).attr("r", 6 / zoomK).attr("stroke-width", 1.2 / zoomK);
}

/* ---------- tooltip ---------- */
const tip = document.getElementById("tip");
function showTip(ev, d) {
  const n = d.properties.name, info = DATA[n];
  const [mx, my] = d3.pointer(ev, document.querySelector(".mapwrap"));
  tip.innerHTML = `<b>${esc(n)}</b><span>${esc(info?.polity || SPHERES[sphereAt(n, year)][0])}</span>`;
  tip.hidden = false;
  const w = tip.offsetWidth, box = document.querySelector(".mapwrap").clientWidth;
  tip.style.left = Math.min(mx + 14, box - w - 8) + "px";
  tip.style.top = (my + 14) + "px";
}

/* ---------- year rail ---------- */
