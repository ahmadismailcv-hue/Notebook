/* Layout: full-height atlas. Map left, reading panel right; year rail under the map. Stacks on phones. */
:root {
  --bg: #eef0ee;
  --surface: #f8f9f7;
  --sea: #d6dfe2;
  --fg: #1d2326;
  --muted: #5b666b;
  --line: #c4ccce;
  --accent: #1d4f7a;      /* lapis */
  --gold: #a87411;        /* Arabia / the Prophet's track */
  --land-edge: #f8f9f7;
  --hl: #1d2326;
  --font-display: "Marcellus", "Trajan Pro", Georgia, serif;
  --font-body: "Literata", Georgia, "Times New Roman", serif;
  --font-data: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  /* sphere palette */
  --c-islam: #c8952b; --c-arabia: #e2c98f; --c-byz: #8a5a9e; --c-sas: #b5523b;
  --c-latin: #4f7fae; --c-slav: #8fae7a; --c-north: #9bb8c4; --c-turk: #c9a27a;
  --c-india: #d9845a; --c-china: #c4443f; --c-eastasia: #d78d97; --c-seasia: #5f9e8f;
  --c-aksum: #6c7f3c; --c-berber: #b8a36a; --c-meso: #3f8f7a; --c-andes: #9a6b4f;
  --c-other: #cfd3cc; --c-none: #e9ebe8;
  --c-rich: #1d4f7a; --c-moderate: #7ea3c2; --c-sparse: #d2d8dc;
  --c-link: #c8952b; --c-nolink: #d5d9d6;
}

  --bg: #12171b; --surface: #182026; --sea: #0d1316; --fg: #e4e8ea; --muted: #94a1a7; --line: #2d383f;
  --accent: #7fb0dc; --gold: #e0b250; --land-edge: #12171b; --hl: #ffffff;
  --c-islam: #d9a73a; --c-arabia: #a8925e; --c-byz: #8c66a0; --c-sas: #b05a45;
  --c-latin: #4c78a3; --c-slav: #6f8d5d; --c-north: #5f7f8c; --c-turk: #9c7d5c;
  --c-india: #b8714d; --c-china: #b04440; --c-eastasia: #a8707a; --c-seasia: #4c8578;
  --c-aksum: #687a3c; --c-berber: #8f804f; --c-meso: #3a7f6d; --c-andes: #84604a;
  --c-other: #3a4348; --c-none: #262e33;
  --c-rich: #7fb0dc; --c-moderate: #4a6d8a; --c-sparse: #2f3a41;
  --c-link: #d9a73a; --c-nolink: #2f383d;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #12171b; --surface: #182026; --sea: #0d1316; --fg: #e4e8ea; --muted: #94a1a7; --line: #2d383f;
  --accent: #7fb0dc; --gold: #e0b250; --land-edge: #12171b; --hl: #ffffff;
  --c-islam: #d9a73a; --c-arabia: #a8925e; --c-byz: #8c66a0; --c-sas: #b05a45;
  --c-latin: #4c78a3; --c-slav: #6f8d5d; --c-north: #5f7f8c; --c-turk: #9c7d5c;
  --c-india: #b8714d; --c-china: #b04440; --c-eastasia: #a8707a; --c-seasia: #4c8578;
  --c-aksum: #687a3c; --c-berber: #8f804f; --c-meso: #3a7f6d; --c-andes: #84604a;
  --c-other: #3a4348; --c-none: #262e33;
  --c-rich: #7fb0dc; --c-moderate: #4a6d8a; --c-sparse: #2f3a41;
  --c-link: #d9a73a; --c-nolink: #2f383d;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.55; }
.app { display: grid; grid-template-columns: minmax(0, 1fr) 380px; grid-template-rows: auto minmax(0, 1fr) auto; height: 100%; padding-inline: 16px; gap: 0 20px; }
header { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 24px; padding-block: 14px 10px; border-bottom: 1px solid var(--line); }
h1 { font-family: var(--font-display); font-weight: 400; font-size: 1.7rem; letter-spacing: .02em; margin: 0; text-wrap: balance; }
h1 small { font-family: var(--font-data); font-size: .72rem; color: var(--muted); letter-spacing: .06em; margin-left: 10px; white-space: nowrap; }
.modes { display: flex; gap: 4px; flex-wrap: wrap; }
.modes button, .chip, .back { font: 500 .74rem/1 var(--font-data); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); background: transparent; border: 1px solid var(--line); border-radius: 3px; padding: 7px 10px; cursor: pointer; }
.modes button[aria-pressed="true"] { color: var(--surface); background: var(--fg); border-color: var(--fg); }
button:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.mapwrap { position: relative; min-height: 0; padding-block: 12px 0; display: flex; flex-direction: column; }
#map { flex: 1; min-height: 300px; width: 100%; background: var(--sea); border-radius: 4px; display: block; cursor: grab; touch-action: none; }
#map:active { cursor: grabbing; }
.country { stroke: var(--land-edge); stroke-width: .5; transition: fill .35s ease; cursor: pointer; }
.country:hover { filter: brightness(1.08); }
.country.sel { stroke: var(--hl); stroke-width: 1.6; }
.country.dim { opacity: .28; }
.grat { fill: none; stroke: var(--line); stroke-width: .4; opacity: .6; }
.pin { fill: var(--surface); stroke: var(--fg); stroke-width: 1.2; pointer-events: none; }
.pin.arabia { fill: var(--gold); stroke: var(--surface); }
.pulse { fill: none; stroke: var(--gold); stroke-width: 1.2; pointer-events: none; animation: pulse 2.4s ease-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes pulse { from { opacity: .9; transform: scale(.6); } to { opacity: 0; transform: scale(2.6); } }
@media (prefers-reduced-motion: reduce) { .pulse { animation: none; opacity: .5; } .country { transition: none; } }
.zoombtns { position: absolute; right: 10px; top: 22px; display: flex; flex-direction: column; gap: 4px; }
.zoombtns button { width: 30px; height: 30px; font: 500 1rem/1 var(--font-data); background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 3px; cursor: pointer; }
.tip { position: absolute; pointer-events: none; background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 3px; padding: 6px 9px; font-size: .82rem; line-height: 1.35; max-width: 240px; box-shadow: 0 4px 14px rgb(0 0 0 / .12); }
.tip b { font-family: var(--font-display); font-weight: 400; font-size: .95rem; display: block; }
.tip span { color: var(--muted); }

.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; padding-block: 8px 0; font: .72rem/1.3 var(--font-data); color: var(--muted); }
.legend button { all: unset; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; padding: 2px 0; }
.legend button[aria-pressed="true"] { color: var(--fg); text-decoration: underline; text-underline-offset: 3px; }
.legend i { width: 11px; height: 11px; border-radius: 2px; display: inline-block; flex: none; }

.rail { grid-column: 1 / 2; padding-block: 10px 14px; }
.rail-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.yr { font-family: var(--font-display); font-size: 2.2rem; line-height: 1; font-variant-numeric: tabular-nums; }
.yr em { font: .8rem var(--font-data); font-style: normal; color: var(--muted); margin-left: 6px; }
.stage { font-size: .9rem; color: var(--gold); font-style: italic; text-align: right; max-width: 34em; }
.track { position: relative; height: 44px; margin-top: 6px; }
#year { position: absolute; inset: 18px 0 auto 0; width: 100%; margin: 0; accent-color: var(--gold); }
.tick { position: absolute; top: 0; width: 1px; height: 12px; background: var(--gold); opacity: .9; }
.tick button { all: unset; position: absolute; top: -4px; left: -6px; width: 13px; height: 16px; cursor: pointer; }
.life { position: absolute; top: 13px; height: 2px; background: var(--gold); opacity: .35; }
.scale { position: absolute; top: 34px; font: .66rem var(--font-data); color: var(--muted); transform: translateX(-50%); }
.play { margin-left: 8px; }

aside { grid-row: 2 / 4; grid-column: 2; min-height: 0; overflow-y: auto; padding-block: 16px 24px; border-left: 1px solid var(--line); padding-left: 20px; }
aside h2 { font-family: var(--font-display); font-weight: 400; font-size: 1.55rem; margin: 0 0 2px; line-height: 1.15; text-wrap: balance; }
aside h3 { font: 500 .7rem var(--font-data); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 20px 0 8px; }
.polity { color: var(--muted); font-style: italic; margin: 0 0 12px; }
.badges { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.badge { font: .68rem/1 var(--font-data); letter-spacing: .05em; text-transform: uppercase; padding: 5px 7px; border-radius: 3px; border: 1px solid var(--line); color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.badge i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }
.summary { margin: 0; }
.link { margin-top: 14px; padding: 10px 12px; border-left: 2px solid var(--gold); background: color-mix(in srgb, var(--gold) 9%, transparent); font-size: .92rem; }
.link b { font: 500 .68rem var(--font-data); letter-spacing: .1em; text-transform: uppercase; color: var(--gold); display: block; margin-bottom: 3px; }
ol.ev { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
ol.ev li { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 10px; font-size: .92rem; line-height: 1.45; }
ol.ev li.near .y { color: var(--surface); background: var(--fg); }
ol.ev li.far { opacity: .62; }
.y { font: 500 .78rem/1 var(--font-data); font-variant-numeric: tabular-nums; padding: 4px 0; text-align: center; border-radius: 3px; align-self: start; color: var(--fg); border: 1px solid var(--line); }
.y.ar { border-color: var(--gold); color: var(--gold); }
ol.ev .where { all: unset; cursor: pointer; font: 500 .7rem var(--font-data); letter-spacing: .05em; text-transform: uppercase; color: var(--accent); display: block; }
ol.ev .where:hover { text-decoration: underline; }
.back { margin-bottom: 14px; }
.note { font-size: .8rem; color: var(--muted); margin-top: 22px; border-top: 1px solid var(--line); padding-top: 12px; }
.empty { color: var(--muted); font-style: italic; font-size: .9rem; }
.search { width: 100%; font: .88rem var(--font-body); padding: 8px 10px; border: 1px solid var(--line); border-radius: 3px; background: var(--surface); color: var(--fg); margin-bottom: 4px; }

@media (max-width: 860px) {
  html, body { height: auto; }
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto; height: auto; }
  #map { height: 58vh; min-height: 280px; flex: none; }
  aside { grid-row: auto; grid-column: 1; border-left: 0; padding-left: 0; border-top: 1px solid var(--line); overflow: visible; }
  .rail { grid-column: 1; }
  .stage { text-align: left; }
  h1 { font-size: 1.35rem; }
}
</style>

<div class="app">
  <header>
    <h1>The World in His Lifetime <small>570 – 632 CE</small></h1>
    <div class="modes" role="group" aria-label="Colour the map by">
      <button type="button" data-mode="sphere" aria-pressed="true">Powers</button>
      <button type="button" data-mode="link" aria-pressed="false">Contact with Arabia</button>
      <button type="button" data-mode="evidence" aria-pressed="false">How much we know</button>
    </div>
  </header>

  <div class="mapwrap">
    <svg id="map" role="img" aria-label="World map coloured by the powers of c. 570–632 CE. Select a country for details."></svg>
    <div class="zoombtns"><button type="button" id="zin" aria-label="Zoom in">+</button><button type="button" id="zout" aria-label="Zoom out">−</button><button type="button" id="zreset" aria-label="Reset view">⟲</button></div>
    <div class="tip" id="tip" hidden></div>
    <div class="legend" id="legend"></div>
  </div>

  <div class="rail">
    <div class="rail-top">
      <div><span class="yr" id="yrLabel">610</span><em id="yrAH"></em><button type="button" class="chip play" id="play" aria-pressed="false">Play</button></div>
      <div class="stage" id="stage"></div>
    </div>
    <div class="track" id="track">
      <input type="range" id="year" min="565" max="640" step="1" value="610" aria-label="Year (CE)">
    </div>
  </div>

  <aside id="panel" aria-live="polite"></aside>
</div>

const DATA = {"Algeria":{"polity":"Byzantine Numidia (coast) and Mauro-Roman Berber kingdoms (interior)","summary":"Byzantine Africa held the coastal towns and eastern Numidia around Constantine, while the interior and west were ruled by Berber Mauro-Roman kingdoms, heirs of the earlier realm of Altava and of the Aures. These rulers mixed Latin titles, Christianity and tribal power. The Djedars, royal stone tombs near Tiaret, belong to this era. Written sources are thin and mostly Byzantine.","events":[{"y":570,"approx":true,"t":"The Moorish king Garmul defeats and kills Byzantine commanders in Africa, including the prefect Theodore, over c. 570-571."},{"y":578,"approx":true,"t":"The Byzantine general Gennadius defeats Garmul, who is killed by 579, restoring imperial authority for a time."},{"y":600,"approx":true,"t":"Djedar funerary monuments near Tiaret reflect continuing Berber royal power in the western highlands."}],"link":null,"evidence":"moderate"},"Angola":{"polity":"Bantu-speaking farmers; Khoe-San foragers and herders in the south","summary":"Iron-using Bantu-speaking farmers lived in the north and central plateau, while the dry south still had foraging and herding peoples speaking Khoe-San languages. The Kongo and Ndongo kingdoms lay far in the future. Evidence comes from scattered archaeology.","events":[{"y":600,"approx":true,"t":"Early Iron Age farming communities spread across the central plateau; foragers remain in the south."}],"link":null,"evidence":"sparse"},"Benin":{"polity":"Farming and fishing communities","summary":"Coastal lagoon fishers and inland farmers lived here, growing yams and working iron. The later kingdoms of Allada and Dahomey were many centuries away. Archaeological evidence for the period is scant.","events":[{"y":600,"approx":true,"t":"Farming and lagoon fishing communities occupy the region; little archaeology from this era is published."}],"link":null,"evidence":"sparse"},"Botswana":{"polity":"San foragers; Iron Age farmers at Tsodilo and in the east","summary":"San hunter-gatherers and Khoe herders lived across the Kalahari. At the Tsodilo Hills, the Iron Age site of Divuyu dates roughly to the 6th-8th century, with copper and iron. In the east, early Toutswe farmers were beginning to settle. No written records exist.","events":[{"y":600,"approx":true,"t":"Divuyu at Tsodilo Hills is occupied by iron- and copper-using farmers."},{"y":630,"approx":true,"t":"The Toutswe cattle-farming tradition begins in eastern Botswana, c. 600-700."}],"link":null,"evidence":"sparse"},"Burkina Faso":{"polity":"Iron-smelting farming communities of the Volta basin","summary":"Farming villages in the Volta basin grew millet and sorghum and smelted iron, a craft long established here; the ancient iron metallurgy sites of Burkina Faso are among the best known in West Africa. Settlement mounds in the north grew over this period. No written records survive.","events":[{"y":600,"approx":true,"t":"Farming villages smelt iron and cultivate millet in the Volta basin; dating is broad."}],"link":null,"evidence":"sparse"},"Burundi":{"polity":"Iron-using farmers and forest foragers of the Great Lakes","summary":"As in neighbouring Rwanda, highland farmers practised iron smelting, a craft present since the first millennium BCE, and grew grains. Forest foragers lived alongside them. The later kingdom of Burundi did not yet exist. Archaeology gives only a general picture.","events":[{"y":600,"approx":true,"t":"Highland farming communities use iron tools; early furnace sites show a long iron tradition."}],"link":null,"evidence":"sparse"},"Cameroon":{"polity":"Bantu-speaking farmers and foragers; Lake Chad basin communities in the north","summary":"The grasslands of western Cameroon were the ancient homeland of Bantu languages, long since spread across central and southern Africa. In this period farmers lived in the forest and grasslands, foragers in the forest, and Lake Chad basin communities in the far north. Archaeology is the only evidence.","events":[{"y":600,"approx":true,"t":"Farming communities occupy the Grassfields and forest; Lake Chad basin mound sites in the north."}],"link":null,"evidence":"sparse"},"Central African Rep.":{"polity":"Savanna farmers and forest communities","summary":"Farming and foraging communities lived across the savanna and southern forest. Near Bouar, megaliths known as tazunu were raised, some possibly in the first millennium CE, though their dating is disputed. No written sources exist for this period.","events":[{"y":600,"approx":true,"t":"Some of the Bouar megaliths (tazunu) may date to this era; dates are disputed."}],"link":null,"evidence":"sparse"},"Chad":{"polity":"Lake Chad basin farmers and fishers; Saharan pastoralists","summary":"Around Lake Chad, farmers and fishers lived on settlement mounds, part of the long tradition later called Sao culture. The north held pastoralists of the Tibesti and Ennedi. The Kanem kingdom is first mentioned in the 9th century. The period itself is known only through archaeology.","events":[{"y":600,"approx":true,"t":"Settlement mounds in the Lake Chad basin are occupied by farming and fishing communities."}],"link":null,"evidence":"sparse"},"Congo":{"polity":"Bantu-speaking farming and fishing communities; forest foragers","summary":"River and forest communities speaking Bantu languages farmed, fished on the Congo and its tributaries, and worked iron. Forest foragers lived in the deep forest. The Kongo and Tio kingdoms came much later. Archaeological data for this period is very limited.","events":[{"y":600,"approx":true,"t":"Farming and fishing villages along the Congo river system use iron tools; dating is broad."}],"link":null,"evidence":"sparse"},"Côte d'Ivoire":{"polity":"Forest and savanna farming communities","summary":"Northern savanna farmers and southern forest communities grew yams and other crops and used iron. The Akan and other later states had not yet formed. Evidence is limited to scattered archaeological finds.","events":[{"y":600,"approx":true,"t":"Iron-using farmers occupy savanna and forest zones; few sites from this era have been excavated."}],"link":null,"evidence":"sparse"},"Dem. Rep. Congo":{"polity":"Bantu-speaking forest and savanna farmers; forest foragers","summary":"Bantu-speaking communities farmed river valleys and the savanna edges of the rainforest, fishing and working iron, while forest foragers (Batwa) lived in the interior. In the Upemba Depression in the south-east, communities were developing burial traditions that become the Kisalian culture by c. 700-800. No written sources exist.","events":[{"y":600,"approx":true,"t":"Upemba Depression communities develop the traditions that precede the Kisalian culture."}],"link":null,"evidence":"sparse"},"Djibouti":{"polity":"Afar and Somali-speaking pastoralists on Aksum's fringe","summary":"This arid coast at the mouth of the Red Sea was home to pastoralist groups, ancestors of the Afar and Somali. It lay on shipping lanes between Aksum, Yemen and the Indian Ocean. No written or archaeological record gives a clear picture of the period.","events":[{"y":600,"approx":true,"t":"Pastoralists occupy the coast at the Bab el-Mandeb strait, on Red Sea shipping routes."}],"link":null,"evidence":"sparse"},"Eq. Guinea":{"polity":"Bantu-speaking farmers on the mainland; early Bubi settlers on Bioko","summary":"The mainland rainforest held Bantu-speaking farmers and foragers. On Bioko island, settlers ancestral to the Bubi lived in farming and fishing villages, known from archaeological phases of the first millennium CE. Little more can be said for this period.","events":[{"y":600,"approx":true,"t":"Farming and fishing communities occupy Bioko island, ancestral to the Bubi; dates are approximate."}],"link":null,"evidence":"sparse"},"Eritrea":{"polity":"Kingdom of Aksum (Red Sea coast and highlands)","summary":"The Eritrean highlands and coast were core Aksumite lands. Its port Adulis had long carried Red Sea trade in ivory, gold and goods to Arabia and Byzantium, but was declining by the early 7th century as Red Sea commerce shrank. Christianity, Ge'ez and Aksumite coinage defined the region.","events":[{"y":570,"approx":true,"t":"Aksum's grip on Yemen is lost as Persian forces take South Arabia around this time."},{"y":615,"approx":true,"t":"Muslim refugees from Mecca cross the Red Sea to Aksumite territory in the first Hijra."},{"y":630,"approx":true,"t":"Adulis and Red Sea trade are in decline in the early 7th century."}],"link":"The first Muslim emigrants c. 615 crossed the Red Sea to Aksumite territory, landing on this coast on their way to the Negus.","evidence":"moderate"},"Ethiopia":{"polity":"Kingdom of Aksum (Negus Ashama, al-Najashi)","summary":"Aksum was an old Christian kingdom with its capital in the northern Ethiopian highlands, issuing coins and trading via the Red Sea. Its power was waning after losing Yemen around 570. Its ruler in Muhammad's time, Ashama ibn Abjar, called al-Najashi by Muslims, sheltered persecuted early Muslims. Aksumite coinage ends in the early 7th century.","events":[{"y":570,"approx":true,"t":"Abraha, Aksumite-born ruler of Yemen, leads the traditional Year of the Elephant expedition against Mecca."},{"y":615,"approx":true,"t":"The first Hijra: a group of Muslims, then more c. 616, take refuge with the Negus in Aksum."},{"y":616,"approx":true,"t":"Quraysh envoys, including Amr ibn al-As, fail to persuade the Negus to hand over the refugees."},{"y":628,"approx":true,"t":"Ja'far ibn Abi Talib and the remaining emigrants return to join Muhammad in Medina."},{"y":630,"approx":true,"t":"The Negus Ashama dies; tradition says Muhammad prayed the funeral prayer for him in absentia."}],"link":"The Negus Ashama gave refuge to Muslim emigrants from c. 615, including Ja'far ibn Abi Talib and Uthman, the first Hijra.","evidence":"moderate"},"Gabon":{"polity":"Bantu-speaking forest farmers; forest foragers","summary":"Rainforest and river communities practised farming and iron smelting, a craft present in Gabon from the first millennium BCE. Forest foragers lived alongside them. The Middle Ogooue valley has many rock engravings, though their dates are uncertain. No written sources exist.","events":[{"y":600,"approx":true,"t":"Iron-using farming villages occupy the Ogooue valley and coast; site dating is broad."}],"link":null,"evidence":"sparse"},"Gambia":{"polity":"Farming communities of the Senegambian megalithic zone","summary":"Along the Gambia River, farming and iron-using communities built stone circles over graves, as at Wassu and Kerbatch. These sites, now a World Heritage area, span centuries of the first millennium CE. Nothing is known of their rulers or languages from writing.","events":[{"y":600,"approx":true,"t":"Stone circles at sites such as Wassu mark burials of Senegambian farming communities."}],"link":null,"evidence":"sparse"},"Ghana":{"polity":"Savanna and forest farming communities (not the medieval Ghana empire)","summary":"Modern Ghana lies far from the medieval Ghana (Wagadu) empire, which was in the western Sahel. Here, iron-using farmers lived in the savanna and forest. In the north, the Koma Land terracotta figurines span roughly the mid to late first millennium CE. The forest gold trade and Akan states came later.","events":[{"y":600,"approx":true,"t":"Koma Land communities in the north produce terracotta figurines, dated broadly to the later first millennium."}],"link":null,"evidence":"sparse"},"Guinea":{"polity":"Iron-using farmers and forest communities","summary":"Upland savanna and forest communities grew crops, kept livestock and worked iron. Mande-speaking peoples lived in the upper Niger region. The great states of the region came centuries later. The period is known only through limited archaeology.","events":[{"y":600,"approx":true,"t":"Iron-using farming communities occupy the Futa Jallon highlands and upper Niger; few sites are dated."}],"link":null,"evidence":"sparse"},"Guinea-Bissau":{"polity":"Coastal rice-farming and fishing communities","summary":"The coastal estuaries were home to communities growing rice in mangrove swamps, fishing and working iron. These were likely ancestors of coastal groups such as the Balanta and Bijago, but no written or detailed archaeological record survives for this period.","events":[{"y":600,"approx":true,"t":"Coastal communities farm, fish and use iron tools; little archaeology exists for the period."}],"link":null,"evidence":"sparse"},"Kenya":{"polity":"Bantu-speaking coastal farmers; pastoralists in the Rift Valley","summary":"Bantu-speaking farmers using iron lived along the coast, making pottery called Triangular Incised Ware, part of the roots of later Swahili culture. Inland, pastoralist and herding groups, ancestors of Cushitic and Nilotic speakers, used the Rift Valley grasslands. Swahili towns came later. All evidence is archaeological.","events":[{"y":600,"approx":true,"t":"Coastal communities making Triangular Incised Ware form early Swahili-coast precursor villages, c. 6th-10th c."}],"link":null,"evidence":"sparse"},"Lesotho":{"polity":"San hunter-gatherers","summary":"The mountains were home to San hunter-gatherers, who painted many rock shelters. Bantu-speaking farmers, ancestors of the Sotho, arrived only centuries later. Evidence is archaeological and rock art.","events":[{"y":600,"approx":true,"t":"San hunter-gatherers occupy mountain shelters and continue painting rock art."}],"link":null,"evidence":"sparse"},"Liberia":{"polity":"Forest farming and foraging communities","summary":"Dense rainforest supported small farming and foraging communities, probably ancestors of local Kru- and Mel-speaking peoples. Archaeological research for this era is very limited, so little can be said with confidence.","events":[{"y":600,"approx":true,"t":"Small forest communities farm and forage; the period is almost undocumented archaeologically."}],"link":null,"evidence":"sparse"},"Libya":{"polity":"Byzantine Tripolitania and Cyrenaica; Garamantian successors in Fezzan","summary":"Tripolitania belonged to the Exarchate of Africa and Cyrenaica to the Egyptian administration; both were Christian, with shrinking coastal towns such as Leptis Magna and Sabratha. Berber groups held the countryside. In Fezzan the old Garamantian state around Germa was in decline, though oasis farming and Saharan trade continued.","events":[{"y":569,"approx":false,"t":"John of Biclaro records that the Garamantes made peace with Byzantium and accepted Christianity."},{"y":609,"approx":true,"t":"Heraclius' cousin Nicetas advances from Africa toward Egypt against Phocas' forces, crossing the Libyan coast."}],"link":null,"evidence":"moderate"},"Madagascar":{"polity":"Early Austronesian and African settlers (dates debated)","summary":"Madagascar was settled by Austronesian seafarers from Island Southeast Asia, related by language to the Ma'anyan of Borneo, later joined by Bantu-speaking Africans. When this happened is debated, perhaps from the mid first millennium CE, with clear settlements from about the 7th-8th century. Earlier human visits are claimed but disputed.","events":[{"y":600,"approx":true,"t":"Austronesian settlers may be establishing coastal communities in Madagascar; dates remain debated."}],"link":null,"evidence":"sparse"},"Malawi":{"polity":"Early Iron Age farmers (Nkope tradition) and foragers","summary":"Farmers making Nkope-tradition pottery lived along Lake Malawi and the uplands, using iron and keeping livestock. Forager groups also lived here and made some of the older rock paintings of the Chongoni area. The Chewa and later states came much later.","events":[{"y":600,"approx":true,"t":"Nkope-tradition Early Iron Age villages occupy the Lake Malawi region."}],"link":null,"evidence":"sparse"},"Mali":{"polity":"Jenne-jeno and Inland Niger Delta towns; possible early Ghana (Wagadu)","summary":"Jenne-jeno in the Inland Niger Delta was a large walled settlement of farmers, fishers, potters and smiths, trading iron, copper and food across the region long before Islam arrived. It shows that West African towns grew without outside rule. To the north-west, early Ghana (Wagadu) may have been forming. All evidence is archaeological.","events":[{"y":600,"approx":true,"t":"Jenne-jeno is near its peak as a densely settled urban cluster on the Niger, c. 400-900 CE."},{"y":600,"approx":true,"t":"Soninke communities in the Sahel may be organising the early Ghana (Wagadu) state; origins are uncertain."}],"link":null,"evidence":"sparse"},"Mauritania":{"polity":"Berber nomads in the north; Soninke-speaking farmers in the south","summary":"The north was home to Berber camel nomads, while the southern Sahel had Soninke-speaking farming villages. The state later called Ghana (Wagadu) may have been taking shape on the Mauritania-Mali border, but its origins are uncertain and first written mention comes from Arab writers in the late 8th century.","events":[{"y":600,"approx":true,"t":"Early stages of the Ghana (Wagadu) state may be forming in the southern Sahel; dating is uncertain."}],"link":null,"evidence":"sparse"},"Morocco":{"polity":"Berber confederations; Byzantine outpost at Septem (Ceuta)","summary":"Outside the Byzantine fortress of Septem, the land was ruled by Berber tribal confederations and small principalities. Latin Christian communities survived at Volubilis and other old Roman towns, where Latin epitaphs continue into the 7th century. Farming, herding and local trade dominated. Very little was written about the region in this period.","events":[{"y":600,"approx":true,"t":"Latin Christian epitaphs at Volubilis show a surviving Romanised community under local Berber rule."}],"link":null,"evidence":"sparse"},"Mozambique":{"polity":"Bantu-speaking farmers; early coastal trading sites","summary":"Iron-using farming villages lined the river valleys and coast. Coastal sites such as Chibuene in the south began to receive Indian Ocean goods, with the earliest imports probably from the 7th-8th century. Foragers survived in some areas. Evidence is archaeological.","events":[{"y":630,"approx":true,"t":"Chibuene, on the southern coast, may begin receiving Indian Ocean trade goods; dating is debated."}],"link":null,"evidence":"sparse"},"Namibia":{"polity":"San foragers and Khoe herders","summary":"The desert and dry savanna were home to San hunter-gatherers and Khoe-speaking herders of sheep and cattle. Rock art in the Brandberg and elsewhere records a long forager tradition. Farmers were present only in the far north. Evidence is archaeological.","events":[{"y":600,"approx":true,"t":"San foragers and Khoe herders occupy the region; rock art traditions continue."}],"link":null,"evidence":"sparse"},"Niger":{"polity":"Sahelian farmers (Bura culture) and Saharan nomads","summary":"Along the Niger valley, the Bura culture buried its dead in pottery jars with terracotta figures, over roughly the 3rd to 11th centuries. The Air mountains and desert were used by Berber pastoralists. Early Gao lay just upriver in modern Mali. Evidence is archaeological only.","events":[{"y":600,"approx":true,"t":"The Bura culture continues its distinctive jar burials with terracotta figures in the Niger valley."}],"link":null,"evidence":"sparse"},"Nigeria":{"polity":"Iron-using farming communities; Nok culture long ended","summary":"The Nok terracotta culture had ended centuries earlier, and the bronze-casting at Igbo-Ukwu belongs to the 9th-10th centuries, so neither fits this period. Farming villages with iron tools occupied the forest and savanna. Sites like Yelwa on the Niger and Daima near Lake Chad show long-lived settlements. Ile-Ife's urban growth came later.","events":[{"y":600,"approx":true,"t":"Settlements such as Yelwa on the middle Niger show farming and iron-using village life, c. 1st-7th c."}],"link":null,"evidence":"sparse"},"Rwanda":{"polity":"Iron-using farmers and forest foragers of the Great Lakes","summary":"Hill farmers worked iron, a craft known here since the first millennium BCE, and grew sorghum and other crops. Forest foragers, ancestors of the Twa, lived alongside them. The later kingdom of Rwanda was centuries away. Knowledge comes from archaeology.","events":[{"y":600,"approx":true,"t":"Farmers with iron tools clear highland forest; smelting sites show a long iron-working tradition."}],"link":null,"evidence":"sparse"},"S. Sudan":{"polity":"Pastoralist and farming communities of the upper Nile","summary":"The swamps and savannas of the upper Nile were home to cattle-herding and farming peoples, possibly including ancestors of Nilotic groups. Alodia's influence may have reached the northern fringe. No written records exist and archaeology is scarce.","events":[{"y":600,"approx":true,"t":"Cattle-keeping and farming communities occupy the upper Nile basin; dating is very uncertain."}],"link":null,"evidence":"sparse"},"Senegal":{"polity":"Farming and fishing communities; Senegambian megalith builders","summary":"Communities along the Senegal and Gambia rivers farmed millet and rice, fished and worked iron. They raised stone circles over burials, as at Sine Ngayene, a tradition spanning much of the first millennium CE. The state of Takrur appears only later. Knowledge rests on archaeology.","events":[{"y":600,"approx":true,"t":"Senegambian stone circles continue to be raised over burials at sites such as Sine Ngayene."}],"link":null,"evidence":"sparse"},"Sierra Leone":{"polity":"Forest and coastal farming and foraging communities","summary":"Small farming and foraging communities lived in the forests and along the coast. Rock-shelter excavations such as Kamabai and Yengema show long occupation, with iron in use by the later first millennium CE. No written sources exist.","events":[{"y":600,"approx":true,"t":"Rock shelters such as Kamabai are occupied by communities using iron and stone tools."}],"link":null,"evidence":"sparse"},"Somalia":{"polity":"Cushitic-speaking pastoralists and coastal trading settlements","summary":"Camel and cattle pastoralists, ancestors of Somali speakers, lived inland, while the Indian Ocean and Horn coasts had small trading stops dealing in aromatics. Older ports like Opone (Hafun) were known from Roman times. Mogadishu's rise came later. Evidence for this period is very limited.","events":[{"y":600,"approx":true,"t":"Pastoralists herd camels and cattle inland; coastal sites trade aromatics with Arabia."}],"link":null,"evidence":"sparse"},"Somaliland":{"polity":"Trading ports of the Gulf of Aden (Zeila, Berbera) and pastoralists","summary":"Ports such as Zeila and Berbera, known to Greek writers centuries earlier, traded incense, myrrh and animal goods across the Gulf of Aden to Arabia. Inland, Cushitic-speaking pastoralists herded camels and goats. A later tradition claims Zeila's two-qibla mosque dates to the Prophet's time, but this is unverified.","events":[{"y":600,"approx":true,"t":"Zeila and Berbera serve as small ports trading aromatics and livestock goods with Arabia."}],"link":null,"evidence":"sparse"},"South Africa":{"polity":"Bantu-speaking farmers in the east; San foragers and Khoe herders","summary":"Iron-using Bantu-speaking farmers settled the eastern lowlands and river valleys, keeping cattle and growing sorghum. The Lydenburg Heads, terracotta sculptures from Mpumalanga, date to around the 6th century. San hunter-gatherers and Khoe herders held the west and interior. Mapungubwe came later.","events":[{"y":600,"approx":true,"t":"The Lydenburg Heads are made by farming communities in Mpumalanga, c. 500-600 CE."},{"y":630,"approx":true,"t":"Farming villages spread through KwaZulu-Natal river valleys; San foragers remain widespread."}],"link":null,"evidence":"sparse"},"Sudan":{"polity":"Nubian kingdoms: Nobadia, Makuria and Alodia","summary":"Three Christian Nubian kingdoms lined the Nile: Nobadia in the north (capital Faras), Makuria (Old Dongola) and Alodia (Soba). Rival missions from Constantinople converted them: Nobadia and Alodia to Miaphysite Christianity, Makuria likely to Chalcedonian. Churches, ivory, gold and Nile trade linked them to Egypt and Byzantium. Nobadia was later absorbed into Makuria, at an uncertain date.","events":[{"y":569,"approx":false,"t":"The Miaphysite bishop Longinus arrives in Nobadia to lead its church."},{"y":573,"approx":false,"t":"A Makurian embassy reaches Emperor Justin II with gifts of ivory and a giraffe, per John of Biclaro."},{"y":580,"approx":true,"t":"Longinus travels to Alodia and baptises its king and nobles."},{"y":600,"approx":true,"t":"Large churches are built at Old Dongola, the Makurian capital."}],"link":null,"evidence":"moderate"},"Tanzania":{"polity":"Bantu-speaking farmers; early coastal trading villages","summary":"Iron-using Bantu-speaking farmers lived inland and on the coast. On Zanzibar, Unguja Ukuu was becoming a trading settlement, with some imported Indian Ocean goods, perhaps from the 6th-7th century. These coastal villages were forerunners of Swahili culture. Kilwa came much later. Evidence is archaeological.","events":[{"y":600,"approx":true,"t":"Unguja Ukuu on Zanzibar develops as an early coastal trading village; its start date is debated."}],"link":null,"evidence":"sparse"},"Togo":{"polity":"Iron-working farming communities","summary":"Farming communities lived in the coastal plains and northern hills. The Bassar region in the north became a major iron-smelting centre during the first millennium CE. Written sources do not exist, and much of the period is undated.","events":[{"y":600,"approx":true,"t":"Iron production develops in the Bassar region, supplying tools for surrounding farmers."}],"link":null,"evidence":"sparse"},"Tunisia":{"polity":"Byzantine Exarchate of Africa (capital Carthage)","summary":"Carthage was the rich, Latin-speaking capital of Byzantine Africa, reorganised as an exarchate under Emperor Maurice by about 591. It exported grain and olive oil, and its Chalcedonian church corresponded with Pope Gregory I. The exarch Heraclius the Elder launched the revolt that put his son Heraclius on the imperial throne in 610.","events":[{"y":591,"approx":false,"t":"Gennadius is attested as the first exarch of Africa, combining civil and military power at Carthage."},{"y":608,"approx":false,"t":"Exarch Heraclius the Elder and his brother Gregory rebel against Emperor Phocas from Carthage."},{"y":610,"approx":false,"t":"The younger Heraclius sails from Carthage, takes Constantinople and is crowned emperor in October."},{"y":618,"approx":true,"t":"With Persians overrunning the east, Heraclius reportedly considers moving the capital to Carthage."}],"link":"No direct contact, but the Heraclian dynasty launched from Carthage ruled the empire whose army fought Muslims at Mu'ta in 629.","evidence":"rich"},"Uganda":{"polity":"Bantu-speaking iron-using farmers of the Great Lakes","summary":"Around Lake Victoria, Bantu-speaking farmers had used iron and made Urewe-style pottery for centuries, growing sorghum, millet and bananas. Pastoralists lived in drier areas. Large centres like Ntusi came after 1000 CE. No written sources exist.","events":[{"y":600,"approx":true,"t":"Iron-using farming communities, heirs of the Urewe tradition, occupy the Lake Victoria basin."}],"link":null,"evidence":"sparse"},"W. Sahara":{"polity":"Nomadic Sanhaja Berber groups","summary":"This was desert and Atlantic coast used by camel-herding Berber groups, ancestors of the Sanhaja. The camel, widespread in the Sahara by now, made long desert crossings possible. No written sources describe the region in this period, and archaeological work is limited.","events":[{"y":600,"approx":true,"t":"Camel-herding Berber nomads range across the western Sahara; trans-Saharan routes are only beginning to develop."}],"link":null,"evidence":"sparse"},"Zambia":{"polity":"Early Iron Age Bantu-speaking farmers","summary":"Early Iron Age farming villages, making distinctive pottery traditions, occupied the plateau and river valleys, growing sorghum and keeping cattle and goats. Sites like Kalambo Falls show long Iron Age occupation. Foragers persisted in many areas. No written sources exist.","events":[{"y":600,"approx":true,"t":"Early Iron Age villages occupy the Zambian plateau and Kalambo Falls area."}],"link":null,"evidence":"sparse"},"Zimbabwe":{"polity":"Early Iron Age farmers (Gokomere/Ziwa traditions); San foragers","summary":"Bantu-speaking farmers of the Gokomere and Ziwa traditions grew crops, herded cattle and worked iron and some gold. San foragers still lived across the land and painted rock shelters. Great Zimbabwe came only after about 1100 CE. Evidence is archaeological.","events":[{"y":600,"approx":true,"t":"Gokomere/Ziwa farming villages occupy the plateau; San foragers continue rock painting."}],"link":null,"evidence":"sparse"},"eSwatini":{"polity":"Early Iron Age farmers and San foragers","summary":"Bantu-speaking Iron Age farmers lived in the lowland and middle valleys, while San hunter-gatherers lived in the hills and painted rock shelters. The Swazi kingdom formed much later. Little is known in detail.","events":[{"y":600,"approx":true,"t":"Early Iron Age farming villages occupy the lowveld; San foragers remain in the hills."}],"link":null,"evidence":"sparse"},"Canada":{"polity":"Hunter-gatherer and fishing peoples (Dorset in the Arctic, Woodland and Plains groups, Northwest Coast societies)","summary":"No states or writing; everything known comes from archaeology. Dorset Paleo-Inuit hunted seals across the eastern Arctic; the Thule ancestors of the Inuit had not yet arrived. Northwest Coast peoples lived in plank-house villages built on salmon. Plains bison hunters and eastern Woodland groups making pottery were adopting the bow and arrow. Dates and group identities are broad estimates.","events":[{"y":600,"approx":true,"t":"Dorset Paleo-Inuit occupy much of the Arctic coast from Labrador to the high islands, hunting seals and walrus."},{"y":600,"approx":true,"t":"The bow and arrow spreads across the Plains and eastern woodlands, replacing the spear-thrower; on the northern Plains it is linked to the Avonlea complex."},{"y":600,"approx":true,"t":"Northwest Coast villages with large plank houses, salmon storage and marked social ranking continue on the Fraser River and the coast."}],"link":null,"evidence":"sparse"},"United States of America":{"polity":"Diverse Native American societies (Late Woodland, Basketmaker III, Hohokam, Weeden Island and others)","summary":"No states, cities or writing. In the East, the Hopewell mound-building network had faded and Late Woodland villages spread, using the bow and arrow and growing native seed crops with some maize. In the Southwest, Basketmaker III Ancestral Puebloans lived in pithouse villages and made pottery, and Hohokam farmers dug irrigation canals near Phoenix. Gulf coast Weeden Island peoples built platform mounds. Hawaii was probably not yet settled.","events":[{"y":575,"approx":true,"t":"Late Woodland period: the Hopewell exchange network has ended and smaller dispersed villages are typical in the Ohio and Mississippi valleys."},{"y":600,"approx":true,"t":"The bow and arrow becomes common across much of the continent, changing hunting and warfare."},{"y":600,"approx":true,"t":"Basketmaker III Ancestral Puebloans on the Colorado Plateau live in pithouse villages, grow maize and beans, and make fired pottery."},{"y":600,"approx":true,"t":"Hohokam farmers in the Sonoran Desert expand irrigation canals along the Salt and Gila rivers."},{"y":600,"approx":true,"t":"Weeden Island culture flourishes on the Gulf coast of Florida and Georgia, with burial mounds and fine ceremonial pottery; Coles Creek follows from c. 700."}],"link":null,"evidence":"sparse"},"Mexico":{"polity":"Teotihuacan in decline; Zapotec Monte Albán; Cholula; Maya kingdoms (Palenque, Calakmul and others)","summary":"Teotihuacan, once the largest city in the Americas, had its central monuments burned around 550 and was losing its power. Cholula and Zapotec Monte Albán in Oaxaca continued as major centres. In the Maya south, Palenque suffered two attacks by the Kaanul (Snake) dynasty, later based at Calakmul. Pakal, born 603, became king of Palenque at age twelve in 615.","events":[{"y":550,"approx":true,"t":"The civic centre of Teotihuacan is burned (date debated, c. 550–650); the city shrinks and its reach across Mesoamerica fades."},{"y":599,"approx":false,"t":"Kaanul forces sack Palenque, a defeat its later inscriptions record."},{"y":603,"approx":false,"t":"K'inich Janaab Pakal, the future king of Palenque, is born."},{"y":611,"approx":false,"t":"Palenque is sacked a second time by the Kaanul dynasty."},{"y":615,"approx":false,"t":"Pakal, aged twelve, becomes king of Palenque after the brief reign of his mother, Lady Sak K'uk'."},{"y":635,"approx":true,"t":"The Kaanul dynasty is attested at Calakmul, having moved from Dzibanché; it becomes the main rival of Tikal."}],"link":null,"evidence":"moderate"},"Guatemala":{"polity":"Maya city-states (Tikal, Naranjo and others) under the shadow of the Kaanul dynasty","summary":"The Petén lowlands were divided among rival Maya kingdoms that recorded dynastic history in hieroglyphic inscriptions. Tikal had been defeated in 562 and entered a long 'hiatus' with almost no new monuments. The Kaanul (Snake) kings and their ally Caracol dominated the region. Naranjo was beaten in war by Caracol. In the highlands, Kaminaljuyú was declining.","events":[{"y":562,"approx":false,"t":"Tikal is defeated, probably by Caracol and its Kaanul allies; its king Wak Chan K'awiil is apparently sacrificed."},{"y":575,"approx":true,"t":"Tikal's 'hiatus' continues: almost no dated monuments are raised there until 692."},{"y":626,"approx":false,"t":"Caracol defeats Naranjo in battle."},{"y":630,"approx":true,"t":"Dos Pilas is founded as a Tikal outpost in the Petexbatún region; its founder later defects to Calakmul's side."},{"y":631,"approx":true,"t":"Caracol, backed by the Kaanul dynasty, conquers Naranjo."}],"link":null,"evidence":"moderate"},"Belize":{"polity":"Maya kingdom of Caracol, ally of the Kaanul dynasty; smaller centres such as Lamanai and Altun Ha","summary":"Caracol, in the Maya Mountains, was at its height. Allied with the Kaanul kings, it had helped defeat Tikal in 562 and grew into a city of perhaps tens of thousands, with farm terraces and causeways. Its king K'an II, who took power in 618, led wars against Naranjo. Lamanai and Altun Ha were also active Maya towns.","events":[{"y":562,"approx":false,"t":"Caracol and its allies defeat Tikal, beginning Caracol's rise."},{"y":599,"approx":true,"t":"Knot Ajaw becomes ruler of Caracol."},{"y":618,"approx":false,"t":"K'an II becomes king of Caracol; he rules for about forty years."},{"y":626,"approx":false,"t":"Caracol under K'an II wins a battle against Naranjo."},{"y":631,"approx":true,"t":"Caracol defeats Naranjo in a decisive 'star war', recorded on a hieroglyphic stairway."}],"link":null,"evidence":"moderate"},"Honduras":{"polity":"Maya kingdom of Copán; non-Maya chiefdoms elsewhere","summary":"Copán, in the far southeast of the Maya world, was a prosperous royal city with a dynasty dating back to K'inich Yax K'uk' Mo' in 426. Butz' Chan ruled from 578 to 628, followed by K'ahk' Uti' Witz' K'awiil ('Smoke Imix'), who ruled for 67 years. The rest of the region was home to non-Maya peoples, including Lenca ancestors, who are known only from archaeology.","events":[{"y":578,"approx":false,"t":"Butz' Chan, the eleventh ruler, becomes king of Copán."},{"y":628,"approx":false,"t":"K'ahk' Uti' Witz' K'awiil ('Smoke Imix') becomes king of Copán; he rules until 695 and fills the valley with stelae."}],"link":null,"evidence":"moderate"},"El Salvador":{"polity":"Maya and non-Maya farming communities (e.g., Chalchuapa, San Andrés, Joya de Cerén)","summary":"The region was recovering from the huge Ilopango eruption, now often dated to about 431, though some scholars argue for c. 539. Farming villages and towns such as San Andrés and Tazumal at Chalchuapa grew up again. Around 600 the small village of Joya de Cerén was buried under ash from the nearby Loma Caldera vent. Its houses, gardens and tools are preserved.","events":[{"y":575,"approx":true,"t":"Settlement and maize farming recover in the valleys around Lake Ilopango after the great eruption (dated c. 431 or c. 539)."},{"y":600,"approx":true,"t":"Loma Caldera erupts and buries Joya de Cerén; villagers escape but leave behind houses, crops and tools (date estimated, c. 600–660)."},{"y":600,"approx":true,"t":"San Andrés grows into a regional centre in the Zapotitán valley."}],"link":null,"evidence":"sparse"},"Nicaragua":{"polity":"Chiefdom societies of Greater Nicoya (Pacific side); forest peoples of the Caribbean side","summary":"There were no states or writing. Farming villages around the Pacific-side lakes belonged to the Greater Nicoya cultural area and made polychrome pottery and carved stone. The Chorotega and Nicarao groups known to the Spanish arrived later. The Caribbean lowlands are poorly known archaeologically.","events":[{"y":600,"approx":true,"t":"Greater Nicoya villages near Lakes Nicaragua and Managua farm maize and make painted pottery (Bagaces period, c. 300–800)."}],"link":null,"evidence":"sparse"},"Costa Rica":{"polity":"Chiefdoms of Greater Nicoya, the Central Highlands and Atlantic watershed, and Diquís","summary":"Ranked chiefdoms farmed maize and root crops and buried elites with prestige goods. Around this time, jade ornaments were being replaced by gold and tumbaga work, a technology spreading north from Colombia and Panama. In the Arenal area, people of the Silencio phase walked the same footpaths to cemeteries for generations. Evidence is purely archaeological.","events":[{"y":600,"approx":true,"t":"Gold and tumbaga ornaments, influenced by Panama and Colombia, begin to replace jade as the main elite treasure."},{"y":600,"approx":true,"t":"The Silencio phase begins at Arenal, with hilltop cemeteries reached by deeply worn footpaths."}],"link":null,"evidence":"sparse"},"Panama":{"polity":"Chiefdoms of the Gran Coclé and Gran Chiriquí traditions","summary":"Central Panama's Gran Coclé tradition had farming villages, ranked chiefs and boldly painted pottery. Goldwork was already made, though the richest burials at Sitio Conte and El Caño come mostly after c. 700. Western Panama belonged to the Gran Chiriquí sphere. No writing exists; all knowledge comes from excavation.","events":[{"y":600,"approx":true,"t":"Gran Coclé communities, such as at Cerro Juan Díaz, produce polychrome pottery and gold ornaments and bury chiefs with grave goods."}],"link":null,"evidence":"sparse"},"Cuba":{"polity":"Archaic (pre-ceramic) foraging peoples","summary":"Cuba was occupied by Archaic peoples who fished, gathered shellfish, hunted and made ground-stone and shell tools, mostly without pottery. Farming potters of the Ostionoid tradition, ancestors of the Taíno, did not reach Cuba in strength until a few centuries later. Little can be dated precisely.","events":[{"y":600,"approx":true,"t":"Archaic foraging communities live along Cuba's coasts and rivers, with little or no pottery or farming."}],"link":null,"evidence":"sparse"},"Bahamas":{"polity":"Probably uninhabited","summary":"No secure evidence shows people living in the Bahamas at this time. The islands were probably settled from about 700–900 by Ostionoid potters from Hispaniola or Cuba, ancestors of the Lucayans whom Columbus met. Dating of the earliest settlement is still debated.","events":[{"y":600,"approx":true,"t":"The Bahama islands appear to be still unsettled; the first Lucayan ancestors arrive some time after c. 700."}],"link":null,"evidence":"sparse"},"Jamaica":{"polity":"Probably uninhabited until first Ostionoid settlers","summary":"Jamaica seems to have been first settled around 600–650 by pottery-making farmers of the Ostionoid tradition, the so-called Redware people, probably from Hispaniola. Their small coastal villages relied on fish, shellfish and root crops. Earlier occupation has not been securely shown.","events":[{"y":650,"approx":true,"t":"First known settlers, Ostionoid 'Redware' potters, establish coastal villages such as Little River (date approximate, c. 600–650)."}],"link":null,"evidence":"sparse"},"Haiti":{"polity":"Archaic foragers, with ceramic Ostionoid farmers arriving","summary":"Western Hispaniola was home to Archaic foraging peoples using stone and shell tools. Around this period, pottery-making farmers of the Ostionoid tradition were spreading west from Puerto Rico across Hispaniola, beginning the line that led to the Taíno. Detailed dates are scarce.","events":[{"y":600,"approx":true,"t":"Ostionoid farmers who grew cassava begin to spread into Hispaniola alongside long-established Archaic foragers."}],"link":null,"evidence":"sparse"},"Dominican Rep.":{"polity":"Archaic foragers, with ceramic Ostionoid farmers arriving","summary":"Eastern Hispaniola, closest to Puerto Rico, received pottery-making, cassava-growing Ostionoid settlers around 600, who lived alongside or replaced older Archaic foraging groups. These communities were the ancestors of the Taíno chiefdoms that the Spanish met. Earlier Saladoid influence was limited.","events":[{"y":600,"approx":true,"t":"Ostionoid settlers from the Puerto Rico area establish farming villages in eastern Hispaniola."},{"y":630,"approx":true,"t":"Archaic foraging traditions continue in parts of the island beside the newcomers."}],"link":null,"evidence":"sparse"},"Puerto Rico":{"polity":"Village societies in transition from Saladoid to Ostionoid","summary":"Puerto Rico had been farmed for about a thousand years by Saladoid peoples from South America, who lived in round plaza villages and made fine white-on-red pottery. Around 600, archaeologists see a shift to the Ostionoid tradition, with plainer redware, larger populations and early ball courts and ceremonial plazas, which later developed into Taíno society.","events":[{"y":600,"approx":true,"t":"The Saladoid tradition gives way to the Ostionoid; pottery styles simplify and settlements spread inland."},{"y":600,"approx":true,"t":"Early stone-lined plazas and ball courts begin to appear in village centres."}],"link":null,"evidence":"sparse"},"Trinidad and Tobago":{"polity":"Saladoid and Barrancoid-influenced village societies","summary":"Trinidad, close to the Orinoco delta, was a gateway for peoples moving into the Caribbean. Farming and fishing villages made pottery in the Saladoid style, with strong Barrancoid influence from the mainland, at sites such as Palo Seco and Cedros. These were later followed by Arauquinoid and Troumassoid traditions. Dating is approximate.","events":[{"y":600,"approx":true,"t":"Villages on Trinidad's coast make Saladoid pottery influenced by Barrancoid styles from the Orinoco and keep close contact with the mainland."}],"link":null,"evidence":"sparse"},"Colombia":{"polity":"Regional chiefdoms (San Agustín, Tierradentro, Quimbaya, Zenú and others)","summary":"Colombia had many chiefdom societies but no empire or writing. In the south, the San Agustín culture carved large stone statues and Tierradentro dug painted underground tombs. In the central Cauca valley, Quimbaya goldsmiths cast fine gold work. In the north, Zenú communities drained the San Jorge floodplains with huge systems of canals and ridges. Dating rests on radiocarbon.","events":[{"y":600,"approx":true,"t":"San Agustín's Regional Classic period continues, with stone statues and tombs in the upper Magdalena valley."},{"y":600,"approx":true,"t":"Tierradentro communities cut painted underground tomb chambers (hypogea) into the hillsides."},{"y":600,"approx":true,"t":"Zenú farmers maintain vast ridged fields and canals in the San Jorge floodplain to manage seasonal floods."}],"link":null,"evidence":"sparse"},"Venezuela":{"polity":"Village and chiefdom societies of the Orinoco, Llanos and Andes","summary":"There were no states. Along the middle and lower Orinoco, villages made pottery in the Barrancoid style, while the Arauquinoid tradition was growing. In the western Llanos, communities began to build mounds, causeways and raised fields. Andean valleys held small farming villages. Knowledge is entirely archaeological and dates are broad.","events":[{"y":600,"approx":true,"t":"Arauquinoid pottery traditions spread along the middle Orinoco, gradually replacing Barrancoid styles."},{"y":600,"approx":true,"t":"Communities in the Barinas Llanos begin building earthen mounds and causeways."}],"link":null,"evidence":"sparse"},"Guyana":{"polity":"Village societies of the coast and interior","summary":"Very little is known. In the northwest, coastal people of the Mabaruma phase, connected to Barrancoid traditions of the Orinoco, built shell middens and made pottery. Interior savanna and forest groups farmed manioc and fished. Dates are rough and the sites few.","events":[{"y":600,"approx":true,"t":"Mabaruma-phase villages in northwest Guyana make Barrancoid-related pottery and farm manioc."}],"link":null,"evidence":"sparse"},"Suriname":{"polity":"Village societies of the coast and rainforest","summary":"The archaeological record is thin. Coastal and riverine villages farmed manioc, fished and made pottery. The best-known site, the Hertenrits raised-field mound complex, dates mainly from about 700 onward, just after this period. The interior forests were home to small farming and foraging groups.","events":[{"y":600,"approx":true,"t":"Pottery-making farming villages occupy the coastal plain; large raised-field works like Hertenrits come slightly later, from c. 700."}],"link":null,"evidence":"sparse"},"Ecuador":{"polity":"Regional chiefdoms of the coast and highlands (late Regional Development period)","summary":"Ecuador was divided among regional cultures such as Jama-Coaque and Bahía on the coast and Cerro Narrío and Panzaleo in the highlands. Around this time, the coast was moving into the 'Integration period' of larger chiefdoms, such as Milagro-Quevedo. Spondylus shells from Ecuador's warm waters were valued trade goods in Peru.","events":[{"y":600,"approx":true,"t":"Coastal societies move toward the Integration period, with larger chiefdoms; Milagro-Quevedo builds mounds in the Guayas basin."},{"y":600,"approx":true,"t":"Spondylus shell harvested off the Ecuadorian coast is traded south to Andean peoples for ritual use."}],"link":null,"evidence":"sparse"},"Peru":{"polity":"Late Moche (Pampa Grande), the rising Wari state, late Nazca, Recuay, Lima culture","summary":"A time of upheaval. Severe drought and El Niño floods in the late 500s, seen in the Quelccaya ice cores, strained the coastal Moche. Their late capital moved inland to Pampa Grande. In the highlands, the Wari state was rising from its capital Huari near Ayacucho. Nazca culture was ending in the south, and Recuay in the north was fading. Tiwanaku settled colonies in Moquegua.","events":[{"y":570,"approx":true,"t":"Quelccaya ice cores record a severe drought (c. 562–594), alongside El Niño floods on the north coast."},{"y":600,"approx":true,"t":"Late Moche (Phase V) centres shift inland; Pampa Grande in the Lambayeque valley becomes a large capital with the Huaca Fortaleza platform."},{"y":600,"approx":true,"t":"The Wari state expands from its capital Huari near Ayacucho, building a highland network that becomes the first Andean empire."},{"y":600,"approx":true,"t":"Tiwanaku colonists from the Titicaca basin farm the Moquegua valley (Omo settlements)."},{"y":600,"approx":true,"t":"Recuay culture in the Callejón de Huaylas declines as Wari influence grows."},{"y":625,"approx":true,"t":"Nazca culture comes to an end on the south coast as Wari influence spreads (Loro style)."}],"link":null,"evidence":"moderate"},"Bolivia":{"polity":"Tiwanaku (Lake Titicaca basin); Casarabe culture in the Llanos de Mojos","summary":"Tiwanaku, near the south shore of Lake Titicaca, was at its height as a religious and political centre with monumental platforms such as the Akapana and Puma Punku. It was fed by raised-field farming and herding and linked by llama caravans to colonies in Moquegua and San Pedro de Atacama. In the Amazonian lowlands, the Casarabe culture began building mound settlements and causeways.","events":[{"y":600,"approx":true,"t":"Tiwanaku expands its monumental core, including the Akapana and Puma Punku platforms, with carved stone gateways."},{"y":600,"approx":true,"t":"Raised-field farming around Lake Titicaca and llama caravans support Tiwanaku's growth and its colonies on the Pacific slope."},{"y":600,"approx":true,"t":"The Casarabe culture in the Llanos de Mojos builds platform mounds, causeways and canals (c. 500–1400)."}],"link":null,"evidence":"moderate"},"Chile":{"polity":"Atacama oasis communities linked to Tiwanaku; Llolleo farmers; southern foragers","summary":"In the north, the oasis people of San Pedro de Atacama traded with Tiwanaku by llama caravan, and their graves contain Tiwanaku textiles and snuff kits. Central Chile's Llolleo communities grew maize and squash and made pottery. In the south lived Pitrén pottery makers, probably ancestors of the Mapuche, and in the far south, canoe-using marine foragers. No writing; knowledge is archaeological.","events":[{"y":600,"approx":true,"t":"San Pedro de Atacama elites are buried with Tiwanaku-style textiles, cups and snuff trays, showing caravan links to the Titicaca basin."},{"y":600,"approx":true,"t":"Pitrén-complex groups in the southern forests combine foraging with small-scale farming and pottery."}],"link":null,"evidence":"sparse"},"Argentina":{"polity":"Northwest Andean farming societies (early Aguada); Pampas and Patagonian hunter-gatherers","summary":"In the northwest Andean valleys, farming and herding communities were forming the Aguada culture, known for jaguar imagery and fine engraved pottery. The Chaco, Pampas and Patagonia were home to mobile hunter-gatherers who hunted guanaco and rhea. Tierra del Fuego had foot and canoe foragers. Evidence is archaeological, with broad dates.","events":[{"y":600,"approx":true,"t":"The Aguada culture emerges in Catamarca and La Rioja, with ceremonial centres and jaguar-themed art (c. 600–900)."},{"y":600,"approx":true,"t":"Patagonian and Pampas hunter-gatherers follow guanaco herds, using bolas and, increasingly, the bow."}],"link":null,"evidence":"sparse"},"Paraguay":{"polity":"Guarani-speaking farmers (Tupi-Guarani tradition); Chaco hunter-gatherers","summary":"Pottery-making farmers of the Tupi-Guarani tradition, ancestors of the Guarani, lived in forested river valleys of the Paraná and Paraguay basins and grew manioc and maize in swidden plots. West of the Paraguay River, the Chaco was home to mobile foraging peoples. Precise dates for this period are few.","events":[{"y":600,"approx":true,"t":"Guarani-ancestral farming villages, with painted corrugated pottery and urn burials, spread along the rivers of eastern Paraguay."}],"link":null,"evidence":"sparse"},"Uruguay":{"polity":"Mound-building hunter-gatherer and horticulturalist groups ('cerritos de indios')","summary":"In the wetlands of eastern Uruguay, around Laguna Merín, people built and used earth mounds known as 'cerritos de indios' for living, burial and ceremony over thousands of years. They mixed hunting, fishing and gathering with some plant cultivation. Elsewhere, mobile hunter-gatherers lived on the grasslands. Evidence is archaeological only.","events":[{"y":600,"approx":true,"t":"Mound-building communities continue to raise and reuse cerritos in the eastern wetlands, a tradition dating back to c. 3000 years ago."}],"link":null,"evidence":"sparse"},"Brazil":{"polity":"Diverse Amazonian, Atlantic and highland societies (Marajoara, Tupi-Guarani, southern Jê and others)","summary":"On Marajó Island, the Marajoara culture built large earth mounds and made elaborate painted funerary urns. Across Amazonia, settled communities enriched soils into dark terra preta and, in Acre, dug geometric ditched enclosures (geoglyphs). Tupi-Guarani farmers were expanding along rivers and the Atlantic coast, while southern Jê ancestors built pit houses in the highlands. No writing; dates come from excavation.","events":[{"y":600,"approx":true,"t":"Marajoara communities on Marajó Island build habitation and burial mounds and produce polychrome funerary urns (c. 400–1400)."},{"y":600,"approx":true,"t":"Long-term Amazonian settlements create fertile terra preta soils from household waste and charcoal."},{"y":600,"approx":true,"t":"Geometric ditched enclosures (geoglyphs) are built and used in eastern Acre, in managed forest."},{"y":600,"approx":true,"t":"Southern highland groups of the Itararé-Taquara tradition, ancestors of Jê speakers, live in clusters of pit houses."}],"link":null,"evidence":"sparse"},"Falkland Is.":{"polity":"Uninhabited","summary":"The islands had no human inhabitants. There is no accepted evidence of people living there before European visits. The only native land mammal was the warrah, a fox-like canid, and the coasts held large seabird, penguin and sea lion colonies.","events":[{"y":600,"approx":true,"t":"The islands are uninhabited, home to the warrah and large colonies of seabirds and sea lions."}],"link":null,"evidence":"sparse"},"China":{"polity":"Northern Zhou, Chen, then Sui (581-618) and Tang (618-); Tibetan Empire of Songtsen Gampo in the west","summary":"Yang Jian (Emperor Wen) founded the Sui in 581 and reunified China in 589 after centuries of division. His son Yang Di built the Grand Canal but exhausted the realm with wars on Goguryeo, and the dynasty fell in 618 to the Tang. Taizong (r. 626-649) consolidated Tang power. Songtsen Gampo unified Tibet from Lhasa. The story that Sa'd ibn Abi Waqqas reached China then is later legend.","events":[{"y":589,"approx":false,"t":"Sui armies conquer the southern Chen dynasty, reunifying China under Emperor Wen."},{"y":605,"approx":false,"t":"Emperor Yang begins the Grand Canal network linking the Yellow River and Huai/Yangzi regions."},{"y":612,"approx":false,"t":"A huge Sui invasion of Goguryeo is crushed at the Salsu River; further campaigns in 613 and 614 also fail."},{"y":618,"approx":false,"t":"Emperor Yang is killed at Jiangdu; Li Yuan proclaims the Tang dynasty as Emperor Gaozu."},{"y":626,"approx":false,"t":"At the Xuanwu Gate, Li Shimin kills his brothers; Gaozu abdicates and Li Shimin reigns as Taizong."},{"y":629,"approx":true,"t":"Songtsen Gampo, unifier of Tibet, rules from Lhasa; the monk Xuanzang sets out for India."}],"link":null,"evidence":"rich"},"Taiwan":{"polity":"Independent Austronesian (Formosan) peoples","summary":"Taiwan was home to Austronesian-speaking villagers, the linguistic homeland of the wider Austronesian family, living by farming millet and rice, hunting and fishing. There was no state and no outside rule. Sui court records describe expeditions to a land called Liuqiu, which may refer to Taiwan or the Ryukyu Islands; the identification is disputed. Documentation is very thin.","events":[{"y":607,"approx":false,"t":"Emperor Yang of Sui sends envoys to Liuqiu, possibly Taiwan or the Ryukyus."},{"y":610,"approx":true,"t":"A Sui expedition under Chen Leng raids Liuqiu and carries off captives; the location remains debated."}],"link":null,"evidence":"sparse"},"Japan":{"polity":"Yamato court (Asuka period) under Empress Suiko","summary":"The Yamato court ruled from the Asuka region. After the Soga clan defeated the Mononobe in 587, Empress Suiko (r. 593-628) reigned with Prince Shotoku as regent and Soga no Umako as chief minister. Buddhism was patronised, temples such as Asuka-dera and Horyu-ji were built, and Chinese-style government was adopted. Embassies to Sui and early Tang brought back learning.","events":[{"y":587,"approx":false,"t":"Soga no Umako and Prince Shotoku's faction defeat the anti-Buddhist Mononobe clan."},{"y":593,"approx":false,"t":"Suiko becomes the first reigning empress, with Prince Shotoku as regent."},{"y":604,"approx":true,"t":"The Seventeen-Article Constitution, attributed to Prince Shotoku, sets Confucian and Buddhist principles of government."},{"y":607,"approx":false,"t":"Ono no Imoko leads an embassy to the Sui court; Horyu-ji is traditionally founded this year."},{"y":622,"approx":true,"t":"Death of Prince Shotoku."},{"y":630,"approx":false,"t":"Under Emperor Jomei, Japan sends its first embassy to the Tang court."}],"link":null,"evidence":"moderate"},"North Korea":{"polity":"Goguryeo kingdom (capital Pyongyang)","summary":"This land was the heart of Goguryeo, the largest of Korea's Three Kingdoms, ruled from Pyongyang and stretching into Manchuria. Under King Yeongyang (r. 590-618) it repelled repeated Sui invasions, most famously when general Eulji Mundeok destroyed a Sui army at the Salsu River in 612. Goguryeo was a fortified, aristocratic state with Buddhist temples and painted tombs.","events":[{"y":598,"approx":false,"t":"A Sui invasion of Goguryeo fails through storms, disease and supply problems."},{"y":612,"approx":false,"t":"Eulji Mundeok annihilates a Sui army at the Salsu River, a famous Korean victory."},{"y":614,"approx":false,"t":"After a failed 613 campaign, a third Sui assault ends with a negotiated withdrawal."},{"y":618,"approx":false,"t":"King Yeongnyu succeeds Yeongyang and seeks peace with the new Tang dynasty."},{"y":631,"approx":true,"t":"Goguryeo begins building the Cheolli Jangseong, a long defensive wall against Tang."}],"link":null,"evidence":"moderate"},"South Korea":{"polity":"Silla (southeast) and Baekje (southwest), two of Korea's Three Kingdoms","summary":"The south was divided between Silla, centred at Gyeongju, which had absorbed the Gaya confederacy in 562, and Baekje in the southwest, ruled from Sabi. The two fought constantly over the Han River region. Both were Buddhist kingdoms in contact with China and Japan; Baekje passed Buddhism and craftsmen to Yamato. Silla's King Jinpyeong (r. 579-632) was succeeded by Queen Seondeok in 632.","events":[{"y":579,"approx":false,"t":"King Jinpyeong begins a long reign in Silla."},{"y":600,"approx":false,"t":"King Mu takes the throne of Baekje and wages repeated wars on Silla."},{"y":632,"approx":false,"t":"Seondeok becomes Silla's first reigning queen on Jinpyeong's death."}],"link":null,"evidence":"moderate"},"Myanmar":{"polity":"Pyu city-states (Sri Ksetra, Halin, Beikthano); Mon communities in the south","summary":"The dry zone of the Irrawaddy valley was home to the Pyu, who built large walled brick cities such as Sri Ksetra near modern Pyay and Halin. They practised Buddhism with Hindu elements, wrote in a script derived from Indian models, and traded with India and China. Dates and rulers are known mainly from archaeology and a few inscriptions, so the political picture is uncertain.","events":[{"y":600,"approx":true,"t":"Sri Ksetra flourishes as the leading Pyu city, with large Buddhist stupas."},{"y":638,"approx":false,"t":"The Burmese era, a calendar later used across the region, begins; its origin is traditionally linked to the Pyu."}],"link":null,"evidence":"sparse"},"Thailand":{"polity":"Dvaravati Mon city-states; Chenla influence in the northeast","summary":"Central Thailand held the Mon-speaking Dvaravati culture, centred on moated towns such as Nakhon Pathom and U Thong. It was Theravada Buddhist, with Buddha images, dharma wheels and silver coins naming Dvaravati. The Khorat plateau in the northeast came under Khmer Chenla influence, recorded in inscriptions of King Mahendravarman. The southern peninsula had small trading ports. Evidence is mostly archaeological.","events":[{"y":600,"approx":true,"t":"Khmer king Mahendravarman of Chenla leaves inscriptions in the Mun river valley of the northeast."},{"y":610,"approx":true,"t":"Dvaravati Mon towns flourish around Nakhon Pathom; coins bear the name Dvaravati."},{"y":640,"approx":true,"t":"Chinese sources, including reports gathered by Xuanzang, name the kingdom Duoluobodi (Dvaravati)."}],"link":null,"evidence":"sparse"},"Laos":{"polity":"Chenla (early Khmer kingdom) in the south; local chiefdoms elsewhere","summary":"Southern Laos, around the sacred mountain of Wat Phu near Champasak, is often regarded as an early heartland of Chenla, the Khmer kingdom that absorbed Funan. Shaivite worship of the mountain as a linga was central. The north was home to upland farming peoples with no recorded states. Knowledge comes from a few Sanskrit and Khmer inscriptions and archaeology.","events":[{"y":600,"approx":true,"t":"The Wat Phu area serves as a religious centre of the Chenla kingdom."}],"link":null,"evidence":"sparse"},"Cambodia":{"polity":"Chenla (Khmer kingdom), successor to Funan","summary":"Chenla, a Khmer kingdom that had emerged inland, was absorbing the older trading state of Funan. Kings Bhavavarman I, Mahendravarman (Citrasena) and Isanavarman I expanded it, and Isanavarman ruled from Isanapura, the brick temple city at Sambor Prei Kuk. Religion mixed Shaivism, Vishnu worship and Buddhism. Khmer and Sanskrit inscriptions and Chinese records are the main sources.","events":[{"y":590,"approx":true,"t":"Bhavavarman I and Mahendravarman extend Chenla rule, taking over former Funan lands."},{"y":616,"approx":true,"t":"Isanavarman I comes to power; Chenla sends an embassy to the Sui court."},{"y":627,"approx":true,"t":"Isanapura (Sambor Prei Kuk) flourishes as capital; Funan has effectively disappeared."}],"link":null,"evidence":"moderate"},"Vietnam":{"polity":"North: Early Ly, then Sui/Tang Jiaozhou; centre: Champa; far south: Chenla","summary":"The Red River delta was ruled by the Early Ly dynasty founded by Ly Bon in 544 until the Sui reconquered it in 602; it then became a Sui and later Tang province based near modern Hanoi. The central coast was the Cham kingdom of Champa, Hindu and seafaring, whose sanctuary at My Son was growing. The Mekong delta passed from Funan to Chenla.","events":[{"y":602,"approx":false,"t":"Sui general Liu Fang forces Ly Phat Tu to surrender, ending the Early Ly dynasty."},{"y":605,"approx":false,"t":"Liu Fang invades Champa and sacks its capital, carrying off treasures and Buddhist texts."},{"y":622,"approx":true,"t":"The new Tang dynasty organises its rule over the Jiaozhou region."},{"y":629,"approx":true,"t":"Champa's long-reigning king Sambhuvarman dies and is succeeded by Kandarpadharma."}],"link":null,"evidence":"moderate"},"Malaysia":{"polity":"Small Malay trading kingdoms (Kedah, Langkasuka, Chitu); Austronesian and Orang Asli peoples","summary":"The Malay Peninsula held small Indianised port kingdoms on the trade route between India and China, including the Bujang valley site in Kedah and states named in Chinese records such as Langkasuka and Chitu, the Red Earth Kingdom. Hinduism and Buddhism were present. Borneo's Sarawak and Sabah held Austronesian communities. Srivijaya, which later dominated the region, did not arise until about 670, after this period.","events":[{"y":607,"approx":false,"t":"Sui envoy Chang Jun visits Chitu, the Red Earth Kingdom, whose location on the peninsula is debated."},{"y":610,"approx":true,"t":"The Bujang valley in Kedah serves as a port for Indian Ocean trade."}],"link":null,"evidence":"sparse"},"Brunei":{"polity":"Austronesian coastal communities; possibly the kingdom of Poli known from Chinese records","summary":"Northwest Borneo was home to Austronesian-speaking peoples living by fishing, farming and trade. Chinese records mention a kingdom called Poli that sent embassies in the 6th and 7th centuries; some scholars place it in Borneo, others in Sumatra or Bali, so its link to Brunei is uncertain. There is little archaeological evidence for this period.","events":[{"y":616,"approx":true,"t":"The kingdom of Poli, of disputed location, is recorded sending envoys to the Sui court."}],"link":null,"evidence":"sparse"},"Indonesia":{"polity":"Tarumanagara (west Java), Kalingga (central Java), Malayu (Sumatra) and many local chiefdoms","summary":"Java and Sumatra held Indianised kingdoms engaged in sea trade between India and China. Tarumanagara in west Java was a Hindu kingdom that still sent embassies to China, and Kalingga (Heling) in central Java was emerging. Austronesian seafarers linked the islands. Srivijaya, the great Sumatran maritime power, rose only about 670-683, after this period. Eastern islands had independent communities with little documentation.","events":[{"y":600,"approx":true,"t":"Tarumanagara remains the leading kingdom of west Java."},{"y":640,"approx":true,"t":"Kalingga (Heling) in central Java sends an embassy to the Tang court."}],"link":null,"evidence":"sparse"},"Philippines":{"polity":"Independent Austronesian communities (barangay chiefdoms)","summary":"The islands were home to Austronesian-speaking communities of farmers, fishers and seafarers, living in villages led by local chiefs. They traded with mainland Southeast Asia and southern China. There were no states or written records in this period, and evidence comes from archaeology, such as burial jars and plank-built balangay boats from Butuan, some dated to around these centuries.","events":[{"y":600,"approx":true,"t":"Austronesian coastal villages trade across the South China Sea; no written records survive."}],"link":null,"evidence":"sparse"},"Timor-Leste":{"polity":"Independent Austronesian and Papuan-speaking communities","summary":"Timor was inhabited by both Austronesian-speaking and Papuan-speaking peoples living by farming, fishing and herding in small communities. There was no state and no written record. Archaeology shows long, continuous occupation of caves and coastal sites. Its later sandalwood trade with China and Java is not documented for this period.","events":[{"y":600,"approx":true,"t":"Village farming and fishing communities continue; no dated events are recorded."}],"link":null,"evidence":"sparse"},"Papua New Guinea":{"polity":"Independent Papuan and Austronesian (Lapita-descended) communities","summary":"New Guinea's highlands had been farmed for thousands of years, with taro, bananas and drainage systems such as those at Kuk swamp. Hundreds of Papuan-speaking groups lived in independent clans. Coastal areas and islands such as New Britain and New Ireland held Austronesian descendants of the Lapita people, who traded pottery and obsidian. No written records exist.","events":[{"y":600,"approx":true,"t":"Highland gardening and coastal exchange networks continue; evidence is archaeological only."}],"link":null,"evidence":"sparse"},"Australia":{"polity":"Aboriginal and Torres Strait Islander peoples (hundreds of independent nations)","summary":"Australia was home to hundreds of Aboriginal peoples with their own languages, laws and lands, continuing a presence of more than 50,000 years. They lived by hunting, gathering, fishing and fire management, with complex religious traditions and long trade networks. Torres Strait Islanders had links to New Guinea. Specific events for this period cannot be dated; evidence is archaeological and sparse.","events":[{"y":600,"approx":true,"t":"Aboriginal societies continue long-established ways of life, art and exchange; no specific dated events."}],"link":null,"evidence":"sparse"},"New Zealand":{"polity":"Uninhabited","summary":"No humans lived in New Zealand in this period. The islands were home only to birds such as the moa, along with bats and reptiles. Polynesian voyagers, ancestors of the Maori, settled the islands much later, around 1250-1300.","events":[{"y":600,"approx":true,"t":"The islands remain uninhabited; Polynesian settlement comes about 650 years later."}],"link":null,"evidence":"sparse"},"Fiji":{"polity":"Independent chiefdoms descended from Lapita settlers","summary":"Fiji had been settled about 3,000 years earlier by Lapita pottery-makers. Its people lived in
