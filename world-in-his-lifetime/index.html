asia."},{"y":613,"approx":false,"t":"Chlothar II becomes sole ruler of the Franks, including Austrasia."},{"y":623,"approx":false,"t":"Dagobert I becomes king of Austrasia."}],"link":null,"evidence":"sparse","sources":[{"title":"Austrasia","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/place/Austrasia"},{"title":"Theodoric II","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/biography/Theodoric-II"},{"title":"Chlotar II","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/biography/Chlotar-II"},{"title":"Dagobert I","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/biography/Dagobert-I"}]},"Netherlands":{"polity":"Frisians on the coast; Franks to the south","summary":"The Frisians, a Germanic seafaring people, held the coastlands from the Rhine to the Ems. The Franks, centred on the lower Rhine, conquered them only gradually, completing the conquest in the 9th century, so in this period the Frisian coast lay outside Frankish rule.","events":[{"y":600,"approx":true,"t":"Frisians, not yet under Frankish rule, hold the coast between the Rhine and the Ems."}],"link":null,"evidence":"sparse","sources":[{"title":"Frisians","publisher":"Encyclopaedia Britannica (Britannica Students)","url":"https://kids.britannica.com/students/article/Frisians/323990"},{"title":"Germany","publisher":"Encyclopaedia Britannica (Britannica Students)","url":"https://kids.britannica.com/students/article/Germany/274536"}]},"Norway":{"polity":"Local elites, no known central authority (Merovingian period, c. 550–800)","summary":"Norwegian archaeologists call c. 550–800 the Merovingian period, a time of marked change in burial rites, language, art style and weaponry. Relatively few finds survive from it. Large burial mounds served as symbols of power and wealth, and the first Scandinavian ship burials appear early in the period. There is no contemporary written history, so knowledge is archaeological.","events":[{"y":600,"approx":true,"t":"Burial rites, art style and weaponry change markedly as the Merovingian period (c. 550–800) unfolds."}],"link":null,"evidence":"sparse","sources":[{"title":"merovingertid","publisher":"Store norske leksikon","url":"https://snl.no/merovingertid"},{"title":"Scandinavia's oldest known ship burial is located in mid-Norway","publisher":"Norwegian SciTech News (NTNU University Museum)","url":"https://norwegianscitechnews.com/2023/12/scandinavias-oldest-known-ship-burial-is-located-in-mid-norway/"}]},"Portugal":{"polity":"Suebic kingdom in the northwest, absorbed by the Visigoths in 585","summary":"In the northwest the Suebi had an independent kingdom in Galicia. Once Arian, they were converted to Catholic Christianity in the mid-6th century by Martin of Dumio, bishop of Braga. In 585 the Visigoths under Leovigild conquered the kingdom, and the region became part of Visigothic Spain; the Visigoths already held part of Lusitania to the south.","events":[{"y":585,"approx":false,"t":"The Visigothic king Leovigild conquers the Suebic kingdom."},{"y":589,"approx":false,"t":"The Visigothic kingdom, now including the former Suebic lands, formally converts from Arian to Catholic Christianity."}],"link":null,"evidence":"moderate","sources":[{"title":"Spain","publisher":"Encyclopaedia Britannica (Britannica Scholars)","url":"https://kids.britannica.com/scholars/article/Spain/108580"},{"title":"History of Europe","publisher":"Encyclopaedia Britannica (Britannica Scholars)","url":"https://kids.britannica.com/scholars/article/history-of-Europe/106072"}]},"Spain":{"polity":"Visigothic kingdom of Toledo (with Byzantine territory in the southeast until the 620s)","summary":"The Visigoths ruled from Toledo. Leovigild (568–586) conquered the Suebi, and his son Reccared (586–601) abandoned Arianism for Catholicism, removing a main obstacle between Goths and Hispano-Romans. Isidore, bishop of Seville from about 600 to 636, wrote the encyclopaedic Etymologies. Between about 612 and 616 King Sisebut decreed that all Jews must convert, and Swinthila (621–631) took the last Byzantine fortresses.","events":[{"y":585,"approx":false,"t":"Leovigild conquers the Suebic kingdom in the northwest."},{"y":589,"approx":false,"t":"The Visigoths formally convert from Arian to Catholic Christianity under Reccared."},{"y":600,"approx":true,"t":"Isidore becomes bishop of Seville (c. 600); he later writes the Etymologies."},{"y":612,"approx":true,"t":"Between about 612 and 616 King Sisebut decrees that all Jews of the kingdom must convert to Christianity."},{"y":625,"approx":true,"t":"Swinthila (621–631) conquers the last Byzantine fortresses in Spain (exact date uncertain)."}],"link":null,"evidence":"rich","sources":[{"title":"Spain","publisher":"Encyclopaedia Britannica (Britannica Scholars)","url":"https://kids.britannica.com/scholars/article/Spain/108580"},{"title":"History of Europe","publisher":"Encyclopaedia Britannica (Britannica Scholars)","url":"https://kids.britannica.com/scholars/article/history-of-Europe/106072"},{"title":"Spain (Chapter 5), The Jews in Late Antiquity","publisher":"Amsterdam University Press (via Cambridge Core)","url":"https://www.cambridge.org/core/books/abs/jews-in-late-antiquity/spain/45E37A2BFF2B5C093D55F0616597FC49"}]},"Sweden":{"polity":"Svear and Götar chieftains (Vendel period)","summary":"This is the Vendel period, named after the boat-grave cemetery at Vendel in Uppland; nearby Valsgärde held unlooted boat graves with rare helmets. The Svear lived around Lake Mälaren and Uppsala, the Götar in Östergötland and Västergötland. At Gamla Uppsala, great mounds and a magnate estate with a hall arose from the late 6th century. Gotland raised carved picture stones. There is no contemporary written history.","events":[{"y":600,"approx":true,"t":"Vendel-period boat graves at Valsgärde, near Gamla Uppsala, contain helmets and rich weapons of a warrior elite."},{"y":600,"approx":true,"t":"Gamla Uppsala's East and West mounds are built in the late 6th–early 7th century as the site becomes a monumental centre."},{"y":600,"approx":true,"t":"Gotlanders carve picture stones in Vendel-period style; the early tradition is dated from the 5th to mid-7th century."}],"link":null,"evidence":"sparse","sources":[{"title":"Valsgärde burial ground","publisher":"Gustavianum, Uppsala University","url":"https://www.uu.se/en/gustavianum/about-the-museum/our-collections/the-historical-collections/nordic-archeology/valsgarde"},{"title":"John Ljungkvist & Per Frölund, \"Gamla Uppsala – the emergence of a centre and a magnate complex\", Journal of Archaeology and Ancient History 16 (2015)","publisher":"Uppsala University","url":"https://journals.uu.se/jaah/article/download/148/131/107"},{"title":"Frederic B. Pearl, \"The Water Dragon and the Snake Witch: Two Vendel Period Picture Stones from Gotland, Sweden\", Current Swedish Archaeology","publisher":"Current Swedish Archaeology (via DOAJ)","url":"https://doaj.org/article/8c2486556f60421aaf8431646b136411"}]},"Switzerland":{"polity":"Frankish kingdom of Burgundy (west) and Alamannic lands (north and east)","summary":"The west belonged to the Frankish kingdom of Burgundy. Marius, bishop of Avenches from 573, wrote a world chronicle for 455–581 and is credited, without firm proof, with moving the see to Lausanne. To the north and east lay Alamannic lands, where Columbanus and his companions preached around 610–612. His companion Gall stayed behind and built a hermit's cell on the Steinach, the origin of the abbey of Saint Gall.","events":[{"y":593,"approx":false,"t":"Marius, bishop of Avenches and author of a chronicle, dies."},{"y":612,"approx":true,"t":"Gall, a companion of Columbanus, stays behind and builds a hermit's cell on the Steinach near Arbon."},{"y":613,"approx":false,"t":"Chlothar II becomes sole ruler of the Franks, including Burgundy."}],"link":null,"evidence":"moderate","sources":[{"title":"Marius","publisher":"Historisches Lexikon der Schweiz","url":"https://hls-dhs-dss.ch/de/articles/012781/"},{"title":"Gall (saint)","publisher":"Historisches Lexikon der Schweiz (Dictionnaire historique de la Suisse)","url":"https://hls-dhs-dss.ch/fr/articles/010216/2006-11-20/"},{"title":"Kolumban","publisher":"Historisches Lexikon der Schweiz","url":"https://hls-dhs-dss.ch/de/articles/010215/2007-08-23/"},{"title":"Chlotar II","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/biography/Chlotar-II"}]},"United Kingdom":{"polity":"Anglo-Saxon kingdoms (Kent, East Anglia, Northumbria and others); Christian Britons in Wales; Iona in the west","summary":"England was divided among Anglo-Saxon kingdoms, while Christian churches in Wales predated the Roman mission and Columba's monastery of Iona worked to convert Scotland. Pope Gregory I sent Augustine to Kent in 597, where King Æthelberht received him and was soon baptized. Æthelfrith, king of Bernicia from 592/593, also ruled Deira, together forming Northumbria. The Sutton Hoo ship burial (early 7th century) may be that of Rædwald of East Anglia.","events":[{"y":597,"approx":false,"t":"Augustine's mission, sent by Pope Gregory I, reaches Kent and is received by King Æthelberht."},{"y":616,"approx":true,"t":"Æthelfrith, king of Bernicia and Deira (Northumbria), dies (date uncertain)."},{"y":625,"approx":true,"t":"The Sutton Hoo ship burial is made (coins point to c. 610–635); Rædwald is a popular but unproven candidate."}],"link":null,"evidence":"rich","sources":[{"title":"Saint Augustine of Canterbury summary","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/summary/Saint-Augustine-of-Canterbury"},{"title":"Augustine of Canterbury","publisher":"Encyclopaedia Britannica (Britannica Students)","url":"https://kids.britannica.com/students/article/Augustine-of-Canterbury/273011"},{"title":"Aethelfrith","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/biography/Aethelfrith"},{"title":"The Anglo-Saxon ship burial at Sutton Hoo","publisher":"The British Museum","url":"https://www.britishmuseum.org/collection/death-and-memory/anglo-saxon-ship-burial-sutton-hoo"},{"title":"Saint Columba","publisher":"Encyclopaedia Britannica (Britannica Students)","url":"https://kids.britannica.com/students/article/Saint-Columba/320053"}]},"Greenland":{"polity":"Uninhabited (gap between Early and Late Dorset)","summary":"Greenland appears to have been empty of people in these decades. Early Dorset Palaeo-Inuit had lived there until around the start of the common era, then abandoned it; Late Dorset groups returned to the northwest only around 700–800 (sources differ). Meanwhile Dorset people continued to hunt in the Canadian Arctic. Evidence is purely archaeological and dates rest on radiocarbon.","events":[{"y":600,"approx":true,"t":"No dated human occupation in Greenland; Late Dorset Palaeo-Inuit live in the Canadian Arctic and reach northwest Greenland c. 700–800."}],"link":null,"evidence":"sparse","sources":[{"title":"Late Dorset (Prehistory of Greenland)","publisher":"National Museum of Denmark","url":"https://natmus.dk/organisation/forskning-og-kulturarv/nyere-tid-og-verdens-kulturer/etnografisk-samling/arktisk-forskning/prehistory-of-greenland/late-dorset/"},{"title":"Geographic Distribution of the Dorset Culture","publisher":"The Canadian Encyclopedia","url":"https://www.thecanadianencyclopedia.ca/en/article/geographic-distribution-of-the-dorset-culture"}]},"Austria":{"polity":"Bavarians under Frankish influence; Alemanni in the west; Slavs under Avar rule in the east","summary":"After the Lombards left for Italy in 568, the Bavarians, under Frankish political influence, struggled with Slavs invading from the east, while Alemanni settled in today's Vorarlberg. The Slavs had Avar rulers and at their greatest extent reached Lower Austria, Styria and Carinthia. At Bregenz, a former Roman fort where Christianity survived mixed with pagan cults, the Irish monk Columbanus and his companions worked in 610–612.","events":[{"y":610,"approx":true,"t":"Columbanus and his companions work at Bregenz on Lake Constance (610–612) before he moves on to Italy."},{"y":623,"approx":true,"t":"Western Slavs rise against the Avars under Samo (623 or 624); eastern Austria is among the proposed centres of his realm."}],"link":null,"evidence":"moderate","sources":[{"title":"Austria: Early Middle Ages","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/place/Austria/Early-Middle-Ages"},{"title":"Kolumban","publisher":"Historisches Lexikon der Schweiz","url":"https://hls-dhs-dss.ch/de/articles/010215/2007-08-23/"},{"title":"Samo","publisher":"World History Encyclopedia","url":"https://www.worldhistory.org/Samo/"}]},"Estonia":{"polity":"Finnic communities (no state)","summary":"The ancestors of the Estonians, a Finnic (Finno-Ugric) people rather than Balts, lived in farming communities during the Middle Iron Age (c. 450–800). Small hillforts appear in the pre-Viking period (c. 600–800), probably housing only a few families and serving as centres of local trade and craft. Weapon hoards, often votive, were deposited at the edges of wetlands. Knowledge comes almost entirely from archaeology.","events":[{"y":600,"approx":true,"t":"Small hillforts, centres of local trade and handicraft, begin to appear in the pre-Viking period (c. 600–800)."}],"link":null,"evidence":"sparse","sources":[{"title":"Martti Veldi, A landscape biography of the 'Land of Drumlins': Vooremaa, East Estonia (PhD thesis, 2020), ch. 8","publisher":"Leiden University","url":"https://scholarlypublications.universiteitleiden.nl/access/item%3A2906425/view"},{"title":"Balt","publisher":"Britannica (Britannica Kids, Students)","url":"https://kids.britannica.com/students/article/Balt/316733"}]},"Latvia":{"polity":"Baltic tribes (no state)","summary":"Baltic-speaking peoples, ancestors of the Latvians, lived in the region. Cut off by sea, forest and swamp, the western Balts kept their own identity and pagan religion until the Middle Ages. No written records survive from this period: the documented history of the Latvians begins only in the 13th century, so knowledge comes from archaeology.","events":[{"y":600,"approx":true,"t":"Pagan Baltic communities live without writing; Latvian recorded history begins only in the 13th century."}],"link":null,"evidence":"sparse","sources":[{"title":"Balt","publisher":"Britannica (Britannica Kids, Students)","url":"https://kids.britannica.com/students/article/Balt/316733"}]},"Lithuania":{"polity":"Baltic tribes (no state)","summary":"Baltic-speaking ancestors of the Lithuanians kept their pagan religion until the Middle Ages; their written history begins only in the 13th century. Archaeology shows a long tradition of horse burial: in western and central Lithuania people were buried with whole horses or with horse heads and legs. Migration-period (4th–6th century) graves contain many weapons and non-local goods.","events":[{"y":600,"approx":true,"t":"Burials with whole horses, or horse heads and legs, continue in western and central Lithuania."}],"link":null,"evidence":"sparse","sources":[{"title":"Piličiauskienė et al., \"Horses in Lithuania in the Late Roman–Medieval Period (3rd–14th C AD) Burial Sites\", Animals (2022)","publisher":"MDPI Animals (via PubMed Central)","url":"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC9219477/"},{"title":"Balt","publisher":"Britannica (Britannica Kids, Students)","url":"https://kids.britannica.com/students/article/Balt/316733"}]},"Saudi Arabia":{"polity":"Independent Arabian tribes and towns (Quraysh of Mecca; Aws, Khazraj and Jewish clans of Yathrib); Muslim community at Medina from 622","summary":"The Hijaz had no state. Mecca, home of the Quraysh tribe, was a pilgrimage sanctuary around the Kaaba and a trading town on the caravan route; Yathrib (Medina) was an oasis of Arab and Jewish clans. Muhammad ﷺ, born in Mecca, received his first revelation about 610, emigrated to Medina in 622, entered Mecca in 630, and by his death in 632 had united Arabia under Islam.","events":[{"y":570,"approx":true,"t":"Muhammad ﷺ is born in Mecca (c. 570), in the year that, according to tradition, Abraha of South Arabia tried to conquer Mecca."},{"y":610,"approx":true,"t":"Muhammad ﷺ receives the first revelation in a cave on Mount Hira near Mecca, at about the age of forty."},{"y":622,"approx":false,"t":"The Hijra: Muhammad ﷺ and his followers emigrate from Mecca to Yathrib (Medina); it marks the beginning of the Muslim calendar."},{"y":624,"approx":false,"t":"In 2 AH the Muslims of Medina win a surprising victory over a Meccan force at Badr."},{"y":630,"approx":false,"t":"In 8 AH Muhammad ﷺ enters Mecca with 10,000 men; the city submits, and he dedicates it to God as the centre of Muslim pilgrimage."},{"y":632,"approx":false,"t":"Muhammad ﷺ dies in Medina (11 AH); Abu Bakr becomes caliph and faces the tribal uprisings known as the Ridda."}],"link":"This was the homeland of Muhammad ﷺ and of the first Muslim community, at Mecca and Medina.","evidence":"moderate","sources":[{"title":"Muhammad ﷺ","publisher":"Encyclopaedia Britannica (Britannica Scholars)","url":"https://kids.britannica.com/scholars/article/Muhammad/105853"},{"title":"Muhammad ﷺ","publisher":"Encyclopaedia Britannica (Britannica Students)","url":"https://kids.britannica.com/students/article/Muhammad/275969"},{"title":"Mecca","publisher":"Encyclopaedia Britannica (Britannica Students)","url":"https://kids.britannica.com/students/article/Mecca/275760"},{"title":"Islamic world: the emigration of Muhammad ﷺ to Yathrib (Medina)","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/topic/Islamic-world/Muhammads-emigration-to-Yathrib-Medina"},{"title":"Battle of Badr","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/event/Battle-of-Badr"},{"title":"Riddah","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/topic/riddah"},{"title":"Ibn Ishaq, The Life of Muhammad ﷺ (Sirat Rasul Allah, recension of Ibn Hisham), trans. A. Guillaume, 1955","publisher":"Oxford University Press","url":null},{"title":"Safiur-Rahman Mubarakpuri, Ar-Raheeq Al-Makhtum (The Sealed Nectar)","publisher":"Darussalam","url":null}]},"Yemen":{"polity":"Former Himyarite kingdom under Ethiopian (Aksumite) rule, then a Sasanian Persian dependency from c. 570","summary":"After Ethiopia intervened in 525, south Arabia became an Ethiopian protectorate under Abraha and his son Masruq. About 570 a Persian force under Vahriz, backing Sayf ibn Dhi Yazan, killed Masruq and took Sanaa. Persian governors then ruled, and the descendants of Persian soldiers and Arab mothers were called the Abna. The last governor, Badhan, accepted Islam, recorded under 10 AH (631).","events":[{"y":570,"approx":true,"t":"According to Islamic tradition, Abraha of South Arabia tries to conquer Mecca in the year Muhammad ﷺ is born."},{"y":570,"approx":true,"t":"A Persian force under Vahriz defeats and kills Abraha's son Masruq, ending Ethiopian rule (c. 570; some sources date Masruq's death to 575–576 or 582)."},{"y":631,"approx":false,"t":"Badhan, Persian governor of Yemen, and other Abna leaders accept Islam, recorded under 10 AH (631)."},{"y":632,"approx":false,"t":"A Yemeni rising led by al-Aswad, who claimed prophetic powers, expels agents of Muhammad ﷺ (March 632); al-Aswad is later killed."}],"link":"Yemen's Persian governor Badhan and other Abna leaders accepted Islam in the lifetime of Muhammad ﷺ, who confirmed the governor as his agent in Yemen.","evidence":"moderate","sources":[{"title":"Abnāʾ","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/abna-term/"},{"title":"Arabia ii. The Sasanians and Arabia","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/arabia-ii-sasanians-and-arabia/"},{"title":"ʿArab ii. Arab conquest of Iran","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/arab-ii/"},{"title":"Riddah","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/topic/riddah"},{"title":"Muhammad ﷺ","publisher":"Encyclopaedia Britannica (Britannica Scholars)","url":"https://kids.britannica.com/scholars/article/Muhammad/105853"},{"title":"Ibn Ishaq, The Life of Muhammad ﷺ (Sirat Rasul Allah, recension of Ibn Hisham), trans. A. Guillaume, 1955","publisher":"Oxford University Press","url":null}]},"Oman":{"polity":"Azd and other Arab tribes under the Julanda family, Sasanian vassals; the coast part of the Sasanian province of Mazun","summary":"A treaty under Khosrow I gave the Julanda family paramountcy over the Arabs of Oman as tributaries and auxiliaries of Persia, while Persian officials and garrisons held the coast, part of the province of Mazun, and Rustaq inland. After Mecca submitted in 630, the rulers of Oman accepted Islam through Amr ibn al-As, sent by Muhammad ﷺ.","events":[{"y":600,"approx":true,"t":"The Julanda rulers lead Oman's Arabs as Sasanian vassals, while the coast forms part of the Sasanian province of Mazun."},{"y":630,"approx":true,"t":"The rulers of Oman accept Islam after Amr ibn al-As arrives as envoy of Muhammad ﷺ."}],"link":"The rulers of Oman accepted Islam c. 630 through Amr ibn al-As, envoy of Muhammad ﷺ.","evidence":"sparse","sources":[{"title":"ʿArab i. Arabs and Iran in the pre-Islamic period","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/arab-i/"},{"title":"Arabia ii. The Sasanians and Arabia","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/arabia-ii-sasanians-and-arabia/"},{"title":"Sea of Oman","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/oman/"},{"title":"ʿAmr ibn al-ʿĀṣ","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/biography/Amr-ibn-al-As"},{"title":"ʿArab ii. Arab conquest of Iran","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/arab-ii/"}]},"United Arab Emirates":{"polity":"Arab tribes of the wider Oman region, within the Sasanian sphere","summary":"This coast belonged to the wider Oman region, where the Julanda family held paramountcy over the Arabs as tributaries of Persia, and Persian garrisons, including one at the tip of the Musandam peninsula, guarded the entrance to the Gulf.","events":[{"y":630,"approx":true,"t":"The rulers of Oman accept Islam through Amr ibn al-As, envoy of Muhammad ﷺ; Persia's Arab protégés in Oman also recognize him."}],"link":"As part of the Oman region, its tribes came under the Julanda rulers, who accepted Islam c. 630.","evidence":"sparse","sources":[{"title":"ʿArab i. Arabs and Iran in the pre-Islamic period","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/arab-i/"},{"title":"Abnāʾ","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/abna-term/"},{"title":"ʿArab ii. Arab conquest of Iran","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/arab-ii/"},{"title":"ʿAmr ibn al-ʿĀṣ","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/biography/Amr-ibn-al-As"}]},"Qatar":{"polity":"Arab communities of eastern Arabia (Bahrain region) within the Sasanian sphere","summary":"Qatar lay in eastern Arabia, then called Bahrain (the northeastern Arabian mainland), where Sasanian Persia ruled through Arab allies and a Persian governor (marzban) at Hajar. After Mecca fell to Muhammad ﷺ in 630, the marzban at Hajar converted to Islam and recognized him, as did Persia's Arab protégés in Bahrain.","events":[{"y":600,"approx":true,"t":"Eastern Arabia, including this peninsula, lies within the Sasanian sphere, with a Persian governor at Hajar."},{"y":630,"approx":true,"t":"The Persian governor at Hajar converts to Islam and recognizes Muhammad ﷺ."}],"link":"Eastern Arabia's Persian governor at Hajar converted to Islam and recognized Muhammad ﷺ c. 630.","evidence":"sparse","sources":[{"title":"ʿArab ii. Arab conquest of Iran","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/arab-ii/"},{"title":"Arabia ii. The Sasanians and Arabia","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/arabia-ii-sasanians-and-arabia/"}]},"Kuwait":{"polity":"Arab tribes on the Sasanian frontier of southern Mesopotamia","summary":"The Kuwait coast lay at the southern edge of Sasanian Mesopotamia, between eastern Arabia and the port of Ubulla. Bedouin tribes such as the Bakr ibn Wa'il ranged along this frontier, and their victory over the Persians at Dhu Qar, sometime between 604 and 613, showed the weakness of Persian defences.","events":[{"y":633,"approx":false,"t":"Khalid ibn al-Walid defeats the Sasanian frontier commander Hormoz at Dhat al-Salasil, between Bahrain and Ubulla, opening the Muslim campaign in Iraq."}],"link":null,"evidence":"sparse","sources":[{"title":"ʿArab i. Arabs and Iran in the pre-Islamic period","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/arab-i/"},{"title":"ʿArab ii. Arab conquest of Iran","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/arab-ii/"},{"title":"Lakhmids","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/lakhmids/"}]},"Iraq":{"polity":"Sasanian Empire (capital Ctesiphon), with the Lakhmid Arab client kingdom at al-Hira until 602; Kurdish tribes in the northern mountains","summary":"Mesopotamia, with the capital Ctesiphon, was the most important part of the Sasanian Empire. Khosrow II ended the Lakhmid kingdom of al-Hira in 602, weakening the desert frontier. In the northern mountains, the edge of the Zagros, lived Kurdish tribes who herded sheep and goats. By the end of the Sasanian period the Kurds were a major people of the Zagros; the name Kurd is securely attested from the 7th century, when they converted to Islam.","events":[{"y":602,"approx":false,"t":"Khosrow II deposes and kills al-Nu'man III, ending the Lakhmid kingdom of al-Hira."},{"y":604,"approx":true,"t":"Arab tribes led by the Bakr ibn Wa'il defeat a Persian force at Dhu Qar near Kufa; the date is disputed, c. 604–613."},{"y":627,"approx":false,"t":"Heraclius defeats the Persian army near Nineveh on 12 December and advances toward Ctesiphon."},{"y":628,"approx":false,"t":"Khosrow II is overthrown and executed; his son Kavad II makes peace with Byzantium and dies later that year."},{"y":637,"approx":true,"t":"Arab Muslim armies win at al-Qadisiyya and take Ctesiphon (dates disputed, c. 636–637)."}],"link":"The end of the Lakhmids and the Arab victory at Dhu Qar weakened Persia's Arabian frontier, which Muslim armies crossed in 633.","evidence":"moderate","sources":[{"title":"Lakhmids","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/lakhmids/"},{"title":"Ḵosrow II","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/khosrow-ii/"},{"title":"ʿArab i. Arabs and Iran in the pre-Islamic period","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/arab-i/"},{"title":"ʿArab ii. Arab conquest of Iran","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/arab-ii/"},{"title":"Egypt iv. Relations in the Sasanian period","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/egypt-iv/"},{"title":"Kurd","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/topic/Kurd"},{"title":"Iran v. Peoples of Iran (2): Pre-Islamic (C. J. Brunner)","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/iran-v2-peoples-pre-islamic/"}]},"Iran":{"polity":"Sasanian Empire (Hormizd IV, Khosrow II, then rapid succession); Kurdish tribes in the Zagros mountains","summary":"Iran was the core of the Sasanian Empire, whose state religion was Zoroastrianism, with great fire temples such as Adur Gushnasp. Khosrow II conquered vast Byzantine lands after 603 but lost the war in 622–628 and was killed in 628; Yazdegerd III took the throne in 632. In the Zagros the Kurds were by the end of the Sasanian period a major people, herding sheep and goats; they later fought against the Arab invaders.","events":[{"y":590,"approx":false,"t":"The general Bahram Chobin rebels and Hormizd IV is deposed and killed; Khosrow II flees to Byzantine territory."},{"y":591,"approx":false,"t":"With help from the Byzantine emperor Maurice, Khosrow II defeats Bahram Chobin and regains the throne."},{"y":624,"approx":true,"t":"Heraclius invades Atropatene and sacks the fire temple of Adur Gushnasp near Ganzak (623 or 624, date disputed)."},{"y":628,"approx":false,"t":"Khosrow II is deposed and executed; his son Kavad II makes peace with Byzantium."},{"y":632,"approx":false,"t":"Yazdegerd III, the last Sasanian king, comes to the throne after years of turmoil."}],"link":"Abandoned after the fall of Khosrow II, Persian governors in Yemen and Bahrain became Muslims and recognized Muhammad ﷺ (c. 628–632).","evidence":"moderate","sources":[{"title":"Ḵosrow II","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/khosrow-ii/"},{"title":"Byzantine-Iranian Relations","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/byzantine-iranian-relations/"},{"title":"Armenia and Iran ii. The pre-Islamic period","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/armenia-ii/"},{"title":"ʿArab ii. Arab conquest of Iran","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/arab-ii/"},{"title":"Byzantine Empire","publisher":"Encyclopaedia Britannica (Britannica Scholars)","url":"https://kids.britannica.com/scholars/article/Byzantine-Empire/106111"},{"title":"Iran v. Peoples of Iran (2): Pre-Islamic (C. J. Brunner)","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/iran-v2-peoples-pre-islamic/"},{"title":"Kurd","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/topic/Kurd"}]},"Syria":{"polity":"Byzantine Empire, with Ghassanid Arab allies; Persian occupation c. 611–628","summary":"Syria was a rich Byzantine land of cities such as Antioch and Damascus, with Ghassanid Arab allies guarding the desert side; Meccan merchants traded here. Persian armies took Antioch about 610–612 and occupied Syria after defeating Heraclius in 613, holding it until Kavad II returned Persia's conquests in 628.","events":[{"y":611,"approx":true,"t":"Persian armies under Shahrbaraz take Antioch (date disputed, 610–612)."},{"y":613,"approx":false,"t":"The Persians defeat a Byzantine army under Heraclius and occupy Syria, including Damascus."},{"y":628,"approx":false,"t":"Kavad II returns his father's conquests, and Byzantine rule over Syria is restored."},{"y":637,"approx":true,"t":"Antioch falls to the Arab Muslim armies (637–638)."}],"link":"Meccan caravans traded in Syria; tradition says the young Muhammad ﷺ, travelling there with his uncle, was recognized as a future prophet by a Christian monk.","evidence":"moderate","sources":[{"title":"Antioch (1)","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/antioch-1-northern-syria/"},{"title":"Ḵosrow II","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/khosrow-ii/"},{"title":"Byzantine-Iranian Relations","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/byzantine-iranian-relations/"},{"title":"Ghassanid dynasty","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/place/Ghassanid-dynasty"},{"title":"Muhammad ﷺ","publisher":"Encyclopaedia Britannica (Britannica Scholars)","url":"https://kids.britannica.com/scholars/article/Muhammad/105853"}]},"Lebanon":{"polity":"Byzantine Empire, under Persian occupation c. 612–628","summary":"The Lebanese coast was part of Byzantine Syria. During the great war Persian armies captured Antioch and pushed through to the Mediterranean coast in 612, then occupied Syria; Byzantium regained the region when Kavad II returned Persia's conquests under the peace of 628.","events":[{"y":612,"approx":true,"t":"Persian armies take Antioch and push on to the Mediterranean coast during their conquest of Syria."},{"y":628,"approx":true,"t":"Under the peace of 628, Persia gives up its conquests and Byzantine authority returns."}],"link":null,"evidence":"moderate","sources":[{"title":"Ḵosrow II","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/khosrow-ii/"},{"title":"Byzantine-Iranian Relations","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/byzantine-iranian-relations/"},{"title":"Antioch (1)","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/antioch-1-northern-syria/"}]},"Israel":{"polity":"Byzantine Empire (Palestine), under Persian occupation 614–c. 628","summary":"This land was part of Byzantine Palestine, with Christian and Jewish communities. When Persia took Jerusalem in 614, Jews were allowed to settle in the city, but this was reversed within two years under Christian pressure. Persia placed Palestine, with its desert frontage, under direct rule in 616 and gave up its conquests under the peace of 628.","events":[{"y":614,"approx":false,"t":"Persian forces under Shahrbaraz conquer Palestine and capture Jerusalem."},{"y":616,"approx":true,"t":"Persia places Palestine under direct rule, having reversed its permission for Jews to settle in Jerusalem."},{"y":628,"approx":true,"t":"Persia gives up its conquests under the peace of 628, and Byzantine rule returns."}],"link":null,"evidence":"moderate","sources":[{"title":"Ḵosrow II","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/khosrow-ii/"},{"title":"Byzantine-Iranian Relations","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/byzantine-iranian-relations/"}]},"Palestine":{"polity":"Byzantine Empire (Palestine), under Persian occupation 614–c. 628","summary":"Jerusalem was a great Byzantine Christian city. In 614 Persian forces captured it and carried the True Cross to Ctesiphon, a shock to the Christian world. Heraclius triumphantly restored the Cross to Jerusalem in 630, a few years before the Arab conquest of Palestine (634–640).","events":[{"y":614,"approx":false,"t":"Persian forces take Jerusalem and carry the True Cross to Ctesiphon."},{"y":624,"approx":true,"t":"In Medina, the Muslim direction of prayer changes from Jerusalem to the Kaaba in Mecca, eighteen months after the Hijra, according to tradition."},{"y":630,"approx":false,"t":"Heraclius triumphantly restores the True Cross to Jerusalem."}],"link":"Jerusalem was the first direction of prayer of the early Muslims, until a revelation about eighteen months after the Hijra turned them toward the Kaaba.","evidence":"rich","sources":[{"title":"Byzantine Empire","publisher":"Encyclopaedia Britannica (Britannica Scholars)","url":"https://kids.britannica.com/scholars/article/Byzantine-Empire/106111"},{"title":"Ḵosrow II","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/khosrow-ii/"},{"title":"Byzantine-Iranian Relations","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/byzantine-iranian-relations/"},{"title":"Muhammad ﷺ","publisher":"Encyclopaedia Britannica (Britannica Scholars)","url":"https://kids.britannica.com/scholars/article/Muhammad/105853"}]},"Jordan":{"polity":"Byzantine Empire, with Ghassanid Arab allies; Persian occupation c. 614–628","summary":"This land lay in Byzantine provinces whose desert edge was guarded by Arab allies, chiefly the Ghassanids, who protected the spice route from southern Arabia. Persia held the region during the great war. In 630 Muhammad ﷺ campaigned to the Syrian border at Tabuk, where various towns submitted to him, and in 636 the Byzantine defeat at the Yarmuk River opened the region to the Muslims.","events":[{"y":616,"approx":true,"t":"Persia establishes direct rule over Palestine, including its desert frontage."},{"y":630,"approx":false,"t":"Muhammad ﷺ leads a campaign to the Syrian border at Tabuk and secures the submission of various towns."},{"y":636,"approx":false,"t":"Arab Muslim forces defeat a Byzantine army at the Yarmuk River, opening Palestine and Syria to Muslim control."}],"link":"In 630 Muhammad ﷺ led a campaign to Tabuk on the Syrian frontier, where various towns submitted to him.","evidence":"moderate","sources":[{"title":"Ghassanid dynasty","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/place/Ghassanid-dynasty"},{"title":"Ḵosrow II","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/khosrow-ii/"},{"title":"Muhammad ﷺ","publisher":"Encyclopaedia Britannica (Britannica Scholars)","url":"https://kids.britannica.com/scholars/article/Muhammad/105853"},{"title":"Byzantine Empire","publisher":"Encyclopaedia Britannica (Britannica Scholars)","url":"https://kids.britannica.com/scholars/article/Byzantine-Empire/106111"}]},"Turkey":{"polity":"Byzantine (Eastern Roman) Empire, capital Constantinople","summary":"Anatolia and Constantinople formed the heart of the Byzantine Empire, ruled by Maurice, then the usurper Phocas, then Heraclius from 610. Persian armies conquered Asia Minor and reached Chalcedon, across from the capital. In 626 Constantinople survived an Avar siege while a Persian army waited across the Bosporus. The Kurds, today a large population in the southeast, are documented in this period mainly in the Zagros mountains to the east, in what are now Iran and Iraq.","events":[{"y":602,"approx":false,"t":"An army mutiny brings Phocas to power and the emperor Maurice is executed, giving Khosrow II a pretext for war."},{"y":610,"approx":false,"t":"Heraclius overthrows Phocas and becomes emperor."},{"y":615,"approx":false,"t":"A Persian army under Shahin enters Chalcedon and camps within sight of Constantinople."},{"y":622,"approx":false,"t":"Heraclius begins annual campaigns against Persia."},{"y":626,"approx":false,"t":"Constantinople withstands a siege by the Avars while a Persian army waits on the Asian shore."}],"link":null,"evidence":"rich","sources":[{"title":"Ḵosrow II","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/khosrow-ii/"},{"title":"Byzantine-Iranian Relations","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/byzantine-iranian-relations/"},{"title":"Byzantine Empire","publisher":"Encyclopaedia Britannica (Britannica Scholars)","url":"https://kids.britannica.com/scholars/article/Byzantine-Empire/106111"},{"title":"Iran v. Peoples of Iran (2): Pre-Islamic (C. J. Brunner)","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/iran-v2-peoples-pre-islamic/"},{"title":"Kurd","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/topic/Kurd"}]},"Cyprus":{"polity":"Byzantine Empire; autocephalous (self-governing) Church of Cyprus","summary":"Cyprus was a Byzantine island whose church had been independent of Antioch since 488. A 6th-century mosaic at Kiti shows close artistic ties to Constantinople. John the Almsgiver, born at Amathus, became Chalcedonian patriarch of Alexandria and died back on Cyprus. Arab raids came later in the 7th century, and in 688 a treaty neutralized the island.","events":[{"y":610,"approx":true,"t":"John the Almsgiver of Amathus becomes Chalcedonian patriarch of Alexandria (610; some sources say 606), famed for his charity."},{"y":619,"approx":true,"t":"With the Persians occupying Alexandria, John flees to his native Cyprus and dies there (619/20; some sources give 616)."}],"link":null,"evidence":"moderate","sources":[{"title":"Cyprus (Britannica Scholars)","publisher":"Encyclopaedia Britannica","url":"https://kids.britannica.com/scholars/article/Cyprus/109746"},{"title":"John Eleemon (from The Oxford Dictionary of Byzantium)","publisher":"Oxford Reference / Oxford University Press","url":"https://www.oxfordreference.com/display/10.1093/oi/authority.20110803100022698"},{"title":"St. John the Almsgiver (Catholic Encyclopedia, 1910)","publisher":"New Advent","url":"https://www.newadvent.org/cathen/08486a.htm"}]},"N. Cyprus":{"polity":"Byzantine Empire (part of Byzantine Cyprus)","summary":"The north shared in the life of Byzantine Cyprus and its self-governing church. Its best-known treasure from this period is a set of nine silver plates showing the life of David, made in Constantinople under Emperor Heraclius (stamps dated 613–629/30). They were found together in 1902 in the Kyrenia district and are now divided between the Metropolitan Museum and the Cyprus Museum in Nicosia.","events":[{"y":629,"approx":true,"t":"Silver plates showing David's life are made in Constantinople (c. 629–630), possibly commemorating an event of Heraclius's reign; they were later found in northern Cyprus."}],"link":null,"evidence":"moderate","sources":[{"title":"Plate with the Presentation of David to Saul","publisher":"The Metropolitan Museum of Art","url":"https://www.metmuseum.org/art/collection/search/464378"},{"title":"Steven H. Wander, 'The Cyprus Plates: The Story of David and Goliath', Metropolitan Museum Journal 8, 1973","publisher":"The Metropolitan Museum of Art","url":"https://resources.metmuseum.org/resources/metpublications/pdf/The_Cyprus_Plates_The_Story_of_David_and_Goliath_The_Metropolitan_Museum_Journal_v_8_1973.pdf"},{"title":"Cyprus (Britannica Scholars)","publisher":"Encyclopaedia Britannica","url":"https://kids.britannica.com/scholars/article/Cyprus/109746"}]},"Armenia":{"polity":"Divided between the Byzantine Empire and Sasanian Persia (Persarmenia); Armenian noble houses","summary":"Armenia was ruled by noble families such as the Bagratunis and Mamikonians under two empires. In 591 Khosrow II ceded western Persian Armenia to Byzantium, but Persia recovered it after 603. A council at Dvin in 596 rejected Chalcedon. Heraclius campaigned through Armenia from 623, and his victories enabled him to insist on the frontier of 591.","events":[{"y":591,"approx":false,"t":"Khosrow II cedes western Persian Armenia, up to the river Azat, to Byzantium in return for help in regaining his throne."},{"y":596,"approx":false,"t":"A church council at Dvin, sponsored by Sembat Bagratuni, rejects the doctrines of the Council of Chalcedon."},{"y":607,"approx":true,"t":"Persian forces take Karin (modern Erzurum) as they reconquer Byzantine Armenia (607–608)."},{"y":623,"approx":true,"t":"Heraclius campaigns through Armenia into Atropatene against Persian forces (623–624)."},{"y":628,"approx":true,"t":"After Heraclius's victories, Persia consents to restore the Armenian frontier fixed in 591."}],"link":null,"evidence":"moderate","sources":[{"title":"Armenia and Iran ii. The pre-Islamic period","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/armenia-ii/"},{"title":"Ḵosrow II","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/khosrow-ii/"}]},"Azerbaijan":{"polity":"Caucasian Albania (Aghvank) under Sasanian rule, with the Mihrakan princes","summary":"This land was Caucasian Albania, a Christian land under Persian rule with its capital at Partaw (Barda); it is distinct from Atropatene (Iranian Azerbaijan) to the south. Darband and Partaw were key Persian strongholds against northern raiders. Heraclius wintered here in 624, and Turkic allies of Byzantium, called Khazars in the sources, invaded in 626–628. Varaz Grigor of the Mihrakan family then became prince.","events":[{"y":624,"approx":false,"t":"Heraclius winters his army in Caucasian Albania after striking into Persian Atropatene."},{"y":626,"approx":true,"t":"Khazar allies of Heraclius break through the Darband pass, and the Persian governor of Albania flees."},{"y":628,"approx":true,"t":"A second Khazar invasion: their leader declares himself lord of Albania."},{"y":630,"approx":true,"t":"Varaz Grigor of the Mihrakan family is consecrated prince of Albania (c. 629–630)."}],"link":null,"evidence":"sparse","sources":[{"title":"Albania (Caucasian Albania / Arran)","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/albania-iranian-aran/"},{"title":"Ḵosrow II","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/khosrow-ii/"}]},"Georgia":{"polity":"Kartli (Iberia) under its nobility and client rulers, caught between Byzantium and Persia; Lazica in the west","summary":"Kartli (Iberia), with its capital at Tiflis, was a Christian land whose nobles shifted between the two empires; in the later 580s they transferred their allegiance from Persia to Byzantium. The settlement of 591 divided Iberia roughly equally, with Persia keeping Tiflis. Laz and Iberian allies fought for Heraclius in 624, and in 627 he met the Western Turkish ruler outside Tiflis and besieged the city.","events":[{"y":591,"approx":true,"t":"Khosrow II and Maurice divide Iberia, with Tiflis remaining on the Persian side."},{"y":624,"approx":false,"t":"Christian Caucasian allies, the Laz, Abasgians and Iberians, fight alongside Heraclius in Armenia."},{"y":627,"approx":false,"t":"Heraclius meets the Western Turkish ruler outside Tiflis, and their forces besiege the city."}],"link":null,"evidence":"moderate","sources":[{"title":"Ḵosrow II","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/khosrow-ii/"},{"title":"Byzantine Empire","publisher":"Encyclopaedia Britannica (Britannica Scholars)","url":"https://kids.britannica.com/scholars/article/Byzantine-Empire/106111"}]},"Egypt":{"polity":"Byzantine Empire; Persian occupation 619–629","summary":"Egypt's grain fed Constantinople and Byzantine armies. Its Coptic church was miaphysite and resisted the imperial Chalcedonian church. Persia invaded from 618–619, took Alexandria in June 619 and held Egypt until 629, pillaging monasteries. Amr ibn al-As later led the Arab Muslim conquest of Egypt.","events":[{"y":619,"approx":true,"t":"Persian forces, invading from 618–619, take Alexandria (c. June 619) and soon control all Egypt."},{"y":626,"approx":false,"t":"Benjamin I becomes Coptic patriarch of Alexandria."},{"y":629,"approx":true,"t":"Persian troops withdraw from Alexandria (c. June 629), and Byzantine rule returns."}],"link":null,"evidence":"moderate","sources":[{"title":"Egypt iv. Relations in the Sasanian period","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/egypt-iv/"},{"title":"Byzantine Empire","publisher":"Encyclopaedia Britannica (Britannica Scholars)","url":"https://kids.britannica.com/scholars/article/Byzantine-Empire/106111"},{"title":"ʿAmr ibn al-ʿĀṣ","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/biography/Amr-ibn-al-As"}]},"Afghanistan":{"polity":"Post-Hephthalite principalities and Western Turkic rulers in Tokharistan; Sasanian frontier near Herat","summary":"After the Western Turks and Sasanians destroyed the Hephthalites around 560–566, the land was divided. After 579, battles with the Western Turks cost the Sasanians control of Tokharistan (Bactria). Buddhism flourished: Balkh had about 100 monasteries, and the colossal Bamiyan Buddhas, dated to the 6th–7th centuries, stood in the central mountains. Xuanzang described these Buddhist lands around 628–632.","events":[{"y":579,"approx":true,"t":"After 579, battles with the Western Turks over former Hephthalite lands cost the Sasanians control of Tokharistan (Bactria)."},{"y":588,"approx":false,"t":"Turk-backed Hephthalite forces reach Badghis and Herat; the Sasanian general Bahram Chobin defeats the Western Turks and takes Balkh."},{"y":600,"approx":true,"t":"The colossal Bamiyan Buddhas belong to this era; sources date them to the 6th–7th centuries (dating debated)."},{"y":630,"approx":true,"t":"Xuanzang describes Buddhist Kapisa, Bamiyan and Tokharistan (c. 628–632); his account is the earliest text describing the Bamiyan Buddhas."}],"link":null,"evidence":"moderate","sources":[{"title":"Khorasan iii. Historical Geography in the Late Sasanid-Early Islamic Periods","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/khorasan-iii-historical-geography-in-the-late-sasanid-early-islamic-periods/"},{"title":"Bahrām VI Čōbīn","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/bahram-the-name-of-six-sasanian-kings/bahram-vi/"},{"title":"Bamiyan Buddhas","publisher":"Smarthistory","url":"https://smarthistory.org/bamiyan-buddhas/"},{"title":"Buddhism iv. Buddhist Sites in Afghanistan and Central Asia","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/buddhism-iv/"}]},"Pakistan":{"polity":"Kingdom of Sindh centred on Aror; Buddhist Gandhara in the northwest","summary":"Sindh's early history is known mainly from the Chachnama, a 13th-century Persian translation of a lost Arabic history compiled at Aror. Its local tradition, which mixes history with legend, tells of a Buddhist dynasty overthrown by the Brahman Chach, whose line ruled until the Arab conquest. In Gandhara, the Buddhist monastery of Takht-i-Bahi, founded in the 1st century, remained in use until the 7th century.","events":[{"y":630,"approx":true,"t":"Xuanzang, having described Buddhist Kapisa and Bamiyan, travels on into India, which he enters around 630."}],"link":null,"evidence":"sparse","sources":[{"title":"Čač-nāma","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/cac-nama/"},{"title":"Buddhist Ruins of Takht-i-Bahi and Neighbouring City Remains at Sahr-i-Bahlol","publisher":"UNESCO World Heritage Centre","url":"https://whc.unesco.org/en/list/140/"},{"title":"Buddhism iv. Buddhist Sites in Afghanistan and Central Asia","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/buddhism-iv/"},{"title":"Harsha","publisher":"World History Encyclopedia","url":"https://www.worldhistory.org/Harsha/"}]},"India":{"polity":"Harsha of Thanesar and Kannauj (north), Chalukyas of Badami (Deccan), Pallavas of Kanchi (southeast), Valabhi kingdom (west)","summary":"After the Gupta collapse, regional dynasties competed. Harsha (r. 606–647) ruled from Thanesar and later Kannauj; his court poet Bana wrote the Harshacharita. The Chalukya king Pulakeshin II (r. 609–642) defeated him on the Narmada, which became Harsha's southern frontier. Chalukyas and Pallavas, under Mahendravarman I (c. 600–630), fought over Vengi. Xuanzang reached India around 630 and presided over a great Buddhist assembly held by Harsha.","events":[{"y":578,"approx":true,"t":"Shrines to Shiva and Vishnu are built at Badami, base of the Early Chalukya dynasty."},{"y":606,"approx":false,"t":"Harsha, aged 16, becomes king of Thanesar after Shashanka of Gauda kills his elder brother Rajyavardhana."},{"y":609,"approx":false,"t":"Pulakeshin II begins his reign as Chalukya king of Badami, ruling until 642."},{"y":630,"approx":true,"t":"Pulakeshin II defeats Harsha on the Narmada, which becomes the southern limit of Harsha's empire (date disputed; one source gives 630–634)."}],"link":null,"evidence":"rich","sources":[{"title":"Harsha","publisher":"World History Encyclopedia","url":"https://www.worldhistory.org/Harsha/"},{"title":"Gauda Kingdom","publisher":"World History Encyclopedia","url":"https://www.worldhistory.org/Gauda_Kingdom/"},{"title":"South Asia: South, 500–1000 A.D. (Heilbrunn Timeline of Art History)","publisher":"The Metropolitan Museum of Art","url":"https://www.metmuseum.org/toah/ht/06/sss.html"},{"title":"Mahendravarman I","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/biography/Mahendravarman-I"}]},"Nepal":{"polity":"Licchavi kingdom of the Kathmandu Valley","summary":"The Kathmandu Valley was ruled by the Licchavi dynasty (c. 450–750), of Indian origin, which used Sanskrit as its court language and issued Indian-style coins. It kept close ties with India and had economic and political relations with Tibet, making Nepal a cultural link between central and southern Asia. The Harsha era beginning in 606 was long used in Nepal.","events":[{"y":606,"approx":false,"t":"The Harsha era begins; it was long preserved in Nepal for dating."}],"link":null,"evidence":"sparse","sources":[{"title":"Licchavi era","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/event/Licchavi-era"},{"title":"Harṣa Dynasty","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/topic/Harsa-Dynasty"}]},"Bhutan":{"polity":"Unknown local societies (no recorded state)","summary":"The historical origins of Bhutan are obscure, and little is known of its early history; no written records survive for 570–632. The Bhutia (Ngalops), today's largest group, descend from migrants who came from Tibet starting in the 9th century. Legend says the Tibetan emperor Songtsen Gampo built Kyichu Lhakhang in the Paro valley in the 7th century, but this is tradition, not record.","events":[{"y":630,"approx":true,"t":"Songtsen Gampo rules Tibet to the north (7th century); legend later credits him with founding Kyichu Lhakhang in Paro."}],"link":null,"evidence":"sparse","sources":[{"title":"Bhutan: History","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/place/Bhutan/History"},{"title":"Bhutan (Britannica Students)","publisher":"Encyclopaedia Britannica","url":"https://kids.britannica.com/students/article/Bhutan/273203"},{"title":"Kyichu Lhakhang","publisher":"The Treasury of Lives: A Biographical Encyclopedia of Tibet, Inner Asia and the Himalayan Region","url":"https://treasuryoflives.org/institution/Kyichu-Lhakhang"}]},"Bangladesh":{"polity":"Gauda kingdom of Shashanka (north and west); Samatata (east)","summary":"Northern Bangladesh lay in Gauda, whose king Shashanka, ruling from Karnasuvarna, held Magadha and lands in Odisha and fought the Maukharis and Harsha's family. Pundranagara (Mahasthangarh), founded around the 4th–3rd century BCE, was long an administrative centre with Buddhist monasteries and Brahmanical temples. Samatata in the east was famed as a Mahayana Buddhist centre, as Xuanzang's travel account attests.","events":[{"y":606,"approx":true,"t":"Shashanka is blamed for killing Rajyavardhana, Harsha's brother; Harsha allies with Bhaskaravarman of Kamarupa against him."},{"y":635,"approx":true,"t":"Xuanzang, travelling in India from about 630, records the fame of Samatata as a Mahayana Buddhist centre."},{"y":637,"approx":false,"t":"Shashanka dies after a long reign; only now does Harsha gain direct control of the Gauda lands."}],"link":null,"evidence":"moderate","sources":[{"title":"Gauda Kingdom","publisher":"World History Encyclopedia","url":"https://www.worldhistory.org/Gauda_Kingdom/"},{"title":"Cultural Landscape of Mahasthan and Karatoya River (Tentative List)","publisher":"UNESCO World Heritage Centre","url":"https://whc.unesco.org/en/tentativelists/6671/"},{"title":"Archaeological sites of Lalmai-Mainamati (Tentative List)","publisher":"UNESCO World Heritage Centre","url":"https://whc.unesco.org/en/tentativelists/6670/"}]},"Sri Lanka":{"polity":"Anuradhapura kingdom (Sinhalese kings recorded in the Culavamsa)","summary":"Sinhalese Buddhist kings ruled from Anuradhapura; the Culavamsa chronicle records them, but its dates are approximate and must be checked against inscriptions. Aggabodhi I and his nephew Aggabodhi II are remembered for irrigation works. The 6th–8th centuries were otherwise marked by murder, revolt and civil war, and from the 7th century South Indian powers and Tamil mercenaries grew more involved. The island lay on Indian Ocean trade routes.","events":[{"y":590,"approx":true,"t":"Reign of Aggabodhi I (6th–7th century; exact dates uncertain), who restores Mahasena's channel to Minneriya and builds the Kurunduvewa tank."},{"y":609,"approx":true,"t":"Under Aggabodhi II, credited with fourteen tanks, a fleeing Kalinga king takes refuge in Lanka and becomes a monk, possibly c. 609."},{"y":630,"approx":true,"t":"From the 7th century South Indian powers grow more involved in island politics, with Tamil mercenaries in and around the capital."}],"link":null,"evidence":"moderate","sources":[{"title":"History of Sri Lanka (Britannica Scholars)","publisher":"Encyclopaedia Britannica","url":"https://kids.britannica.com/scholars/article/history-of-Sri-Lanka/638090"},{"title":"Anurādhapura (historical state)","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/place/Anuradhapura-historical-state-Sri-Lanka"},{"title":"H. W. Codrington, A Short History of Ceylon (London: Macmillan, 1926), ch. III","publisher":"Macmillan (online edition at lakdiva.org.lk)","url":"https://lakdiva.org.lk/codrington/chap03.html"}]},"Kazakhstan":{"polity":"Western Turkic Khaganate","summary":"The steppes belonged to the Turkic (Kök Türk) empire founded in 552, which split into eastern and western halves in 583. Sogdian merchants gave the Turks their first chancellery language and, between 568 and 575, persuaded the khagan to open contact with Byzantium to sell silk. Early in the 7th century the Western Turks under Tong Yabghu extended their rule over the oasis states.","events":[{"y":568,"approx":true,"t":"Sogdian merchants persuade the Turkic khagan to open contact with Byzantium to sell Chinese silk (between 568 and 575)."},{"y":583,"approx":false,"t":"Rivalries within the ruling dynasty split the Turkic khaganate into eastern and western halves."},{"y":627,"approx":false,"t":"Ziebel, brother of the supreme khagan Tong Yabghu, allies with Emperor Heraclius in the Caucasus and conquers Tiflis (627–628)."},{"y":628,"approx":true,"t":"Tong Yabghu is assassinated (628 or 630), and power struggles weaken the Western Turks' grip on the oasis states."}],"link":null,"evidence":"moderate","sources":[{"title":"Sogdian Trade","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/sogdian-trade/"},{"title":"Khagan","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/khagan/"},{"title":"H. İ. Erkoç, The Impact of General Li Jing's Military Thought on the Fall of the Eastern Türk Qaghanate","publisher":"Çanakkale Araştırmaları Türk Yıllığı 22 (2017), Çanakkale Onsekiz Mart University","url":"https://cdn.comu.edu.tr/cms/ckalearastirma/files/515-2-hayrettin-ihsan-erkoc-the-impact-of-general-li-j.pdf"},{"title":"Khotan ii. History in the Pre-Islamic Period","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/khotan-parent/khotan-ii-history-in-the-pre-islamic-period/"}]},"Kyrgyzstan":{"polity":"Western Turkic Khaganate (Chu valley)","summary":"The Chu valley held Suyab (Ak-Beshim, 60 km east of modern Bishkek), a town probably founded by Sogdians in the 6th century, where Sogdian and local Turkic cultures met. Chinese annals describe the district as densely settled, subject to the Turks and dotted with trading colonies of Sogdian merchants. The Western Turkic khagan Tong Yabghu dominated the region until his assassination.","events":[{"y":628,"approx":true,"t":"Tong Yabghu, khagan of the Western Turks, is assassinated (628 or 630; date disputed)."},{"y":629,"approx":false,"t":"Xuanzang passes through Suyab, the town's first recorded mention."}],"link":null,"evidence":"moderate","sources":[{"title":"Suyāb","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/suyab/"},{"title":"Khotan ii. History in the Pre-Islamic Period","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/khotan-parent/khotan-ii-history-in-the-pre-islamic-period/"}]},"Tajikistan":{"polity":"Sogdian towns (Panjikant) in the north; Tokharistan principalities in the south under Western Turkic power","summary":"The north lay in Sogdiana, where Panjikant was a prosperous town of merchants and landowners; its two temples and many houses were decorated with murals of gods, royal feasts and epic heroes. The south belonged to Tokharistan, a hub of trade routes once dominated by the Hephthalites and later under Western Turkic control. Buddhist monasteries stood in northern Tokharistan.","events":[{"y":565,"approx":true,"t":"The Western Turks and Sasanians destroy the Hephthalites (dated 558–561 or 563–566); the Turks take the lands north of the Oxus."},{"y":600,"approx":true,"t":"Panjikant flourishes; its temples and houses bear murals of gods, feasts, hunts and heroes such as Rostam."},{"y":628,"approx":true,"t":"Xuanzang, writing under the year 628, records Buddhist monasteries in northern Tokharistan."}],"link":null,"evidence":"moderate","sources":[{"title":"Panjikant","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/panjikant/"},{"title":"Khorasan iii. Historical Geography in the Late Sasanid-Early Islamic Periods","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/khorasan-iii-historical-geography-in-the-late-sasanid-early-islamic-periods/"},{"title":"Buddhism iv. Buddhist Sites in Afghanistan and Central Asia","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/buddhism-iv/"},{"title":"Hephthalites","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/hephthalites/"}]},"Turkmenistan":{"polity":"Sasanian Empire (Merv, in Khorasan)","summary":"Merv, an oasis city on the Silk Road, was one of the main population centres of Sasanian Khorasan; its walled city of Gyaur Kala contained a Buddhist stupa and monastery. Khorasan faced repeated pressure from the Western Turks and their Hephthalite subjects, and after 579 the Sasanians lost control of Tokharistan to the east.","events":[{"y":588,"approx":false,"t":"Bahram Chobin defeats a Turk-backed Hephthalite invasion of the eastern provinces that had reached Badghis and Herat."},{"y":590,"approx":false,"t":"Bahram Chobin rebels and is proclaimed king after nobles kill Hormizd IV; Khosrow II, backed by a Byzantine army, ousts him in 591."},{"y":615,"approx":true,"t":"Late in his career (he died 616 or 617), the Armenian prince Smbat Bagratuni leads a Persian and Armenian army to victory over the Hephthalites."}],"link":null,"evidence":"moderate","sources":[{"title":"Khorasan iii. Historical Geography in the Late Sasanid-Early Islamic Periods","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/khorasan-iii-historical-geography-in-the-late-sasanid-early-islamic-periods/"},{"title":"Bahrām VI Čōbīn","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/bahram-the-name-of-six-sasanian-kings/bahram-vi/"},{"title":"Smbat Bagratuni","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/smbat-bagratuni/"},{"title":"State Historical and Cultural Park “Ancient Merv”","publisher":"UNESCO World Heritage Centre","url":"https://whc.unesco.org/en/list/886/"}]},"Uzbekistan":{"polity":"Sogdian city-states (Samarkand, Bukhara) under Western Turkic overlordship","summary":"Sogdiana's city-states lay north of the Oxus under Turkic overlordship; Samarkand was a major trading emporium, and Bukhara's rulers deferred to its ruler. Sogdian merchants dominated Silk Road trade and gave the Turks their first chancellery language. Samarkand hosted Zoroastrians, Christians, Buddhists and Manichaeans, and Buddhist monasteries stood at Termez in the south.","events":[{"y":568,"approx":true,"t":"Sogdian merchants persuade the Turkic khagan to open contact with Byzantium to sell Chinese silk (between 568 and 575)."},{"y":628,"approx":true,"t":"Xuanzang passes through Samarkand and Termez, where he notes about a dozen Buddhist monasteries and some 1,000 monks."}],"link":null,"evidence":"moderate","sources":[{"title":"Sogdian Trade","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/sogdian-trade/"},{"title":"Khorasan iii. Historical Geography in the Late Sasanid-Early Islamic Periods","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/khorasan-iii-historical-geography-in-the-late-sasanid-early-islamic-periods/"},{"title":"Buddhism iv. Buddhist Sites in Afghanistan and Central Asia","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/buddhism-iv/"},{"title":"Panjikant","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/panjikant/"}]},"Mongolia":{"polity":"Turkic (Kök Türk) Khaganate, from 583 its eastern branch","summary":"Mongolia was the heartland of the Turkic khaganate founded in 552, which split into eastern and western halves in 583. Its nomadic rulers, whose economy rested on herding, first wrote in Sogdian. The Eastern Turks were strongest under Shibi Qaghan (609–619), but after disasters in 627 and revolts led by the Xueyantuo, the Tang general Li Jing destroyed the khaganate in 630.","events":[{"y":581,"approx":true,"t":"The Bugut stele, written in Sogdian, is raised for a dead khagan; it is the oldest surviving inscription on the history of the Turkic rulers."},{"y":583,"approx":false,"t":"Rivalries within the ruling dynasty split the Turkic khaganate into eastern and western halves."},{"y":615,"approx":false,"t":"Shibi Qaghan besieges the Sui emperor Yangdi at Yanmen, triggering rebellions across China."},{"y":626,"approx":false,"t":"Illig Qaghan advances to the Tang capital Chang'an; the new emperor Taizong has to bribe the Turks to withdraw."},{"y":627,"approx":false,"t":"Heavy snowfall kills the Turks' herds; famine and heavy taxes spark revolts by vassal tribes, which unite under the Xueyantuo."},{"y":630,"approx":false,"t":"Tang general Li Jing destroys the Eastern Turkic khaganate in surprise raids; his subordinate Zhang Baoxiang captures Illig Qaghan."}],"link":null,"evidence":"moderate","sources":[{"title":"H. İ. Erkoç, The Impact of General Li Jing's Military Thought on the Fall of the Eastern Türk Qaghanate","publisher":"Çanakkale Araştırmaları Türk Yıllığı 22 (2017), Çanakkale Onsekiz Mart University","url":"https://cdn.comu.edu.tr/cms/ckalearastirma/files/515-2-hayrettin-ihsan-erkoc-the-impact-of-general-li-j.pdf"},{"title":"Khagan","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/khagan/"},{"title":"Chinese Turkestan viii. Turkish-Iranian Language Contacts","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/chinese-turkestan-viii/"}]}};

function sphereAt(name, y) {
  /* Rules checked against Encyclopaedia Iranica (Abnāʾ; Arabia; Oman; Egypt iv; Armenia ii; Ḵosrow II) and Britannica. */
  switch (name) {
    case "Saudi Arabia": return y >= 630 ? "islam" : "arabia";               // Medina's community from 622; Mecca and most tribes follow from 630
    case "Yemen": return y >= 631 ? "islam" : y >= 570 ? "sas" : "aksum";        // Persian conquest c. 570; Badhan accepts Islam, recorded under 10 AH (631) (Iranica, Abnāʾ)
    case "Oman": case "United Arab Emirates": case "Qatar":
      return y >= 630 ? "islam" : "sas";                                      // submission to Medina after the fall of Mecca, 630
    case "Kuwait": return "sas";                                              // Sasanian frontier until Khalid's campaign of 633
    case "Egypt": return (y >= 619 && y < 629) ? "sas" : "byz";               // Alexandria falls 619; Persian withdrawal c. June 629
    case "Syria": case "Lebanon": return (y >= 613 && y < 629) ? "sas" : "byz";
    case "Israel": case "Palestine": case "Jordan": return (y >= 614 && y < 629) ? "sas" : "byz"; // Jerusalem 614
    case "Armenia": return (y >= 591 && y < 607) || y >= 628 ? "byz" : "sas";   // western Armenia ceded 591; Persian reconquest c. 607–608
    case "Georgia": return y >= 628 ? "byz" : "sas";                          // Kartli (Tiflis) Persian until Heraclius 627–628; Lazica Byzantine throughout
  }
  return STATIC_LOOKUP[name] || "other";
}

function mainPolygon(f) {
  if (f.geometry.type !== "MultiPolygon") return f;
  let best = null, area = -1;
  for (const coords of f.geometry.coordinates) {
    const g = { type: "Feature", geometry: { type: "Polygon", coordinates: coords } };
    const a = d3.geoArea(g); if (a > area) { area = a; best = g; }
  }
  return best;
}
const anchors = new Map(features.map(f => [f.properties.name, mainPolygon(f)]));

let W = 0, H = 0, zoomK = 1;
const zoom = d3.zoom().scaleExtent([1, 12]).on("zoom", ev => {
  zoomK = ev.transform.k;
  gRoot.attr("transform", ev.transform);
  gLand.selectAll("path").attr("stroke-width", .5 / zoomK);

});
svg.call(zoom);
function layout() {
  const r = svg.node().getBoundingClientRect(); W = r.width; H = r.height;

  gGrat.attr("d", path(d3.geoGraticule10()));
  nodes.attr("d", path);
  zoom.translateExtent([[0, 0], [W, H]]).extent([[0, 0], [W, H]]);

}

/* ---------- colouring ---------- */
function keyFor(name) {
  const d = DATA[name];
  if (mode === "sphere") return sphereAt(name, year);
  if (mode === "evidence") return d?.pending ? "pending" : (d?.evidence || "sparse");
  return d?.pending ? "pending" : d?.link ? "yes" : "no";
}
function table() { return mode === "sphere" ? SPHERES : mode === "evidence" ? EVIDENCE : LINK; }
function paint() {
  const T = table();
  nodes.attr("fill", d => col(T[keyFor(d.properties.name)][1]))
       .classed("sel", d => d.properties.name === selected)
       .classed("dim", d => filterKey && keyFor(d.properties.name) !== filterKey);
  nodes.filter(d => d.properties.name === selected).raise();
  renderLegend();
}
function renderLegend() {
  const T = table();
  const present = new Set(features.map(f => keyFor(f.properties.name)));
  const el = document.getElementById("legend");
  el.innerHTML = Object.entries(T).filter(([k]) => present.has(k)).map(([k, [label, v]]) =>
    `<button type="button" data-k="${k}" aria-pressed="${filterKey === k}"><i style="background:var(${v})"></i>${esc(label)}</button>`).join("")
    + (mode === "sphere" ? `<span>· simplified; modern borders</span>` : "");
  el.querySelectorAll("button").forEach(b => b.onclick = () => { filterKey = filterKey === b.dataset.k ? null : b.dataset.k; paint(); });
}

/* ---------- pins: places with events near the chosen year ---------- */
const WINDOW = 2;
function eventsNear(y) {
  const out = [];
  for (const [name, d] of Object.entries(DATA)) for (const e of d.events || []) if (Math.abs(e.y - y) <= WINDOW) out.push({ name, ...e });
  return out.sort((a, b) => Math.abs(a.y - y) - Math.abs(b.y - y) || a.y - b.y);
}
function drawPins() {
  if (!W) return;
  const names = [...new Set(eventsNear(year).map(e => e.name))];
  const pts = names.map(n => { const a = anchors.get(n); if (!a) return null; const c = path.centroid(a); return isFinite(c[0]) ? { n, c } : null; }).filter(Boolean);
  const r = 3.2 / zoomK;
  gPins.selectAll("circle.pin").data(pts, d => d.n).join("circle")
    .attr("class", d => "pin" + (d.n === "Saudi Arabia" ? " arabia" : ""))
    .attr("cx", d => d.c[0]).attr("cy", d => d.c[1]).attr("r", r).attr("stroke-width", 1.2 / zoomK);
  const medina = projection([39.61, 24.47]);
  gPins.selectAll("circle.medina").data(year >= 622 ? [medina] : []).join("circle").attr("class", "pin arabia medina")
    .attr("cx", d => d[0]).attr("cy", d => d[1]).attr("r", 2.6 / zoomK).attr("stroke-width", 1 / zoomK);
  const mecca = projection([39.83, 21.42]);
  gPins.selectAll("circle.pulse").data([mecca]).join("circle").attr("class", "pulse")
    .attr("cx", d => d[0]).attr("cy", d => d[1]).attr("r", 6 / zoomK).attr("stroke-width", 1.2 / zoomK);
}

  const n = d.properties.name, info = DATA[n];

  tip.style.left = Math.min(mx + 14, box - w - 8) + "px";

}
