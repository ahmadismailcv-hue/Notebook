gister Multiple Property Documentation Form","publisher":"US National Park Service","url":"https://npgallery.nps.gov/NRHP/GetAsset/NRHP/64500749_text"}]},"Trinidad and Tobago":{"polity":"Saladoid and Barrancoid-related village societies","summary":"Trinidad, near the Orinoco, lay on the route by which Saladoid pottery-making farmers spread from South America into the Caribbean. Saladoid and Barrancoid ceramic traditions are both found in Trinidad and Tobago in the period up to about AD 750, reflecting close ties with the mainland. Dating is approximate.","events":[{"y":600,"approx":true,"t":"Villages in Trinidad and Tobago make pottery in the Saladoid and Barrancoid traditions, linked to the South American mainland."}],"link":null,"evidence":"sparse","sources":[{"title":"The Native Peoples of Turks and Caicos","publisher":"Florida Museum of Natural History, Caribbean Archaeology Program","url":"https://www.floridamuseum.ufl.edu/caribarch/education/tc-peoples/"},{"title":"Representations of cosmology: a study of the Saladoid and Barrancoid adornos of Trinidad and Tobago, 500 BC - AD 750 (James-Williams, M.Phil. thesis)","publisher":"University of the West Indies, St Augustine","url":"https://uwispace.sta.uwi.edu/items/7acc1b97-4506-4ba0-907e-d3834b350173/full"}]},"Colombia":{"polity":"Regional chiefdom societies (San Agustín, Tierradentro, San Jorge floodplain and others)","summary":"Colombia had chiefdom societies but no empire or writing. Around San Agustín in the upper Magdalena, the Regional Classic period (c. 1–900) saw elite burial mounds with stone tombs and large carved statues. At Tierradentro, monumental painted shaft-and-chamber tombs (hypogea) were cut into volcanic tuff from about 600. In the San Jorge floodplain of the north, ridges and canals managed floodwaters, with the region at its height c. 400–1000.","events":[{"y":600,"approx":true,"t":"San Agustín's Regional Classic period (c. 1–900) continues, with burial mounds over stone tombs guarded by large carved statues."},{"y":600,"approx":true,"t":"At Tierradentro, communities begin cutting decorated underground tomb chambers (hypogea) into volcanic tuff (c. 600–900)."},{"y":600,"approx":true,"t":"In the San Jorge floodplain, ridges and drainage canals manage seasonal floods; the region is at its height c. 5th–10th centuries."}],"link":null,"evidence":"sparse","sources":[{"title":"San Agustín Archaeological Park","publisher":"UNESCO World Heritage Centre","url":"https://whc.unesco.org/en/list/744"},{"title":"National Archeological Park of Tierradentro","publisher":"UNESCO World Heritage Centre","url":"https://whc.unesco.org/en/list/743"},{"title":"Pre-Hispanic Hydraulic System of the San Jorge River (Tentative List)","publisher":"UNESCO World Heritage Centre","url":"https://whc.unesco.org/en/tentativelists/5764"}]},"Venezuela":{"polity":"Village and early chiefdom societies (e.g. western Llanos of Barinas)","summary":"There were no states or writing. The best-studied area is Barinas in the western Llanos and Andean piedmont. There, occupation was sparse in 300–550, but in the following phase (550–1000) the number of settlements rose sharply and chiefdoms with centralized authority began to form. Petroglyphs in the piedmont may mark a trade route between the Llanos and the high Andes. Knowledge is entirely archaeological.","events":[{"y":600,"approx":true,"t":"In Barinas, settlements multiply (to 32 in the Llanos and six in the piedmont in 550–1000) and chiefdoms begin to form."}],"link":null,"evidence":"sparse","sources":[{"title":"Archaeology of the Western Venezuelan Llanos: The Barinas Project","publisher":"American Museum of Natural History","url":"https://www.amnh.org/research/anthropology/curatorial-research/meso-american-archaeology/projects/7.-western-venezuelan-llanos"}]},"Guyana":{"polity":null,"evidence":"sparse","pending":true,"sources":[],"events":[],"link":null},"Suriname":{"polity":"Village societies of the coast and interior","summary":"The record is thin and dates are broad. On the swampy coastal plain of western Suriname, people built raised fields (mounds and ridges with ditches and canals) linked to habitation mounds. According to Rostain, the first raised fields were made by migrants from the lower Orinoco from about 1,800 years ago, and the tradition later spread east into French Guiana. Knowledge is archaeological only.","events":[{"y":600,"approx":true,"t":"Raised-field farming, introduced from the lower Orinoco from about 1,800 years ago, is practised on the western coastal plain."}],"link":null,"evidence":"sparse","sources":[{"title":"La mise en culture des marécages littoraux de Guyane à la période précolombienne récente (Stéphen Rostain)","publisher":"IRD (ORSTOM) documentation","url":"https://horizon.documentation.ird.fr/exl-doc/pleins_textes/pleins_textes_7/b_fdi_03_04/42067.pdf"}]},"Ecuador":{"polity":"Regional coastal and highland societies (late Regional Development period)","summary":"Ecuador had regional societies but no state. On the coast this was the end of the Regional Development period, which lasted until about 700; the Integration period that followed brought population growth and sharper social ranking. Spondylus shell, found off the warm Ecuadorian coast but scarce in Peru's cold waters, had great ritual value in the Central Andes, and Peruvian demand rose sharply after about 600.","events":[{"y":600,"approx":true,"t":"Peruvian demand for Ecuadorian Spondylus shell rises considerably after Moche V (c. 600)."},{"y":600,"approx":true,"t":"In southern Manabí, settlements stay small with little stratification until the end of the Regional Development period (c. 700)."}],"link":null,"evidence":"sparse","sources":[{"title":"La trayectoria del desarrollo social precolombino en el sur de Manabí (Martín & Lara 2009)","publisher":"Antropología: Cuadernos de Investigación (PUCE), via Dialnet","url":"https://dialnet.unirioja.es/descarga/articulo/7609614.pdf"}]},"Peru":{"polity":"Late Moche polities (Pampa Grande), the expanding Wari state, late Nazca, Recuay; Tiwanaku colonies in Moquegua","summary":"A time of upheaval. Severe droughts and El Niño floods strained the north-coast Moche; new inland centres such as Pampa Grande rose as the old southern capital declined. In the highlands, the Wari state was expanding from its capital near Ayacucho. Nazca culture was in its late phase on the south coast and Recuay persisted in the north highlands. Tiwanaku colonists from the Titicaca basin farmed the Moquegua valley.","events":[{"y":600,"approx":true,"t":"Droughts and El Niño floods (dated c. 560–600 by some, c. 630 by others) strain the Moche; the southern capital at Moche is largely abandoned."},{"y":600,"approx":true,"t":"Pampa Grande (c. 550–700), with the huge Huaca Fortaleza platform, becomes the largest Moche city, in the Lambayeque valley."},{"y":600,"approx":true,"t":"Wari, north of modern Ayacucho, is a prosperous metropolis and capital of a rapidly expanding state, with specialized craft compounds."},{"y":600,"approx":true,"t":"Tiwanaku colonists from the altiplano farm the Moquegua valley, beginning with Omo-style settlements."},{"y":600,"approx":true,"t":"Late Nazca culture (c. 100–700) continues on the south coast; Nasca styles shape Wari's Chakipampa ceramics."}],"link":null,"evidence":"moderate","sources":[{"title":"Central and Southern Andes, 500–1000 A.D. (Heilbrunn Timeline of Art History)","publisher":"The Metropolitan Museum of Art","url":"https://www.metmuseum.org/toah/ht/06/sac"},{"title":"Late Moche Society: Disruption, Reconstitution, and End (Garth Bawden, course notes)","publisher":"University of New Mexico","url":"https://www.unm.edu/~gbawden/324-MLateA/324-MLateA.htm"},{"title":"Pampa Grande and the Mochica Culture (Izumi Shimada)","publisher":"University of Texas Press (via UBC Press)","url":"https://www.ubcpress.ca/pampa-grande-and-the-mochica-culture"},{"title":"Wari Imperial Art (José Ochatoma Paravicino)","publisher":"The Metropolitan Museum of Art","url":"https://www.metmuseum.org/en/essays/wari-imperial-art"},{"title":"The Tiwanaku 'Empire' (Garth Bawden, course notes)","publisher":"University of New Mexico","url":"https://www.unm.edu/~gbawden/324-TEmp/324-TEmp.htm"}]},"Bolivia":{"polity":"Tiwanaku (Lake Titicaca basin); Casarabe culture in the Llanos de Mojos","summary":"Tiwanaku, near the south shore of Lake Titicaca, was in its apogee (c. 500–900) as a ceremonial and political centre with monuments such as the Akapana, Kalasasaya and Pumapunku. Raised-field farming and lake resources supported it, and its influence reached colonies in Moquegua and Cochabamba and, through caravan trade, distant oases. In the Amazonian lowlands, the Casarabe culture (c. 500–1400) built platform mounds, causeways and canals.","events":[{"y":600,"approx":true,"t":"A major construction programme begins at Tiwanaku, including the Akapana pyramid with seven stone-walled platforms and an expanded drainage system."},{"y":600,"approx":true,"t":"Monumental human-form stone sculptures, including the Bennett Stela, are erected at Tiwanaku."},{"y":600,"approx":true,"t":"The Casarabe culture (c. 500–1400) in the Llanos de Mojos develops settlements that later include platform mounds, raised causeways and canals."}],"link":null,"evidence":"moderate","sources":[{"title":"Tiwanaku: Spiritual and Political Centre of the Tiwanaku Culture","publisher":"UNESCO World Heritage Centre","url":"https://whc.unesco.org/en/list/567"},{"title":"Central and Southern Andes, 500–1000 A.D. (Heilbrunn Timeline of Art History)","publisher":"The Metropolitan Museum of Art","url":"https://www.metmuseum.org/toah/ht/06/sac"},{"title":"The Tiwanaku 'Empire' (Garth Bawden, course notes)","publisher":"University of New Mexico","url":"https://www.unm.edu/~gbawden/324-TEmp/324-TEmp.htm"},{"title":"Lidar reveals pre-Hispanic low-density urbanism in the Bolivian Amazon (Prümers et al. 2022)","publisher":"Nature","url":"https://www.nature.com/articles/s41586-022-04780-4"}]},"Chile":{"polity":"Atacama oasis communities linked to Tiwanaku; Bato and Llolleo horticulturalists in central Chile","summary":"In the north, the San Pedro de Atacama oases were drawn into Tiwanaku's economic and ideological sphere, probably through caravan trade rather than conquest; Tiwanaku-style goods appear mainly in burials. In central Chile, Bato and Llolleo groups of the Early Ceramic period lived in the Santiago basin; Llolleo numbers grew after about 700 with greater reliance on maize. Knowledge is archaeological only.","events":[{"y":600,"approx":true,"t":"San Pedro de Atacama burials include Tiwanaku-style textiles, drinking cups and hallucinogen paraphernalia, reflecting links with the Titicaca basin (c. 400–1000)."},{"y":600,"approx":true,"t":"Bato and Llolleo horticultural groups occupy the Santiago basin during the Early Ceramic period (c. 200 BC–AD 1300)."}],"link":null,"evidence":"sparse","sources":[{"title":"The Tiwanaku 'Empire' (Garth Bawden, course notes)","publisher":"University of New Mexico","url":"https://www.unm.edu/~gbawden/324-TEmp/324-TEmp.htm"},{"title":"Trends in thermoluminescence date distributions for the Angostura micro region in Central Chile (Falabella et al. 2015)","publisher":"Quaternary International, via Repositorio Universidad de Chile","url":"https://repositorio.uchile.cl/handle/2250/133252"}]},"Argentina":{"polity":"Northwest Andean farming societies (Aguada)","summary":"In the northwest Andean valleys, the Aguada peoples built on earlier Condorhuasi-phase developments. Their gray and polychrome ceramics, incised with dragonlike creatures and staff-bearing figures, suggest they shared in a wider pan-Andean mythology; Aguada bronzeworking became highly developed somewhat later. There was no writing, and evidence is archaeological, with broad dates.","events":[{"y":650,"approx":true,"t":"Aguada peoples of northwest Argentina build on Condorhuasi traditions, making incised ceramics with dragonlike creatures and staff-bearing figures."}],"link":null,"evidence":"sparse","sources":[{"title":"Central and Southern Andes, 500–1000 A.D. (Heilbrunn Timeline of Art History)","publisher":"The Metropolitan Museum of Art","url":"https://www.metmuseum.org/toah/ht/06/sac"}]},"Paraguay":{"polity":"Early Guaraní forager-horticulturalists (Upper Paraná)","summary":"Guaraní-ancestral groups, originating in southwestern Amazonia, were beginning to settle the Plata basin; the earliest Guaraní sites there date to about 500 ± 100 CE along the Upper Paraná River. They hunted, fished, gathered and grew maize, tubers, beans, squash and peanuts, made corrugated and painted pottery and often buried the dead in urns. Precise dates for this period are few.","events":[{"y":600,"approx":true,"t":"The earliest Guaraní sites in the Plata basin, along the Upper Paraná River, date to about 500 ± 100 CE."}],"link":null,"evidence":"sparse","sources":[{"title":"At the Southern limit: the Arenal Central site and the Guaraní occupation of the Paraná Delta (Loponte et al. 2025)","publisher":"Frontiers in Environmental Archaeology","url":"https://www.frontiersin.org/journals/environmental-archaeology/articles/10.3389/fearc.2025.1535551/full"}]},"Uruguay":{"polity":"Mound-building groups of the eastern lowlands ('cerritos de indios')","summary":"In the Laguna Merín lowlands of eastern Uruguay, people built earthen mounds known as 'cerritos de indios', a tradition dated from about 5,000 to 250 radiocarbon years ago. Older models saw the mound builders as specialised hunters; newer fish-bone evidence suggests fishing was also important. Evidence is archaeological only.","events":[{"y":600,"approx":true,"t":"The cerrito mound-building tradition of the Laguna Merín lowlands (c. 5000–250 radiocarbon years BP) continues."}],"link":null,"evidence":"sparse","sources":[{"title":"Aproximación a la pesca indígena en las tierras bajas de la Laguna Merín (Bica-Méndez 2022)","publisher":"Revista Chakiñan de Ciencias Sociales y Humanidades, via Redalyc","url":"https://www.redalyc.org/journal/5717/571772328005/571772328005.pdf"}]},"Brazil":{"polity":"Diverse Amazonian and highland societies (Marajoara, Acre geoglyph builders, southern proto-Jê and others)","summary":"On Marajó Island, the Marajoara (c. 300–1350) lived on large earth mounds, built fishponds, and made elaborate pottery and burial urns. In Acre, people used huge geometric ditched enclosures (geoglyphs) as ceremonial gathering places within long-managed forest. In the southern highlands, proto-Jê groups of the Taquara-Itararé tradition, ancestors of the Kaingang and Xokleng, built pit-house villages and earthworks. No writing; dates come from excavation.","events":[{"y":600,"approx":true,"t":"Marajoara communities on Marajó Island live on raised mounds, manage fishponds and bury ancestors in decorated urns (c. 300–1350)."},{"y":600,"approx":true,"t":"Geometric ditched enclosures (geoglyphs) in Acre are built and used sporadically as ceremonial sites (c. 2000–650 years ago)."},{"y":600,"approx":true,"t":"Southern proto-Jê groups of the Taquara-Itararé tradition (c. 380 BC–17th century) live in pit-house villages in the southern highlands."}],"link":null,"evidence":"sparse","sources":[{"title":"Ancient Marajó","publisher":"ORIAS, University of California, Berkeley","url":"https://orias.berkeley.edu/resources-teachers/societies-americas/ancient-maraj%C3%B3"},{"title":"Impact of pre-Columbian 'geoglyph' builders on Amazonian forests (Watling et al. 2017)","publisher":"PNAS","url":"https://www.pnas.org/doi/10.1073/pnas.1614359114"},{"title":"Understanding the Chronology and Occupation Dynamics of Oversized Pit Houses in the Southern Brazilian Highlands (de Souza et al. 2016)","publisher":"PLOS ONE, via PubMed Central","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC4934860"}]},"Falkland Is.":{"polity":"Uninhabited (no known settlement)","summary":"No settlement is known. Europeans arriving in 1690 found no people. A 2021 study found evidence of pre-European visits by Indigenous South Americans, probably short stays, most likely between about 1275 and 1420, though earlier dates cannot be ruled out. The only native land mammal was the warrah, a fox-like canid.","events":[{"y":600,"approx":true,"t":"No settlement is known; the main evidence for human visits points to c. 1275–1420, centuries later."}],"link":null,"evidence":"sparse","sources":[{"title":"Evidence of prehistoric human activity in the Falkland Islands (Hamley et al. 2021)","publisher":"Science Advances","url":"https://www.science.org/doi/10.1126/sciadv.abh3803"},{"title":"Evidence of prehistoric human activity in Falkland Islands (University of Maine release)","publisher":"ScienceDaily","url":"https://sciencedaily.com/releases/2021/10/211027150706.htm"}]},"China":{"polity":"Northern Zhou, then Sui (581–618) and Tang (618–); Tibetan kingdom of Songtsen Gampo in the west","summary":"Yang Jian (Emperor Wen) founded the Sui in 581 and reunified China by conquering the south in 589. His son Yangdi (r. 604–618) built the Grand Canal but exhausted the realm with failed wars against Goguryeo. Yangdi was assassinated in 618 and Li Yuan founded the Tang. His son Taizong seized power in 626, and in 630 Tang forces destroyed the Eastern Turkic khaganate. Songtsen Gampo expanded Tibet.","events":[{"y":589,"approx":false,"t":"Sui armies capture Nanjing and conquer the south, reunifying China under Emperor Wen after three centuries of division."},{"y":604,"approx":false,"t":"Yangdi becomes emperor; his reign sees the building of the Grand Canal linking the Yangtze and Yellow rivers."},{"y":612,"approx":false,"t":"Yangdi personally leads a huge invasion of Goguryeo, which is crushed at the Salsu River; further campaigns in 613 and 614 also fail."},{"y":615,"approx":false,"t":"The Eastern Turkic ruler Shibi Qaghan besieges Yangdi at Yanmen, fuelling the rebellions that bring down the Sui."},{"y":618,"approx":false,"t":"Yangdi is assassinated; Li Yuan, Duke of Tang, founds the Tang dynasty and reigns as Gaozu."},{"y":626,"approx":false,"t":"Li Shimin kills his brothers, including the heir Li Jiancheng, in a coup; Gaozu abdicates and Li Shimin reigns as Taizong."},{"y":629,"approx":false,"t":"Songtsen Gampo is crowned king of Tibet; he later extends his rule to Nepal and parts of India and China."},{"y":630,"approx":false,"t":"Tang general Li Jing destroys the Eastern Turkic khaganate in surprise raids; his subordinate Zhang Baoxiang captures the khagan Illig."}],"link":null,"evidence":"rich","sources":[{"title":"Sui Dynasty","publisher":"World History Encyclopedia","url":"https://www.worldhistory.org/Sui_Dynasty/"},{"title":"Tang Dynasty","publisher":"World History Encyclopedia","url":"https://www.worldhistory.org/Tang_Dynasty/"},{"title":"H. İ. Erkoç, The Impact of General Li Jing's Military Thought on the Fall of the Eastern Türk Qaghanate","publisher":"Çanakkale Araştırmaları Türk Yıllığı 22 (2017), Çanakkale Onsekiz Mart University","url":"https://cdn.comu.edu.tr/cms/ckalearastirma/files/515-2-hayrettin-ihsan-erkoc-the-impact-of-general-li-j.pdf"},{"title":"Srong-brtsan-sgam-po","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/biography/Srong-brtsan-sgam-po"}]},"Taiwan":{"polity":"Independent Indigenous (Austronesian-speaking) peoples","summary":"Taiwan was home to Indigenous peoples whose ancestors had lived on the island for more than 10,000 years and who spoke Austronesian languages. Many scholars see Taiwan as the starting point of the Austronesian expansion, though this is debated. There was no state and no outside rule. Chinese records report an expedition in the early 7th century that brought Indigenous people back to China. Documentation is very thin.","events":[{"y":605,"approx":true,"t":"A Chinese expedition brings several Indigenous people from Taiwan back to China; a follow-up mission gathers more information (date as given by Britannica)."}],"link":null,"evidence":"sparse","sources":[{"title":"Taiwan (Students)","publisher":"Britannica Kids / Encyclopaedia Britannica","url":"https://kids.britannica.com/students/article/Taiwan/277248"},{"title":"Austronesian languages (Scholars)","publisher":"Britannica Kids / Encyclopaedia Britannica","url":"https://kids.britannica.com/scholars/article/Austronesian-languages/109806"},{"title":"Human settlement history between Sunda and Sahul: a focus on East Timor (Timor-Leste) and the Pleistocenic mtDNA diversity","publisher":"BMC Genomics (2015)","url":"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC4342813/"}]},"Japan":{"polity":"Yamato court (Asuka period) under Empress Suiko, then Emperor Jomei","summary":"The Yamato court ruled from Asuka. From 587 the Soga clan dominated government. Empress Suiko (r. 592–628) reigned with Prince Shotoku as regent. Buddhism was promoted and temples such as Shitennoji, Hokoji and Horyuji were built, while teachers and scholars from Baekje in Korea brought Chinese learning such as Confucian texts. Official embassies to Sui China began about 607.","events":[{"y":587,"approx":false,"t":"The Soga clan establishes control of the government, holding it until 645; the rival Mononobe clan had resisted Buddhism."},{"y":594,"approx":false,"t":"Prince Shotoku becomes regent for Empress Suiko, Japan's first empress, and governs on her behalf until his death in 622."},{"y":604,"approx":false,"t":"The Seventeen Article Constitution, credited to Prince Shotoku, sets out Buddhist and Confucian principles of government."},{"y":607,"approx":true,"t":"Horyuji temple is completed, and Japan sends the first of many official embassies to the Sui court."},{"y":622,"approx":false,"t":"Death of Prince Shotoku."},{"y":629,"approx":false,"t":"Jomei becomes emperor, reigning until 641."}],"link":null,"evidence":"moderate","sources":[{"title":"Asuka Period","publisher":"World History Encyclopedia","url":"https://www.worldhistory.org/Asuka_Period/"}]},"North Korea":{"polity":"Goguryeo kingdom (capital Pyongyang)","summary":"This land was the heart of Goguryeo, the northernmost of Korea's Three Kingdoms, ruled from Pyongyang since 427. Under King Yeongyang (r. 590–618) it repelled Sui invasions in 598 and 612–614, most famously when general Eulji Mundeok won a great victory at the Salsu River in 612. Many Goguryeo tombs were decorated with painted murals.","events":[{"y":598,"approx":false,"t":"A Sui invasion of Goguryeo fails after the army runs short of supplies and meets heavy rains."},{"y":612,"approx":false,"t":"General Eulji Mundeok wins a great victory over a huge Sui army at the Salsu River."},{"y":614,"approx":false,"t":"After a failed attack in 613, a further Sui campaign in 614 is also repelled."},{"y":618,"approx":false,"t":"King Yeongnyu succeeds Yeongyang, reigning until 642."},{"y":628,"approx":true,"t":"Goguryeo builds a defensive wall some 480 km long to deter further Chinese invasions."}],"link":null,"evidence":"moderate","sources":[{"title":"Goguryeo","publisher":"World History Encyclopedia","url":"https://www.worldhistory.org/Goguryeo/"},{"title":"Sui Dynasty","publisher":"World History Encyclopedia","url":"https://www.worldhistory.org/Sui_Dynasty/"},{"title":"List of Rulers of Korea (Heilbrunn Timeline of Art History)","publisher":"The Metropolitan Museum of Art","url":"https://www.metmuseum.org/toah/hd/koru/hd_koru.htm"}]},"South Korea":{"polity":"Silla (southeast) and Baekje (southwest), two of Korea's Three Kingdoms","summary":"The south was divided between Silla, ruled from Geumseong (Gyeongju), which had absorbed the Gaya confederation by 562, and Baekje in the southwest, ruled from Sabi (Buyeo) since 538. They had been enemies since Silla seized the lower Han River valley in the 550s. Both had made Buddhism a state religion; Baekje exported much of its culture to Japan. Jinpyeong of Silla (r. 579–632) was succeeded by his daughter Seondeok.","events":[{"y":579,"approx":false,"t":"King Jinpyeong begins a long reign in Silla."},{"y":600,"approx":false,"t":"King Mu takes the throne of Baekje, reigning until 641."},{"y":632,"approx":false,"t":"Seondeok succeeds her father Jinpyeong, becoming the first female sovereign in ancient Korea."}],"link":null,"evidence":"moderate","sources":[{"title":"Silla","publisher":"World History Encyclopedia","url":"https://www.worldhistory.org/Silla/"},{"title":"Baekje","publisher":"World History Encyclopedia","url":"https://www.worldhistory.org/Baekje/"},{"title":"List of Rulers of Korea (Heilbrunn Timeline of Art History)","publisher":"The Metropolitan Museum of Art","url":"https://www.metmuseum.org/toah/hd/koru/hd_koru.htm"}]},"Myanmar":{"polity":"Pyu city-kingdoms (Sri Ksetra, Halin, Beikthano and others)","summary":"The Pyu, speakers of Tibeto-Burman languages, held city-kingdoms in the Irrawaddy valley from about the 1st century BCE to the 9th century CE. Their brick-walled, moated cities, such as Sri Ksetra, Halin and Beikthano, stood in irrigated land in the dry zone, with monumental Buddhist stupas. Buddhism and other Indian influences were strong, and a trade route linked them to China and India. Evidence is mainly archaeological.","events":[{"y":600,"approx":true,"t":"Pyu walled cities such as Sri Ksetra, Halin and Beikthano are in use, with Buddhist stupas and irrigated farmland."}],"link":null,"evidence":"sparse","sources":[{"title":"Pyu Ancient Cities","publisher":"UNESCO World Heritage Centre","url":"https://whc.unesco.org/en/list/1444/"},{"title":"Myanmar: The Pyu state","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/place/Myanmar/The-Pyu-state"},{"title":"Pyu","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/topic/Pyu"}]},"Thailand":{"polity":"Dvaravati (Mon kingdom) in the lower Chao Phraya valley; other local communities","summary":"Central Thailand saw the rise of Dvaravati, the first Mon kingdom in what is now Thailand. Centred in the lower Chao Phraya River valley, it emerged as an independent state late in the 6th century and spread Indian cultural influence. It was rarely politically dominant and lived in the shadow of stronger neighbours. Evidence for this period is limited.","events":[{"y":590,"approx":true,"t":"Dvaravati emerges as an independent Mon kingdom in the lower Chao Phraya valley, late in the 6th century."}],"link":null,"evidence":"sparse","sources":[{"title":"Dvaravati","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/place/Dvaravati"}]},"Laos":{"polity":"Early Khmer polities in the Champasak region of the south","summary":"Southern Laos, on the Champasak plain beside the Mekong, lay within the early Khmer world; Wat Phu was one of the important Khmer centres of the 7th century. UNESCO dates the planned riverside city of Shrestrapura there to the 5th–7th centuries, and the origins of the Vat Phou temple complex to the 7th century.","events":[{"y":600,"approx":true,"t":"Shrestrapura, a planned city on the Mekong near Vat Phou (5th–7th centuries), is an early Khmer centre."}],"link":null,"evidence":"sparse","sources":[{"title":"Khmer Empire","publisher":"World History Encyclopedia","url":"https://www.worldhistory.org/Khmer_Empire/"},{"title":"Vat Phou and Associated Ancient Settlements within the Champasak Cultural Landscape","publisher":"UNESCO World Heritage Centre","url":"https://whc.unesco.org/en/list/481/"}]},"Cambodia":{"polity":"Chenla, an early Khmer kingdom (capital Ishanapura)","summary":"By the 7th century Khmer people lived along the Mekong, divided among warring kingdoms whose art and culture were strongly influenced by India. Sambor Prei Kuk, identified as Ishanapura, was the capital of Chenla, which flourished in the late 6th and early 7th centuries. Its brick temples, Sanskrit and Old Khmer inscriptions and sculpture laid foundations for later Khmer art.","events":[{"y":600,"approx":true,"t":"Ishanapura (Sambor Prei Kuk), capital of Chenla, flourishes in the late 6th and early 7th centuries."}],"link":null,"evidence":"moderate","sources":[{"title":"Khmer Empire","publisher":"World History Encyclopedia","url":"https://www.worldhistory.org/Khmer_Empire/"},{"title":"Temple Zone of Sambor Prei Kuk, Archaeological Site of Ancient Ishanapura","publisher":"UNESCO World Heritage Centre","url":"https://whc.unesco.org/en/list/1532/"}]},"Vietnam":{"polity":"Annam region in the north; Champa kingdom; Khmer lands in the Mekong delta","summary":"In the early 7th century Sui armies campaigned in the region, taking territory from Annam and from the kingdom of Champa; they defeated war elephants with crossbows, but many northern soldiers died of malaria. The Mekong delta in the far south lay within the Khmer world.","events":[{"y":605,"approx":true,"t":"Sui armies take territory from Annam and Champa, routing war elephants with crossbows (early 7th century; exact dates vary)."}],"link":null,"evidence":"moderate","sources":[{"title":"Sui Dynasty","publisher":"World History Encyclopedia","url":"https://www.worldhistory.org/Sui_Dynasty/"},{"title":"Khmer Empire","publisher":"World History Encyclopedia","url":"https://www.worldhistory.org/Khmer_Empire/"}]},"Malaysia":{"polity":"Small Indianised Malay kingdoms (notably Langkasuka); Iron Age communities in Sarawak and Sabah","summary":"The Malay Peninsula held perhaps 30 small Indianised states during the 1st millennium CE, known mainly from Chinese sources; the most important, Langkasuka, controlled much of the north. Hinduism and Mahayana Buddhism shaped court culture, and major temple ruins survive around Kedah Peak. Sarawak had entered the Iron Age by about 600 and traded with China. Srivijaya's loose control of the region came later, from the 7th century.","events":[{"y":600,"approx":true,"t":"Sarawak has entered the Iron Age; sites in the Sarawak River delta show ironworking and trade with China and mainland Southeast Asia."}],"link":null,"evidence":"sparse","sources":[{"title":"History of Malaysia (Scholars)","publisher":"Britannica Kids / Encyclopaedia Britannica","url":"https://kids.britannica.com/scholars/article/history-of-Malaysia/638472"}]},"Brunei":{"polity":"Austronesian coastal communities trading with China","summary":"The early history of Brunei is obscure. Encyclopaedia Britannica states that it was already trading with and paying tribute to China in the 6th century CE. Little else is known for this period, and there is little archaeological evidence.","events":[{"y":570,"approx":true,"t":"Brunei is recorded as trading with and paying tribute to China in the 6th century."}],"link":null,"evidence":"sparse","sources":[{"title":"Brunei: History","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/place/Brunei/History"}]},"Indonesia":{"polity":"Small Indianised Hindu-Buddhist kingdoms on Java and Sumatra; many local communities","summary":"Hindu-Buddhist kingdoms based on Indian ideas of the state had arisen in Sumatra and, somewhat later, Java. Tarumanegara, established about the 5th century, is the oldest recorded kingdom of west Java. Srivijaya, the great Sumatran maritime power based at Palembang, flourished from the 7th century; it is first recorded when the Chinese pilgrim I-ching visited in 671, after this period. Evidence for these decades is thin.","events":[{"y":600,"approx":true,"t":"Small Indianised kingdoms on Java and Sumatra trade by sea; Srivijaya will rise at Palembang later in the 7th century."}],"link":null,"evidence":"sparse","sources":[{"title":"Tarumanegara","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/place/Tarumanegara"},{"title":"Srivijaya empire","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/place/Srivijaya-empire"},{"title":"Indonesia: The Malay kingdom of Srivijaya-Palembang","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/place/Indonesia/The-Malay-kingdom-of-Srivijaya-Palembang"}]},"Philippines":{"polity":"Independent Austronesian communities without central government","summary":"The islands were home to diverse peoples with little contact with each other and no centralised government. Later accounts suggest lowland people lived in kin groups called barangays, each led by a datu. In northern Luzon, rice terraces had been built about 2,000 years earlier. Chinese and Indian influence was slight; the first recorded contact with Chinese traders dates to 982. No written records survive from this period.","events":[{"y":600,"approx":true,"t":"Island communities live by farming, hunting and fishing; no written records or dated events survive."}],"link":null,"evidence":"sparse","sources":[{"title":"History of the Philippines (Scholars)","publisher":"Britannica Kids / Encyclopaedia Britannica","url":"https://kids.britannica.com/scholars/article/history-of-the-Philippines/638781"},{"title":"Barangay","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/topic/barangay"}]},"Timor-Leste":{"polity":"Independent Papuan- and Austronesian-speaking communities","summary":"Timor had been inhabited for more than 42,000 years. Its early settlers are linked with non-Austronesian (Papuan) languages, while Austronesian speakers arrived in eastern Indonesia and Timor about 4,000 years ago. Its people today are of Papuan, Malay and Polynesian origin. There was no state and no written record, and no dated events are known for this period.","events":[{"y":600,"approx":true,"t":"Village communities continue; no dated events are recorded."}],"link":null,"evidence":"sparse","sources":[{"title":"Human settlement history between Sunda and Sahul: a focus on East Timor (Timor-Leste) and the Pleistocenic mtDNA diversity","publisher":"BMC Genomics (2015)","url":"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC4342813/"},{"title":"East Timor (Students)","publisher":"Britannica Kids / Encyclopaedia Britannica","url":"https://kids.britannica.com/students/article/East-Timor/384947"}]},"Papua New Guinea":{"polity":"Independent Papuan- and Austronesian-speaking communities","summary":"New Guinea's highlands had been farmed for thousands of years: at Kuk swamp, wetlands were drained with ditches dug with wooden tools, and bananas, taro and yams were grown. Papuan-speaking groups were the older population. Austronesian languages were spoken mainly on coasts and in the Bismarck Archipelago, where Lapita people had settled by 2000 BCE. No written records exist.","events":[{"y":600,"approx":true,"t":"Highland farming and coastal communities continue; evidence is archaeological only."}],"link":null,"evidence":"sparse","sources":[{"title":"Kuk Early Agricultural Site","publisher":"UNESCO World Heritage Centre","url":"https://whc.unesco.org/en/list/887"},{"title":"Lapita culture","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/topic/Lapita-culture"},{"title":"Austronesian languages (Scholars)","publisher":"Britannica Kids / Encyclopaedia Britannica","url":"https://kids.britannica.com/scholars/article/Austronesian-languages/109806"}]},"Australia":{"polity":"Aboriginal and Torres Strait Islander peoples (many distinct nations)","summary":"Australia was home to many distinct Aboriginal and Torres Strait Islander groups, each with its own culture, language, beliefs and practices. Current research suggests they had lived on the continent for upwards of 60,000 years. Torres Strait Islanders lived on the islands between Cape York and New Guinea. No specific events can be dated for this period.","events":[{"y":600,"approx":true,"t":"Aboriginal and Torres Strait Islander societies continue long-established ways of life; no specific dated events."}],"link":null,"evidence":"sparse","sources":[{"title":"First Peoples of Australia","publisher":"Australian Institute of Aboriginal and Torres Strait Islander Studies (AIATSIS)","url":"https://aiatsis.gov.au/explore/first-peoples-australia"}]},"New Zealand":{"polity":"Uninhabited","summary":"No humans lived in New Zealand in this period. Most evidence indicates that the first settlers, Polynesians from East Polynesia, arrived by canoe around 1250–1300. Rat bones once dated to about 50–150 CE suggested an earlier visit, but most scientists now think those dates are inaccurate.","events":[{"y":600,"approx":true,"t":"The islands remain uninhabited; Polynesian settlement comes around 1250–1300."}],"link":null,"evidence":"sparse","sources":[{"title":"When was New Zealand first settled?","publisher":"Te Ara – the Encyclopedia of New Zealand","url":"https://teara.govt.nz/en/when-was-new-zealand-first-settled"}]},"Fiji":{"polity":"Independent island communities","summary":"Fiji's first settlers arrived from other Pacific islands at least 3,500 years ago; Lapita people had spread into West Polynesia from about 1000 BCE. Their descendants lived in island communities with no written records, and the period is known only through archaeology.","events":[{"y":600,"approx":true,"t":"Island communities continue; no dated events are known."}],"link":null,"evidence":"sparse","sources":[{"title":"Fiji (Kids)","publisher":"Britannica Kids / Encyclopaedia Britannica","url":"https://kids.britannica.com/kids/article/Fiji/345688"},{"title":"When was New Zealand first settled?","publisher":"Te Ara – the Encyclopedia of New Zealand","url":"https://teara.govt.nz/en/when-was-new-zealand-first-settled"}]},"Vanuatu":{"polity":"Independent island communities","summary":"Archaeological evidence shows that by 1300 BCE islands in northern Vanuatu had been settled by people of the Lapita culture from Melanesian islands to the west, followed by successive waves of migrants. A highly stratified society developed in central Vanuatu only around 1200. There are no written records for this period.","events":[{"y":600,"approx":true,"t":"Island communities continue; no specific dated events are known."}],"link":null,"evidence":"sparse","sources":[{"title":"Vanuatu: History","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/place/Vanuatu/History"}]},"Solomon Is.":{"polity":"Independent Papuan- and Austronesian-speaking island communities","summary":"People had lived in the Solomon Islands for thousands of years. Papuan (non-Austronesian) languages are spoken as far east as the Solomons, and Lapita people began spreading to the islands from about 1600 BCE. Communities farmed and fished in small villages. No written records exist for this period.","events":[{"y":600,"approx":true,"t":"Island communities continue; evidence is archaeological only."}],"link":null,"evidence":"sparse","sources":[{"title":"Lapita culture","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/topic/Lapita-culture"},{"title":"Solomon Islands (Kids)","publisher":"Britannica Kids / Encyclopaedia Britannica","url":"https://kids.britannica.com/kids/article/Solomon-Islands/345785"},{"title":"Human settlement history between Sunda and Sahul: a focus on East Timor (Timor-Leste) and the Pleistocenic mtDNA diversity","publisher":"BMC Genomics (2015)","url":"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC4342813/"}]},"New Caledonia":{"polity":"Independent Melanesian communities (ancestors of the Kanak)","summary":"New Caledonia had long been settled by Melanesians (Britannica gives about 3000 BCE). The Lapita pottery culture takes its name from a site here. Apart from rare Polynesian voyagers, the islanders were probably cut off from outside contact until the late 18th century. There are no written records, and the period is known only through archaeology.","events":[{"y":600,"approx":true,"t":"Melanesian communities continue; no dated events are known."}],"link":null,"evidence":"sparse","sources":[{"title":"History of New Caledonia","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/place/New-Caledonia-French-unique-collectivity-Pacific-Ocean/History"},{"title":"Lapita culture","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/topic/Lapita-culture"}]},"Antarctica":{"polity":"No human presence","summary":"Antarctica had no native population and no recorded human visits before the 19th century. Rarotongan oral tradition tells of Ui-te-Rangiora sailing south to a frozen region around 650, but the continent itself was first sighted in 1820, by Russian, British or American sailors.","events":[],"link":null,"evidence":"sparse","sources":[{"title":"Antarctica","publisher":"EBSCO Research Starters","url":"https://www.ebsco.com/research-starters/geography-and-cartography/antarctica"},{"title":"Antarctica: History","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/place/Antarctica/History"},{"title":"Edward Bransfield","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/biography/Edward-Bransfield"}]},"Fr. S. Antarctic Lands":{"polity":"No human presence","summary":"The Kerguelen and Crozet islands in the southern Indian Ocean had no human inhabitants. They were unknown until French navigators discovered them in 1772: Kerguelen-Trémarec found the Kerguelen Islands and Marion-Dufresne found the Crozet Islands.","events":[{"y":600,"approx":true,"t":"No humans live on the islands."}],"link":null,"evidence":"sparse","sources":[{"title":"Kerguelen Islands","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/place/Kerguelen-Islands"},{"title":"Crozet Islands","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/place/Crozet-Islands"}]},"Albania":{"polity":"Eastern Roman (Byzantine) Empire","summary":"Part of the Byzantine Empire, with Dyrrachium (Durrës), long the chief port of Roman Illyricum. The Avars took Sirmium in 582, and Slavs pushed into the Balkans; between the 6th and 8th centuries they settled and assimilated Illyrian tribes farther north, but the tribes of southern Illyria, including modern Albania, kept their own language. The large Komani cemetery (6th–8th centuries) attests a continuing local population.","events":[{"y":582,"approx":false,"t":"The Avars capture Sirmium, a Balkan fortress; Slavs who besiege Sirmium and Singidunum in the 580s then push deep into the Balkans."},{"y":600,"approx":true,"t":"The large Komani cemetery in the north (6th–8th centuries) shows a local population persisting through the period."},{"y":602,"approx":false,"t":"A mutiny topples Emperor Maurice; afterwards the Byzantine Danube frontier crumbles and is not restored for centuries."}],"link":null,"evidence":"sparse","sources":[{"title":"History of Albania","publisher":"Encyclopaedia Britannica (Britannica Scholars)","url":"https://kids.britannica.com/scholars/article/history-of-Albania/637979"},{"title":"Durrës","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/place/Durres"},{"title":"Byzantine Empire","publisher":"Encyclopaedia Britannica (Britannica Scholars)","url":"https://kids.britannica.com/scholars/article/Byzantine-Empire/106111"},{"title":"History of Europe","publisher":"Encyclopaedia Britannica (Britannica Scholars)","url":"https://kids.britannica.com/scholars/article/history-of-Europe/106072"},{"title":"Early Medieval North Albania: New Discoveries, Remodeling Connections. The Case of Medieval Komani","publisher":"Edizioni Ca' Foscari (Ca' Foscari University of Venice)","url":"https://edizionicafoscari.unive.it/en/edizioni4/libri/978-88-6969-114-0/early-medieval-north-albania-new-discoveries-remod/"}]},"Belarus":{"polity":"Baltic-speaking peoples, with Slavs pushing in (no state)","summary":"Archaeology shows the Bancer-Tushemlya culture (6th–8th centuries) on the upper Dnieper, upper Neman and Daugava, which most researchers attribute to Baltic tribes. People farmed and kept livestock, lived in open settlements, used hillforts as refuges, built small round sanctuaries, and cremated their dead, burying the remains under mounds. The culture declined under intensive Slavic expansion northward.","events":[{"y":600,"approx":true,"t":"Bancer-Tushemlya culture (6th–8th centuries): open settlements, refuge hillforts, farming and stock-raising, and cremation burials under mounds."}],"link":null,"evidence":"sparse","sources":[{"title":"Bancerovo-Tušemlios kultūra","publisher":"Visuotinė lietuvių enciklopedija (Universal Lithuanian Encyclopedia)","url":"https://www.vle.lt/straipsnis/bancerovo-tusemlios-kultura/"}]},"Bosnia and Herz.":{"polity":"Former Roman province of Dalmatia; Avar pressure and Slav settlement","summary":"Most of this land had belonged to the Roman province of Dalmatia, home to Illyrian tribes. After the Avars took Sirmium in 582, Slavs pressed into the Balkans; between the 6th and 8th centuries they settled here and assimilated the Illyrian population. Under Heraclius, Serb groups, earlier Avar vassals, settled inland of the Dalmatian coast, including eastern Herzegovina.","events":[{"y":582,"approx":false,"t":"The Avars capture Sirmium; Slavs then infiltrate the western Balkans."},{"y":630,"approx":true,"t":"Serb groups, clients of Heraclius, settle inland of the Dalmatian coast, including eastern Herzegovina (date approximate)."}],"link":null,"evidence":"sparse","sources":[{"title":"Bosnia and Herzegovina: History","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/place/Bosnia-and-Herzegovina/History"},{"title":"History of Albania","publisher":"Encyclopaedia Britannica (Britannica Scholars)","url":"https://kids.britannica.com/scholars/article/history-of-Albania/637979"},{"title":"History of Serbia","publisher":"Encyclopaedia Britannica (Britannica Scholars)","url":"https://kids.britannica.com/scholars/article/history-of-Serbia/638027"},{"title":"Byzantine Empire","publisher":"Encyclopaedia Britannica (Britannica Scholars)","url":"https://kids.britannica.com/scholars/article/Byzantine-Empire/106111"},{"title":"History of Europe","publisher":"Encyclopaedia Britannica (Britannica Scholars)","url":"https://kids.britannica.com/scholars/article/history-of-Europe/106072"}]},"Bulgaria":{"polity":"Eastern Roman Empire (Thrace and the lower Danube), under Avar and Slav pressure","summary":"This was Roman Thrace and the lower Danube frontier, close to Constantinople. Slavs who had besieged Sirmium and Singidunum in the 580s pushed into the Balkans, and by the end of the century much of present-day Bulgaria was Slavicized. Emperor Maurice campaigned constantly and forced the Avars back across the Danube by 602, but his order for troops to winter beyond the river provoked the mutiny that made Phocas emperor. Afterwards the frontier crumbled.","events":[{"y":585,"approx":true,"t":"After the Avar and Slav sieges of Sirmium and Singidunum in the 580s, Slavs push deep into the Balkans."},{"y":595,"approx":true,"t":"Maurice's armies campaign repeatedly in the Balkans, forcing the Avars back across the Danube by 602."},{"y":602,"approx":false,"t":"The Danube army mutinies over wintering north of the river; Phocas marches on Constantinople and Maurice is killed."},{"y":626,"approx":false,"t":"The Avars and their Slav allies, coordinating with a Persian army, besiege Constantinople and fail."}],"link":null,"evidence":"moderate","sources":[{"title":"Byzantine Empire","publisher":"Encyclopaedia Britannica (Britannica Scholars)","url":"https://kids.britannica.com/scholars/article/Byzantine-Empire/106111"},{"title":"History of Europe","publisher":"Encyclopaedia Britannica (Britannica Scholars)","url":"https://kids.britannica.com/scholars/article/history-of-Europe/106072"},{"title":"Antes","publisher":"Internet Encyclopedia of Ukraine (Canadian Institute of Ukrainian Studies)","url":"https://www.encyclopediaofukraine.com/display.asp?linkpath=pages\\A\\N\\Antes.htm"},{"title":"Ḵosrow II","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/khosrow-ii/"}]},"Croatia":{"polity":"Roman province of Dalmatia, collapsing before Avars and Slavs","summary":"Roman Dalmatia had its chief city at Salonae, near Split. Avar and Slav pressure on the Balkans grew from the late 500s, and between the 6th and 8th centuries Slavs settled here and assimilated the older Illyrian population. After the Avars sacked the town in 615, its people built a new town inside Diocletian's palace at Split. Heraclius later allowed Croats who accepted Christianity to settle in the northwest Balkans.","events":[{"y":615,"approx":true,"t":"The Avars sack Salonae; refugees build a new town inside Diocletian's palace at Split (c. 615)."},{"y":630,"approx":true,"t":"Croats settle in the northwest Balkans with the permission of Heraclius, once they accept Christianity (date approximate)."}],"link":null,"evidence":"moderate","sources":[{"title":"Split (Croatia) summary","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/summary/Split-Croatia"},{"title":"Byzantine Empire","publisher":"Encyclopaedia Britannica (Britannica Scholars)","url":"https://kids.britannica.com/scholars/article/Byzantine-Empire/106111"},{"title":"History of Albania","publisher":"Encyclopaedia Britannica (Britannica Scholars)","url":"https://kids.britannica.com/scholars/article/history-of-Albania/637979"},{"title":"Bosnia and Herzegovina: History","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/place/Bosnia-and-Herzegovina/History"}]},"Czechia":{"polity":"Slavic tribes; probably part of Samo's realm (c. 623–658)","summary":"From the 6th century an early Slavic culture marked by Prague-type pottery spread across this region; ancient DNA from neighbouring Moravia shows a strong population shift between the 5th and 7th centuries. Many Slavs lived under Avar domination. In 623 or 624 a Frankish merchant named Samo was chosen king by Slavs (Wends) who rebelled against the Avars; he ruled until 658, and his realm included at least part of Bohemia. The main source is the Chronicle of Fredegar.","events":[{"y":600,"approx":true,"t":"An early Slavic culture marked by Prague-type pottery spreads across the region (6th–early 7th century)."},{"y":623,"approx":true,"t":"Samo is chosen king by the Slavs after their revolt against the Avars (623 or 624)."},{"y":631,"approx":true,"t":"Samo's Slavs defeat the army of the Frankish king Dagobert I at Wogastisburg (date as given by Fredegar)."}],"link":null,"evidence":"moderate","sources":[{"title":"Samo","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/biography/Samo-Frankish-merchant"},{"title":"Samo","publisher":"World History Encyclopedia","url":"https://www.worldhistory.org/Samo/"},{"title":"Ancient genomes provide evidence of demographic shift to Slavic-associated groups in Moravia","publisher":"Peer-reviewed article (PubMed Central)","url":"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC12409924/"}]},"Greece":{"polity":"Eastern Roman (Byzantine) Empire, with Slav settlement inland","summary":"Greece was Greek-speaking, Christian Roman territory ruled from Constantinople. From the late 6th century many Slavs entered it, and together with the Avar wars they disrupted the economy: building of churches and secular works almost ceased, and newcomers reached deep into the Peloponnese. Inland, Slavic chieftaincies (sklaviniai) dominated many districts, while fortified cities with sea access, such as Thessalonica and Corinth, stayed in imperial hands.","events":[{"y":586,"approx":false,"t":"Avars and Slavs besiege Thessalonica; a local miracle collection credits Saint Demetrius with saving the city."},{"y":610,"approx":false,"t":"Heraclius overthrows Phocas and becomes emperor."},{"y":620,"approx":true,"t":"Slav tribes attack Thessalonica (c. 620), and in 622 the Avars besiege it, according to the Miracles of Saint Demetrius."},{"y":620,"approx":true,"t":"Newcomers settle deep in the Peloponnese; the later, controversial Chronicle of Monemvasia describes Greek flight (dates disputed)."}],"link":null,"evidence":"moderate","sources":[{"title":"Greece","publisher":"Encyclopaedia Britannica (Britannica Scholars)","url":"https://kids.britannica.com/scholars/article/Greece/106266"},{"title":"The festival of Saint Demetrios, the Timarion, and the Aithiopika","publisher":"Byzantine and Modern Greek Studies (Cambridge University Press)","url":"https://www.cambridge.org/core/journals/byzantine-and-modern-greek-studies/article/abs/festival-of-saint-demetrios-the-timarion-and-the-aithiopika/FA9627E1318C114553DDCB0BE7BE419B"},{"title":"Chronicle of Monemvasia, in A Guide to Byzantine Historical Writing","publisher":"Cambridge University Press","url":"https://www.cambridge.org/core/books/abs/guide-to-byzantine-historical-writing/chronicle-of-monemvasia/05A19DE94B1B38F98EC673EA242079E6"},{"title":"Ḵosrow II","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/khosrow-ii/"},{"title":"Byzantine Empire","publisher":"Encyclopaedia Britannica (Britannica Scholars)","url":"https://kids.britannica.com/scholars/article/Byzantine-Empire/106111"}]},"Hungary":{"polity":"Avar Khaganate (heartland in the Carpathian Basin)","summary":"From 567–568 the Hungarian plain was the centre of the Avar Khaganate, a steppe power whose ruling elite was largely of East-Central Asian origin and which dominated Slavic peoples. The Avars took Sirmium in 582 and, between periods of Byzantine subsidies and tribute, pressed the Balkans until their failed siege of Constantinople in 626, after which their power waned. Rich 7th-century elite graves of the Kunbábony group reflect their wealth.","events":[{"y":582,"approx":false,"t":"The Avars capture the Balkan fortress of Sirmium."},{"y":604,"approx":true,"t":"Phocas concludes a peace with the Avars, freeing troops for the Persian war."},{"y":623,"approx":false,"t":"Heraclius secures peace with the Avars by promising massive tribute payments."},{"y":626,"approx":false,"t":"An Avar host besieges Constantinople with Slav allies, coordinated with a Persian army; the assault fails."}],"link":null,"evidence":"moderate","sources":[{"title":"Avar","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/topic/Avar"},{"title":"Byzantine Empire","publisher":"Encyclopaedia Britannica (Britannica Scholars)","url":"https://kids.britannica.com/scholars/article/Byzantine-Empire/106111"},{"title":"History of Europe","publisher":"Encyclopaedia Britannica (Britannica Scholars)","url":"https://kids.britannica.com/scholars/article/history-of-Europe/106072"},{"title":"Ḵosrow II","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/khosrow-ii/"},{"title":"Genetic insights into the social organisation of the Avar period elite in the 7th century AD Carpathian Basin","publisher":"Scientific Reports (PubMed Central)","url":"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC6976699/"}]},"Kosovo":{"polity":"Eastern Roman Empire (Dardania), giving way to Slav settlement","summary":"This was part of the Roman province of Dardania, whose city of Ulpiana Justinian, a native of the region, rebuilt as Justiniana Secunda. Avar and Slav pressure on the Balkans grew from the 580s, and after 602 the Danube frontier crumbled. Archaeologists now question the old view that Avar and Slav attacks quickly emptied Ulpiana. Slavs settled widely in the central Balkans during the 7th century.","events":[{"y":585,"approx":true,"t":"After Avar and Slav sieges on the Danube in the 580s, Slavs push deep into the central Balkans."},{"y":602,"approx":false,"t":"Mutiny on the Danube topples Maurice; afterwards the Balkan frontier crumbles."}],"link":null,"evidence":"sparse","sources":[{"title":"Mosaic Inscription Connects Justinian to Ancient City in Kosovo","publisher":"Archaeology (Archaeological Institute of America)","url":"https://archaeology.org/news/2025/08/08/mosaic-inscription-connects-justinian-to-ancient-city-in-kosovo/"},{"title":"Ulpiana / Iustiniana secunda","publisher":"ChronoCarto, École normale supérieure","url":"https://www.chronocarto.ens.fr/wpchrono/?p=1363"},{"title":"Byzantine Empire","publisher":"Encyclopaedia Britannica (Britannica Scholars)","url":"https://kids.britannica.com/scholars/article/Byzantine-Empire/106111"},{"title":"History of Europe","publisher":"Encyclopaedia Britannica (Britannica Scholars)","url":"https://kids.britannica.com/scholars/article/history-of-Europe/106072"},{"title":"History of Serbia","publisher":"Encyclopaedia Britannica (Britannica Scholars)","url":"https://kids.britannica.com/scholars/article/history-of-Serbia/638027"}]},"Macedonia":{"polity":"Eastern Roman Empire, with growing Slav settlement","summary":"This upper Vardar region lay in the Roman provinces of Macedonia. Stobi, an episcopal seat and capital of Macedonia Secunda, was abandoned in the last decade of the 6th century. Avar and Slav raids hit the Balkans from the 580s, and many Slavs settled here; those of Macedonia kept their Slavic speech. The empire held Thessalonica to the south.","events":[{"y":586,"approx":false,"t":"Avars and Slavs besiege Thessalonica, the great city to the south."},{"y":595,"approx":true,"t":"Stobi is abandoned during the last decade of the 6th century."}],"link":null,"evidence":"sparse","sources":[{"title":"Taking care of an archaeological site (Stobi)","publisher":"Istorijski zapisi (journal)","url":"https://istorijskizapisi.me/wp-content/uploads/2021/01/Nikolovski-Taking-care-of-an-archaeological-site.pdf"},{"title":"Greece","publisher":"Encyclopaedia Britannica (Britannica Scholars)","url":"https://kids.britannica.com/scholars/article/Greece/106266"},{"title":"The festival of Saint Demetrios, the Timarion, and the Aithiopika","publisher":"Byzantine and Modern Greek Studies (Cambridge University Press)","url":"https://www.cambridge.org/core/journals/byzantine-and-modern-greek-studies/article/abs/festival-of-saint-demetrios-the-timarion-and-the-aithiopika/FA9627E1318C114553DDCB0BE7BE419B"},{"title":"History of Europe","publisher":"Encyclopaedia Britannica (Britannica Scholars)","url":"https://kids.britannica.com/scholars/article/history-of-Europe/106072"}]},"Moldova":{"polity":"Slavic communities within the range of the Antes, under Avar pressure","summary":"Slavs arrived in this land between the Prut and Dniester in the 6th century, though invasions disrupted their settlement. The Antes, an eastern Slavic tribal alliance centred between the Dnieper and Dniester, at times extended across the forest-steppe to the lower Danube. The Avars passed through Antes lands about 560, and from the late 500s the Antes fought them stubbornly.","events":[{"y":600,"approx":true,"t":"Wars with the Avars break up the Antes alliance; Byzantine writers stop mentioning the Antes in the early 7th century."}],"link":null,"evidence":"sparse","sources":[{"title":"Bessarabia","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/place/Bessarabia"},{"title":"Antes","publisher":"Internet Encyclopedia of Ukraine (Canadian Institute of Ukrainian Studies)","url":"https://www.encyclopediaofukraine.com/display.asp?linkpath=pages\\A\\N\\Antes.htm"},{"title":"Antae","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/topic/Antae"}]},"Montenegro":{"polity":"Former Roman Illyricum, giving way to Slav settlement","summary":"Before the Slavs arrived in the 6th and 7th centuries, the area was inhabited mainly by Illyrians, whom modern Albanians claim as ancestors, and Rome had ruled Illyria for some six centuries. Between the 6th and 8th centuries Slavs settled widely and assimilated Illyrian tribes. Under Heraclius, Serb groups settled inland of the Dalmatian coast, across northern Montenegro.","events":[{"y":630,"approx":true,"t":"Serb groups, clients of Heraclius, settle inland of the Dalmatian coast, including northern Montenegro (date approximate)."}],"link":null,"evidence":"sparse","sources":[{"title":"Montenegro: History","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/place/Montenegro/History"},{"title":"History of Serbia","publisher":"Encyclopaedia Britannica (Britannica Scholars)","url":"https://kids.britannica.com/scholars/article/history-of-Serbia/638027"},{"title":"History of Albania","publisher":"Encyclopaedia Britannica (Britannica Scholars)","url":"https://kids.britannica.com/scholars/article/history-of-Albania/637979"}]},"Poland":{"polity":"Slavic and other tribal communities (no state)","summary":"When Slavs reached this region is debated: one view holds that they arrived no earlier than the 6th century, another that they lived here since the Iron Age. After the Migration Period, material cultures across the region became more homogeneous, and archaeologists link them with the Slavs. These people cremated their dead, which makes their origins hard to test with ancient DNA.","events":[{"y":600,"approx":true,"t":"Material cultures across the region grow more homogeneous, a change archaeologists link to Slavs (date of their arrival debated)."}],"link":null,"evidence":"sparse","sources":[{"title":"Genetic history of East-Central Europe in the first millennium CE","publisher":"Peer-reviewed article (PubMed Central)","url":"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC10364380/"},{"title":"Ancient genomes provide evidence of demographic shift to Slavic-associated groups in Moravia","publisher":"Peer-reviewed article (PubMed Central)","url":"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC12409924/"}]},"Romania":{"polity":"Slavs and Avars north of the Danube; Byzantine frontier on the river","summary":"North of the lower Danube lived Slavic groups, many subject to the Avars, who raided and then settled south of the river. Emperor Maurice campaigned constantly in the Balkans and forced the Avars back across the Danube by 602, but that year his order for soldiers to winter in enemy lands beyond the river caused a mutiny that toppled him. After 602 the Danube frontier crumbled.","events":[{"y":595,"approx":true,"t":"Maurice's armies campaign along and across the Danube against Avars and Slavs."},{"y":602,"approx":false,"t":"Maurice orders the army to winter north of the Danube, triggering the mutiny that topples him."}],"link":null,"evidence":"moderate","sources":[{"title":"Byzantine Empire","publisher":"Encyclopaedia Britannica (Britannica Scholars)","url":"https://kids.britannica.com/scholars/article/Byzantine-Empire/106111"},{"title":"Ḵosrow II","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/khosrow-ii/"},{"title":"Antes","publisher":"Internet Encyclopedia of Ukraine (Canadian Institute of Ukrainian Studies)","url":"https://www.encyclopediaofukraine.com/display.asp?linkpath=pages\\A\\N\\Antes.htm"}]},"Russia":{"polity":"Western Turkic power in the south, from which the Khazars later emerged; Kubrat's Bulgars (c. 635)","summary":"The southern steppe and north Caucasus lay under the Western Turks. Later texts call them Khazars, but the Khazars become distinguishable from their Western Turkic masters only by the 650s. In 627–628 Western Turkish forces allied with Heraclius stormed Darband and besieged Tiflis. As Western Turkish rule broke up, the Bulgar ruler Kubrat led a successful revolt about 635 and organized the confederation called Great Bulgaria.","events":[{"y":627,"approx":false,"t":"Western Turkish forces allied with Heraclius storm Darband and besiege Tiflis (627–628); later sources call them Khazars."},{"y":635,"approx":true,"t":"Kubrat leads a successful Bulgar revolt and organizes Great Bulgaria (date disputed)."}],"link":null,"evidence":"moderate","sources":[{"title":"Khazars","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/khazars/"},{"title":"Khagan","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/khagan/"},{"title":"Ḵosrow II","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/khosrow-ii/"},{"title":"Kurt (Kubrat), Bulgar khan","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/biography/Kurt"}]},"Serbia":{"polity":"Eastern Roman Empire (Danube frontier), contested by Avars and Slavs","summary":"This was the Danube frontier of the Roman Empire, with Singidunum and nearby Sirmium. Justiniana Prima (Caričin Grad), built by Justinian near his birthplace, was an archbishopric seat. Avar and Slav sieges in the 580s broke the frontier, which crumbled after 602. The Serbs, first recorded as vassals of the Avars, became clients of Heraclius and settled inland, into southeastern Serbia.","events":[{"y":582,"approx":false,"t":"Sirmium falls to the Avars."},{"y":584,"approx":true,"t":"Slavs successfully besiege Singidunum during the sieges of the 580s."},{"y":602,"approx":false,"t":"Mutiny on the Danube topples Maurice; afterwards the frontier crumbles."},{"y":615,"approx":true,"t":"Justiniana Prima (Caričin Grad) is abandoned under Heraclius amid Slavic invasions (date approximate)."}],"link":null,"evidence":"moderate","sources":[{"title":"Byzantine Empire","publisher":"Encyclopaedia Britannica (Britannica Scholars)","url":"https://kids.britannica.com/scholars/article/Byzantine-Empire/106111"},{"title":"History of Europe","publisher":"Encyclopaedia Britannica (Britannica Scholars)","url":"https://kids.britannica.com/scholars/article/history-of-Europe/106072"},{"title":"Caričin Grad – Iustiniana Prima, archaeological site (Tentative List)","publisher":"UNESCO World Heritage Centre","url":"https://whc.unesco.org/en/tentativelists/5539/"},{"title":"History of Serbia","publisher":"Encyclopaedia Britannica (Britannica Scholars)","url":"https://kids.britannica.com/scholars/article/history-of-Serbia/638027"}]},"Slovakia":{"polity":"Slavs under Avar rule; possibly part of Samo's realm (c. 623–658)","summary":"By the 6th century Slavs lived between the Avar Khaganate in the Carpathian Basin and the Frankish kingdom, many under Avar domination. In 623 or 624 Samo, a Frankish merchant, became king of Slavs (Wends) who had revolted against the Avars; Slovakia is among the proposed centres of his realm. Ancient DNA from neighbouring Moravia points to a population shift linked with Slavic expansion.","events":[{"y":623,"approx":true,"t":"Samo is chosen king by the Slavs after their revolt against the Avars (623 or 624)."},{"y":631,"approx":true,"t":"Samo defeats the army of the Frankish king Dagobert I at Wogastisburg (date as given by Fredegar)."}],"link":null,"evidence":"sparse","sources":[{"title":"Samo","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/biography/Samo-Frankish-merchant"},{"title":"Samo","publisher":"World History Encyclopedia","url":"https://www.worldhistory.org/Samo/"},{"title":"Ancient genomes provide evidence of demographic shift to Slavic-associated groups in Moravia","publisher":"Peer-reviewed article (PubMed Central)","url":"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC12409924/"}]},"Slovenia":{"polity":"Alpine Slavs under Avar overlordship","summary":"Slavs, ancestors of the Slovenes, settled here in the 500s and over the following centuries assimilated the older Illyrian population. The Slavs who pressed into the eastern Alps lived under Avar rulers and struggled with the Bavarians to the west. From about 623 a Slavic kingdom under Samo emerged that extended from the Sava valley northward.","events":[{"y":600,"approx":true,"t":"Slavs under Avar rulers spread into the eastern Alps, at their greatest extent reaching Carinthia, Styria and Lower Austria."},{"y":623,"approx":true,"t":"Samo's Slavic kingdom forms, reportedly extending from the Sava valley northward."}],"link":null,"evidence":"sparse","sources":[{"title":"Slovenia","publisher":"Encyclopaedia Britannica (Britannica Kids)","url":"https://kids.britannica.com/kids/article/Slovenia/345784"},{"title":"History of Albania","publisher":"Encyclopaedia Britannica (Britannica Scholars)","url":"https://kids.britannica.com/scholars/article/history-of-Albania/637979"},{"title":"Austria: Early Middle Ages","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/place/Austria/Early-Middle-Ages"},{"title":"Samo","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/biography/Samo-Frankish-merchant"}]},"Ukraine":{"polity":"Antes and other Slavs; Pontic steppe peoples; Kubrat's Bulgars (c. 635)","summary":"The Antes, an eastern Slavic tribal alliance between the Dnieper and Dniester, farmed with iron ploughs and were skilled potters and ironworkers. In the 6th century they joined Slavic raids on the Byzantine Balkans. The Avars passed through their lands about 560, and from the late 500s the Antes fought them stubbornly; the alliance broke up, and the Antes vanish from Byzantine writings in the early 7th century.","events":[{"y":600,"approx":true,"t":"Wars with the Avars break up the Antes alliance; Byzantine writers stop mentioning them in the early 7th century."},{"y":635,"approx":true,"t":"Kubrat leads a successful Bulgar revolt and organizes Great Bulgaria (date disputed)."}],"link":null,"evidence":"moderate","sources":[{"title":"Antes","publisher":"Internet Encyclopedia of Ukraine (Canadian Institute of Ukrainian Studies)","url":"https://www.encyclopediaofukraine.com/display.asp?linkpath=pages\\A\\N\\Antes.htm"},{"title":"Antae","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/topic/Antae"},{"title":"Kurt (Kubrat), Bulgar khan","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/biography/Kurt"}]},"Belgium":{"polity":"Merovingian Franks (Austrasia and Neustria)","summary":"The region lay in the Frankish lands: Austrasia, the eastern Frankish kingdom, covered present-day Belgium among other areas, while Neustria lay to the west. The Merovingian kingdoms fought one another until Chlothar II, king of Neustria, became sole ruler of the Franks in 613, and his son Dagobert I ruled the whole realm from 629.","events":[{"y":584,"approx":false,"t":"Chilperic I is assassinated; his infant son Chlothar II succeeds, protected by his mother Fredegund."},{"y":613,"approx":false,"t":"Chlothar II becomes sole ruler of the Franks."},{"y":629,"approx":false,"t":"Dagobert I becomes king of all the Franks."}],"link":null,"evidence":"moderate","sources":[{"title":"Austrasia","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/place/Austrasia"},{"title":"Chlotar II","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/biography/Chlotar-II"},{"title":"Chilperic I","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/biography/Chilperic-I"},{"title":"Dagobert I","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/biography/Dagobert-I"}]},"Denmark":{"polity":"Magnates and chieftains (Late Germanic Iron Age)","summary":"This is the Late Germanic Iron Age (c. 550–800). Magnates ran power centres that controlled religion, trade and crafts. Gudme on Funen, with a magnate's farm, nearly 50 smaller farms, gold hoards and a coastal trading place at Lundeborg, flourished from the 3rd to the 7th century. A rich Nordic animal-art style developed, and the first images of the Nordic gods appear.","events":[{"y":600,"approx":true,"t":"Gudme on Funen, a magnate's seat and cult centre with its trading place at Lundeborg, is in its final phase (3rd–7th centuries)."}],"link":null,"evidence":"sparse","sources":[{"title":"The Late Iron Age","publisher":"National Museum of Denmark","url":"https://en.natmus.dk/historical-knowledge/denmark/prehistoric-period-until-1050-ad/the-late-iron-age/"},{"title":"Gudme – gold, gods and people","publisher":"National Museum of Denmark","url":"https://en.natmus.dk/historical-knowledge/denmark/prehistoric-period-until-1050-ad/the-late-iron-age/gudme-gold-gods-and-people/"}]},"Finland":{"polity":"Permanently settled communities in the south and west; hunter-fishers in the north (no state)","summary":"Archaeologists call this the Merovingian period (c. 550–800). Permanent settlement was concentrated in southern and western Finland, including Ostrobothnia, while the far north had no permanent settlement and was used by hunting and fishing groups, called Lapps (Sámi) in older scholarship. In Ostrobothnia, finds are poorer than in the preceding Migration Period and western contacts declined. Evidence is almost entirely archaeological.","events":[{"y":600,"approx":true,"t":"Ostrobothnian finds become fewer and poorer than in the Migration Period, reflecting weaker contacts with central Sweden."}],"link":null,"evidence":"sparse","sources":[{"title":"Liisa Erä-Esko, \"On the Iron Age Settlement of Northern Finland\", Iskos","publisher":"Finnish Antiquarian Society (Iskos, journal.fi)","url":"https://journal.fi/iskos/article/view/143138/90579"}]},"France":{"polity":"Merovingian Franks (Neustria, Austrasia, Burgundy)","summary":"Gaul was ruled by Merovingian kings whose kingdoms often fought one another; Guntram of Burgundy tried to keep a balance among his warring relatives. Chlothar II, king of Neustria, became sole ruler of the Franks in 613, and his son Dagobert I ruled the whole realm from 629. Bishop Gregory of Tours wrote his Ten Books of history, and the Irish monk Columbanus founded Annegray and Luxeuil in the Vosges.","events":[{"y":592,"approx":false,"t":"Columbanus, newly arrived from Ireland, founds Annegray in the Vosges, then Luxeuil and Fontaine."},{"y":594,"approx":true,"t":"Gregory of Tours, bishop and historian, dies (594?)."},{"y":613,"approx":false,"t":"Chlothar II becomes sole ruler of the Franks."},{"y":629,"approx":false,"t":"Dagobert I becomes king of all the Franks."}],"link":null,"evidence":"rich","sources":[{"title":"Chlotar II","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/biography/Chlotar-II"},{"title":"Guntram","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/biography/Guntram-king-of-Burgundy"},{"title":"Saint Gregory of Tours","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/biography/Saint-Gregory-of-Tours"},{"title":"Kolumban","publisher":"Historisches Lexikon der Schweiz","url":"https://hls-dhs-dss.ch/de/articles/010215/2007-08-23/"},{"title":"Dagobert I","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/biography/Dagobert-I"}]},"Germany":{"polity":"Merovingian Franks (Austrasia), with Alemanni, Thuringians and Bavarians; independent pagan Saxons","summary":"The Rhineland and parts of western and central Germany belonged to Austrasia, the eastern Frankish kingdom. Other Germanic peoples lived farther east: Saxons between the Rhine and Elbe, Thuringians in central Germany and Alemanni on the upper Rhine, while the Bavarians were under Frankish influence. The Saxons clung to their pagan religion. Dagobert I became king of Austrasia in 623 and campaigned against the Slavs on his eastern frontier.","events":[{"y":612,"approx":false,"t":"Theuderic II of Burgundy, backed by Brunhild, overthrows his brother Theudebert II of Austrasia."},{"y":623,"approx":false,"t":"Dagobert I becomes king of Austrasia."},{"y":631,"approx":true,"t":"Dagobert I's army is defeated by the Slavs under Samo at Wogastisburg (date as given by Fredegar)."}],"link":null,"evidence":"moderate","sources":[{"title":"Austrasia","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/place/Austrasia"},{"title":"Germany","publisher":"Encyclopaedia Britannica (Britannica Students)","url":"https://kids.britannica.com/students/article/Germany/274536"},{"title":"History of Europe","publisher":"Encyclopaedia Britannica (Britannica Scholars)","url":"https://kids.britannica.com/scholars/article/history-of-Europe/106072"},{"title":"Theodoric II","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/biography/Theodoric-II"},{"title":"Dagobert I","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/biography/Dagobert-I"},{"title":"Samo","publisher":"World History Encyclopedia","url":"https://www.worldhistory.org/Samo/"}]},"Iceland":{"polity":"Uninhabited","summary":"Iceland had no settled human population in these decades. Britannica notes that Iceland apparently has no prehistory: the oldest written source, Íslendingabók (c. 1130), places Norse settlement in about 870–930, some two and a half centuries after this period.","events":[{"y":600,"approx":true,"t":"Iceland remains uninhabited; Norse settlement begins only around 870."}],"link":null,"evidence":"sparse","sources":[{"title":"Iceland: History – Settlement (c. 870–c. 930)","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/place/Iceland/History"}]},"Ireland":{"polity":"Christian Ireland, with influential monasteries","summary":"Ireland had been Christian since the 5th century, and its monasteries were centres of classical learning that Irish monks carried abroad. Columba, who founded a monastery on Iona about 563, died there in 597; his elegy is probably by the chief poet Dallán Forgaill. Columbanus, trained at Bangor, left Ireland with twelve companions in 591 and founded monasteries in Gaul and at Bobbio in Italy.","events":[{"y":591,"approx":false,"t":"Columbanus leaves Ireland for the Continent with twelve companions."},{"y":597,"approx":false,"t":"Columba dies on Iona."}],"link":null,"evidence":"moderate","sources":[{"title":"Ireland","publisher":"Encyclopaedia Britannica (Britannica Students)","url":"https://kids.britannica.com/students/article/Ireland/275089"},{"title":"Saint Columba","publisher":"Encyclopaedia Britannica (Britannica Students)","url":"https://kids.britannica.com/students/article/Saint-Columba/320053"},{"title":"Kolumban","publisher":"Historisches Lexikon der Schweiz","url":"https://hls-dhs-dss.ch/de/articles/010215/2007-08-23/"},{"title":"Dallán Forgaill","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/biography/Dallan-Forgaill"}]},"Italy":{"polity":"Lombard kingdom and duchies; Byzantine Exarchate of Ravenna; papal Rome","summary":"Italy was divided after the Lombards invaded in 568. They soon held most of the peninsula, but many small dukedoms grew up, while Rome, Ravenna and a few other fortified cities resisted and stayed with Byzantium. Pope Gregory I (590–604) defended Rome against the Lombards and sent Augustine to England. The Irish monk Columbanus went to the Lombard king Agilulf and founded the monastery of Bobbio.","events":[{"y":568,"approx":false,"t":"The Lombards under Alboin invade Italy from Pannonia."},{"y":590,"approx":false,"t":"Gregory I is unanimously chosen pope."},{"y":593,"approx":true,"t":"Gregory I defends Rome against the Lombards (590s)."},{"y":613,"approx":true,"t":"Columbanus founds the monastery of Bobbio (613 or 614)."}],"link":null,"evidence":"rich","sources":[{"title":"Italy: Lombards and Byzantines","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/place/Italy/Lombards-and-Byzantines"},{"title":"Lombards","publisher":"Encyclopaedia Britannica (Britannica Students)","url":"https://kids.britannica.com/students/article/Lombards/275527"},{"title":"Gregory, popes","publisher":"Encyclopaedia Britannica (Britannica Students)","url":"https://kids.britannica.com/students/article/Gregory-popes/274661"},{"title":"Kolumban","publisher":"Historisches Lexikon der Schweiz","url":"https://hls-dhs-dss.ch/de/articles/010215/2007-08-23/"},{"title":"Byzantine Empire","publisher":"Encyclopaedia Britannica (Britannica Scholars)","url":"https://kids.britannica.com/scholars/article/Byzantine-Empire/106111"}]},"Luxembourg":{"polity":"Merovingian Franks (Austrasia)","summary":"The region lay in Austrasia, the eastern Frankish kingdom, ruled from 561 to 613 by Sigebert I and his descendants. Austrasia was caught up in Merovingian civil wars: in 612 Theuderic II of Burgundy, backed by Brunhild, overthrew Theudebert II of Austrasia, and in 613 Chlothar II became sole ruler of the Franks. In 623 Dagobert I was made king of Austrasia.","events":[{"y":612,"approx":false,"t":"Theuderic II of Burgundy overthrows his brother Theudebert II of Austr
