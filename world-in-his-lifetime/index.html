<style>
*{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}
/* Layout: full-height atlas. Map left, reading panel right; year rail under the map. Stacks on phones. */
:root {
  --bg: #eef0ee;
  --surface: #f8f9f7;
  --sea: #d6dfe2;
  --fg: #1d2326;
  --muted: #5b666b;
  --line: #c4ccce;
  --accent: #1d4f7a;      /* lapis */
  --gold: #a87411;        /* Arabia / the Prophet's track */
  --land-edge: #f8f9f7;
  --hl: #1d2326;
  --font-display: "Marcellus", "Trajan Pro", Georgia, serif;
  --font-body: "Literata", Georgia, "Times New Roman", serif;
  --font-data: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  /* sphere palette */
  --c-islam: #c8952b; --c-arabia: #e2c98f; --c-byz: #8a5a9e; --c-sas: #b5523b;
  --c-latin: #4f7fae; --c-slav: #8fae7a; --c-north: #9bb8c4; --c-turk: #c9a27a;
  --c-india: #d9845a; --c-china: #c4443f; --c-eastasia: #d78d97; --c-seasia: #5f9e8f;
  --c-aksum: #6c7f3c; --c-berber: #b8a36a; --c-meso: #3f8f7a; --c-andes: #9a6b4f;
  --c-other: #cfd3cc; --c-none: #e9ebe8;
  --c-rich: #1d4f7a; --c-moderate: #7ea3c2; --c-sparse: #d2d8dc;
  --c-link: #c8952b; --c-nolink: #d5d9d6; --c-pending: #eef0ee;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12171b; --surface: #182026; --sea: #0d1316; --fg: #e4e8ea; --muted: #94a1a7; --line: #2d383f;
  --accent: #7fb0dc; --gold: #e0b250; --land-edge: #12171b; --hl: #ffffff;
  --c-islam: #d9a73a; --c-arabia: #a8925e; --c-byz: #8c66a0; --c-sas: #b05a45;
  --c-latin: #4c78a3; --c-slav: #6f8d5d; --c-north: #5f7f8c; --c-turk: #9c7d5c;
  --c-india: #b8714d; --c-china: #b04440; --c-eastasia: #a8707a; --c-seasia: #4c8578;
  --c-aksum: #687a3c; --c-berber: #8f804f; --c-meso: #3a7f6d; --c-andes: #84604a;
  --c-other: #3a4348; --c-none: #262e33;
  --c-rich: #7fb0dc; --c-moderate: #4a6d8a; --c-sparse: #2f3a41;
  --c-link: #d9a73a; --c-nolink: #2f383d; --c-pending: #1b2227;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #12171b; --surface: #182026; --sea: #0d1316; --fg: #e4e8ea; --muted: #94a1a7; --line: #2d383f;
  --accent: #7fb0dc; --gold: #e0b250; --land-edge: #12171b; --hl: #ffffff;
  --c-islam: #d9a73a; --c-arabia: #a8925e; --c-byz: #8c66a0; --c-sas: #b05a45;
  --c-latin: #4c78a3; --c-slav: #6f8d5d; --c-north: #5f7f8c; --c-turk: #9c7d5c;
  --c-india: #b8714d; --c-china: #b04440; --c-eastasia: #a8707a; --c-seasia: #4c8578;
  --c-aksum: #687a3c; --c-berber: #8f804f; --c-meso: #3a7f6d; --c-andes: #84604a;
  --c-other: #3a4348; --c-none: #262e33;
  --c-rich: #7fb0dc; --c-moderate: #4a6d8a; --c-sparse: #2f3a41;
  --c-link: #d9a73a; --c-nolink: #2f383d; --c-pending: #1b2227;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.55; }
.app { display: grid; grid-template-columns: minmax(0, 1fr) 380px; grid-template-rows: auto minmax(0, 1fr) auto; height: 100%; padding-inline: 16px; gap: 0 20px; }
header { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 24px; padding-block: 14px 10px; border-bottom: 1px solid var(--line); }
h1 { font-family: var(--font-display); font-weight: 400; font-size: 1.7rem; letter-spacing: .02em; margin: 0; text-wrap: balance; }
h1 small { font-family: var(--font-data); font-size: .72rem; color: var(--muted); letter-spacing: .06em; margin-left: 10px; white-space: nowrap; }
.modes { display: flex; gap: 4px; flex-wrap: wrap; }
.modes button, .chip, .back { font: 500 .74rem/1 var(--font-data); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); background: transparent; border: 1px solid var(--line); border-radius: 3px; padding: 7px 10px; cursor: pointer; }
.modes button[aria-pressed="true"] { color: var(--surface); background: var(--fg); border-color: var(--fg); }
button:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.mapwrap { position: relative; min-height: 0; padding-block: 12px 0; display: flex; flex-direction: column; }
#map { flex: 1; min-height: 300px; width: 100%; background: var(--sea); border-radius: 4px; display: block; cursor: grab; touch-action: none; }
#map:active { cursor: grabbing; }
.country { stroke: var(--land-edge); stroke-width: .5; transition: fill .35s ease; cursor: pointer; }
.country:hover { filter: brightness(1.08); }
.country.sel { stroke: var(--hl); stroke-width: 1.6; }
.country.dim { opacity: .28; }
.grat { fill: none; stroke: var(--line); stroke-width: .4; opacity: .6; }
.pin { fill: var(--surface); stroke: var(--fg); stroke-width: 1.2; pointer-events: none; }
.pin.arabia { fill: var(--gold); stroke: var(--surface); }
.pulse { fill: none; stroke: var(--gold); stroke-width: 1.2; pointer-events: none; animation: pulse 2.4s ease-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes pulse { from { opacity: .9; transform: scale(.6); } to { opacity: 0; transform: scale(2.6); } }
@media (prefers-reduced-motion: reduce) { .pulse { animation: none; opacity: .5; } .country { transition: none; } }
.zoombtns { position: absolute; right: 10px; top: 22px; display: flex; flex-direction: column; gap: 4px; }
.zoombtns button { width: 30px; height: 30px; font: 500 1rem/1 var(--font-data); background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 3px; cursor: pointer; }
.tip { position: absolute; pointer-events: none; background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 3px; padding: 6px 9px; font-size: .82rem; line-height: 1.35; max-width: 240px; box-shadow: 0 4px 14px rgb(0 0 0 / .12); }
.tip b { font-family: var(--font-display); font-weight: 400; font-size: .95rem; display: block; }
.tip span { color: var(--muted); }

.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; padding-block: 8px 0; font: .72rem/1.3 var(--font-data); color: var(--muted); }
.legend button { all: unset; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; padding: 2px 0; }
.legend button[aria-pressed="true"] { color: var(--fg); text-decoration: underline; text-underline-offset: 3px; }
.legend i { width: 11px; height: 11px; border-radius: 2px; display: inline-block; flex: none; }

.rail { grid-column: 1 / 2; padding-block: 10px 14px; }
.rail-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.yr { font-family: var(--font-display); font-size: 2.2rem; line-height: 1; font-variant-numeric: tabular-nums; }
.yr em { font: .8rem var(--font-data); font-style: normal; color: var(--muted); margin-left: 6px; }
.stage { font-size: .9rem; color: var(--gold); font-style: italic; text-align: right; max-width: 34em; }
.track { position: relative; height: 44px; margin-top: 6px; }
#year { position: absolute; inset: 18px 0 auto 0; width: 100%; margin: 0; accent-color: var(--gold); }
.tick { position: absolute; top: 0; width: 1px; height: 12px; background: var(--gold); opacity: .9; }
.tick button { all: unset; position: absolute; top: -4px; left: -6px; width: 13px; height: 16px; cursor: pointer; }
.life { position: absolute; top: 13px; height: 2px; background: var(--gold); opacity: .35; }
.scale { position: absolute; top: 34px; font: .66rem var(--font-data); color: var(--muted); transform: translateX(-50%); }
.play { margin-left: 8px; }

aside { grid-row: 2 / 4; grid-column: 2; min-height: 0; overflow-y: auto; padding-block: 16px 24px; border-left: 1px solid var(--line); padding-left: 20px; }
aside h2 { font-family: var(--font-display); font-weight: 400; font-size: 1.55rem; margin: 0 0 2px; line-height: 1.15; text-wrap: balance; }
aside h3 { font: 500 .7rem var(--font-data); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 20px 0 8px; }
.polity { color: var(--muted); font-style: italic; margin: 0 0 12px; }
.badges { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.badge { font: .68rem/1 var(--font-data); letter-spacing: .05em; text-transform: uppercase; padding: 5px 7px; border-radius: 3px; border: 1px solid var(--line); color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.badge i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }
.summary { margin: 0; }
.link { margin-top: 14px; padding: 10px 12px; border-left: 2px solid var(--gold); background: color-mix(in srgb, var(--gold) 9%, transparent); font-size: .92rem; }
.link b { font: 500 .68rem var(--font-data); letter-spacing: .1em; text-transform: uppercase; color: var(--gold); display: block; margin-bottom: 3px; }
ol.ev { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
ol.ev li { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 10px; font-size: .92rem; line-height: 1.45; }
ol.ev li.near .y { color: var(--surface); background: var(--fg); }
ol.ev li.far { opacity: .62; }
.y { font: 500 .78rem/1 var(--font-data); font-variant-numeric: tabular-nums; padding: 4px 0; text-align: center; border-radius: 3px; align-self: start; color: var(--fg); border: 1px solid var(--line); }
.y.ar { border-color: var(--gold); color: var(--gold); }
ol.ev .where { all: unset; cursor: pointer; font: 500 .7rem var(--font-data); letter-spacing: .05em; text-transform: uppercase; color: var(--accent); display: block; }
ol.ev .where:hover { text-decoration: underline; }
.back { margin-bottom: 14px; }
.note { font-size: .8rem; color: var(--muted); margin-top: 22px; border-top: 1px solid var(--line); padding-top: 12px; }
.empty { color: var(--muted); font-style: italic; font-size: .9rem; }
.saw { font-family: "Amiri", "Scheherazade New", "Noto Naskh Arabic", serif; font-size: 1.15em; line-height: 1; margin-inline: .08em; }
.src { display: block; font: .7rem/1.4 var(--font-data); color: var(--muted); margin-top: 3px; }
ul.sources { margin: 0; padding-left: 18px; font-size: .84rem; color: var(--muted); display: grid; gap: 6px; }
ul.sources a { color: var(--accent); }
.about p, .about li { font-size: .9rem; }
.about ul { padding-left: 18px; display: grid; gap: 6px; }
.search { width: 100%; font: .88rem var(--font-body); padding: 8px 10px; border: 1px solid var(--line); border-radius: 3px; background: var(--surface); color: var(--fg); margin-bottom: 4px; }

@media (max-width: 860px) {
  html, body { height: auto; }
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto; height: auto; }
  #map { height: auto; aspect-ratio: 1.9 / 1; min-height: 0; max-width: 100%; flex: none; }
  aside { grid-row: auto; grid-column: 1; border-left: 0; padding-left: 0; border-top: 1px solid var(--line); overflow: visible; }
  .rail { grid-column: 1; }
  .stage { text-align: left; }
  h1 { font-size: 1.35rem; }
}
</style>
</head>
<body>

<div class="app">
  <header>
    <h1>The World in His Lifetime <small>570 – 632 CE</small></h1>
    <div class="modes" role="group" aria-label="Colour the map by">
      <button type="button" data-mode="sphere" aria-pressed="true">Powers</button>
      <button type="button" data-mode="link" aria-pressed="false">Contact with Arabia</button>
      <button type="button" data-mode="evidence" aria-pressed="false">How much we know</button>
      <button type="button" id="aboutBtn" aria-pressed="false">Sources &amp; method</button>
    </div>
  </header>

  <div class="mapwrap">
    <svg id="map" role="img" aria-label="World map coloured by the powers of c. 570–632 CE. Select a country for details."></svg>
    <div class="zoombtns"><button type="button" id="zin" aria-label="Zoom in">+</button><button type="button" id="zout" aria-label="Zoom out">−</button><button type="button" id="zreset" aria-label="Reset view">⟲</button></div>
    <div class="tip" id="tip" hidden></div>
    <div class="legend" id="legend"></div>
  </div>

  <div class="rail">
    <div class="rail-top">
      <div><span class="yr" id="yrLabel">610</span><em id="yrAH"></em><button type="button" class="chip play" id="play" aria-pressed="false">Play</button></div>
      <div class="stage" id="stage"></div>
    </div>
    <div class="track" id="track">
      <input type="range" id="year" min="565" max="640" step="1" value="610" aria-label="Year (CE)">
    </div>
  </div>

  <aside id="panel" aria-live="polite"></aside>
</div>

const DATA = {"Algeria":{"polity":"Byzantine Africa (coast and eastern Numidia) and independent Moorish (Berber) kingdoms in the interior","summary":"Byzantine Africa held the coastal towns and the east, while independent Moorish kingdoms, which had emerged in the Mauretanias by the end of Vandal rule, held the interior, including the region of Altava, the Ouarsenis, the Hodna and the Aures. In some of these kingdoms Latin epitaphs and Roman names survived. Written sources are thin and mostly Byzantine or Latin.","events":[{"y":570,"approx":true,"t":"John of Biclaro records Byzantine commanders in Africa, including the prefect Theodore, killed by the Moors under King Garmul, c. 570-572."},{"y":578,"approx":true,"t":"The Byzantine commander Gennadius defeats the Moors and kills Garmul, c. 578-579, per John of Biclaro."}],"link":null,"evidence":"moderate","sources":[{"title":"North Africa: The Vandal conquest","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/place/North-Africa/The-Vandal-conquest"},{"title":"Berber","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/topic/Berber"},{"title":"Conquerors and Chroniclers of Early Medieval Spain (trans. of the Chronicle of John of Biclaro), K. B. Wolf, 1990","publisher":"Liverpool University Press (Translated Texts for Historians 9)","url":null}]},"Libya":{"polity":"Byzantine provinces of Tripolitania and Cyrenaica; Garamantes in Fezzan","summary":"The Libyan coast was Byzantine territory after the reconquest of 533, with Tripolitania tied to Carthage. Inland, the Garamantes of Fezzan, an old Saharan oasis people, remained in contact with the Mediterranean world until the Arab conquest of the region in the 660s. Sources for the period are scarce.","events":[{"y":568,"approx":true,"t":"John of Biclaro records that the Garamantes sought peace with the empire and the Christian faith, c. 568-569."},{"y":609,"approx":true,"t":"Nicetas, cousin of Heraclius, leads a force through Libya toward Alexandria against the forces of Phocas, c. 609-610."}],"link":null,"evidence":"sparse","sources":[{"title":"Garamantes","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/topic/Garamantes"},{"title":"Nicetas","publisher":"Oxford Reference (Oxford Dictionary of Byzantium)","url":"https://www.oxfordreference.com/display/10.1093/acref/9780198662778.001.0001/acref-9780198662778-e-3346"},{"title":"Conquerors and Chroniclers of Early Medieval Spain (trans. of the Chronicle of John of Biclaro), K. B. Wolf, 1990","publisher":"Liverpool University Press (Translated Texts for Historians 9)","url":null}]},"Morocco":{"polity":"Moorish (Berber) principalities","summary":"Beyond Byzantine control, the land was held by Moorish (Berber) rulers. At Volubilis, an old Roman town, a cemetery has yielded Christian funerary inscriptions in Latin dated 599-655 CE, showing that a Latin-using Christian community survived under local rule. Very little was written about the region in this period.","events":[{"y":600,"approx":true,"t":"Christian Latin epitaphs at Volubilis, dated 599-655 CE, attest a surviving Romanised Christian community."}],"link":null,"evidence":"sparse","sources":[{"title":"The History of Volubilis","publisher":"Volubilis Project (UCL / INSAP excavations)","url":"https://volubilis.lparchaeology.com/www/english/about/history.htm"},{"title":"North Africa: The Vandal conquest","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/place/North-Africa/The-Vandal-conquest"}]},"Tunisia":{"polity":"Byzantine Exarchate of Africa (capital Carthage)","summary":"Carthage was the capital of Byzantine Africa. Emperor Maurice reorganised it as an exarchate, giving one governor both civil and military power. In 610 the exarch of Carthage sent his son Heraclius with a fleet to Constantinople, where he overthrew Phocas and founded a new dynasty. The exarchate lasted until the Arab conquest of 697-698.","events":[{"y":591,"approx":true,"t":"Emperor Maurice joins civil and military power under an exarch at Carthage, c. 590-591."},{"y":608,"approx":true,"t":"The exarch Heraclius the Elder rebels against Emperor Phocas from Carthage, c. 608."},{"y":610,"approx":false,"t":"The younger Heraclius sails from Carthage, overthrows Phocas and is proclaimed emperor in October."},{"y":619,"approx":true,"t":"With Persians overrunning the east, Heraclius considers moving to Carthage, but popular feeling in Constantinople prevents it."}],"link":null,"evidence":"rich","sources":[{"title":"Exarchate of Carthage","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/place/Exarchate-of-Carthage"},{"title":"Phocas","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/biography/Phocas"},{"title":"North Africa: The Vandal conquest","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/place/North-Africa/The-Vandal-conquest"}]},"W. Sahara":{"polity":"Berber nomadic groups","summary":"This desert and Atlantic coastline was used by Berber-speaking herding groups. No written sources describe the region in this period, and archaeological work is limited, so little can be said with confidence.","events":[],"link":null,"evidence":"sparse","sources":[{"title":"Berber","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/topic/Berber"}]},"Mauritania":{"polity":"Berber nomads in the north; Soninke farming communities in the south","summary":"The southern Sahel was home to Soninke communities, the founders of the empire of Ghana (Wagadu), which Britannica dates from about the 7th to the 13th century in what is now southeastern Mauritania and part of Mali. Its origins are uncertain; Soninke tradition places them earlier, but this is unconfirmed. Evidence for 570-632 itself is very thin.","events":[{"y":600,"approx":true,"t":"The Ghana (Wagadu) state may be taking shape in the southern Sahel; its origins are uncertain."}],"link":null,"evidence":"sparse","sources":[{"title":"Ghana (historical West African empire)","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/place/Ghana-historical-West-African-empire?anchor=ref1118"},{"title":"Soninke","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/topic/Soninke"}]},"Sudan":{"polity":"Nubian kingdoms: Nobadia, Makuria and Alodia","summary":"Three Christian Nubian kingdoms lined the Nile: Nobadia in the north (capital Pachoras, modern Faras), Makuria (capital Dongola) and Alodia (capital Soba). Missionaries converted Nobadia and Alodia to Miaphysite Christianity, while a contemporary report says Makuria adopted the Diophysite (Chalcedonian) faith. Nobadia and Makuria later merged, probably in the 7th century; the date is uncertain.","events":[{"y":569,"approx":false,"t":"The Miaphysite missionary Longinus arrives in Nobadia, where he works until about 575."},{"y":570,"approx":true,"t":"John of Biclaro records the conversion of Makuria to the Diophysite (Chalcedonian) faith, c. 570."},{"y":578,"approx":true,"t":"Longinus carries Miaphysite Christianity to Alodia, c. 575-580; sources differ on the date."},{"y":600,"approx":true,"t":"A monastery is founded on Kom H at Old Dongola, the Makurian capital, in the 6th-7th century."}],"link":null,"evidence":"moderate","sources":[{"title":"Nobatia","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/place/Nobatia"},{"title":"Alwah","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/place/Alwah"},{"title":"Makouria (Research Starters)","publisher":"EBSCO","url":"https://www.ebsco.com/research-starters/religion-and-philosophy/makouria"}]},"S. Sudan":{"polity":"Unknown; no recorded states","summary":"The swamps and savannas of the upper Nile were inhabited, but no written records exist for this period and archaeological research is very limited, so the societies of the region cannot be described with confidence.","events":[],"link":null,"evidence":"sparse","sources":[{"title":"History of Sudan","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/topic/history-of-Sudan"}]},"Eritrea":{"polity":"Kingdom of Aksum (Red Sea coast and highlands)","summary":"The highlands and coast were Aksumite lands. Its port Adulis had long carried Red Sea trade, but lost importance as trade routes shifted and was cut off from Mediterranean trade by the rise of Arab powers in the 7th and 8th centuries. Christianity and the Ge'ez language marked Aksumite culture.","events":[{"y":570,"approx":true,"t":"Sasanian Persian forces end Ethiopian-backed rule in Yemen in the 570s (dates vary), ending Aksumite influence across the Red Sea."},{"y":615,"approx":true,"t":"Muslim emigrants from Mecca cross the Red Sea to the Aksumite kingdom in the first Hijra."},{"y":630,"approx":true,"t":"Adulis declines in the 7th century as Red Sea trade shifts; the exact chronology is uncertain."}],"link":"The first Muslim emigrants c. 615 crossed the Red Sea to the Aksumite kingdom, whose coast and port of Adulis lay here; their exact landing place is not securely recorded.","evidence":"moderate","sources":[{"title":"Adulis","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/place/Adulis"},{"title":"Arabia ii. The Sasanians and Arabia","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/arabia-ii-sasanians-and-arabia/"},{"title":"The Life of Muhammad ﷺ: A Translation of Ibn Ishaq's Sirat Rasul Allah, trans. A. Guillaume, 1955","publisher":"Oxford University Press","url":null}]},"Ethiopia":{"polity":"Kingdom of Aksum (ruler known in Islamic tradition as al-Najashi, Ashama)","summary":"Aksum was an old Christian kingdom in the northern Ethiopian highlands, trading via the Red Sea. Its power was waning after Persia took Yemen in the 570s, and its coinage was increasingly debased. According to the Islamic tradition, its ruler, the Negus Ashama ibn Abjar (al-Najashi), sheltered persecuted early Muslims from c. 615.","events":[{"y":570,"approx":true,"t":"Abraha, the Aksumite commander ruling Yemen, leads the Year of the Elephant expedition against Mecca; the traditional date of 570 is disputed."},{"y":615,"approx":true,"t":"First Hijra (5th year of prophethood): Muslim emigrants take refuge with the Negus, per Ibn Hisham and The Sealed Nectar."},{"y":616,"approx":true,"t":"Quraysh envoys, including Amr ibn al-As, fail to persuade the Negus to hand over the refugees, per Ibn Ishaq."},{"y":628,"approx":true,"t":"Ja'far ibn Abi Talib and remaining emigrants rejoin Muhammad ﷺ around the time of Khaybar, per Islamic sources."},{"y":630,"approx":true,"t":"The Negus dies (9 AH); Islamic tradition reports that Muhammad ﷺ prayed the funeral prayer for him in absentia."}],"link":"According to Islamic sources (Ibn Hisham, The Sealed Nectar), the Negus, identified in the Islamic tradition as Ashama, sheltered Muslim emigrants from c. 615, including Ja'far ibn Abi Talib and Uthman ibn Affan.","evidence":"moderate","sources":[{"title":"The Life of Muhammad ﷺ: A Translation of Ibn Ishaq's Sirat Rasul Allah, trans. A. Guillaume, 1955","publisher":"Oxford University Press","url":null},{"title":"The Sealed Nectar (Ar-Raheeq Al-Makhtum), Safiur Rahman al-Mubarakpuri","publisher":"Darussalam","url":null},{"title":"Negash (Al-Nejashi) Village: Sanctuary of the First Hijra (Tentative List)","publisher":"UNESCO World Heritage Centre","url":"https://whc.unesco.org/en/tentativelists/7015/"}]},"Djibouti":{"polity":"Unknown; pastoralist peoples on the fringe of Aksum","summary":"This arid coast lies at the Bab el-Mandeb strait between the Horn of Africa and Yemen, on Red Sea shipping lanes. No written or archaeological record gives a clear picture of its people or rulers in this period.","events":[],"link":null,"evidence":"sparse","sources":[{"title":"Eastern Africa: The Horn of Africa","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/place/eastern-Africa/The-Horn-of-Africa"}]},"Somalia":{"polity":"Pastoralists and coastal trading settlements","summary":"Ras Hafun, identified with Opone of the 1st-century Periplus, holds the oldest archaeological evidence of long-distance trade on this coast. Between the 7th and 12th centuries, Indian Ocean towns such as Marka, Baraawe and Mogadishu served as trading ports, though their early history is poorly known. Evidence for 570-632 is very limited.","events":[],"link":null,"evidence":"sparse","sources":[{"title":"Long Distance Trade in Somalia, 1st-19th Centuries AD","publisher":"Oxford Research Encyclopedia of African History","url":"https://oxfordre.com/africanhistory/display/10.1093/acrefore/9780190277734.001.0001/acrefore-9780190277734-e-1306?d=/10.1093/acrefore/9780190277734.001.0001/acrefore-9780190277734-e-1306&p=emailAicxSLIYWoGjU"},{"title":"Somaliland","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/place/Somaliland"}]},"Somaliland":{"polity":"Gulf of Aden trading ports (Zeila, Berbera) and pastoralists","summary":"The 1st-century Periplus describes 'Far-Side Ports' along this shore trading with Arabia and Egypt. Between the 7th and 12th centuries, Zeila (Seylac) and Berbera served as Gulf of Aden trading ports; Islam was firmly established there by the 10th century. Little is known about these towns in 570-632 specifically.","events":[{"y":600,"approx":true,"t":"Zeila and Berbera are among Gulf of Aden trading ports from about the 7th century."}],"link":null,"evidence":"sparse","sources":[{"title":"Somaliland","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/place/Somaliland"},{"title":"Seylac","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/place/Seylac"},{"title":"Long Distance Trade in Somalia, 1st-19th Centuries AD","publisher":"Oxford Research Encyclopedia of African History","url":"https://oxfordre.com/africanhistory/display/10.1093/acrefore/9780190277734.001.0001/acrefore-9780190277734-e-1306?d=/10.1093/acrefore/9780190277734.001.0001/acrefore-9780190277734-e-1306&p=emailAicxSLIYWoGjU"}]},"Kenya":{"polity":"Coastal communities of the early Tana Tradition","summary":"From about 600 CE, coastal and inland sites across eastern Africa share pottery known as the early Tana Tradition or Triangular-Incised Ware. Its recognition has led archaeologists to stress the indigenous African roots of later Swahili coastal culture. Evidence for the period is entirely archaeological.","events":[{"y":600,"approx":true,"t":"Communities making early Tana Tradition (Triangular-Incised Ware) pottery spread along the coast, c. 600-900."}],"link":null,"evidence":"sparse","sources":[{"title":"Ceramics and the Early Swahili: Deconstructing the Early Tana Tradition (Fleisher and Wynne-Jones, 2011)","publisher":"African Archaeological Review (Springer)","url":"https://link.springer.com/article/10.1007/s10437-011-9104-6"}]},"Tanzania":{"polity":"Bantu-speaking farmers; early coastal trading villages","summary":"Early coastal villages were forerunners of Swahili culture. On Zanzibar, Unguja Ukuu was first settled in the 6th-7th centuries and was tied to Indian Ocean trade from its earliest levels. On Pemba, the trade village of Tumbe dates to c. 600-950. Evidence is archaeological.","events":[{"y":600,"approx":true,"t":"Unguja Ukuu on Zanzibar is founded as a trading settlement, 6th-7th century; its start date is debated."}],"link":null,"evidence":"sparse","sources":[{"title":"Understanding the layout of early coastal settlement at Unguja Ukuu, Zanzibar","publisher":"Antiquity (Cambridge University Press)","url":"https://www.cambridge.org/core/journals/antiquity/article/understanding-the-layout-of-early-coastal-settlement-at-unguja-ukuu-zanzibar/A93E817CE0D498CB706CAFCB0DDB0308"},{"title":"The early Swahili trade village of Tumbe, Pemba Island, Tanzania, AD 600-950","publisher":"Antiquity (Cambridge University Press)","url":"https://www.cambridge.org/core/journals/antiquity/article/abs/early-swahili-trade-village-of-tumbe-pemba-island-tanzania-ad-600950/96E5356A34B749A056921E27371A05A0"}]},"Madagascar":{"polity":"Early Austronesian settlers (dates debated)","summary":"The Malagasy language is related to Ma'anyan of southern Borneo, and Malagasy people have both Southeast Asian and African ancestry. When Austronesian seafarers arrived is debated: estimates range from the mid first millennium CE to the 7th-8th centuries, and Southeast Asian crops found at early sites give the first archaeological evidence of their presence.","events":[{"y":630,"approx":true,"t":"Austronesian settlers may be reaching Madagascar around the 7th-8th centuries; dates remain debated."}],"link":null,"evidence":"sparse","sources":[{"title":"Ancient crops provide first archaeological signature of the westward Austronesian expansion (Crowther et al., 2016)","publisher":"PNAS","url":"https://www.pnas.org/doi/10.1073/pnas.1522714113"},{"title":"Contrasting Linguistic and Genetic Origins of the Asian Source Populations of Malagasy (2016)","publisher":"Scientific Reports (Nature)","url":"https://www.nature.com/articles/srep26066"}]},"Mozambique":{"polity":"Bantu-speaking farmers; early coastal trading sites","summary":"Chibuene, on the southern coast, was occupied from about the 7th century and became the main entry point for Indian Ocean trade into southern Africa from about the 8th to mid-10th century. Glass beads of a distinctive Chibuene series suggest imports may have begun in the 7th century. Evidence is archaeological.","events":[{"y":630,"approx":true,"t":"Chibuene may begin receiving Indian Ocean glass beads in the 7th century; dating is debated."}],"link":null,"evidence":"sparse","sources":[{"title":"The glass of Chibuene, Mozambique: new insights into early Indian Ocean trade (Wood, Dussubieux and Robertshaw, 2012)","publisher":"DiVA (Uppsala University)","url":"http://www.diva-portal.org/smash/record.jsf?pid=diva2:573788&dswid=2248"},{"title":"Trade and society on the south-east African coast in the later first millennium AD: the case of Chibuene","publisher":"Antiquity (Cambridge University Press)","url":"https://www.cambridge.org/core/journals/antiquity/article/abs/trade-and-society-on-the-southeast-african-coast-in-the-later-first-millennium-ad-the-case-of-chibuene/3433E399B0D88DD2F85E266BADAD80C8"}]},"Chad":{"polity":"Sao communities of the Lake Chad basin","summary":"The Sao culture arose near Lake Chad, probably in the 5th century CE, and peaked later, from the 9th to the 15th century. The modern Kotoko are believed to descend from them. The Kanem kingdom east of the lake is first noted by Arabic writers in the 9th century. The period 570-632 is known only through archaeology.","events":[{"y":600,"approx":true,"t":"Sao communities live in the Lake Chad basin, a culture that probably arose in the 5th century."}],"link":null,"evidence":"sparse","sources":[{"title":"Sao","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/topic/Sao-people"},{"title":"Nigeria: History","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/place/Nigeria/History"}]},"Niger":{"polity":"Bura culture of the Niger valley; Saharan nomads","summary":"In the Niger River valley, the Bura culture made terracotta funerary jars and figures marking graves, dated by the Met to the 3rd-11th centuries and by UNESCO's tentative listing to roughly the 3rd-13th centuries. The necropolis at Bura is the key site. Evidence is archaeological only.","events":[{"y":600,"approx":true,"t":"The Bura culture continues its burials with terracotta jars and figures in the Niger valley."}],"link":null,"evidence":"sparse","sources":[{"title":"Grave Marker, Bura peoples","publisher":"The Metropolitan Museum of Art","url":"https://www.metmuseum.org/art/collection/search/317898"},{"title":"Site archeologique de Bura (Tentative List)","publisher":"UNESCO World Heritage Centre","url":"https://whc.unesco.org/en/tentativelists/5045/"}]},"Mali":{"polity":"Djenne-Djeno and Inland Niger Delta settlements; possible early Ghana (Wagadu)","summary":"Djenne-Djeno (Jenne-jeno) in the Inland Niger Delta, inhabited from about the 3rd century BCE, preserves a pre-Islamic urban settlement of round and rectangular mud-brick buildings, funerary jars and metalworking debris; it is part of a UNESCO World Heritage property. To the north-west, the Soninke state of Ghana (Wagadu) may have been forming. Evidence is archaeological.","events":[{"y":600,"approx":true,"t":"Djenne-Djeno is a large settled town on the Inland Niger Delta."},{"y":600,"approx":true,"t":"Soninke communities in the Sahel may be organising the early Ghana (Wagadu) state; origins are uncertain."}],"link":null,"evidence":"sparse","sources":[{"title":"Old Towns of Djenne","publisher":"UNESCO World Heritage Centre","url":"https://whc.unesco.org/en/list/116"},{"title":"Ghana (historical West African empire)","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/place/Ghana-historical-West-African-empire?anchor=ref1118"}]},"Angola":{"polity":"Iron-using farming communities","summary":"Most of the later population descends from farming cultures that appeared c. 1000-500 BCE and were working iron by the first centuries CE. Archaeology from this region is very scarce, so little can be said specifically about c. 570-632. The Kongo and Ndongo kingdoms lay centuries in the future.","events":[{"y":600,"approx":true,"t":"Iron-using farming communities occupy the region; almost no sites from this period have been dated."}],"link":null,"evidence":"sparse","sources":[{"title":"History of Angola","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/topic/history-of-Angola"},{"title":"Lander & Russell, The archaeological evidence for the appearance of pastoralism and farming in southern Africa (PLoS ONE 13, 2018)","publisher":"PLoS ONE, via PubMed Central","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC6002040/"}]},"Benin":{"polity":null,"evidence":"sparse","pending":true,"sources":[],"events":[],"link":null},"Botswana":{"polity":"Foragers and herders; early iron-using farmers at Tsodilo","summary":"In the north-west, foraging dominated the Tsodilo Hills until about 600 CE; the Iron Age village of Divuyu there dates to roughly the 6th-8th centuries, with iron and copper working. The Toutswe farming tradition of the east began only around 700. No written records exist.","events":[{"y":600,"approx":true,"t":"Divuyu at Tsodilo Hills is occupied by iron- and copper-working farmers, dated broadly to the 6th-8th centuries."}],"link":null,"evidence":"sparse","sources":[{"title":"Tsodilo (nomination file / ICOMOS documentation, No. 1021)","publisher":"UNESCO World Heritage Centre","url":"https://whc.unesco.org/document/151551"},{"title":"Iron age metal working at the Tsodilo Hills, Northwestern Botswana","publisher":"University of Cape Town (OpenUCT)","url":"https://open.uct.ac.za/items/a76a0330-0942-4851-8c32-da6b74587829"},{"title":"Mookodi, article on Toutswe-tradition settlement, Pula: Botswana Journal of African Studies","publisher":"Pula (Michigan State University digital library)","url":"https://d.lib.msu.edu/pula/319/FULL_TEXT/view"}]},"Burkina Faso":{"polity":"Iron-working farming communities","summary":"Iron production in the region was very old: Douroula, part of a UNESCO World Heritage property, dates back to the 8th century BCE. The property's other furnace sites show intensified production in the second millennium CE. Little is specifically dated to c. 570-632, and no written records survive.","events":[{"y":600,"approx":true,"t":"Iron smelting, attested at Douroula since the 8th century BCE, is long established; specific sites of this era are poorly dated."}],"link":null,"evidence":"sparse","sources":[{"title":"Ancient Ferrous Metallurgy Sites of Burkina Faso","publisher":"UNESCO World Heritage Centre","url":"https://whc.unesco.org/en/list/1602/"}]},"Burundi":{"polity":null,"evidence":"sparse","pending":true,"sources":[],"events":[],"link":null},"Cameroon":{"polity":"Farming and foraging communities; Lake Chad plain settlements in the north","summary":"The Cameroon-Nigeria borderlands are the likely homeland of the Bantu languages. In southern Cameroon, radiocarbon evidence shows a sharp population collapse c. 400-600 CE and low activity for centuries after. In the far north, settlement mounds of the Lake Chad plain were occupied. Archaeology is the only evidence.","events":[{"y":600,"approx":true,"t":"Southern Cameroon's forest communities are much reduced after a population collapse c. 400-600 CE."}],"link":null,"evidence":"sparse","sources":[{"title":"Seidensticker et al., Population collapse in Congo rainforest from 400 CE urges reassessment of the Bantu Expansion (Science Advances 7, 2021)","publisher":"Science Advances (AAAS), open access via PubMed Central","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC7880602/"},{"title":"David W. Phillipson, African Archaeology, 3rd ed. (2005)","publisher":"Cambridge University Press","url":null},{"title":"Graham Connah, African Civilizations: An Archaeological Perspective, 3rd ed. (2016)","publisher":"Cambridge University Press","url":null}]},"Central African Rep.":{"polity":"Savanna and forest communities (poorly documented)","summary":"Very little archaeology from this period has been dated in this region. To the south, studies of the wider Congo rainforest show a widespread population collapse between c. 400 and 600 CE. The megaliths near Bouar are of uncertain date and cannot be securely placed in this period. No written sources exist.","events":[{"y":600,"approx":true,"t":"In the wider Congo rainforest to the south, human activity is very low after a collapse c. 400-600 CE."}],"link":null,"evidence":"sparse","sources":[{"title":"Seidensticker et al., Population collapse in Congo rainforest from 400 CE urges reassessment of the Bantu Expansion (Science Advances 7, 2021)","publisher":"Science Advances (AAAS), open access via PubMed Central","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC7880602/"}]},"Congo":{"polity":"Forest and river communities (much reduced)","summary":"Iron-using Bantu-speaking communities had spread along the Congo's tributaries in earlier centuries, but radiocarbon evidence shows a widespread population collapse across the Congo rainforest c. 400-600 CE, strongest in the Lower Congo, with low activity until resettlement around 1000. The Kongo and Tio kingdoms came much later.","events":[{"y":600,"approx":true,"t":"After a rainforest-wide population collapse c. 400-600 CE, human activity remains low; recovery comes around 1000 CE."}],"link":null,"evidence":"sparse","sources":[{"title":"Seidensticker et al., Population collapse in Congo rainforest from 400 CE urges reassessment of the Bantu Expansion (Science Advances 7, 2021)","publisher":"Science Advances (AAAS), open access via PubMed Central","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC7880602/"},{"title":"Central Africa: The Iron Age","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/place/central-Africa/The-Iron-Age"}]},"Côte d'Ivoire":{"polity":null,"evidence":"sparse","pending":true,"sources":[],"events":[],"link":null},"Dem. Rep. Congo":{"polity":"Farming and foraging communities; Kamilambian iron-users in the Upemba","summary":"Across the Congo rainforest, including the inner basin, radiocarbon evidence shows a population collapse c. 400-600 CE and low activity until c. 1000. In the Upemba Depression in the south-east, the Kamilambian, the area's earliest ironworking culture (c. 6th-8th century), preceded the Kisalian, which began c. mid-8th century.","events":[{"y":600,"approx":true,"t":"Kamilambian communities, the Upemba Depression's earliest ironworking culture (c. 6th-8th century), occupy sites such as Kamilamba and Sanga."}],"link":null,"evidence":"sparse","sources":[{"title":"Nicolas Nikis, Upemba Depression (The Encyclopedia of Ancient History, 2021)","publisher":"Wiley-Blackwell; author copy via Royal Museum for Central Africa","url":"https://www.africamuseum.be/publication_docs/Nikis 2021 Upemba depression.pdf"},{"title":"Seidensticker et al., Population collapse in Congo rainforest from 400 CE urges reassessment of the Bantu Expansion (Science Advances 7, 2021)","publisher":"Science Advances (AAAS), open access via PubMed Central","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC7880602/"}]},"Eq. Guinea":{"polity":"Forest communities (poorly documented)","summary":"The mainland lies within the Congo rainforest, where radiocarbon studies covering neighbouring southern Cameroon and Gabon show a sharp population collapse c. 400-600 CE and low activity for centuries afterwards. The early history of Bioko island in this period is poorly known.","events":[{"y":600,"approx":true,"t":"Rainforest communities in the region are much reduced after a population collapse c. 400-600 CE."}],"link":null,"evidence":"sparse","sources":[{"title":"Seidensticker et al., Population collapse in Congo rainforest from 400 CE urges reassessment of the Bantu Expansion (Science Advances 7, 2021)","publisher":"Science Advances (AAAS), open access via PubMed Central","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC7880602/"}]},"Gabon":{"polity":"Forest communities (much reduced)","summary":"Iron smelting had reached Central Africa's western forest long before, but radiocarbon evidence shows a sharp population collapse in Gabon c. 400-600 CE, with very low human activity until a new expansion phase from c. 1000 CE. No written sources exist.","events":[{"y":600,"approx":true,"t":"Gabon's forest is thinly occupied after a population collapse c. 400-600 CE; resettlement follows from c. 1000."}],"link":null,"evidence":"sparse","sources":[{"title":"Seidensticker et al., Population collapse in Congo rainforest from 400 CE urges reassessment of the Bantu Expansion (Science Advances 7, 2021)","publisher":"Science Advances (AAAS), open access via PubMed Central","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC7880602/"},{"title":"Central Africa: The Iron Age","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/place/central-Africa/The-Iron-Age"}]},"Gambia":{"polity":"Communities of the Senegambian megalithic zone","summary":"Along the Gambia River, communities raised circles of laterite pillars, quarried with iron tools, beside burial mounds, as at Wassu and Kerbatch. Excavated material from the sites suggests dates from the 3rd century BCE to the 16th century CE. Nothing is known of their rulers or languages from writing.","events":[{"y":600,"approx":true,"t":"The Senegambian stone-circle tradition, spanning the 3rd century BCE to the 16th century CE, is in use at sites such as Wassu."}],"link":null,"evidence":"sparse","sources":[{"title":"Stone Circles of Senegambia","publisher":"UNESCO World Heritage Centre","url":"https://whc.unesco.org/en/list/1226/"}]},"Ghana":{"polity":"Farming communities (not the medieval Ghana empire)","summary":"Modern Ghana lies far from the medieval Ghana (Wagadu) empire, which was in the western Sahel. Iron-using farmers lived in the savanna and forest, but sites of this period are few. The Koma Land terracotta mounds of the north are dated mainly to later centuries (c. 13th-19th) in published research.","events":[{"y":600,"approx":true,"t":"Iron-using farming communities occupy savanna and forest; few sites from this era are dated."}],"link":null,"evidence":"sparse","sources":[{"title":"Graham Connah, African Civilizations: An Archaeological Perspective, 3rd ed. (2016)","publisher":"Cambridge University Press","url":null},{"title":"Kankpeyeng & Nkumbaan, Ancient Shrines? New Insights on the Komaland Sites of Northern Ghana","publisher":"University of Ghana (UGSpace)","url":"https://ugspace.ug.edu.gh/items/c592f7c2-448f-4cae-92af-16e24867e66d"}]},"Guinea":{"polity":null,"evidence":"sparse","pending":true,"sources":[],"events":[],"link":null},"Guinea-Bissau":{"polity":null,"evidence":"sparse","pending":true,"sources":[],"events":[],"link":null},"Lesotho":{"polity":"San hunter-gatherers","summary":"The mountains were home to San hunter-gatherers, the makers of much of the rock art of southern Africa, including Lesotho. Iron Age farming communities settled the area only in later centuries. Evidence is archaeological and rock art.","events":[{"y":600,"approx":true,"t":"San hunter-gatherers occupy mountain rock shelters; farming communities have not yet settled the area."}],"link":null,"evidence":"sparse","sources":[{"title":"Rock art","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/art/rock-art"},{"title":"David W. Phillipson, African Archaeology, 3rd ed. (2005)","publisher":"Cambridge University Press","url":null}]},"Liberia":{"polity":null,"evidence":"sparse","pending":true,"sources":[],"events":[],"link":null},"Malawi":{"polity":"Early Iron Age farmers (Nkope tradition) and BaTwa foragers","summary":"Bantu-speaking farmers making Nkope-tradition pottery lived around Lake Malawi, and ironworking and slash-and-burn cultivation spread in the centuries to about 1200 CE. BaTwa hunter-gatherers, present since the late Stone Age, painted rock shelters such as those at Chongoni. The Chewa states came much later.","events":[{"y":600,"approx":true,"t":"Nkope-tradition Early Iron Age farming villages occupy the Lake Malawi region; BaTwa foragers live alongside them."}],"link":null,"evidence":"sparse","sources":[{"title":"David W. Phillipson, African Archaeology, 3rd ed. (2005)","publisher":"Cambridge University Press","url":null},{"title":"History of Malawi","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/topic/history-of-Malawi"},{"title":"Chongoni Rock-Art Area","publisher":"UNESCO World Heritage Centre","url":"https://whc.unesco.org/en/list/476/"}]},"Namibia":{"polity":"San foragers and Khoe herders","summary":"The desert and dry savanna were home to San hunter-gatherers and herders of sheep and some cattle, part of an enduring pastoralist presence in the western half of southern Africa. Much of Namibia's rock art was made by San peoples. Metal-working sites are known but poorly classified. Evidence is archaeological.","events":[{"y":600,"approx":true,"t":"Foragers and herders occupy the region; rock art traditions continue."}],"link":null,"evidence":"sparse","sources":[{"title":"Lander & Russell, The archaeological evidence for the appearance of pastoralism and farming in southern Africa (PLoS ONE 13, 2018)","publisher":"PLoS ONE, via PubMed Central","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC6002040/"},{"title":"Rock art","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/art/rock-art"}]},"Nigeria":{"polity":null,"evidence":"sparse","pending":true,"sources":[],"events":[],"link":null},"Rwanda":{"polity":null,"evidence":"sparse","pending":true,"sources":[],"events":[],"link":null},"Senegal":{"polity":"Communities of the Senegambian megalithic zone","summary":"Communities in the Gambia river region raised circles of laterite pillars, quarried with iron tools, beside burial mounds, as at Sine Ngayene and Wanar. Excavated material suggests dates from the 3rd century BCE to the 16th century CE. Takrur appears in written sources only centuries later.","events":[{"y":600,"approx":true,"t":"The Senegambian stone-circle tradition is in use at sites such as Sine Ngayene and Wanar."}],"link":null,"evidence":"sparse","sources":[{"title":"Stone Circles of Senegambia","publisher":"UNESCO World Heritage Centre","url":"https://whc.unesco.org/en/list/1226/"},{"title":"Graham Connah, African Civilizations: An Archaeological Perspective, 3rd ed. (2016)","publisher":"Cambridge University Press","url":null}]},"Sierra Leone":{"polity":null,"evidence":"sparse","pending":true,"sources":[],"events":[],"link":null},"South Africa":{"polity":"Iron-using farmers in the east; San foragers and Khoe herders","summary":"Iron-using farmers, ancestors of today's Bantu-speaking majority, had settled the eastern river valleys and coastal plain from c. 200 CE, keeping cattle and sheep. The Lydenburg Heads from Mpumalanga, the earliest sculpture known from southern Africa, date to c. 500-700 CE. Foragers and herders held the west. Mapungubwe came later.","events":[{"y":600,"approx":true,"t":"The Lydenburg Heads are made by farming communities in Mpumalanga, dated to c. 500-700 CE."}],"link":null,"evidence":"sparse","sources":[{"title":"South Africa: The Iron Age","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/place/South-Africa/The-Iron-Age"},{"title":"Lydenburg heads","publisher":"University of Cape Town, Faculty of Humanities","url":"https://humanities.uct.ac.za/node/272910"},{"title":"Lander & Russell, The archaeological evidence for the appearance of pastoralism and farming in southern Africa (PLoS ONE 13, 2018)","publisher":"PLoS ONE, via PubMed Central","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC6002040/"}]},"Togo":{"polity":"Iron-working farming communities","summary":"Farming communities lived in the coastal plains and northern hills. In the Bassar region of the north, iron smelting began in the Early Iron Age, and production grew into a major regional industry in the later Iron Age. Written sources do not exist, and much of the period is undated.","events":[{"y":600,"approx":true,"t":"Bassar communities continue an iron-working tradition begun in the Early Iron Age; large-scale production comes later."}],"link":null,"evidence":"sparse","sources":[{"title":"de Barros et al., The Early Iron Metallurgy of Bassar, Togo (Azania 55, 2020)","publisher":"Azania (Taylor & Francis); White Rose eprints","url":"https://eprints.whiterose.ac.uk/158986"}]},"Uganda":{"polity":null,"evidence":"sparse","pending":true,"sources":[],"events":[],"link":null},"Zambia":{"polity":"Early Iron Age farmers and foragers","summary":"Ironworking in central and western Zambia dates to the first five or six centuries CE. Early Iron Age farming villages with distinctive pottery traditions occupied the plateau and valleys, and Kalambo Falls shows long Iron Age occupation. Foragers persisted in many areas. No written sources exist.","events":[{"y":600,"approx":true,"t":"Early Iron Age farming villages occupy the Zambian plateau and the Kalambo Falls area."}],"link":null,"evidence":"sparse","sources":[{"title":"History of Zambia","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/topic/history-of-Zambia"},{"title":"David W. Phillipson, African Archaeology, 3rd ed. (2005)","publisher":"Cambridge University Press","url":null}]},"Zimbabwe":{"polity":"Early Iron Age farmers (Gokomere/Ziwa traditions); San foragers","summary":"Farmers of the Gokomere and Ziwa Early Iron Age traditions grew crops, kept livestock and worked iron. San foragers, makers of much of the region's rock art, still lived in the land. Great Zimbabwe was built only between the 11th and 15th centuries. Evidence is archaeological.","events":[{"y":600,"approx":true,"t":"Gokomere/Ziwa farming villages occupy the plateau; San foragers live alongside them."}],"link":null,"evidence":"sparse","sources":[{"title":"David W. Phillipson, African Archaeology, 3rd ed. (2005)","publisher":"Cambridge University Press","url":null},{"title":"Great Zimbabwe","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/place/Great-Zimbabwe"},{"title":"Rock art","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/art/rock-art"}]},"eSwatini":{"polity":"Iron-using farmers and San foragers (poorly documented)","summary":"Iron-using farmers had settled the eastern lowlands of southern Africa, including neighbouring Mpumalanga and KwaZulu-Natal, from c. 200 CE, while San hunter-gatherers lived in the region. Evidence specific to eSwatini in this period is scanty. The Swazi kingdom formed much later.","events":[{"y":600,"approx":true,"t":"Iron-using farming communities occupy the wider eastern lowlands; San foragers remain in the region."}],"link":null,"evidence":"sparse","sources":[{"title":"South Africa: The Iron Age","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/place/South-Africa/The-Iron-Age"},{"title":"David W. Phillipson, African Archaeology, 3rd ed. (2005)","publisher":"Cambridge University Press","url":null}]},"Canada":{"polity":null,"evidence":"sparse","pending":true,"sources":[],"events":[],"link":null},"United States of America":{"polity":null,"evidence":"sparse","pending":true,"sources":[],"events":[],"link":null},"Mexico":{"polity":"Teotihuacan in decline; Maya kingdoms such as Palenque and the Kaanul (Snake) kingdom","summary":"Teotihuacan, once the largest city in the Americas, had its major buildings burned around 600 (date debated) and lost its regional dominance, though people kept living there. In the Maya south, the Kaanul (Snake) kingdom, then based at Dzibanché, attacked Palenque in 599 and sacked it in 611. Pakal, born 603, became king of Palenque aged twelve in 615. In the 630s the Kaanul royal seat moved to Calakmul.","events":[{"y":599,"approx":false,"t":"Kaanul (Snake) forces from Dzibanché attack Palenque, a defeat recorded in Palenque's inscriptions."},{"y":600,"approx":true,"t":"Teotihuacan's major buildings are burned and sculptures smashed (date debated); the city stays inhabited but loses its regional dominance."},{"y":603,"approx":false,"t":"K'inich Janaab Pakal, the future king of Palenque, is born."},{"y":611,"approx":false,"t":"Palenque is sacked a second time by the Kaanul king Scroll Serpent."},{"y":612,"approx":false,"t":"Muwaan Mat becomes ruler of Palenque after the death of Aj Ne' Yohl Mat."},{"y":615,"approx":false,"t":"Pakal, aged twelve, becomes king of Palenque; he rules until 683."},{"y":635,"approx":true,"t":"The Kaanul royal seat moves from Dzibanché to Calakmul (c. 631–636, debated); Yuknoom Ch'een II takes the throne in 636."}],"link":null,"evidence":"moderate","sources":[{"title":"Table of Palenque Rulers","publisher":"Mesoweb","url":"https://www.mesoweb.com/palenque/resources/rulers/rulers_table.html"},{"title":"In search of the serpent kings: From Dzibanche to Calakmul","publisher":"Ancient Mesoamerica (Cambridge University Press)","url":"https://www.cambridge.org/core/journals/ancient-mesoamerica/article/in-search-of-the-serpent-kings-from-dzibanche-to-calakmul/CA64F5753086F211D772C2B38DFF46CF"},{"title":"Teotihuacan","publisher":"World History Encyclopedia","url":"https://www.worldhistory.org/Teotihuacan/"}]},"Guatemala":{"polity":"Maya kingdoms (Tikal, Naranjo and others) under pressure from the Kaanul (Snake) kingdom and Caracol","summary":"The Petén lowlands were divided among rival Maya kingdoms that recorded dynastic history in hieroglyphic inscriptions. Tikal's king Wak Chan K'awiil had been defeated in a 'star war' in 562, and the city raised almost no monuments for about 130 years. The Kaanul (Snake) kingdom and its ally Caracol dominated the region, and Naranjo was defeated by Caracol between 626 and 631.","events":[{"y":575,"approx":true,"t":"Tikal's 'hiatus' (557–692) continues after its defeat in 562: almost no dated monuments are raised there."},{"y":625,"approx":false,"t":"B'ajlaj Chan K'awiil, a Tikal prince who later rules from Dos Pilas and sides with Calakmul, is born at Tikal."},{"y":626,"approx":false,"t":"Caracol attacks Naranjo, the first of three assaults recorded for 626–627."},{"y":631,"approx":false,"t":"Naranjo is conquered in a 'star war'; inscriptions credit Caracol's K'an II and the Kaanul ruler Yuknoom Head."}],"link":null,"evidence":"moderate","sources":[{"title":"In search of the serpent kings: From Dzibanche to Calakmul","publisher":"Ancient Mesoamerica (Cambridge University Press)","url":"https://www.cambridge.org/core/journals/ancient-mesoamerica/article/in-search-of-the-serpent-kings-from-dzibanche-to-calakmul/CA64F5753086F211D772C2B38DFF46CF"},{"title":"Stanley Guenter, The Inscriptions of Dos Pilas Associated with B'ajlaj Chan K'awiil","publisher":"Mesoweb","url":"https://www.mesoweb.com/features/guenter/DosPilas.pdf"},{"title":"A. F. Chase and D. Z. Chase, The Materialization of Classic Period Maya Warfare: Caracol Stranger-Kings at Tikal","publisher":"Caracol Archaeological Project (book chapter)","url":"https://caracol.org/wp-content/uploads/2020/04/Chases20war.pdf"}]},"Belize":{"polity":"Maya kingdom of Caracol, ally of the Kaanul (Snake) kingdom","summary":"Caracol, in the Maya Mountains, was rising. It took part in the 562 'star war' defeat of Tikal, though some scholars now credit a Kaanul (Snake) king as the main victor. Under K'an II, who ruled 618–658, Caracol repeatedly attacked Naranjo. Archaeology shows rapid population growth and an expanding causeway system after these wars.","events":[{"y":599,"approx":false,"t":"A ruler known as Knot Ajaw (also read Flame Ajaw) is seated at Caracol, between Yajaw Te' K'inich II and his son K'an II."},{"y":618,"approx":false,"t":"K'an II becomes king of Caracol; he rules until his death in 658."},{"y":626,"approx":false,"t":"K'an II's forces make the first of three attacks on Naranjo (626–627)."},{"y":631,"approx":false,"t":"Caracol defeats Naranjo in a 'star war', recorded on Caracol Stela 3 and Naranjo's hieroglyphic stairway."}],"link":null,"evidence":"moderate","sources":[{"title":"A. F. Chase and D. Z. Chase, The Materialization of Classic Period Maya Warfare: Caracol Stranger-Kings at Tikal","publisher":"Caracol Archaeological Project (book chapter)","url":"https://caracol.org/wp-content/uploads/2020/04/Chases20war.pdf"},{"title":"In search of the serpent kings: From Dzibanche to Calakmul","publisher":"Ancient Mesoamerica (Cambridge University Press)","url":"https://www.cambridge.org/core/journals/ancient-mesoamerica/article/in-search-of-the-serpent-kings-from-dzibanche-to-calakmul/CA64F5753086F211D772C2B38DFF46CF"},{"title":"Simon Martin and Nikolai Grube, Chronicle of the Maya Kings and Queens, 2nd ed. (2008)","publisher":"Thames & Hudson","url":null}]},"Honduras":{"polity":"Maya kingdom of Copán; non-Maya societies elsewhere","summary":"Copán, in the far southeast of the Maya world, was a royal city whose dynasty traced its founding to K'inich Yax K'uk' Mo', inaugurated in 426. Butz' Chan ruled from 578 to 628. He was followed by K'ahk' Uti' Witz' K'awiil ('Smoke Imix'), the 12th ruler, who reigned from 628 to 695.","events":[{"y":578,"approx":false,"t":"Butz' Chan, the eleventh ruler, becomes king of Copán."},{"y":628,"approx":false,"t":"K'ahk' Uti' Witz' K'awiil ('Smoke Imix'), the 12th ruler, becomes king of Copán; he reigns until 695."}],"link":null,"evidence":"moderate","sources":[{"title":"Copan Monument Manual, Part 2 (Stela E)","publisher":"FAMSI","url":"https://www.famsi.org/research/copan/monuments/CopanMonumentManualPart2.pdf"},{"title":"Time of Kings and Queens","publisher":"Expedition Magazine, Penn Museum","url":"https://www.penn.museum/sites/expedition/time-of-kings-and-queens/"},{"title":"Simon Martin and Nikolai Grube, Chronicle of the Maya Kings and Queens, 2nd ed. (2008)","publisher":"Thames & Hudson","url":null}]},"El Salvador":{"polity":null,"evidence":"sparse","pending":true,"sources":[],"events":[],"link":null},"Nicaragua":{"polity":null,"evidence":"sparse","pending":true,"sources":[],"events":[],"link":null},"Costa Rica":{"polity":null,"evidence":"sparse","pending":true,"sources":[],"events":[],"link":null},"Panama":{"polity":null,"evidence":"sparse","pending":true,"sources":[],"events":[],"link":null},"Cuba":{"polity":null,"evidence":"sparse","pending":true,"sources":[],"events":[],"link":null},"Bahamas":{"polity":null,"evidence":"sparse","pending":true,"sources":[],"events":[],"link":null},"Jamaica":{"polity":null,"evidence":"sparse","pending":true,"sources":[],"events":[],"link":null},"Haiti":{"polity":null,"evidence":"sparse","pending":true,"sources":[],"events":[],"link":null},"Dominican Rep.":{"polity":null,"evidence":"sparse","pending":true,"sources":[],"events":[],"link":null},"Puerto Rico":{"polity":null,"evidence":"sparse","pending":true,"sources":[],"events":[],"link":null},"Trinidad and Tobago":{"polity":null,"evidence":"sparse","pending":true,"sources":[],"events":[],"link":null},"Colombia":{"polity":null,"evidence":"sparse","pending":true,"sources":[],"events":[],"link":null},"Venezuela":{"polity":null,"evidence":"sparse","pending":true,"sources":[],"events":[],"link":null},"Guyana":{"polity":null,"evidence":"sparse","pending":true,"sources":[],"events":[],"link":null},"Suriname":{"polity":null,"evidence":"sparse","pending":true,"sources":[],"events":[],"link":null},"Ecuador":{"polity":null,"evidence":"sparse","pending":true,"sources":[],"events":[],"link":null},"Peru":{"polity":null,"evidence":"moderate","pending":true,"sources":[],"events":[],"link":null},"Bolivia":{"polity":null,"evidence":"moderate","pending":true,"sources":[],"events":[],"link":null},"Chile":{"polity":null,"evidence":"sparse","pending":true,"sources":[],"events":[],"link":null},"Argentina":{"polity":null,"evidence":"sparse","pending":true,"sources":[],"events":[],"link":null},"Paraguay":{"polity":null,"evidence":"sparse","pending":true,"sources":[],"events":[],"link":null},"Uruguay":{"polity":null,"evidence":"sparse","pending":true,"sources":[],"events":[],"link":null},"Brazil":{"polity":null,"evidence":"sparse","pending":true,"sources":[],"events":[],"link":null},"Falkland Is.":{"polity":null,"evidence":"sparse","pending":true,"sources":[],"events":[],"link":null},"China":{"polity":"Northern Zhou and Chen, then Sui (581-618) and Tang (618-); Tibetan kingdom of Songtsen Gampo in the west","summary":"Yang Jian (Emperor Wen) founded the Sui in 581 and reunified China by conquering the southern Chen in 589. His son Yangdi extended the canal system linking north and south but exhausted the realm with failed wars on Goguryeo in 612-614. Yangdi was killed in 618 and Li Yuan founded the Tang. His son Taizong took power in 626. In Tibet, Songtsen Gampo built an expanding kingdom ruled from Lhasa.","events":[{"y":589,"approx":false,"t":"Sui armies overthrow the southern Chen dynasty, reunifying China under Emperor Wen."},{"y":605,"approx":false,"t":"Yangdi begins the New Bian Canal, the first great section of the Grand Canal, linking the Yellow River region with the Huai."},{"y":612,"approx":false,"t":"Yangdi's huge invasion of Goguryeo is defeated at the Salsu River; further campaigns in 613 and 614 also fail."},{"y":618,"approx":false,"t":"Yangdi is murdered by his own entourage at Jiangdu; Li Yuan proclaims the Tang dynasty and reigns as Gaozu."},{"y":626,"approx":false,"t":"Li Shimin kills his rival brothers in a palace coup; Gaozu abdicates and Li Shimin reigns as Taizong."},{"y":629,"approx":true,"t":"Songtsen Gampo is crowned king of Tibet (traditional date; sources differ) and later extends Tibetan rule."}],"link":null,"evidence":"rich","sources":[{"title":"China: The Sui dynasty","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/place/China/The-Sui-dynasty"},{"title":"Gaozu, emperor of Tang dynasty","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/biography/Gaozu-emperor-of-Tang-dynasty"},{"title":"Srong-brtsan-sgam-po","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/biography/Srong-brtsan-sgam-po"}]},"Taiwan":{"polity":null,"evidence":"sparse","pending":true,"sources":[],"events":[],"link":null},"Japan":{"polity":"Yamato court (Asuka period) under Empress Suiko, then Emperor Jomei","summary":"The Yamato court ruled from the Asuka area. After defeating the rival Mononobe clan in 587, the Soga clan dominated the court. Empress Suiko (r. 592-628) reigned with Prince Shotoku as regent. Buddhism was patronised and temples such as Asuka-dera and Horyu-ji were built, while Chinese writing and administrative methods were adopted. Official embassies to Sui China began about 607.","events":[{"y":587,"approx":false,"t":"The Soga clan under Soga no Umako defeats the Mononobe, opponents of Buddhism, and comes to dominate the court."},{"y":593,"approx":true,"t":"Prince Shotoku becomes regent for Empress Suiko, Japan's first empress (sources give 593 or 594)."},{"y":604,"approx":false,"t":"The Seventeen-Article Constitution, attributed to Prince Shotoku though his authorship is doubted, sets out Buddhist and Confucian principles of government."},{"y":607,"approx":true,"t":"Horyu-ji temple is completed, and the first official Japanese embassy is sent to the Sui court."},{"y":622,"approx":false,"t":"Death of Prince Shotoku."},{"y":629,"approx":false,"t":"Jomei becomes emperor, reigning until 641."}],"link":null,"evidence":"moderate","sources":[{"title":"Asuka period","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/event/Asuka-period"},{"title":"Taishi Shotoku","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/biography/Taishi-Shotoku"},{"title":"Asuka Period","publisher":"World History Encyclopedia","url":"https://www.worldhistory.org/Asuka_Period/"}]},"North Korea":{"polity":"Goguryeo kingdom (capital Pyongyang)","summary":"This land was the heart of Goguryeo, the northernmost of Korea's Three Kingdoms, ruled from Pyongyang since 427. Under King Yeongyang (r. 590-618) it repelled Sui invasions in 598 and 612-614, most famously when general Eulji Mundeok won a great victory at the Salsu River in 612. Goguryeo was a Buddhist state, and many tombs of its elite were decorated with painted murals.","events":[{"y":598,"approx":false,"t":"A Sui invasion of Goguryeo fails after the army runs short of supplies and meets heavy rains."},{"y":612,"approx":false,"t":"General Eulji Mundeok wins a great victory over a huge Sui army at the Salsu River."},{"y":614,"approx":false,"t":"After a failed attack in 613, a further Sui campaign in 614 is also repelled."},{"y":618,"approx":false,"t":"King Yeongnyu succeeds Yeongyang, reigning until 642."},{"y":628,"approx":true,"t":"Goguryeo builds a defensive wall some 480 km long against China (date disputed; often given as 631)."}],"link":null,"evidence":"moderate","sources":[{"title":"Goguryeo","publisher":"World History Encyclopedia","url":"https://www.worldhistory.org/Goguryeo/"},{"title":"Sui Dynasty","publisher":"World History Encyclopedia","url":"https://www.worldhistory.org/Sui_Dynasty/"},{"title":"List of Rulers of Korea (Heilbrunn Timeline of Art History)","publisher":"The Metropolitan Museum of Art","url":"https://www.metmuseum.org/toah/hd/koru/hd_koru.htm"}]},"South Korea":{"polity":"Silla (southeast) and Baekje (southwest), two of Korea's Three Kingdoms","summary":"The south was divided between Silla, ruled from Geumseong (modern Gyeongju), which had absorbed the Gaya confederation by 562, and Baekje in the southwest, ruled from Sabi (modern Buyeo) since 538. They had been enemies since Silla seized the lower Han River valley in the 550s. Both were Buddhist kingdoms; Baekje sent teachers, scholars and craftsmen to Japan. Silla's King Jinpyeong (r. 579-632) was succeeded by his daughter Seondeok.","events":[{"y":579,"approx":false,"t":"King Jinpyeong begins a long reign in Silla."},{"y":600,"approx":false,"t":"King Mu takes the throne of Baekje (r. 600-641); he builds Mireuksa at Iksan, the largest Buddhist temple in East Asia."},{"y":632,"approx":false,"t":"Seondeok succeeds her father Jinpyeong, becoming the first female sovereign in ancient Korea."}],"link":null,"evidence":"moderate","sources":[{"title":"Silla","publisher":"World History Encyclopedia","url":"https://www.worldhistory.org/Silla/"},{"title":"Baekje","publisher":"World History Encyclopedia","url":"https://www.worldhistory.org/Baekje/"},{"title":"Three Kingdoms Period in Korea","publisher":"World History Encyclopedia","url":"https://www.worldhistory.org/Three_Kingdoms_Period_in_Korea/"}]},"Myanmar":{"polity":null,"evidence":"sparse","pending":true,"sources":[],"events":[],"link":null},"Thailand":{"polity":null,"evidence":"sparse","pending":true,"sources":[],"events":[],"link":null},"Laos":{"polity":"Early Khmer kingdom in the south; local chiefdoms elsewhere","summary":"Southern Laos, around Wat Phu near Champasak, lay within the early Khmer world; Wat Phu was one of the important early Khmer centres along the Mekong. Elsewhere lived upland farming peoples with no recorded states.","events":[{"y":600,"approx":true,"t":"Wat Phu is an important centre of the early Khmer people along the Mekong."}],"link":null,"evidence":"sparse","sources":[{"title":"Khmer Empire","publisher":"World History Encyclopedia","url":"https://www.worldhistory.org/Khmer_Empire/"}]},"Cambodia":{"polity":"Early Khmer kingdom","summary":"By the 7th century Khmer people inhabited lands along the Mekong, and Sambor Prei Kuk was among their important early cities, alongside Angkor Borei and Banteay Prei Nokor. Details of rulers and dates for this period could not be confirmed in this check.","events":[{"y":600,"approx":true,"t":"Sambor Prei Kuk flourishes as one of the important early Khmer cities."}],"link":null,"evidence":"moderate","sources":[{"title":"Khmer Empire","publisher":"World History Encyclopedia","url":"https://www.worldhistory.org/Khmer_Empire/"}]},"Vietnam":{"polity":"North: Chinese-ruled Annam region under Sui, then Tang; centre: Champa; far south: Khmer lands","summary":"In the early 7th century Sui armies campaigned in the region, taking territory in the north (Annam) and from the kingdom of Champa on the central coast. The Mekong delta in the far south lay within the Khmer world along the Mekong.","events":[{"y":605,"approx":true,"t":"Sui armies take territory from Annam and Champa (early 7th century; exact dates vary)."}],"link":null,"evidence":"moderate","sources":[{"title":"Sui Dynasty","publisher":"World History Encyclopedia","url":"https://www.worldhistory.org/Sui_Dynasty/"},{"title":"Khmer Empire","publisher":"World History Encyclopedia","url":"https://www.worldhistory.org/Khmer_Empire/"}]},"Malaysia":{"polity":null,"evidence":"sparse","pending":true,"sources":[],"events":[],"link":null},"Brunei":{"polity":null,"evidence":"sparse","pending":true,"sources":[],"events":[],"link":null},"Indonesia":{"polity":null,"evidence":"sparse","pending":true,"sources":[],"events":[],"link":null},"Philippines":{"polity":null,"evidence":"sparse","pending":true,"sources":[],"events":[],"link":null},"Timor-Leste":{"polity":null,"evidence":"sparse","pending":true,"sources":[],"events":[],"link":null},"Papua New Guinea":{"polity":null,"evidence":"sparse","pending":true,"sources":[],"events":[],"link":null},"Australia":{"polity":null,"evidence":"sparse","pending":true,"sources":[],"events":[],"link":null},"New Zealand":{"polity":null,"evidence":"sparse","pending":true,"sources":[],"events":[],"link":null},"Fiji":{"polity":null,"evidence":"sparse","pending":true,"sources":[],"events":[],"link":null},"Vanuatu":{"polity":null,"evidence":"sparse","pending":true,"sources":[],"events":[],"link":null},"Solomon Is.":{"polity":null,"evidence":"sparse","pending":true,"sources":[],"events":[],"link":null},"New Caledonia":{"polity":null,"evidence":"sparse","pending":true,"sources":[],"events":[],"link":null},"Antarctica":{"polity":null,"evidence":"sparse","pending":true,"sources":[],"events":[],"link":null},"Fr. S. Antarctic Lands":{"polity":null,"evidence":"sparse","pending":true,"sources":[],"events":[],"link":null},"Albania":{"polity":"Eastern Roman (Byzantine) Empire","summary":"Still Roman (Byzantine) territory ruled from Constantinople, with Dyrrachium (Durrës) as its chief Adriatic city. Much of the population descended from the Illyrians. Avar and Slav pressure on the Balkans grew from the 580s, and Slavs came to occupy much of the peninsula, while older populations held out in the mountains. Cemeteries such as Komani, used from the 6th to 8th centuries, attest a continuing local population.","events":[{"y":582,"approx":false,"t":"The Avars capture Sirmium, the empire's main stronghold on the middle Danube, opening the Balkans to deeper raiding."},{"y":600,"approx":true,"t":"The large Komani cemetery in the north (6th–8th centuries) shows a local population persisting through the period."},{"y":610,"approx":false,"t":"Heraclius becomes emperor; the Balkan frontier, crumbling since 602, is not restored while he fights Persia."}],"link":null,"evidence":"sparse","sources":[{"title":"History of Albania","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/topic/history-of-Albania"},{"title":"Durrës","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/place/Durres"},{"title":"Early Medieval North Albania: New Discoveries, Remodeling Connections. The Case of Medieval Komani","publisher":"Edizioni Ca' Foscari (Ca' Foscari University of Venice)","url":"https://edizionicafoscari.unive.it/en/edizioni4/libri/978-88-6969-114-0/early-medieval-north-albania-new-discoveries-remod/"}]},"Belarus":{"polity":"Baltic-speaking peoples, with Slavs beginning to arrive (no state)","summary":"No written sources describe this region in these decades. Archaeology shows Baltic-speaking farming communities, such as the Bancer-Tushemlya culture of the upper Dnieper and Neman, with hillforts used as refuges, mixed farming and cremation burials under mounds. Slavic settlement of the region began in the 6th to 8th centuries, and the Balts were gradually Slavicized. Religion was local and pagan.","events":[{"y":600,"approx":true,"t":"Bancer-Tushemlya culture (6th–8th centuries): hillforts, farming and barrow cremations across the upper Dnieper, upper Neman and Daugava."}],"link":null,"evidence":"sparse","sources":[{"title":"History of Belarus","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/topic/history-of-Belarus"},{"title":"Bancerovo-Tušemlios kultūra","publisher":"Visuotinė lietuvių enciklopedija (Universal Lithuanian Encyclopedia)","url":"https://www.vle.lt/straipsnis/bancerovo-tusemlios-kultura/"},{"title":"Balt","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/topic/Balt"}]},"Bosnia and Herz.":{"polity":"Eastern Roman Empire in name (inland Dalmatia); Avar raids and Slav settlement","summary":"Most of this land lay in the Roman province of Dalmatia, and after Justinian expelled the Goths it was, at least on paper, part of the Byzantine Empire. Avar raids hit Dalmatia in the late 500s, and Slavs settled widely in the following decades; a second wave in the 7th century included Croats and Serbs. Written sources are almost silent, so the picture comes mainly from archaeology.","events":[{"y":582,"approx":false,"t":"Fall of Sirmium to the Avars exposes the western Balkans to raiding."},{"y":614,"approx":true,"t":"Salona, capital of Dalmatia, is sacked by Avars and Slavs (c. 614–615, date disputed); Roman rule inland effectively ends."}],"link":null,"evidence":"sparse","sources":[{"title":"Bosnia and Herzegovina: History","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/place/Bosnia-and-Herzegovina/History"},{"title":"Montenegro: History","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/place/Montenegro/History"},{"title":"Palace of Diocletian","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/topic/Palace-of-Diocletian"}]},"Bulgaria":{"polity":"Eastern Roman Empire (Thrace and Moesia), under Avar and Slav pressure","summary":"This was Roman Thrace and Moesia, close to Constantinople and defended along the Danube. From the 580s Slavs pushed into the Balkans, and the Avars pressed the frontier. Emperor Maurice campaigned constantly and drove the Avars back across the Danube, but his order for troops to winter north of the river caused the mutiny of 602 that put Phocas on the throne. After 602 the frontier crumbled.","events":[{"y":585,"approx":true,"t":"After the Avar and Slav sieges of Sirmium and Singidunum in the 580s, Slavs push deep into the Balkans."},{"y":595,"approx":true,"t":"Maurice's armies campaign repeatedly against Avars and Slavs, forcing the Avars back across the Danube by 602."},{"y":602,"approx":false,"t":"Army on the Danube mutinies over wintering north of the river; Phocas marches on Constantinople and Maurice is overthrown."},{"y":626,"approx":false,"t":"The Avars and their Slav allies, coordinating with a Persian army, besiege Constantinople and fail."}],"link":null,"evidence":"moderate","sources":[{"title":"Byzantine Empire: The successors of Justinian, 565–610","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/place/Byzantine-Empire/The-successors-of-Justinian-565-610"},{"title":"Maurice (Byzantine emperor)","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/biography/Maurice-Byzantine-emperor"},{"title":"Avar","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/topic/Avar"}]},"Croatia":{"polity":"Eastern Roman Empire (Dalmatia and Istria), collapsing before Avars and Slavs","summary":"Roman Dalmatia, centred on Salona, remained Christian under Constantinople, and its church was in contact with Pope Gregory I. Avar and Slav raids devastated the region from the late 500s. Around 614–615 Salona was sacked, and its people built a new town inside Diocletian's palace at Split. Byzantine tradition says Heraclius later allowed Croats to settle in the northwest Balkans.","events":[{"y":595,"approx":true,"t":"Pope Gregory I contests the irregular consecration of Maximus as bishop of Salona; Maximus clears himself by oath at Ravenna c. 599."},{"y":614,"approx":true,"t":"Avars sack Salona; refugees build a new town inside Diocletian's palace at Split (614 or 615, date disputed)."},{"y":630,"approx":true,"t":"Croats settle in the northwest Balkans with the consent of Heraclius, according to Byzantine tradition (date disputed)."}],"link":null,"evidence":"moderate","sources":[{"title":"Palace of Diocl
