etian","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/topic/Palace-of-Diocletian"},{"title":"Split (Croatia) summary","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/summary/Split-Croatia"},{"title":"E06384: Two letters and a memorandum of Pope Gregory the Great (Register 9.178, 9.179 and Appendix V) of 598/599 on the oath of Maximus, bishop of Salona","publisher":"The Cult of Saints in Late Antiquity database, University of Oxford","url":"https://portal.sds.ox.ac.uk/articles/online_resource/E06384_Two_letters_and_a_memorandum_of_Pope_Gregory_the_Great_Register_9_178_9_179_and_Appendix_V_of_598_599_require_and_describe_the_oath_that_Maximus_bishop_of_Salona_had_to_swear_in_order_to_absolve_himself_of_excommunication_at_the_grav/13902206"}]},"Czechia":{"polity":"Slavic tribes; probably part of Samo's realm (c. 623–658)","summary":"Slavic farmers lived in small villages of sunken-floor houses, as excavated at Roztoky near Prague, many under Avar domination. Around 623 a Frankish merchant named Samo was chosen king by the Slavs (Wends) after their revolt against the Avars, and he ruled until 658. His realm probably included part of Bohemia, but its centre is debated. The main source is the Frankish Chronicle of Fredegar.","events":[{"y":600,"approx":true,"t":"Early Slavic villages of sunken-floor houses spread in Bohemia, as at Roztoky in the Vltava valley."},{"y":623,"approx":true,"t":"Samo is chosen king by the Slavs after their revolt against the Avars (623 or 624)."},{"y":631,"approx":true,"t":"Samo defeats the army of the Frankish king Dagobert I at Wogastisburg (location unknown)."}],"link":null,"evidence":"moderate","sources":[{"title":"Samo","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/biography/Samo-Frankish-merchant"},{"title":"Samo","publisher":"World History Encyclopedia","url":"https://www.worldhistory.org/Samo/"},{"title":"The Early Medieval Site of Roztoky: A Puzzle in the Vltava Valley","publisher":"Czech Academy of Sciences (ASEP repository)","url":"https://asep.lib.cas.cz/arl-cav/cs/detail-cav_un_epca-0550946-The-Early-Medieval-Site-of-Roztoky-A-Puzzle-in-the-Vltava-Valley"}]},"Greece":{"polity":"Eastern Roman (Byzantine) Empire, with Slav settlement inland","summary":"Greece was Greek-speaking, Christian Roman territory ruled from Constantinople. Thessalonica was the great city of the region and, like Corinth, held out as a fortified port. Slavs, often allied with the Avars, overran much of the interior, and new populations reached deep into the Peloponnese, while building largely stopped. Heraclius became emperor in 610.","events":[{"y":586,"approx":false,"t":"Avars and Slavs besiege Thessalonica; the city credits its deliverance to Saint Demetrius."},{"y":610,"approx":false,"t":"Heraclius overthrows Phocas and becomes emperor."},{"y":615,"approx":true,"t":"Further Slav and Avar attacks on Thessalonica in the 610s (dates disputed); the city holds."},{"y":620,"approx":true,"t":"Newcomers settle deep in the Peloponnese; the later, controversial Chronicle of Monemvasia describes Greek flight (dates disputed)."}],"link":null,"evidence":"moderate","sources":[{"title":"Greece","publisher":"Encyclopaedia Britannica (Britannica Scholars)","url":"https://kids.britannica.com/scholars/article/Greece/106266"},{"title":"The festival of Saint Demetrios, the Timarion, and the Aithiopika","publisher":"Byzantine and Modern Greek Studies (Cambridge University Press)","url":"https://www.cambridge.org/core/journals/byzantine-and-modern-greek-studies/article/abs/festival-of-saint-demetrios-the-timarion-and-the-aithiopika/FA9627E1318C114553DDCB0BE7BE419B"},{"title":"Chronicle of Monemvasia, in A Guide to Byzantine Historical Writing","publisher":"Cambridge University Press","url":"https://www.cambridge.org/core/books/abs/guide-to-byzantine-historical-writing/chronicle-of-monemvasia/05A19DE94B1B38F98EC673EA242079E6"}]},"Hungary":{"polity":"Avar Khaganate (heartland in the Carpathian Basin)","summary":"From 567–568 the Carpathian Basin was the centre of the Avar Khaganate, a steppe empire ruled by a khagan over Gepids, Slavs, and other peoples. The Avars took Sirmium in 582 and extracted tribute from Constantinople. After their failed siege of Constantinople in 626 their raids into the Balkans ended. Rich elite graves, such as Kunbábony, reflect their wealth.","events":[{"y":582,"approx":false,"t":"The Avars take Sirmium after a siege."},{"y":604,"approx":false,"t":"Phocas makes peace with the Avars by agreeing to a larger annual tribute."},{"y":626,"approx":false,"t":"The Avar khagan leads a failed siege of Constantinople with Slav allies, coordinated with a Persian army."},{"y":631,"approx":true,"t":"After strife within the khaganate, a group of Bulgars flees Avar Pannonia to the Frankish king Dagobert I (Fredegar)."}],"link":null,"evidence":"moderate","sources":[{"title":"Avar","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/topic/Avar"},{"title":"Byzantine Empire: The successors of Justinian, 565–610","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/place/Byzantine-Empire/The-successors-of-Justinian-565-610"},{"title":"Genetic insights into the social organisation of the Avar period elite in the 7th century AD Carpathian Basin","publisher":"Scientific Reports (PubMed Central)","url":"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC6976699/"}]},"Kosovo":{"polity":"Eastern Roman Empire (Dardania), giving way to Slav settlement","summary":"This was part of the Roman province of Dardania, with towns such as Ulpiana, which Justinian rebuilt as Justiniana Secunda. From the 580s Avar and Slav pressure on the Balkans grew, and after 602 imperial control faded. Slavic groups eventually settled the land. Written evidence is thin, so the picture relies mostly on archaeology.","events":[{"y":585,"approx":true,"t":"Slavs, following Avar and Slav sieges on the Danube, push deep into the central Balkans."},{"y":602,"approx":false,"t":"Mutiny on the Danube topples Maurice; afterwards the Balkan frontier crumbles."}],"link":null,"evidence":"sparse","sources":[{"title":"Mosaic Inscription Connects Justinian to Ancient City in Kosovo","publisher":"Archaeology (Archaeological Institute of America)","url":"https://archaeology.org/news/2025/08/08/mosaic-inscription-connects-justinian-to-ancient-city-in-kosovo/"},{"title":"Ulpiana / Iustiniana secunda","publisher":"ChronoCarto, École normale supérieure","url":"https://www.chronocarto.ens.fr/wpchrono/?p=1363"},{"title":"Byzantine Empire: The successors of Justinian, 565–610","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/place/Byzantine-Empire/The-successors-of-Justinian-565-610"}]},"Macedonia":{"polity":"Eastern Roman Empire, with growing Slav settlement","summary":"This upper Vardar region belonged to the Roman provinces of Macedonia. Slavic tribes began settling Macedonia in the 6th century, and Avar and Slav raids hit the Balkans from the 580s. Towns declined: Stobi was abandoned around the end of the 6th century. The empire held on to Thessalonica to the south. Evidence is fragmentary.","events":[{"y":586,"approx":false,"t":"Avars and Slavs besiege Thessalonica, the great city to the south."},{"y":595,"approx":true,"t":"Stobi is abandoned around the last decade of the 6th century (date disputed)."}],"link":null,"evidence":"sparse","sources":[{"title":"Macedonia (region, Europe)","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/place/Macedonia-region-Europe"},{"title":"Taking care of an archaeological site (Stobi)","publisher":"Istorijski zapisi (journal)","url":"https://istorijskizapisi.me/wp-content/uploads/2021/01/Nikolovski-Taking-care-of-an-archaeological-site.pdf"},{"title":"The festival of Saint Demetrios, the Timarion, and the Aithiopika","publisher":"Byzantine and Modern Greek Studies (Cambridge University Press)","url":"https://www.cambridge.org/core/journals/byzantine-and-modern-greek-studies/article/abs/festival-of-saint-demetrios-the-timarion-and-the-aithiopika/FA9627E1318C114553DDCB0BE7BE419B"}]},"Moldova":{"polity":"Slavic communities (Antes nearby) under Avar and steppe pressure","summary":"Slavs began entering this area in the 6th century. To the east, the Antes, an eastern Slavic tribal alliance between the Dnieper and Dniester, fought the Avars from the late 500s. There were no towns or kings recorded here, and sources say almost nothing specific about this territory.","events":[{"y":600,"approx":true,"t":"Wars with the Avars break up the Antes alliance; Byzantine writers stop mentioning the Antes in the early 7th century."}],"link":null,"evidence":"sparse","sources":[{"title":"Bessarabia","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/place/Bessarabia"},{"title":"Antes","publisher":"Internet Encyclopedia of Ukraine (Canadian Institute of Ukrainian Studies)","url":"https://www.encyclopediaofukraine.com/display.asp?linkpath=pages\\A\\N\\Antes.htm"}]},"Montenegro":{"polity":"Eastern Roman Empire, giving way to Slav settlement","summary":"Before the Slavs arrived, the area was inhabited mainly by Illyrians and formed part of the Roman world. Avars raided the Adriatic coast in the 6th century as Roman power declined, and Slavs became widely established in Dalmatia by the mid-7th century. Serbs settled inland, including northern Montenegro. The rugged terrain sheltered older groups. Written sources are very thin.","events":[{"y":590,"approx":true,"t":"Avar raids strike the Adriatic coast as Roman power declines."},{"y":630,"approx":true,"t":"Serbs settle inland of the Dalmatian coast, including northern Montenegro (date disputed)."}],"link":null,"evidence":"sparse","sources":[{"title":"Montenegro: History","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/place/Montenegro/History"},{"title":"Serbia: History","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/place/Serbia/History"}]},"Poland":{"polity":"Slavic tribes and Baltic peoples (no state)","summary":"Slavs enter the written record in the 6th century, and when they reached this region is debated: some scholars favour migration from the 6th century, others longer local roots. Material culture across the region became more uniform after the Migration Period. Baltic peoples lived as far west as the mouth of the Vistula. There were no towns, kings, or writing, and religion was pagan.","events":[{"y":600,"approx":true,"t":"Material cultures across the region grow more uniform, a change archaeologists link to Slavs (date of arrival debated)."}],"link":null,"evidence":"sparse","sources":[{"title":"Slav","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/topic/Slav"},{"title":"Balt","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/topic/Balt"},{"title":"Genetic history of East-Central Europe in the first millennium CE","publisher":"Peer-reviewed article (PubMed Central)","url":"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC10364380/"}]},"Romania":{"polity":"Slavs and Avars north of the Danube; Byzantine frontier on the river","summary":"North of the Danube lived Slavic groups, often under Avar power, who raided the empire. Emperor Maurice campaigned constantly against Avars and Slavs and pushed the Avars back across the Danube, but his order to winter beyond the river in 602 caused a mutiny that toppled him. After 602 the Danube frontier crumbled.","events":[{"y":595,"approx":true,"t":"Maurice's armies campaign along and across the Danube against Slavs and Avars."},{"y":602,"approx":false,"t":"Maurice orders the army to winter north of the Danube, triggering the mutiny that topples him."}],"link":null,"evidence":"moderate","sources":[{"title":"Byzantine Empire: The successors of Justinian, 565–610","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/place/Byzantine-Empire/The-successors-of-Justinian-565-610"},{"title":"Maurice (Byzantine emperor)","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/biography/Maurice-Byzantine-emperor"}]},"Russia":{"polity":"Turkic powers and emerging Khazars in the south; Great Bulgaria (c. 635); northern forest peoples","summary":"The southern steppe and north Caucasus were under Turkic powers, from which the Khazars emerged as a major force. Khazar forces allied with Heraclius against Persia in 627. Around 635 the Bulgar ruler Kubrat revolted against the Avars and formed Great Bulgaria, bounded to the south by the Kuban River. Little is recorded of the vast northern forest zone.","events":[{"y":627,"approx":false,"t":"Khazar forces allied to Heraclius invade the Caucasus, taking Darband and Tiflis (627–628)."},{"y":635,"approx":true,"t":"Kubrat leads the Bulgars in revolt against the Avars and forms Great Bulgaria (date disputed)."}],"link":null,"evidence":"moderate","sources":[{"title":"Khazars","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/khazars/"},{"title":"Khagan","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/khagan/"},{"title":"Kurt (Kubrat), Bulgar khan","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/biography/Kurt"}]},"Serbia":{"polity":"Eastern Roman Empire (Danube frontier), contested by Avars and Slavs","summary":"This was the Danube frontier of the Roman Empire, guarded by cities such as Singidunum (Belgrade), with Sirmium nearby. Justiniana Prima (Caričin Grad), built by Justinian near his birthplace, was an archbishopric seat. Avar and Slav sieges in the 580s broke the frontier, which crumbled after 602. The Serbs, once Avar vassals, later became clients of Heraclius.","events":[{"y":582,"approx":false,"t":"Sirmium falls to the Avars."},{"y":584,"approx":true,"t":"Singidunum falls during the Avar and Slav sieges of the 580s."},{"y":602,"approx":false,"t":"Mutiny on the Danube topples Maurice; afterwards the frontier crumbles."},{"y":615,"approx":true,"t":"Justiniana Prima (Caričin Grad) is abandoned under Heraclius amid Slavic invasions (date approximate)."}],"link":null,"evidence":"moderate","sources":[{"title":"Byzantine Empire: The successors of Justinian, 565–610","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/place/Byzantine-Empire/The-successors-of-Justinian-565-610"},{"title":"Caričin Grad (Tentative List)","publisher":"UNESCO World Heritage Centre","url":"https://whc.unesco.org/en/tentativelists/5539/"},{"title":"Serbia: History","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/place/Serbia/History"}]},"Slovakia":{"polity":"Slavs under Avar rule; possibly part of Samo's realm (c. 623–658)","summary":"By the 6th century Slavs lived between the Avar Khaganate in the Carpathian Basin and the Frankish kingdom, many under Avar domination. Around 623 Samo, a Frankish merchant, became king of Slavs who had revolted against the Avars; Slovakia is among the proposed centres of his realm. There were no towns, and religion was pagan.","events":[{"y":623,"approx":true,"t":"Samo is chosen king by the Slavs after their revolt against the Avars (623 or 624)."},{"y":631,"approx":true,"t":"Samo defeats the Frankish king Dagobert I at Wogastisburg (location unknown)."}],"link":null,"evidence":"sparse","sources":[{"title":"Samo","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/biography/Samo-Frankish-merchant"},{"title":"Samo","publisher":"World History Encyclopedia","url":"https://www.worldhistory.org/Samo/"},{"title":"Ancient genomes provide evidence of demographic shift to Slavic-associated groups in Moravia","publisher":"Peer-reviewed article (PubMed Central)","url":"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC12409924/"}]},"Slovenia":{"polity":"Alpine Slavs under Avar overlordship; former Roman Noricum and Pannonia","summary":"In the 6th century Alpine Slavs, ancestors of the Slovenes, moved up the Sava, Drava and Mura valleys into the Eastern Alps and the Karst, mixing with the Romano-Celtic-Illyrian population. They owed allegiance to the Avar khans. Around 623 a Slavic realm formed under Samo, reaching from the Sava valley northward. Bavarian expansion pressed them over the following centuries.","events":[{"y":590,"approx":true,"t":"Alpine Slavs settle the Sava, Drava and Mura valleys under Avar overlordship."},{"y":623,"approx":true,"t":"Samo's Slavic realm forms, reportedly extending from the Sava valley northward."}],"link":null,"evidence":"sparse","sources":[{"title":"History of Slovenia","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/topic/history-of-Slovenia"},{"title":"Samo","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/biography/Samo-Frankish-merchant"}]},"Ukraine":{"polity":"Antes and other Slavs; Pontic steppe nomads; Great Bulgaria (c. 635)","summary":"The Antes, an eastern Slavic tribal alliance between the Dnieper and Dniester, at times fought and at times sided with Byzantium. The Avars crossed their lands in the 560s and the Antes fought them stubbornly; the alliance broke up, and the Antes vanish from the sources in the early 7th century. Around 635 Kubrat formed Great Bulgaria on the steppe to the east.","events":[{"y":600,"approx":true,"t":"Wars with the Avars break up the Antes alliance; Byzantine writers stop mentioning them in the early 7th century."},{"y":635,"approx":true,"t":"Kubrat leads the Bulgars in revolt against the Avars and forms Great Bulgaria (date disputed)."}],"link":null,"evidence":"moderate","sources":[{"title":"Antes","publisher":"Internet Encyclopedia of Ukraine (Canadian Institute of Ukrainian Studies)","url":"https://www.encyclopediaofukraine.com/display.asp?linkpath=pages\\A\\N\\Antes.htm"},{"title":"Antae","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/topic/Antae"},{"title":"Kurt (Kubrat), Bulgar khan","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/biography/Kurt"}]},"Belgium":{"polity":"Merovingian Franks (Neustria and Austrasia)","summary":"The region lay in the Frankish heartland, divided between the Merovingian kingdoms of Neustria and Austrasia during decades of civil war. Chlothar II reunited the Frankish lands in 613, and his son Dagobert I ruled them all from 629. Much of the countryside was still pagan, and the missionary Amand worked around Ghent, where he founded two abbeys in the early 7th century.","events":[{"y":584,"approx":false,"t":"Chilperic I of Neustria is assassinated; his infant son Chlothar II succeeds, protected by his mother Fredegund."},{"y":613,"approx":false,"t":"Chlothar II reunites the Frankish kingdoms after the fall of Brunhild."},{"y":629,"approx":false,"t":"Dagobert I becomes king of all the Franks."},{"y":630,"approx":true,"t":"Amand founds two abbeys in and near Ghent (early 7th century; exact dates uncertain)."}],"link":null,"evidence":"moderate","sources":[{"title":"Chilperic I","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/biography/Chilperic-I"},{"title":"Chlotar II","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/biography/Chlotar-II"},{"title":"History of the Low Countries","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/topic/history-of-the-Low-Countries-prehistoric-times-to-1579-2157575"}]},"Denmark":{"polity":"Magnates and chieftains (Late Germanic Iron Age)","summary":"This is the Late Germanic Iron Age (c. 550–800). Magnates ran power centres that controlled religion, trade, and crafts. Gudme on Funen, a wealthy centre with a magnate's hall, gold hoards, and a coastal trading place at Lundeborg, lasted into the 7th century. A rich Nordic animal art style developed. There are almost no written sources; knowledge is archaeological.","events":[{"y":600,"approx":true,"t":"Gudme on Funen, a magnate's seat and cult centre with its trading place at Lundeborg, is in its final phase (3rd–7th centuries)."}],"link":null,"evidence":"sparse","sources":[{"title":"The Late Iron Age","publisher":"National Museum of Denmark","url":"https://en.natmus.dk/historical-knowledge/denmark/prehistoric-period-until-1050-ad/the-late-iron-age/"},{"title":"Gudme – gold, gods and people","publisher":"National Museum of Denmark","url":"https://en.natmus.dk/historical-knowledge/denmark/prehistoric-period-until-1050-ad/the-late-iron-age/gudme-gold-gods-and-people/"},{"title":"Iron Age gods","publisher":"National Museum of Denmark","url":"https://en.natmus.dk/historical-knowledge/denmark/prehistoric-period-until-1050-ad/the-late-iron-age/iron-age-gods/"}]},"Finland":{"polity":null,"evidence":"sparse","pending":true,"sources":[],"events":[],"link":null},"France":{"polity":"Merovingian Franks (Neustria, Austrasia, Burgundy, Aquitaine)","summary":"Gaul was ruled by Merovingian kings whose kingdoms fought bitter civil wars, shaped partly by the rivalry of Queens Fredegund and Brunhild. Chlothar II reunited the Frankish lands in 613 and issued a wide-ranging edict at Paris in 614. His son Dagobert I moved his capital to Paris. Gregory of Tours wrote his Histories, and the Irish monk Columbanus founded Luxeuil.","events":[{"y":587,"approx":false,"t":"Treaty of Andelot: Guntram of Burgundy settles remaining differences with his nephew Childebert II."},{"y":591,"approx":true,"t":"Columbanus arrives in Gaul (c. 590–591) and founds Annegray, then Luxeuil, in the Vosges."},{"y":594,"approx":true,"t":"Gregory of Tours, author of the Histories, dies (c. 594)."},{"y":613,"approx":false,"t":"Chlothar II has Brunhild killed and becomes sole ruler of the Franks."},{"y":614,"approx":false,"t":"Chlothar II issues the Edict of Paris after a church council, settling problems left by years of turmoil."},{"y":629,"approx":false,"t":"Dagobert I becomes king of all the Franks and later moves his capital to Paris."}],"link":null,"evidence":"rich","sources":[{"title":"Chlotar II","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/biography/Chlotar-II"},{"title":"Guntram","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/biography/Guntram-king-of-Burgundy"},{"title":"Saint Gregory of Tours","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/biography/Saint-Gregory-of-Tours"}]},"Germany":{"polity":"Merovingian Franks (Austrasia) with subject Alamanni, Bavarians and Thuringians; independent Saxons","summary":"The Rhineland formed part of Frankish Austrasia. Further east, Alamanni, Bavarians, and Thuringians were governed by dukes who represented the Frankish king, while the Saxons in the north stayed independent and mostly pagan. Dagobert I was made king of Austrasia in 623 and campaigned against Slavs on the eastern frontier.","events":[{"y":612,"approx":false,"t":"Theuderic II of Burgundy, backed by Brunhild, overthrows his brother Theudebert II of Austrasia."},{"y":623,"approx":false,"t":"Chlothar II makes his son Dagobert I king of Austrasia."},{"y":631,"approx":true,"t":"Dagobert I campaigns against the Slavs under Samo on the eastern frontier (c. 631)."}],"link":null,"evidence":"moderate","sources":[{"title":"History of Germany","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/topic/history-of-Germany"},{"title":"Theodoric II","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/biography/Theodoric-II"},{"title":"Dagobert I","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/biography/Dagobert-I"}]},"Iceland":{"polity":null,"evidence":"sparse","pending":true,"sources":[],"events":[],"link":null},"Ireland":{"polity":"Irish kingdoms (Uí Néill and many others)","summary":"Ireland was a patchwork of small kingdoms under over-kings such as the Uí Néill, with an already Christian elite. Monasticism flourished: Columba, founder of Iona, died there in 597, and Columbanus left Bangor for the Continent around 590, founding Luxeuil and Bobbio. Irish churchmen debated the date of Easter, and Latin learning thrived.","events":[{"y":575,"approx":true,"t":"Assembly of Druim Cett, attended by Columba (traditionally dated 575)."},{"y":590,"approx":true,"t":"Columbanus leaves Ireland for Gaul with twelve companions (c. 590–591)."},{"y":597,"approx":false,"t":"Columba dies on Iona."},{"y":632,"approx":true,"t":"Cummian's letter on the Easter controversy defends the Roman reckoning (c. 632–633)."}],"link":null,"evidence":"moderate","sources":[{"title":"Dallán Forgaill","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/biography/Dallan-Forgaill"},{"title":"St. Columban","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/biography/Saint-Columban"},{"title":"Maura Walsh and Dáibhí Ó Cróinín (eds.), Cummian's Letter De controversia paschali (1988)","publisher":"Pontifical Institute of Mediaeval Studies, Toronto","url":null}]},"Italy":{"polity":"Lombard kingdom and duchies; Byzantine Exarchate of Ravenna; papal Rome","summary":"Italy was divided after the Lombards invaded in 568. Lombard kings ruled the north, while the duchies of Spoleto and Benevento were largely separate; Byzantium held Ravenna, Rome, and other territories. Pope Gregory I (590–604) organised Rome's defence and food supply and sent missions. Queen Theodelinda, a Catholic, eased relations with the Church, and Columbanus founded Bobbio.","events":[{"y":568,"approx":false,"t":"The Lombards under Alboin invade Italy."},{"y":590,"approx":false,"t":"Gregory I becomes pope; Agilulf becomes Lombard king."},{"y":593,"approx":true,"t":"Lombards threaten Rome; Gregory twice saves the city from sack through payments and diplomacy (590s)."},{"y":609,"approx":false,"t":"The Pantheon in Rome is dedicated as a church, Santa Maria ad Martyres, by Pope Boniface IV."},{"y":613,"approx":true,"t":"Columbanus founds the monastery of Bobbio (c. 612–614)."}],"link":null,"evidence":"rich","sources":[{"title":"Italy: Lombards and Byzantines","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/place/Italy/Lombards-and-Byzantines"},{"title":"St. Gregory the Great","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/biography/St-Gregory-the-Great"},{"title":"Pantheon","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/topic/Pantheon-building-Rome-Italy"}]},"Luxembourg":{"polity":"Merovingian Franks (Austrasia)","summary":"The region lay in Austrasia, the eastern Frankish kingdom, near the old Roman city of Trier. Its kings were caught up in the civil wars between Brunhild's heirs and Neustria until Chlothar II reunited the Frankish lands in 613. In 623 Dagobert I was made king of Austrasia. Local written detail is scarce.","events":[{"y":613,"approx":false,"t":"Austrasia passes to Chlothar II after the fall of Brunhild."},{"y":623,"approx":false,"t":"Dagobert I becomes king of Austrasia."}],"link":null,"evidence":"sparse","sources":[{"title":"Austrasia","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/place/Austrasia"},{"title":"Chlotar II","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/biography/Chlotar-II"},{"title":"Dagobert I","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/biography/Dagobert-I"}]},"Netherlands":{"polity":"Frisians in the north; Merovingian Franks in the south","summary":"Frisians along the coast, many living on raised mounds (terpen), remained independent of the Franks and mostly pagan, and took part in North Sea trade. The south lay within the Frankish realm. Near the fork of the Rhine, Dorestad developed as a trading place during the 7th century. Written sources are scarce.","events":[{"y":600,"approx":true,"t":"Frisian coastal communities, independent of the Franks, take part in North Sea trade."},{"y":630,"approx":true,"t":"Dorestad begins to develop as a trading place (7th century; date uncertain)."}],"link":null,"evidence":"sparse","sources":[{"title":"History of Germany","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/topic/history-of-Germany"},{"title":"Richard Hodges, Dark Age Economics: The Origins of Towns and Trade, A.D. 600–1000 (1982)","publisher":"Duckworth","url":null}]},"Norway":{"polity":null,"evidence":"sparse","pending":true,"sources":[],"events":[],"link":null},"Portugal":{"polity":"Suebic kingdom of Gallaecia, absorbed by the Visigoths in 585","summary":"In the north the Suebi ruled a Catholic kingdom based around Braga, where Bishop Martin of Braga had reconverted the monarchy to Catholicism. Around 585 the Visigothic king Leovigild annexed it, and the whole region became part of Visigothic Spain. The south, in the old province of Lusitania, was already Visigothic.","events":[{"y":580,"approx":true,"t":"Martin of Braga, bishop and reformer among the Suebi, dies (c. 580)."},{"y":585,"approx":false,"t":"Leovigild annexes the Suebic kingdom to the Visigothic state."},{"y":589,"approx":false,"t":"At the Third Council of Toledo, Reccared makes Catholicism the faith of the Visigothic kingdom, including the former Suebic lands."}],"link":null,"evidence":"moderate","sources":[{"title":"Suebi","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/topic/Suebi"},{"title":"Portugal: History","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/place/Portugal/History"},{"title":"Saint Martin of Braga","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/biography/Saint-Martin-of-Braga"}]},"Spain":{"polity":"Visigothic kingdom of Toledo (with Byzantine territory in the southeast until the 620s)","summary":"The Visigoths ruled from Toledo. Leovigild annexed the Suebic kingdom around 585, and his son Reccared abandoned Arianism for Catholicism, removing a barrier between Goths and Hispano-Romans. Isidore of Seville became the greatest scholar of the age. King Sisebut decreed the conversion of Jews, and Suinthila took the remaining Byzantine fortresses.","events":[{"y":585,"approx":false,"t":"Leovigild annexes the Suebic kingdom in the northwest."},{"y":587,"approx":false,"t":"Reccared converts to Catholic Christianity."},{"y":589,"approx":false,"t":"Third Council of Toledo: Reccared publicly professes the Catholic faith, which becomes the state religion."},{"y":600,"approx":true,"t":"Isidore becomes bishop of Seville (c. 600); he later writes the Etymologies."},{"y":612,"approx":true,"t":"Sisebut becomes king and, between about 612 and 616, decrees that Jews must convert."},{"y":625,"approx":true,"t":"Suinthila (621–631) takes the last Byzantine fortresses in Spain (exact date uncertain)."}],"link":null,"evidence":"rich","sources":[{"title":"Spain: The Visigothic kingdom","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/place/Spain/The-Visigothic-kingdom"},{"title":"Recared","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/biography/Recared"},{"title":"Spain (Chapter 5), The Jews in Late Antiquity","publisher":"Cambridge University Press (Cambridge Core)","url":"https://www.cambridge.org/core/books/abs/jews-in-late-antiquity/spain/45E37A2BFF2B5C093D55F0616597FC49"}]},"Sweden":{"polity":null,"evidence":"sparse","pending":true,"sources":[],"events":[],"link":null},"Switzerland":{"polity":"Merovingian Franks (Burgundy) and Alamanni","summary":"The west belonged to the Frankish kingdom of Burgundy, Romanised and Catholic, where Bishop Marius moved his see from Avenches to Lausanne around 590. The north and east were settled by Alamanni under dukes subject to the Franks. Marius wrote a chronicle, and the Irish monk Gall settled as a hermit on the Steinach, the origin of Saint Gall.","events":[{"y":593,"approx":false,"t":"Marius, bishop of Avenches and Lausanne and author of a chronicle, dies."},{"y":612,"approx":true,"t":"Gall, a companion of Columbanus, stays behind and builds a hermit's cell on the Steinach near Arbon."},{"y":613,"approx":false,"t":"Burgundy passes to Chlothar II after the fall of Brunhild."}],"link":null,"evidence":"moderate","sources":[{"title":"Marius","publisher":"Historisches Lexikon der Schweiz","url":"https://hls-dhs-dss.ch/de/articles/012781/"},{"title":"Gall (saint)","publisher":"Historisches Lexikon der Schweiz","url":"https://hls-dhs-dss.ch/fr/articles/010216/2006-11-20/"},{"title":"Lausanne","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/place/Lausanne"}]},"United Kingdom":{"polity":"Anglo-Saxon kingdoms (Kent, East Anglia, Northumbria, etc.), British kingdoms, Picts and Dál Riata","summary":"England was split among Anglo-Saxon kingdoms, with British kingdoms in the west and north and Picts and Gaelic Dál Riata in Scotland. Pope Gregory I sent Augustine to Kent in 597, where King Æthelberht received him. The Sutton Hoo ship burial (c. 620–630) may be that of Rædwald of East Anglia, and Edwin of Northumbria was converted by Paulinus in 627.","events":[{"y":597,"approx":false,"t":"Augustine's mission, sent by Pope Gregory I, reaches Kent and is received by King Æthelberht."},{"y":603,"approx":true,"t":"Æthelfrith of Northumbria defeats Áedán of Dál Riata at Degsastan (603 or 604)."},{"y":616,"approx":true,"t":"Rædwald of East Anglia defeats and kills Æthelfrith at the River Idle; Edwin becomes king of Northumbria."},{"y":625,"approx":true,"t":"The Sutton Hoo ship burial is made (c. 620–630); Rædwald is a likely but unproven candidate."},{"y":627,"approx":false,"t":"Edwin of Northumbria is converted and baptised by Paulinus."}],"link":null,"evidence":"rich","sources":[{"title":"St Augustine of Canterbury, first archbishop of Canterbury (summary)","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/summary/Saint-Augustine-of-Canterbury"},{"title":"Aethelfrith","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/biography/Aethelfrith"},{"title":"The Anglo-Saxon ship burial at Sutton Hoo","publisher":"The British Museum","url":"https://www.britishmuseum.org/collection/death-and-memory/anglo-saxon-ship-burial-sutton-hoo"}]},"Greenland":{"polity":null,"evidence":"sparse","pending":true,"sources":[],"events":[],"link":null},"Austria":{"polity":"Bavarian duchy (Agilolfings) under Frankish influence; Alpine Slavs and Avars in the east","summary":"The west was held by Bavarians under Agilolfing dukes, under Frankish political influence, while Alemanni settled in today's Vorarlberg. Slavs pressing in from the east lived under Avar rulers, and the Bavarians struggled against them. At Bregenz the Irish monk Columbanus and his companions preached to the pagan Alemanni for two years.","events":[{"y":610,"approx":true,"t":"Columbanus and his companions work at Bregenz on Lake Constance (c. 610–612) before he moves on to Italy."},{"y":623,"approx":true,"t":"Western Slavs rise against the Avars under Samo (c. 623–624); his rule may have reached the eastern Alps."},{"y":639,"approx":false,"t":"After Dagobert I's death, the Agilolfing dukes of Bavaria become virtually independent."}],"link":null,"evidence":"moderate","sources":[{"title":"Austria: Early Middle Ages","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/place/Austria/Early-Middle-Ages"},{"title":"Kolumban","publisher":"Historisches Lexikon der Schweiz","url":"https://hls-dhs-dss.ch/de/articles/010215/2007-08-23/"},{"title":"Samo","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/biography/Samo-Frankish-merchant"}]},"Estonia":{"polity":null,"evidence":"sparse","pending":true,"sources":[],"events":[],"link":null},"Latvia":{"polity":null,"evidence":"sparse","pending":true,"sources":[],"events":[],"link":null},"Lithuania":{"polity":null,"evidence":"sparse","pending":true,"sources":[],"events":[],"link":null},"Saudi Arabia":{"polity":"Independent Arabian tribes and towns (Quraysh of Mecca, Aws and Khazraj of Yathrib); Muslim community at Medina from 622","summary":"The Hijaz had no state: Mecca, led by the Quraysh, was a sanctuary town around the Kaaba, while Yathrib (Medina) was an oasis of Arab and Jewish clans. Muhammad ﷺ, born in Mecca, received his first revelation c. 610, emigrated to Medina in 622, entered Mecca in 630 and by his death in 632 led much of Arabia.","events":[{"y":570,"approx":true,"t":"Muhammad ﷺ is born in Mecca (c. 570/571), in what tradition calls the 'Year of the Elephant', named for Abraha's march on Mecca."},{"y":610,"approx":true,"t":"Muhammad ﷺ receives the first revelation in the cave of Hira near Mecca, at about the age of forty."},{"y":622,"approx":false,"t":"The Hijra: Muhammad ﷺ and his followers emigrate from Mecca to Yathrib (Medina); this later became year one of the Islamic calendar."},{"y":624,"approx":false,"t":"In 2 AH the Muslims of Medina defeat a larger Meccan force at Badr."},{"y":630,"approx":false,"t":"In 8 AH Mecca submits to Muhammad ﷺ with little fighting, and the idols around the Kaaba are destroyed."},{"y":632,"approx":false,"t":"Muhammad ﷺ dies in Medina (11 AH); Abu Bakr becomes the first caliph and confronts the tribal revolts known as the Ridda."}],"link":"This was the homeland of Muhammad ﷺ and of the first Muslim community, at Mecca and Medina.","evidence":"moderate","sources":[{"title":"Muhammad ﷺ","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/biography/Muhammad"},{"title":"Battle of Badr","publisher":"Encyclopaedia Britannica","url":"https://britannica.com/print/article/48575"},{"title":"Ibn Ishaq, The Life of Muhammad ﷺ (Sirat Rasul Allah, recension of Ibn Hisham), trans. A. Guillaume, 1955","publisher":"Oxford University Press","url":null},{"title":"Safiur-Rahman Mubarakpuri, Ar-Raheeq Al-Makhtum (The Sealed Nectar)","publisher":"Darussalam","url":null},{"title":"Riddah","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/topic/riddah"}]},"Yemen":{"polity":"Former Himyarite kingdom under Aksumite rule (Abraha and his sons), then a Sasanian Persian dependency from c. 570","summary":"Christian Aksum had conquered Himyar in 525, and the Aksumite commander Abraha came to rule Yemen. About 570 a Persian force under Vahriz, backing Sayf ibn Dhi Yazan, expelled the Aksumites. Persian governors then ruled, supported by settlers whose descendants were called the Abna. The last governor, Badhan, accepted Islam.","events":[{"y":570,"approx":true,"t":"Abraha leads an expedition north toward Mecca, remembered in Islamic tradition as the 'Year of the Elephant'; its exact date is disputed."},{"y":570,"approx":true,"t":"A Persian force under Vahriz defeats and kills Abraha's son Masruq, ending Aksumite rule (c. 570; some sources date it to the later 570s)."},{"y":628,"approx":true,"t":"Badhan, Persian governor of Yemen, accepts Islam after the death of Khosrow II, according to tradition; another report dates his conversion to 631."},{"y":632,"approx":true,"t":"Al-Aswad al-Ansi, claiming prophethood, leads a revolt in Yemen and is killed around the time of the death of the Prophet."}],"link":"Yemen's Persian governor Badhan and many Yemenis accepted Islam in the lifetime of Muhammad ﷺ, who sent Mu'adh ibn Jabal there as a teacher, according to tradition.","evidence":"moderate","sources":[{"title":"Yemen: History","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/place/Yemen/History"},{"title":"Abnāʾ","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/abna-term/"},{"title":"Ibn Ishaq, The Life of Muhammad ﷺ (Sirat Rasul Allah, recension of Ibn Hisham), trans. A. Guillaume, 1955","publisher":"Oxford University Press","url":null}]},"Oman":{"polity":"Azd tribes under the Julanda family, Sasanian vassals; the coast part of the Sasanian province of Mazun","summary":"The Julanda family led the Arab tribes of Oman as vassals of Sasanian Persia, whose province of Mazun took in the coast. After Mecca submitted in 630, the Julanda rulers accepted Islam through Amr ibn al-As, envoy of Muhammad ﷺ. Written sources are thin and mostly from later Islamic histories.","events":[{"y":600,"approx":true,"t":"The Julanda rulers lead Oman's Arabs as Sasanian vassals, while the coast forms part of the Sasanian province of Mazun."},{"y":630,"approx":true,"t":"Jayfar and Abd, sons of al-Julanda, accept Islam after Amr ibn al-As arrives as envoy of Muhammad ﷺ, according to tradition."}],"link":"The Julanda rulers of Oman accepted Islam c. 630 through Amr ibn al-As, envoy of Muhammad ﷺ.","evidence":"sparse","sources":[{"title":"Arabia ii. The Sasanians and Arabia","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/arabia-ii-sasanians-and-arabia/"},{"title":"Oman","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/oman/"},{"title":"ʿAmr ibn al-ʿĀṣ","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/biography/Amr-ibn-al-As"}]},"United Arab Emirates":{"polity":"Arab tribes of the wider Oman region, within the Sasanian sphere","summary":"This coast formed part of the wider Oman region, where the Julanda family led Arab tribes as Sasanian vassals and the Persian province of Mazun reached the shore. Written evidence for this area in the period is very sparse.","events":[{"y":630,"approx":true,"t":"The Julanda rulers, leaders of the Oman region's Arab tribes, accept Islam through an envoy of Muhammad ﷺ, according to tradition."}],"link":"As part of the Oman region, its tribes came under the Julanda rulers, who accepted Islam c. 630 according to tradition.","evidence":"sparse","sources":[{"title":"Arabia ii. The Sasanians and Arabia","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/arabia-ii-sasanians-and-arabia/"},{"title":"Oman","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/oman/"},{"title":"ʿArab ii. Arab conquest of Iran","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/arab-ii/"}]},"Qatar":{"polity":"Arab communities of eastern Arabia (al-Bahrayn) within the Sasanian sphere","summary":"Qatar belonged to the eastern Arabian region of al-Bahrayn, which Sasanian Persia controlled through a governor at Hajar and Arab allies. After Mecca submitted in 630, that governor recognized Muhammad ﷺ, according to Islamic tradition. Evidence for the period is sparse.","events":[{"y":600,"approx":true,"t":"Eastern Arabia, including this peninsula, lies within the Sasanian sphere, overseen by a Persian-appointed governor at Hajar."},{"y":630,"approx":true,"t":"The governor at Hajar recognizes Muhammad ﷺ; tradition names him al-Mundhir ibn Sawa, visited by the envoy al-Ala al-Hadrami."}],"link":"Eastern Arabia's governor recognized Muhammad ﷺ c. 630, according to tradition after the envoy al-Ala al-Hadrami arrived.","evidence":"sparse","sources":[{"title":"ʿArab ii. Arab conquest of Iran","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/arab-ii/"},{"title":"Ibn Ishaq, The Life of Muhammad ﷺ (Sirat Rasul Allah, recension of Ibn Hisham), trans. A. Guillaume, 1955","publisher":"Oxford University Press","url":null}]},"Kuwait":{"polity":"Arab tribes on the Sasanian frontier of southern Mesopotamia","summary":"The Kuwait coast lay at the southern edge of Sasanian Mesopotamia, between eastern Arabia and the port of Ubulla. Bedouin tribes such as the Bakr ibn Wa'il ranged along this frontier, and their victory at Dhi Qar showed Persian weakness. Written evidence for the area itself is sparse.","events":[{"y":633,"approx":true,"t":"Khalid ibn al-Walid defeats the Sasanian frontier commander Hormoz at Dhat al-Salasil, between Bahrain and Ubulla, opening the Muslim campaign in Iraq."}],"link":null,"evidence":"sparse","sources":[{"title":"ʿArab i. Arabs and Iran in the pre-Islamic period","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/arab-i/"},{"title":"ʿArab ii. Arab conquest of Iran","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/arab-ii/"}]},"Iraq":{"polity":"Sasanian Empire (capital Ctesiphon), with the Lakhmid Arab client kingdom at al-Hira until c. 602","summary":"Mesopotamia was the rich farming heart of the Sasanian Empire and held its capital, Ctesiphon, also the centre of the Church of the East. Khosrow II ended the Lakhmid kingdom of al-Hira c. 602, weakening the desert frontier. The war with Byzantium ended in defeat and dynastic turmoil after 628.","events":[{"y":602,"approx":true,"t":"Khosrow II deposes and kills al-Nu'man III, ending the Lakhmid kingdom of al-Hira."},{"y":604,"approx":true,"t":"Arab tribes led by the Bakr ibn Wa'il defeat a Persian force at Dhi Qar near Kufa; the date is disputed, c. 604–613."},{"y":627,"approx":false,"t":"Heraclius defeats the Persian army near Nineveh on 12 December and advances toward Ctesiphon."},{"y":628,"approx":false,"t":"Khosrow II is overthrown and executed; his son Kavad II makes peace with Byzantium and dies later that year."},{"y":637,"approx":true,"t":"Arab Muslim armies win at al-Qadisiyya and take Ctesiphon (dates disputed, c. 636–637)."}],"link":"The end of the Lakhmids and the Arab victory at Dhi Qar weakened Persia's Arabian frontier, which Muslim armies crossed in 633.","evidence":"moderate","sources":[{"title":"Lakhmids","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/lakhmids/"},{"title":"Ḵosrow II","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/khosrow-ii/"},{"title":"ʿArab ii. Arab conquest of Iran","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/arab-ii/"}]},"Iran":{"polity":"Sasanian Empire (Hormizd IV, Khosrow II, then rapid succession)","summary":"Iran was the core of the Sasanian Empire, with Zoroastrianism as the state faith and great fire temples such as Adur Gushnasp in Atropatene. Khosrow II won vast conquests from Byzantium after 603 but lost the war in 622–628 and was killed in 628. Short reigns followed until Yazdegerd III took the throne in 632.","events":[{"y":590,"approx":false,"t":"The general Bahram Chobin rebels and Hormizd IV is deposed and killed; Khosrow II flees to Byzantine territory."},{"y":591,"approx":false,"t":"With help from the Byzantine emperor Maurice, Khosrow II defeats Bahram Chobin and regains the throne."},{"y":624,"approx":true,"t":"Heraclius invades Atropatene and sacks the fire temple of Adur Gushnasp near Ganzak (623 or 624, date disputed)."},{"y":628,"approx":false,"t":"Khosrow II is deposed and executed; his son Kavad II makes peace with Byzantium."},{"y":632,"approx":false,"t":"Yazdegerd III, the last Sasanian king, comes to the throne after years of turmoil."}],"link":"Islamic tradition says Muhammad ﷺ sent a letter inviting Khosrow II to Islam c. 628, which the king tore up.","evidence":"moderate","sources":[{"title":"Ḵosrow II","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/khosrow-ii/"},{"title":"Byzantine-Iranian Relations","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/byzantine-iranian-relations/"},{"title":"Safiur-Rahman Mubarakpuri, Ar-Raheeq Al-Makhtum (The Sealed Nectar)","publisher":"Darussalam","url":null}]},"Syria":{"polity":"Byzantine Empire, with Ghassanid Arab allies; Persian occupation c. 611–628","summary":"Syria was a rich Byzantine land of cities such as Antioch, Damascus and Bostra, guarded on the desert side by Ghassanid Arab allies. Persian armies took Antioch c. 610–612 and Damascus in 613, holding Syria until the peace of 628. Meccan caravans traded here.","events":[{"y":611,"approx":true,"t":"Persian armies under Shahrbaraz take Antioch (date disputed, 610–612)."},{"y":613,"approx":false,"t":"Damascus falls to the Persians, who occupy Syria."},{"y":628,"approx":true,"t":"Under the peace made by Kavad II, Persia gives up its conquests and Byzantine rule over Syria is restored."},{"y":637,"approx":true,"t":"Antioch falls to the Arab Muslim armies (c. 637–638)."}],"link":"Meccan caravans traded in Syria, and tradition says the young Muhammad ﷺ travelled to Bostra, where the monk Bahira met him.","evidence":"moderate","sources":[{"title":"Antioch (1)","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/antioch-1-northern-syria/"},{"title":"Ḵosrow II","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/khosrow-ii/"},{"title":"Byzantine Empire: The successors of Justinian, 565–610","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/place/Byzantine-Empire/The-successors-of-Justinian-565-610"}]},"Lebanon":{"polity":"Byzantine Empire (province of Phoenicia), under Persian occupation c. 613–628","summary":"The Lebanese coast held Byzantine port cities such as Tyre, Sidon and Beirut. During the great war Persian armies pushed through Syria to the Mediterranean coast c. 612 and occupied the region, which Byzantium regained under the peace of 628.","events":[{"y":612,"approx":true,"t":"Persian armies take Antioch and push on to the Mediterranean coast during their conquest of Syria."},{"y":628,"approx":true,"t":"Under the peace of 628, Persia gives up its conquests and Byzantine authority returns."}],"link":null,"evidence":"moderate","sources":[{"title":"Ḵosrow II","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/khosrow-ii/"},{"title":"Byzantine-Iranian Relations","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/byzantine-iranian-relations/"}]},"Israel":{"polity":"Byzantine Empire (Palaestina Prima and Secunda), under Persian occupation 614–c. 628","summary":"This land was part of Byzantine Palestine, with Christian pilgrimage sites and Jewish communities. When Persia took Jerusalem in 614, Jews were allowed to settle in the city, but this was reversed within two years under Christian pressure. Persia placed Palestine under direct rule in 616 and gave it up under the peace of 628.","events":[{"y":614,"approx":false,"t":"Persian forces under Shahrbaraz conquer Palestine and capture Jerusalem."},{"y":616,"approx":true,"t":"Persia places Palestine under direct rule, having reversed its permission for Jews to settle in Jerusalem."},{"y":628,"approx":true,"t":"Persia gives up its conquests under the peace of 628, and Byzantine rule returns."}],"link":null,"evidence":"moderate","sources":[{"title":"Ḵosrow II","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/khosrow-ii/"},{"title":"Byzantine-Iranian Relations","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/byzantine-iranian-relations/"}]},"Palestine":{"polity":"Byzantine Empire (Palaestina Prima), under Persian occupation 614–c. 628","summary":"Jerusalem, Bethlehem and Gaza were Byzantine Christian centres full of churches, monasteries and pilgrims. In 614 Persian forces captured Jerusalem and carried the True Cross to Ctesiphon, a shock to the Christian world. Heraclius restored the Cross to Jerusalem c. 630, a few years before the Arab Muslim conquest.","events":[{"y":614,"approx":false,"t":"Persian forces take Jerusalem and carry the True Cross to Ctesiphon."},{"y":624,"approx":true,"t":"In Medina, the Muslim direction of prayer changes from Jerusalem to the Kaaba in Mecca, according to tradition (2 AH, c. 623–624)."},{"y":630,"approx":true,"t":"Heraclius restores the True Cross to Jerusalem (dated 629 or 630)."}],"link":"Jerusalem was the first direction of prayer of the early Muslims, and tradition says Hashim, great-grandfather of Muhammad ﷺ, died while trading at Gaza.","evidence":"rich","sources":[{"title":"Byzantine Empire: The successors of Justinian, 565–610","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/place/Byzantine-Empire/The-successors-of-Justinian-565-610"},{"title":"Ḵosrow II","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/khosrow-ii/"},{"title":"Ibn Ishaq, The Life of Muhammad ﷺ (Sirat Rasul Allah, recension of Ibn Hisham), trans. A. Guillaume, 1955","publisher":"Oxford University Press","url":null}]},"Jordan":{"polity":"Byzantine Empire (Palaestina Tertia and Arabia), with Ghassanid Arab allies; Persian occupation c. 614–628","summary":"Jordan's towns, such as Gerasa, Madaba and Ayla (Aqaba), lay in Byzantine provinces, while Arab allies, chiefly the Ghassanids, guarded the desert edge. Persia held the region during the great war. Here Muslim and Byzantine forces first fought, at Mu'ta in 629.","events":[{"y":614,"approx":true,"t":"Persian forces occupy the region during their conquest of Palestine."},{"y":629,"approx":false,"t":"A Muslim force sent by Muhammad ﷺ is defeated at Mu'ta by Byzantine troops and Arab allies; Zayd ibn Haritha is killed (8 AH)."},{"y":630,"approx":true,"t":"During the Tabuk expedition (9 AH), Ayla, Adhruh and Jarba agree to pay tribute to Muhammad ﷺ, according to tradition."}],"link":"Muslim and Byzantine forces first fought at Mu'ta in 629, and Ayla and nearby towns submitted to Muhammad ﷺ during the Tabuk expedition of 630.","evidence":"moderate","sources":[{"title":"Ḵosrow II","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/khosrow-ii/"},{"title":"Arabia ii. The Sasanians and Arabia","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/arabia-ii-sasanians-and-arabia/"},{"title":"Ibn Ishaq, The Life of Muhammad ﷺ (Sirat Rasul Allah, recension of Ibn Hisham), trans. A. Guillaume, 1955","publisher":"Oxford University Press","url":null}]},"Turkey":{"polity":"Byzantine (Eastern Roman) Empire, capital Constantinople","summary":"Anatolia and Constantinople formed the heart of the Byzantine Empire, ruled by Maurice, then the usurper Phocas, then Heraclius from 610. Persian armies struck deep into Anatolia and reached Chalcedon, across from the capital. In 626 Constantinople survived an Avar siege while a Persian army waited at Chalcedon. Heraclius then struck into Persia and won the war.","events":[{"y":602,"approx":false,"t":"An army mutiny brings Phocas to power, and the emperor Maurice is executed, giving Khosrow II a pretext for war."},{"y":610,"approx":false,"t":"Heraclius overthrows Phocas and becomes emperor."},{"y":615,"approx":false,"t":"A Persian army under Shahin reaches Chalcedon, within sight of Constantinople."},{"y":622,"approx":false,"t":"Heraclius begins annual campaigns against Persia."},{"y":626,"approx":false,"t":"Constantinople withstands a siege by the Avars while a Persian army waits at Chalcedon."}],"link":"Islamic tradition says Muhammad ﷺ sent a letter to Heraclius inviting him to Islam c. 628.","evidence":"rich","sources":[{"title":"Ḵosrow II","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/khosrow-ii/"},{"title":"Byzantine-Iranian Relations","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/byzantine-iranian-relations/"},{"title":"Ibn Ishaq, The Life of Muhammad ﷺ (Sirat Rasul Allah, recension of Ibn Hisham), trans. A. Guillaume, 1955","publisher":"Oxford University Press","url":null}]},"Cyprus":{"polity":null,"evidence":"moderate","pending":true,"sources":[],"events":[],"link":null},"N. Cyprus":{"polity":null,"evidence":"moderate","pending":true,"sources":[],"events":[],"link":null},"Armenia":{"polity":"Divided between the Byzantine Empire and Sasanian Persia (Persarmenia); Armenian noble houses","summary":"Armenia was ruled by noble families such as the Bagratunis and Mamikonians under two empires. In 591 Khosrow II ceded western Persian Armenia to Byzantium, but Persia retook it after 603. A council at Dvin in 596 rejected Chalcedon. Heraclius campaigned through Armenia in the 620s, and the peace of 628 restored the 591 frontier.","events":[{"y":591,"approx":false,"t":"Khosrow II cedes western Persian Armenia, up to the river Azat, to Byzantium in return for help in regaining his throne."},{"y":596,"approx":false,"t":"A church council at Dvin, sponsored by Sembat Bagratuni, rejects the doctrines of the Council of Chalcedon."},{"y":607,"approx":true,"t":"Persian forces take Karin (Theodosiopolis, modern Erzurum) as they reconquer Byzantine Armenia (c. 607–608)."},{"y":623,"approx":true,"t":"Heraclius campaigns through Armenia into Atropatene against Persian forces (623–624)."},{"y":628,"approx":true,"t":"The peace with Persia restores the Armenian frontier fixed in 591."}],"link":null,"evidence":"moderate","sources":[{"title":"Armenia and Iran ii. The pre-Islamic period","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/armenia-ii/"},{"title":"Ḵosrow II","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/khosrow-ii/"}]},"Azerbaijan":{"polity":"Caucasian Albania (Aghvank) under Sasanian rule, with the Mihranid princes","summary":"This land was Caucasian Albania, a Christian land under Persian rule with its capital at Partaw (Barda); it is distinct from Iranian Azerbaijan (Atropatene) to the south. Khosrow II strengthened the Darband defences against steppe peoples. Heraclius wintered here in 624, and Khazar allies of Byzantium raided in 626–629. The Mihranid family then rose to rule.","events":[{"y":624,"approx":false,"t":"Heraclius winters his army in Caucasian Albania after striking into Persian Atropatene."},{"y":626,"approx":true,"t":"Khazar allies of Heraclius break through the Darband pass, and the Persian governor of Albania flees."},{"y":628,"approx":true,"t":"A second Khazar invasion: their leader declares himself lord of Albania."},{"y":630,"approx":true,"t":"Varaz Grigor of the Mihranid family is consecrated prince of Albania (c. 628–630)."}],"link":null,"evidence":"sparse","sources":[{"title":"Albania (Caucasian Albania / Arran)","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/albania-iranian-aran/"}]},"Georgia":{"polity":"Kartli (Iberia) under presiding princes, caught between Byzantium and Persia; Lazica (Egrisi) in the west a Byzantine client","summary":"Kartli, centred on Tbilisi (Tiflis) and Mtskheta, was a Christian principality caught between the two empires, while western Georgia (Lazica) was a Byzantine client. The settlement of 591 divided Iberia between Byzantium and Persia, with Tiflis on the Persian side. In 627 Heraclius met the Western Turkish ruler outside Tiflis and besieged the city.","events":[{"y":591,"approx":true,"t":"Khosrow II and Maurice divide Iberia, with Tiflis remaining on the Persian side."},{"y":627,"approx":false,"t":"Heraclius meets the Western Turkish ruler outside Tiflis, and their forces besiege the city."}],"link":null,"evidence":"moderate","sources":[{"title":"Ḵosrow II","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/khosrow-ii/"},{"title":"A. P. Kazhdan (ed.), The Oxford Dictionary of Byzantium, 1991","publisher":"Oxford University Press","url":null}]},"Egypt":{"polity":"Byzantine Empire; Persian occupation c. 619–629","summary":"Egypt was Byzantium's granary, its grain feeding Constantinople. Most Egyptians followed the Coptic church, which rejected the imperial Chalcedonian church. Persia invaded in 618–619, took Alexandria in 619 and held Egypt until 629. Amr ibn al-As later led the Arab Muslim conquest of the province.","events":[{"y":619,"approx":true,"t":"Persian forces, invading from 618–619, take Alexandria (c. June 619) and soon control all Egypt."},{"y":626,"approx":true,"t":"Benjamin I becomes Coptic patriarch of Alexandria (date disputed, 623 or 626)."},{"y":629,"approx":true,"t":"Persian troops withdraw from Alexandria (c. June 629), and Byzantine rule returns."}],"link":"Tradition says Muhammad ﷺ wrote to al-Muqawqis, ruler in Egypt, who sent gifts including Maria the Copt, mother of his son Ibrahim.","evidence":"moderate","sources":[{"title":"Egypt iv. Relations in the Sasanian period","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/egypt-iv/"},{"title":"ʿAmr ibn al-ʿĀṣ","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/biography/Amr-ibn-al-As"},{"title":"Ibn Ishaq, The Life of Muhammad ﷺ (Sirat Rasul Allah, recension of Ibn Hisham), trans. A. Guillaume, 1955","publisher":"Oxford University Press","url":null}]},"Afghanistan":{"polity":"Post-Hephthalite principalities (including the Nezak of Kapisa) and Western Turkic rulers in Tokharistan; Sasanian frontier near Herat","summary":"After the Hephthalites were destroyed by the Western Turks and Sasanians in the 560s, the land was divided among local principalities. Tokharistan (Bactria) slipped from Sasanian control after 579 and came under Western Turkic power. Buddhism flourished: the colossal Bamiyan Buddhas, generally dated to the 6th–7th centuries, stood in the central mountains, and Xuanzang recorded Buddhist sites while crossing the region around 628–632.","events":[{"y":579,"approx":true,"t":"After 579, battles with the Western Turks cost the Sasanians control of Tokharistan (Bactria)."},{"y":588,"approx":false,"t":"Turk-backed Hephthalite forces reach Badghis and Herat; the Sasanian general Bahram Chobin defeats them and takes Balkh."},{"y":600,"approx":true,"t":"The colossal Bamiyan Buddhas belong to this era; sources date them to roughly the 6th–7th centuries (dating debated)."},{"y":630,"approx":true,"t":"Xuanzang crosses Tokharistan (c. 628–632), describing its Buddhist monasteries; his account is the earliest text describing the Bamiyan Buddhas."}],"link":null,"evidence":"moderate","sources":[{"title":"Hephthalites","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/hephthalites/"},{"title":"Bahrām VI Čōbīn","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/bahram-the-name-of-six-sasanian-kings/bahram-vi/"},{"title":"Bamiyan Buddhas","publisher":"Smarthistory","url":"https://smarthistory.org/bamiyan-buddhas/"}]},"Pakistan":{"polity":"Kingdom of Sindh ruled from Aror; local rulers in Gandhara and the Punjab","summary":"Sindh was ruled from Aror. The later Chachnama, a 13th-century Persian translation of an earlier Arabic history, preserves a local tradition that the Brahman Chach rose against the previous dynasty and founded his own line; its dates are uncertain. Gandhara's great Buddhist age was past, though monasteries such as Takht-i-Bahi remained in use into the 7th century. Multan was known for its ancient Sun Temple.","events":[{"y":630,"approx":true,"t":"Xuanzang passes through the northwest on his way to India, which he reaches by 633."},{"y":632,"approx":true,"t":"Around this time, by Chachnama tradition, the Brahman Chach takes power in Sindh; the dating is uncertain."}],"link":null,"evidence":"sparse","sources":[{"title":"Čač-nāma","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/cac-nama/"},{"title":"Buddhist Ruins of Takht-i-Bahi and Neighbouring City Remains at Sahr-i-Bahlol","publisher":"UNESCO World Heritage Centre","url":"https://whc.unesco.org/en/list/140/"},{"title":"Multan","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/place/Multan"}]},"India":{"polity":"Harsha of Kannauj (north), Chalukyas of Badami (Deccan), Pallavas of Kanchi (southeast), Maitrakas of Valabhi (west)","summary":"After the Gupta collapse, regional dynasties competed. Harsha (r. 606–647) ruled from Thanesar and later Kannauj; his court author Bana wrote the Harshacharita. Pulakeshin II of the Chalukyas (r. 610–642) drove him back to the Narmada and fought the Pallava Mahendravarman I. Valabhi under the Maitrakas was a celebrated seat of learning. Xuanzang reached India by 633 and became close to Harsha.","events":[{"y":578,"approx":true,"t":"Shrines to Shiva and Vishnu are cut at Badami, base of the Early Chalukya dynasty."},{"y":606,"approx":false,"t":"Harsha is crowned at Thanesar after his elder brother Rajyavardhana is assassinated; the Harsha era begins."},{"y":610,"approx":true,"t":"Pulakeshin II begins his Chalukya reign; his early years are taken up by civil war."},{"y":620,"approx":true,"t":"Pulakeshin II drives Harsha back to the Narmada, ending his Deccan campaign (date disputed)."},{"y":630,"approx":true,"t":"Narasimhavarman I succeeds Mahendravarman I as Pallava king; he later avenges Pallava defeats by capturing the Chalukya capital Vatapi."}],"link":null,"evidence":"rich","sources":[{"title":"Harsha","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/biography/Harsha"},{"title":"South Asia: South, 500–1000 A.D. (Heilbrunn Timeline of Art History)","publisher":"The Metropolitan Museum of Art","url":"https://www.metmuseum.org/toah/ht/06/sss.html"},{"title":"Mahendravarman I","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/biography/Mahendravarman-I"}]},"Nepal":{"polity":"Licchavi kingdom of the Kathmandu Valley","summary":"The Kathmandu Valley was ruled by the Licchavi dynasty (c. 450–750), of Indian origin, which used Sanskrit as its court language and issued Indian-style coins. The powerful figure Amshuvarman is associated with the end of Licchavi dominance, but sources disagree on his dates and status. The Harsha era beginning in 606 was long used in Nepal.","events":[{"y":606,"approx":false,"t":"The Harsha era begins; it was long preserved in Nepal for dating."}],"link":null,"evidence":"sparse","sources":[{"title":"Licchavi era","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/event/Licchavi-era"},{"title":"Harṣa Dynasty","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/topic/Harsa-Dynasty"}]},"Bhutan":{"polity":null,"evidence":"sparse","pending":true,"sources":[],"events":[],"link":null},"Bangladesh":{"polity":"Gauda kingdom of Shashanka (west); Samatata (east)","summary":"The western delta formed part of Gauda, whose king Shashanka annexed much of the Ganges valley in the early 7th century and clashed with the Maukharis and Harsha's family. Pundranagara (Mahasthangarh), founded around the 4th–3rd century BCE, remained a centre of monasteries and temples. Samatata in the east was a famous Mahayana Buddhist centre, as Xuanzang's travel account attests.","events":[{"y":606,"approx":true,"t":"Shashanka of Gauda is held responsible for assassinating Rajyavardhana; Harsha allies with Bhaskaravarman of Kamarupa against him."},{"y":636,"approx":true,"t":"Shashanka dies, never defeated by Harsha, whose later eastern campaign meets little resistance."},{"y":638,"approx":true,"t":"Xuanzang's travels in India (630s–640s) include Pundravardhana and Samatata, which he describes as thriving religious centres."}],"link":null,"evidence":"moderate","sources":[{"title":"Harsha","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/biography/Harsha"},{"title":"Cultural Landscape of Mahasthan and Karatoya River (Tentative List)","publisher":"UNESCO World Heritage Centre","url":"https://whc.unesco.org/en/tentativelists/6671/"},{"title":"Archaeological sites of Lalmai-Mainamati (Tentative List)","publisher":"UNESCO World Heritage Centre","url":"https://whc.unesco.org/en/tentativelists/6670/"}]},"Sri Lanka":{"polity":null,"evidence":"moderate","pending":true,"sources":[],"events":[],"link":null},"Kazakhstan":{"polity":"Western Turkic Khaganate","summary":"The steppes belonged to the western branch of the Turkic (Kök Türk) empire, first ruled by Bumin's brother Ishtemi and then by Tardu, under whom it expanded towards Byzantium. Nomadic pastoralism dominated, while Sogdian merchants supplied the Turks with administrators and trade links, persuading the khagan to open contact with Byzantium to sell silk. Tong Yabghu was supreme khagan in the 620s.","events":[{"y":573,"approx":true,"t":"Ishtemi's rule ends and Tardu succeeds him as ruler of the western Turks."},{"y":603,"approx":true,"t":"Tardu's reign ends, after the western Turkic realm has expanded to the borders of Byzantium."},{"y":627,"approx":false,"t":"A large Western Turkic army, allied with Heraclius against Persia, campaigns in the Caucasus and storms Darband."}],"link":null,"evidence":"moderate","sources":[{"title":"History of Central Asia: The Middle Ages","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/place/history-of-Central-Asia-102306/The-Middle-Ages"},{"title":"Sogdian Trade","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/sogdian-trade/"},{"title":"Khazars","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/khazars/"}]},"Kyrgyzstan":{"polity":"Western Turkic Khaganate (Chu valley)","summary":"The Chu valley held Suyab (Ak-Beshim, east of modern Bishkek), a town probably founded by Sogdians in the 6th century. The district was densely settled, subject to the Turks, and dotted with trading colonies of Sogdian merchants, while Turkic nomads pastured the surrounding mountains. The Western Turkic khagan Tong Yabghu dominated the region until his assassination.","events":[{"y":628,"approx":true,"t":"Tong Yabghu, khagan of the Western Turks, is assassinated (628 or 630; date disputed)."},{"y":629,"approx":true,"t":"Xuanzang passes through Suyab, the town's first recorded mention."}],"link":null,"evidence":"moderate","sources":[{"title":"Suyāb","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/suyab/"},{"title":"Khotan ii. History in the Pre-Islamic Period","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/khotan-parent/khotan-ii-history-in-the-pre-islamic-period/"}]},"Tajikistan":{"polity":"Sogdian towns (Panjikant) in the north; Tokharistan principalities in the south under Western Turkic power","summary":"The north lay in Sogdiana, where Panjikant was a prosperous town of merchants and landowners whose houses and two great temples were decorated with murals of deities, feasts and epic tales. The south belonged to upper Tokharistan, formerly Hephthalite and later under Western Turkic control. Caravan trade and irrigated farming sustained the region, and Buddhist monasteries existed in Tokharistan.","events":[{"y":565,"approx":true,"t":"The Hephthalites are destroyed by the Western Turks and Sasanians (c. 563–566), leaving the region to Turkic overlordship."},{"y":600,"approx":true,"t":"Panjikant flourishes; its temples and houses bear murals forming the fullest set of 5th–8th-century Sogdian painting."},{"y":630,"approx":true,"t":"Xuanzang crosses Tokharistan (c. 628–632), describing its Buddhist monasteries."}],"link":null,"evidence":"moderate","sources":[{"title":"Panjikant","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/panjikant/"},{"title":"Hephthalites","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/hephthalites/"},{"title":"Buddhism iv. Buddhist Sites in Afghanistan and Central Asia","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/buddhism-iv/"}]},"Turkmenistan":{"polity":"Sasanian Empire (Merv, in Khorasan)","summary":"Merv was a major Sasanian city in Khorasan, with a mint and a population of Zoroastrians, Christians and Buddhists; a Buddhist stupa and monastery there are the westernmost excavated Buddhist buildings known. Khorasan faced repeated pressure from the Turks and their Hephthalite allies, and Merv profited from caravan trade.","events":[{"y":588,"approx":false,"t":"Bahram Chobin defeats a Turk-backed Hephthalite invasion of Khorasan that had reached Badghis and Herat."},{"y":590,"approx":false,"t":"Bahram Chobin rebels and Hormizd IV is killed; Khosrow II regains the throne in 591 with Byzantine help."},{"y":615,"approx":true,"t":"Turkic forces defeat the Armenian general Smbat Bagratuni and raid as far as Ray and Isfahan; Smbat later campaigns against them."}],"link":null,"evidence":"moderate","sources":[{"title":"Khorasan iii. Historical Geography in the Late Sasanid-Early Islamic Periods","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/khorasan-iii-historical-geography-in-the-late-sasanid-early-islamic-periods/"},{"title":"Smbat Bagratuni","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/smbat-bagratuni/"},{"title":"Bahrām VI Čōbīn","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/bahram-the-name-of-six-sasanian-kings/bahram-vi/"}]},"Uzbekistan":{"polity":"Sogdian city-states (Samarkand, Bukhara) under Western Turkic overlordship","summary":"Sogdiana's city-states, led by Samarkand and Bukhara, were ruled by local kings who sent tribute to China and lived under Turkic overlordship. Sogdian merchants dominated Silk Road trade and gave the Turks their first chancellery language. Most Sogdians were Zoroastrians, though Buddhist monasteries stood at Termez in the south.","events":[{"y":568,"approx":true,"t":"Sogdian merchants persuade the Turkic khagan to open contact with Byzantium to sell Chinese silk (c. 568–575)."},{"y":630,"approx":true,"t":"Xuanzang passes through Samarkand, noting that the Sogdians were Zoroastrians, then crosses the Iron Gates into Bactria."}],"link":null,"evidence":"moderate","sources":[{"title":"Sogdian Trade","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/sogdian-trade/"},{"title":"Xuanzang","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/biography/Xuanzang"},{"title":"Buddhism iv. Buddhist Sites in Afghanistan and Central Asia","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/buddhism-iv/"}]},"Mongolia":{"polity":"Turkic (Kök Türk) Khaganate, eastern branch","summary":"Mongolia was the centre of the eastern branch of the Turkic Khaganate founded by Bumin in the 550s, ruled first by his son Muhan. Mounted pastoralists ruled a vast tribal confederation, relying on Sogdians for their chancellery, while Sogdian merchants brought Buddhism and Manichaeism. The Eastern Turks fought the Chinese dynasties until 630, when Tang emperor Taizong defeated them and occupied Mongolia.","events":[{"y":572,"approx":false,"t":"Muhan, ruler of the eastern Turkic realm since 553, ends his reign."},{"y":581,"approx":true,"t":"The Bugut stele, written in Sogdian, is raised for the dead khagan Taspar, the oldest surviving inscription on Turkic rulers."},{"y":630,"approx":false,"t":"Tang emperor Taizong defeats the Eastern Turks and occupies Mongolia."}],"link":null,"evidence":"moderate","sources":[{"title":"History of Central Asia: The Middle Ages","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/place/history-of-Central-Asia-102306/The-Middle-Ages"},{"title":"Khagan","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/khagan/"},{"title":"Chinese Turkestan viii. Turkish-Iranian Language Contacts","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/chinese-turkestan-viii/"}]}};

t of Makkah', p. 388"},{"y":630,"approx":false,"ah":"9 AH","t":"Expedition to Tabuk in Rajab against Byzantine forces, without battle. The following months, called the Year of Delegations, see tribes across Arabia send deputations.","src":"Ibn Hisham (Guillaume), 'Raid on Tabuk', p. 602, and 'The Year of the Deputations', p. 627; Sealed Nectar, 'The Invasion of Tabuk', p. 422, and 'The Delegations', p. 443"},{"y":632,"approx":false,"ah":"10–11 AH","t":"Farewell Pilgrimage in Dhu al-Hijja 10 AH. Muhammad ﷺ passes away in Medina on Monday 12 Rabi' al-Awwal 11 AH (June 632), aged 63 lunar years.","src":"Ibn Hisham (Guillaume), 'The farewell pilgrimage', p. 649, and 'His death', p. 682; Sealed Nectar, 'The Farewell Pilgrimage', p. 461, and 'The Prophet breathes his Last', p. 478; Britannica (8 June 632)"}];
