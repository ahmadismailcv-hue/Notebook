/* Layout: full-height atlas. Map left, reading panel right; year rail under the map. Stacks on phones. */
:root {
  --bg: #eef0ee;
  --surface: #f8f9f7;
  --sea: #d6dfe2;
  --fg: #1d2326;
  --muted: #5b666b;
  --line: #c4ccce;
  --accent: #1d4f7a;      /* lapis */
  --gold: #a87411;        /* Arabia / the Prophet's track */
  --land-edge: #f8f9f7;
  --hl: #1d2326;
  --font-display: "Marcellus", "Trajan Pro", Georgia, serif;
  --font-body: "Literata", Georgia, "Times New Roman", serif;
  --font-data: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  /* sphere palette */
  --c-islam: #c8952b; --c-arabia: #e2c98f; --c-byz: #8a5a9e; --c-sas: #b5523b;
  --c-latin: #4f7fae; --c-slav: #8fae7a; --c-north: #9bb8c4; --c-turk: #c9a27a;
  --c-india: #d9845a; --c-china: #c4443f; --c-eastasia: #d78d97; --c-seasia: #5f9e8f;
  --c-aksum: #6c7f3c; --c-berber: #b8a36a; --c-meso: #3f8f7a; --c-andes: #9a6b4f;
  --c-other: #cfd3cc; --c-none: #e9ebe8;
  --c-rich: #1d4f7a; --c-moderate: #7ea3c2; --c-sparse: #d2d8dc;
  --c-link: #c8952b; --c-nolink: #d5d9d6; --c-pending: #eef0ee;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12171b; --surface: #182026; --sea: #0d1316; --fg: #e4e8ea; --muted: #94a1a7; --line: #2d383f;
  --accent: #7fb0dc; --gold: #e0b250; --land-edge: #12171b; --hl: #ffffff;
  --c-islam: #d9a73a; --c-arabia: #a8925e; --c-byz: #8c66a0; --c-sas: #b05a45;

  --c-india: #b8714d; --c-china: #b04440; --c-eastasia: #a8707a; --c-seasia: #4c8578;

  color-scheme: dark;
} }

  --accent: #7fb0dc; --gold: #e0b250; --land-edge: #12171b; --hl: #ffffff;
  --c-islam: #d9a73a; --c-arabia: #a8925e; --c-byz: #8c66a0; --c-sas: #b05a45;

  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.55; }
.app { display: grid; grid-template-columns: minmax(0, 1fr) 380px; grid-template-rows: auto minmax(0, 1fr) auto; height: 100%; padding-inline: 16px; gap: 0 20px; }
header { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 24px; padding-block: 14px 10px; border-bottom: 1px solid var(--line); }
h1 { font-family: var(--font-display); font-weight: 400; font-size: 1.7rem; letter-spacing: .02em; margin: 0; text-wrap: balance; }
h1 small { font-family: var(--font-data); font-size: .72rem; color: var(--muted); letter-spacing: .06em; margin-left: 10px; white-space: nowrap; }
.modes { display: flex; gap: 4px; flex-wrap: wrap; }
.modes button, .chip, .back { font: 500 .74rem/1 var(--font-data); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); background: transparent; border: 1px solid var(--line); border-radius: 3px; padding: 7px 10px; cursor: pointer; }
.modes button[aria-pressed="true"] { color: var(--surface); background: var(--fg); border-color: var(--fg); }
button:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.mapwrap { position: relative; min-height: 0; padding-block: 12px 0; display: flex; flex-direction: column; }
#map { flex: 1; min-height: 300px; width: 100%; background: var(--sea); border-radius: 4px; display: block; cursor: grab; touch-action: none; }
#map:active { cursor: grabbing; }
.country { stroke: var(--land-edge); stroke-width: .5; transition: fill .35s ease; cursor: pointer; }
.country:hover { filter: brightness(1.08); }
.country.sel { stroke: var(--hl); stroke-width: 1.6; }
.country.dim { opacity: .28; }
.grat { fill: none; stroke: var(--line); stroke-width: .4; opacity: .6; }
.pin { fill: var(--surface); stroke: var(--fg); stroke-width: 1.2; pointer-events: none; }
.pin.arabia { fill: var(--gold); stroke: var(--surface); }
.pulse { fill: none; stroke: var(--gold); stroke-width: 1.2; pointer-events: none; animation: pulse 2.4s ease-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes pulse { from { opacity: .9; transform: scale(.6); } to { opacity: 0; transform: scale(2.6); } }
@media (prefers-reduced-motion: reduce) { .pulse { animation: none; opacity: .5; } .country { transition: none; } }
.zoombtns { position: absolute; right: 10px; top: 22px; display: flex; flex-direction: column; gap: 4px; }
.zoombtns button { width: 30px; height: 30px; font: 500 1rem/1 var(--font-data); background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 3px; cursor: pointer; }
.tip { position: absolute; pointer-events: none; background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 3px; padding: 6px 9px; font-size: .82rem; line-height: 1.35; max-width: 240px; box-shadow: 0 4px 14px rgb(0 0 0 / .12); }
.tip b { font-family: var(--font-display); font-weight: 400; font-size: .95rem; display: block; }
.tip span { color: var(--muted); }

.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; padding-block: 8px 0; font: .72rem/1.3 var(--font-data); color: var(--muted); }
.legend button { all: unset; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; padding: 2px 0; }
.legend button[aria-pressed="true"] { color: var(--fg); text-decoration: underline; text-underline-offset: 3px; }
.legend i { width: 11px; height: 11px; border-radius: 2px; display: inline-block; flex: none; }

.rail { grid-column: 1 / 2; padding-block: 10px 14px; }
.rail-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.yr { font-family: var(--font-display); font-size: 2.2rem; line-height: 1; font-variant-numeric: tabular-nums; }
.yr em { font: .8rem var(--font-data); font-style: normal; color: var(--muted); margin-left: 6px; }
.stage { font-size: .9rem; color: var(--gold); font-style: italic; text-align: right; max-width: 34em; }
.track { position: relative; height: 44px; margin-top: 6px; }
#year { position: absolute; inset: 18px 0 auto 0; width: 100%; margin: 0; accent-color: var(--gold); }
.tick { position: absolute; top: 0; width: 1px; height: 12px; background: var(--gold); opacity: .9; }
.tick button { all: unset; position: absolute; top: -4px; left: -6px; width: 13px; height: 16px; cursor: pointer; }
.life { position: absolute; top: 13px; height: 2px; background: var(--gold); opacity: .35; }
.scale { position: absolute; top: 34px; font: .66rem var(--font-data); color: var(--muted); transform: translateX(-50%); }
.play { margin-left: 8px; }

aside { grid-row: 2 / 4; grid-column: 2; min-height: 0; overflow-y: auto; padding-block: 16px 24px; border-left: 1px solid var(--line); padding-left: 20px; }
aside h2 { font-family: var(--font-display); font-weight: 400; font-size: 1.55rem; margin: 0 0 2px; line-height: 1.15; text-wrap: balance; }
aside h3 { font: 500 .7rem var(--font-data); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 20px 0 8px; }
.polity { color: var(--muted); font-style: italic; margin: 0 0 12px; }
.badges { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.badge { font: .68rem/1 var(--font-data); letter-spacing: .05em; text-transform: uppercase; padding: 5px 7px; border-radius: 3px; border: 1px solid var(--line); color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.badge i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }
.summary { margin: 0; }
.link { margin-top: 14px; padding: 10px 12px; border-left: 2px solid var(--gold); background: color-mix(in srgb, var(--gold) 9%, transparent); font-size: .92rem; }
.link b { font: 500 .68rem var(--font-data); letter-spacing: .1em; text-transform: uppercase; color: var(--gold); display: block; margin-bottom: 3px; }
ol.ev { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
ol.ev li { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 10px; font-size: .92rem; line-height: 1.45; }
ol.ev li.near .y { color: var(--surface); background: var(--fg); }
ol.ev li.far { opacity: .62; }
.y { font: 500 .78rem/1 var(--font-data); font-variant-numeric: tabular-nums; padding: 4px 0; text-align: center; border-radius: 3px; align-self: start; color: var(--fg); border: 1px solid var(--line); }
.y.ar { border-color: var(--gold); color: var(--gold); }
ol.ev .where { all: unset; cursor: pointer; font: 500 .7rem var(--font-data); letter-spacing: .05em; text-transform: uppercase; color: var(--accent); display: block; }
ol.ev .where:hover { text-decoration: underline; }
.back { margin-bottom: 14px; }
.note { font-size: .8rem; color: var(--muted); margin-top: 22px; border-top: 1px solid var(--line); padding-top: 12px; }
.empty { color: var(--muted); font-style: italic; font-size: .9rem; }
.saw { font-family: "Amiri", "Scheherazade New", "Noto Naskh Arabic", serif; font-size: 1.15em; line-height: 1; margin-inline: .08em; }
.src { display: block; font: .7rem/1.4 var(--font-data); color: var(--muted); margin-top: 3px; }
ul.sources { margin: 0; padding-left: 18px; font-size: .84rem; color: var(--muted); display: grid; gap: 6px; }
ul.sources a { color: var(--accent); }
.about p, .about li { font-size: .9rem; }
.about ul { padding-left: 18px; display: grid; gap: 6px; }
.report { margin-top: 12px; font-size: .84rem; }
.report a, .about a { color: var(--accent); }
details.all { margin-top: 14px; }
details.all summary { cursor: pointer; font: 500 .74rem var(--font-data); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
ul.clist { list-style: none; padding: 0; margin: 10px 0 0; columns: 2; column-gap: 16px; }
ul.clist li { break-inside: avoid; padding: 2px 0; }
ul.clist .where { text-transform: none; letter-spacing: 0; font: .86rem var(--font-body); color: var(--accent); }
.search { width: 100%; font: .88rem var(--font-body); padding: 8px 10px; border: 1px solid var(--line); border-radius: 3px; background: var(--surface); color: var(--fg); margin-bottom: 4px; }

@media (max-width: 860px) {
  html, body { height: auto; }
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto; height: auto; }
  #map { height: auto; aspect-ratio: 1.9 / 1; min-height: 0; max-width: 100%; flex: none; }
  aside { grid-row: auto; grid-column: 1; border-left: 0; padding-left: 0; border-top: 1px solid var(--line); overflow: visible; }
  .rail { grid-column: 1; }
  .stage { text-align: left; }
  h1 { font-size: 1.35rem; }
}
</style>

const DATA = {"Algeria":{"polity":"Byzantine Africa and independent Moorish (Berber) kingdoms","summary":"From the 5th century, Berber chiefs known at the time as Moorish kings ruled small states both outside and inside the former Roman provinces: Masuna, known from an inscription at Altava in Mauretania Caesariensis, and, in the Byzantine period, Iaudas in the Aures. Byzantine territory in Africa was governed from Carthage, where Emperor Maurice (r. 582-602) created an exarchate in a land occupied largely by Berbers.","events":[],"link":null,"evidence":"moderate","sources":[{"title":"G. Camps, Rex gentium Maurorum et Romanorum. Recherches sur les royaumes de Mauretanie des VIe et VIIe siecles (Antiquites africaines 20, 1984)","publisher":"Antiquites africaines, via Persee","url":"https://www.persee.fr/doc/antaf_0066-4871_1984_num_20_1_1105"},{"title":"Exarchate of Carthage","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/place/Exarchate-of-Carthage"}]},"Libya":{"polity":"Byzantine Tripolitania and Cyrenaica; Fezzan, former land of the Garamantes","summary":"Justinian's reconquest of 533-534 began with an anti-Vandal revolt in Tripolitania, backed by Roman soldiers from Cyrenaica, and returned the coast to the empire. Inland lay Fezzan, the old territory of the Garamantes, which the Arabs conquered in 666. Arab armies reached the coast in the 640s; excavations show that Tocra in Cyrenaica stayed inhabited after the conquest. Sources for 570-632 itself are scarce.","events":[],"link":null,"evidence":"sparse","sources":[{"title":"Justinian I","publisher":"World History Encyclopedia","url":"https://www.worldhistory.org/Justinian_I/"},{"title":"Garamantes","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/topic/Garamantes"},{"title":"A. M. Buzaian, Excavations at Tocra (1985-1992) (Libyan Studies 31, 2000)","publisher":"Cambridge University Press","url":"https://www.cambridge.org/core/journals/libyan-studies/article/abs/excavations-at-tocra-19851992/1D41FEC5B99636811705EE92E45ACECA"}]},"Morocco":{"polity":"Local Romano-Berber communities outside imperial rule","summary":"The Roman army had abandoned the southern part of Mauretania Tingitana, including Volubilis, after Diocletian's reorganisation of 285. At Volubilis a cemetery near the Arch of Caracalla has yielded Christian Latin funerary inscriptions dated 599-655 CE, showing a Christianised Romano-Berber population that still used Latin. Islamisation was under way there before Idris I arrived in the late 8th century.","events":[{"y":600,"approx":true,"t":"Christian Latin epitaphs at Volubilis, dated 599-655 CE, attest a Christianised Romano-Berber community still using Latin."}],"link":null,"evidence":"sparse","sources":[{"title":"The History of Volubilis","publisher":"Volubilis Project (UCL / INSAP excavations)","url":"https://volubilis.lparchaeology.com/www/english/about/history.htm"}]},"Tunisia":{"polity":"Byzantine Exarchate of Africa (capital Carthage)","summary":"Carthage was the centre of Byzantine Africa. In the late 6th century Emperor Maurice (r. 582-602) made it an exarchate whose governor held military and civil power. In 610 Heraclius, son of the governor of Carthage of the same name, led a fleet to Constantinople, where Phocas was overthrown and Heraclius proclaimed emperor. Amid later defeats he considered moving his capital to Carthage.","events":[{"y":590,"approx":true,"t":"Emperor Maurice (r. 582-602) establishes the exarchate of Carthage, its exarch holding military and civil power; the exact date is uncertain."},{"y":610,"approx":false,"t":"Heraclius, son of the governor of Carthage, leads a fleet to Constantinople; Phocas is overthrown and dies on 5 October, and Heraclius becomes emperor."},{"y":619,"approx":true,"t":"After heavy losses to Persia, Heraclius considers moving his capital to Carthage but is persuaded to stay by Bishop Sergios of Constantinople and the people."}],"link":null,"evidence":"rich","sources":[{"title":"Exarchate of Carthage","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/place/Exarchate-of-Carthage"},{"title":"Phocas","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/biography/Phocas"},{"title":"Heraclius","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/biography/Heraclius-Byzantine-emperor"},{"title":"Heraclius","publisher":"World History Encyclopedia","url":"https://www.worldhistory.org/Heraclius/"}]},"W. Sahara":{"polity":"Unknown (not documented)","summary":"This territory, made up of the regions of Rio de Oro and Saguia el-Hamra, lies on the Atlantic between Morocco, Algeria and Mauritania. The sources consulted give no written or dated archaeological evidence about its people or rulers in 570-632.","events":[],"link":null,"evidence":"sparse","sources":[{"title":"Western Sahara","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/place/Western-Sahara"}]},"Mauritania":{"polity":"Soninke communities in the south (early Ghana / Wagadu)","summary":"The Ghana (Wagadu) empire, which Britannica dates from the 7th to the 13th century, lay between the Sahara and the headwaters of the Senegal and Niger rivers, in what is now southeastern Mauritania and part of Mali. Its founders were the Soninke. Evidence for 570-632 itself is very thin.","events":[{"y":600,"approx":true,"t":"The Soninke state of Ghana (Wagadu), dated by Britannica from the 7th century, may be taking shape in the southern Sahel."}],"link":null,"evidence":"sparse","sources":[{"title":"Ghana (historical West African empire)","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/place/Ghana-historical-West-African-empire"},{"title":"Soninke","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/topic/Soninke"}]},"Sudan":{"polity":"Nubian kingdoms: Nobadia, Makuria and Alodia (Alwa)","summary":"Three Christian Nubian kingdoms lined the Nile: Nobadia in the north (capital Pachoras, modern Faras), Makuria (capital Dongola) and Alodia (capital Soba). All converted in the 6th century. Nobadia's ruler adopted Miaphysite (Monophysite) Christianity, while John of Biclaro records Makuria's conversion to the Diophysite faith c. 570. Nobadia and Makuria later merged, sometime in the 7th century or by the early 8th.","events":[{"y":569,"approx":true,"t":"The missionary Longinus, successor of Julian, begins work in Nubia; by 575 the three Nubian kingdoms have been converted to Christianity."},{"y":570,"approx":true,"t":"John of Biclaro records the conversion of Makuria to the Diophysite (Chalcedonian) faith, c. 570."}],"link":null,"evidence":"moderate","sources":[{"title":"Alwah","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/place/Alwah"},{"title":"Makouria (Research Starters)","publisher":"EBSCO","url":"https://www.ebsco.com/research-starters/religion-and-philosophy/makouria"},{"title":"Nubian Kingdoms","publisher":"Nubian Monasteries project, Polish Centre of Mediterranean Archaeology, University of Warsaw","url":"http://nubianmonasteries.uw.edu.pl/about/"}]},"S. Sudan":{"polity":null,"evidence":"sparse","pending":true,"sources":[],"events":[],"link":null},"Eritrea":{"polity":"Kingdom of Aksum (Red Sea coast and highlands)","summary":"The coast lay within the Christian kingdom of Aksum, whose port Adulis, on the Gulf of Zula, linked African, Mediterranean and Asian trade. Adulis declined as trade routes shifted and was cut off from Mediterranean trade by the rise of Arab powers in the 7th and 8th centuries. Across the Red Sea, Sasanian Persia drove Ethiopian forces from Yemen in the later 6th century.","events":[{"y":575,"approx":true,"t":"A Sasanian expedition sent by Khosrow I expels Ethiopian forces from Yemen; sources date it variously, including 575-576 and 582."},{"y":615,"approx":true,"t":"Muslim emigrants from Arabia find protection in the Christian Aksumite kingdom (the First Hijra)."},{"y":630,"approx":true,"t":"Adulis declines as Red Sea trade shifts and Arab powers rise in the 7th and 8th centuries; the exact chronology is uncertain."}],"link":"The first Muslim emigrants (the First Hijra, 615 CE) were granted protection by the Aksumite kingdom, whose Red Sea coast and port of Adulis lay here.","evidence":"moderate","sources":[{"title":"Adulis","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/place/Adulis"},{"title":"Arabia ii. The Sasanians and Arabia","publisher":"Encyclopaedia Iranica","url":"https://www.iranicaonline.org/articles/arabia-ii-sasanians-and-arabia/"},{"title":"Negash (Al-Nejashi) Village: Sanctuary of the First Hijra (Tentative List)","publisher":"UNESCO World Heritage Centre","url":"https://whc.unesco.org/en/tentativelists/7015/"},{"title":"Aksum","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/place/Aksum-ancient-kingdom-Africa"}]},"Ethiopia":{"polity":"Kingdom of Aksum (ruler known in Islamic tradition as al-Najashi, Ashama)","summary":"Aksum was a Christian kingdom, one of the first to adopt Christianity in the 4th century, and a link between African, Mediterranean and Asian trade. Its rule in Yemen ended when Sasanian Persia expelled Ethiopian forces in the later 6th century. According to Islamic sources, its ruler, the Negus Ashama (al-Najashi), sheltered Muslim emigrants from Arabia, among them Ja'far ibn Abi Talib, from c. 615.","events":[{"y":615,"approx":true,"t":"First Hijra: Muslim emigrants from Arabia are granted protection by the Christian Aksumite kingdom."},{"y":628,"approx":true,"t":"Ja'far ibn Abi Talib and the remaining emigrants in Ethiopia rejoin Muhammad ﷺ at the time of the conquest of Khaybar, per Sahih al-Bukhari."},{"y":630,"approx":true,"t":"The Negus Ashama dies (date uncertain); per Sahih al-Bukhari, Muhammad ﷺ announced his death and led the funeral prayer for him."}],"link":"According to Islamic sources, the Negus Ashama (al-Najashi) sheltered Muslim emigrants from c. 615, including Ja'far ibn Abi Talib, and Muhammad ﷺ led the funeral prayer for him when he died.","evidence":"moderate","sources":[{"title":"Negash (Al-Nejashi) Village: Sanctuary of the First Hijra (Tentative List)","publisher":"UNESCO World Heritage Centre","url":"https://whc.unesco.org/en/tentativelists/7015/"},{"title":"Sahih al-Bukhari 4230 and 3877","publisher":"Sunnah.com","url":"https://sunnah.com/bukhari:4230"},{"title":"Sahih al-Bukhari 1245","publisher":"Sunnah.com","url":"https://sunnah.com/bukhari:1245"},{"title":"Aksum","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/place/Aksum-ancient-kingdom-Africa"},{"title":"Timeline: Islam","publisher":"World History Encyclopedia","url":"https://www.worldhistory.org/timeline/islam/"}]},"Djibouti":{"polity":"Unknown (not documented)","summary":"This coast lies on the Bab el-Mandeb strait on the northeast coast of the Horn of Africa. The sources consulted give no written or dated archaeological evidence about its people or rulers in 570-632.","events":[],"link":null,"evidence":"sparse","sources":[{"title":"Djibouti","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/place/Djibouti"}]},"Somalia":{"polity":"Unknown (poorly documented)","summary":"The sources consulted say little about the Somali coast in this period. Britannica describes Seylac (Zeila), on the Gulf of Aden in the far north-west, as the most important Arab settlement on the Somali coast only from the 9th century, trading between Christian Ethiopia and Muslim Arabia. Evidence for 570-632 is very limited.","events":[],"link":null,"evidence":"sparse","sources":[{"title":"Seylac","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/place/Seylac"}]},"Somaliland":{"polity":"Gulf of Aden coast (poorly documented)","summary":"Seylac (Zeila), on the Gulf of Aden, became the most important Arab settlement on the Somali coast from the 9th century, a centre of trade between Christian Ethiopia and Muslim Arabia in ivory, skins and incense. What this coast was like in 570-632 is not documented in the sources consulted.","events":[],"link":null,"evidence":"sparse","sources":[{"title":"Seylac","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/place/Seylac"}]},"Kenya":{"polity":"Coastal and hinterland communities of the early Tana Tradition","summary":"From about 600 CE, sites across eastern Africa, including the Kenyan coast, share locally made pottery known as the early Tana Tradition or Triangular-Incised Ware. Its recognition has led archaeologists to stress the indigenous roots of the later cosmopolitan Swahili coastal culture. Evidence for the period is archaeological.","events":[{"y":600,"approx":true,"t":"Sites across eastern Africa are characterised by early Tana Tradition (Triangular-Incised Ware) pottery, c. 600-900."}],"link":null,"evidence":"sparse","sources":[{"title":"Fleisher and Wynne-Jones, Ceramics and the Early Swahili: Deconstructing the Early Tana Tradition (2011)","publisher":"African Archaeological Review (Springer)","url":"https://link.springer.com/article/10.1007/s10437-011-9104-6"}]},"Tanzania":{"polity":"Early coastal trading villages","summary":"Early coastal villages were forerunners of Swahili culture. On Zanzibar, Unguja Ukuu was settled from the 7th, if not the 6th, century and was tied to Indian Ocean trade from its earliest levels. On Pemba, the trading village of Tumbe dates to c. 600-950 and may have produced shell beads for export. Evidence is archaeological.","events":[{"y":600,"approx":true,"t":"Unguja Ukuu on Zanzibar is occupied as a trading settlement from the 7th, if not the 6th, century; its start date is debated."}],"link":null,"evidence":"sparse","sources":[{"title":"Fitton and Wynne-Jones, Understanding the layout of early coastal settlement at Unguja Ukuu, Zanzibar (2017)","publisher":"Antiquity (Cambridge University Press)","url":"https://www.cambridge.org/core/journals/antiquity/article/understanding-the-layout-of-early-coastal-settlement-at-unguja-ukuu-zanzibar/A93E817CE0D498CB706CAFCB0DDB0308"},{"title":"Fleisher and LaViolette, The early Swahili trade village of Tumbe, Pemba Island, Tanzania, AD 600-950 (2013)","publisher":"Antiquity (Cambridge University Press)","url":"https://www.cambridge.org/core/journals/antiquity/article/abs/early-swahili-trade-village-of-tumbe-pemba-island-tanzania-ad-600950/96E5356A34B749A056921E27371A05A0"}]},"Madagascar":{"polity":"Early settlers (Austronesian arrival dates debated)","summary":"The Malagasy language is related to Ma'anyan of southern Borneo, and Malagasy people have both Southeast Asian and African ancestry. When Austronesian seafarers arrived is debated: estimates range from the middle of the first millennium CE to the 7th-8th centuries, and Southeast Asian crops found at early sites give the first archaeological evidence of their presence.","events":[{"y":630,"approx":true,"t":"Austronesian settlers may be reaching Madagascar, estimated on linguistic grounds at about the 7th-8th centuries; dates remain debated."}],"link":null,"evidence":"sparse","sources":[{"title":"Crowther et al., Ancient crops provide first archaeological signature of the westward Austronesian expansion (2016)","publisher":"PNAS","url":"https://www.pnas.org/doi/10.1073/pnas.1522714113"},{"title":"Kusuma et al., Contrasting Linguistic and Genetic Origins of the Asian Source Populations of Malagasy (2016)","publisher":"Scientific Reports (Nature)","url":"https://www.nature.com/articles/srep26066"}]},"Mozambique":{"polity":"Farming communities; coastal trading sites","summary":"Farming communities with decorated pottery and iron-working had settled the coast of southern Mozambique in earlier centuries. In the later first millennium, the beach site of Chibuene was a landing place for Indian Ocean goods; its community supplied imported beads to interior sites such as Schroda. Evidence is archaeological.","events":[],"link":null,"evidence":"sparse","sources":[{"title":"Sinclair, Ekblom and Wood, Trade and society on the south-east African coast in the later first millennium AD: the case of Chibuene (2012)","publisher":"Antiquity (Cambridge University Press)","url":"https://www.cambridge.org/core/journals/antiquity/article/abs/trade-and-society-on-the-southeast-african-coast-in-the-later-first-millennium-ad-the-case-of-chibuene/3433E399B0D88DD2F85E266BADAD80C8"},{"title":"Lander & Russell, The archaeological evidence for the appearance of pastoralism and farming in southern Africa (PLoS ONE 13, 2018)","publisher":"PLoS ONE, via PubMed Central","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC6002040/"}]},"Chad":{"polity":"Sao communities of the Lake Chad basin","summary":"The Sao, the oldest known civilisation of the Lake Chad region, settled around the lake by about the 5th century (one UNESCO text says 5th century BC; the date is disputed). They lived mainly from fishing, hunting and farming, left rich pottery, and are regarded as ancestors of the Kotoko. The period 570-632 is known only through archaeology.","events":[{"y":600,"approx":true,"t":"Sao communities fish, hunt and farm around Lake Chad and produce rich pottery."}],"link":null,"evidence":"sparse","sources":[{"title":"Lake Chad Cultural Landscape (Nigeria) (Tentative List)","publisher":"UNESCO World Heritage Centre","url":"https://whc.unesco.org/fr/listesindicatives/6360"}]},"Niger":{"polity":"Bura culture of the Niger valley","summary":"In the Niger River valley, the Bura culture buried its dead in terracotta funerary jars topped with figures. The Met dates Bura grave markers to the 3rd-11th centuries, and the UNESCO tentative listing places use of the Bura necropolis between the 3rd and 13th centuries. Bura holds the oldest terracotta equestrian figures in the Niger basin. Evidence is archaeological only.","events":[{"y":600,"approx":true,"t":"The Bura necropolis, used between the 3rd and 13th centuries, receives burials in terracotta jars topped with figures."}],"link":null,"evidence":"sparse","sources":[{"title":"Grave Marker, Bura peoples","publisher":"The Metropolitan Museum of Art","url":"https://www.metmuseum.org/art/collection/search/317898"},{"title":"Site archeologique de Bura (Tentative List)","publisher":"UNESCO World Heritage Centre","url":"https://whc.unesco.org/en/tentativelists/5045/"}]},"Mali":{"polity":"Djenne-Djeno and Inland Niger Delta settlements; possible early Ghana (Wagadu)","summary":"Djenne, inhabited since about 250 BCE, includes the archaeological site of Djenne-Djeno, part of a UNESCO World Heritage property. Excavations there revealed a pre-Islamic urban settlement of circular and rectangular earthen buildings, funerary jars, pottery and metal slag. To the north-west, the Soninke state of Ghana (Wagadu), dated by Britannica from the 7th century, may have been forming.","events":[{"y":600,"approx":true,"t":"Soninke communities may be organising the early Ghana (Wagadu) state, which Britannica dates from the 7th century."}],"link":null,"evidence":"sparse","sources":[{"title":"Old Towns of Djenne","publisher":"UNESCO World Heritage Centre","url":"https://whc.unesco.org/en/list/116"},{"title":"Ghana (historical West African empire)","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/place/Ghana-historical-West-African-empire"}]},"Angola":{"polity":"Farming and herding communities (poorly documented)","summary":"Angola is thought to be a potentially important route for the spread of herders, farmers and livestock into southern Africa, yet a 2018 survey of the evidence found hardly any archaeology from the region. Pottery from a shell midden at Benfica, on the northern coast, has been proposed as a possible origin of the Kalundu pottery tradition. Little can be said specifically about 570-632.","events":[],"link":null,"evidence":"sparse","sources":[{"title":"Lander & Russell, The archaeological evidence for the appearance of pastoralism and farming in southern Africa (PLoS ONE 13, 2018)","publisher":"PLoS ONE, via PubMed Central","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC6002040/"}]},"Benin":{"polity":"Unrecorded local communities (no known state)","summary":"No written records survive for this land in 570–632, and its communities are known only in the most general terms. The kingdoms later associated with the area, such as Allada, Abomey (Dahomey), Ouidah, Nikki and Porto-Novo, arose only between the 12th or 13th century and the 19th century. Across Africa, iron smelting, known since the first millennium BCE, was still spreading.","events":[{"y":600,"approx":true,"t":"Iron and copper smelting, known in Africa since the first millennium BCE, continues to spread; by c. 1000 it is found across the continent."}],"link":null,"evidence":"sparse","sources":[{"title":"Benin (Britannica Students)","publisher":"Encyclopaedia Britannica","url":"https://kids.britannica.com/students/article/Benin/273170"},{"title":"Guinea Coast, 500–1000 A.D. (Heilbrunn Timeline of Art History)","publisher":"The Metropolitan Museum of Art","url":"https://www.metmuseum.org/toah/ht/06/afg.html"}]},"Botswana":{"polity":"Foragers and herders; early iron-using farmers at Tsodilo","summary":"At the Tsodilo Hills in the north-west, with over 4,500 rock paintings and a long record of human occupation, the Early Iron Age village of Divuyu dates to the 6th-8th centuries; its people forged iron and worked copper into small ornaments. The nearby site of Nqoma dates to the 7th-10th centuries. No written records exist.","events":[{"y":600,"approx":true,"t":"Divuyu at the Tsodilo Hills is occupied by iron- and copper-working people, dated to the 6th-8th centuries."}],"link":null,"evidence":"sparse","sources":[{"title":"Tsodilo","publisher":"UNESCO World Heritage Centre","url":"https://whc.unesco.org/en/list/1021"},{"title":"D. Miller, Iron age metal working at the Tsodilo Hills, Northwestern Botswana (PhD thesis, 1992)","publisher":"University of Cape Town (OpenUCT)","url":"https://open.uct.ac.za/items/a76a0330-0942-4851-8c32-da6b74587829"}]},"Burkina Faso":{"polity":"Iron-working farming communities","summary":"Iron production in the region was very old: Douroula, part of a UNESCO World Heritage property, dates back to the 8th century BCE. The property's other furnace sites show intensified production in the second millennium CE. Little is specifically dated to c. 570-632.","events":[{"y":600,"approx":true,"t":"Iron smelting, attested at Douroula since the 8th century BCE, is long established; sites of this era are poorly dated."}],"link":null,"evidence":"sparse","sources":[{"title":"Ancient Ferrous Metallurgy Sites of Burkina Faso","publisher":"UNESCO World Heritage Centre","url":"https://whc.unesco.org/en/list/1602/"}]},"Burundi":{"polity":"Early Iron Age farming communities (Urewe culture and successors)","summary":"Burundi's Central Plateau, with good farming soils and easy access to iron ore and wood, was home to Early Iron Age communities of the Urewe culture. Radiocarbon dates suggest iron smelting began here early in the first millennium BCE at the latest and flourished until about the 7th century CE. No written sources exist, and the later kingdom of Burundi did not yet exist.","events":[{"y":600,"approx":true,"t":"Iron smelting in the Rwanda–Burundi region, practised for over a millennium, reaches the end of its Early Iron Age flourishing (c. 7th century)."}],"link":null,"evidence":"sparse","sources":[{"title":"P. Craddock, I. Freestone, A. Middleton and M.-C. Van Grunderbeek, 'Early Iron Age iron-smelting debris from Rwanda and Burundi, East Africa', Historical Metallurgy 41(1), 2007","publisher":"Historical Metallurgy Society","url":"https://hmsjournal.org/index.php/home/article/download/218/212"}]},"Cameroon":{"polity":"Farming and foraging communities (much reduced in the south)","summary":"The border region of Nigeria and Cameroon is the homeland from which Bantu-speaking peoples spread. In southern Cameroon, radiocarbon evidence shows a population collapse c. 400-600 CE and very low activity for centuries after, reaching near-zero values about 900-1000 CE. Archaeology is the only evidence.","events":[{"y":600,"approx":true,"t":"Southern Cameroon's forest communities are much reduced after a population collapse c. 400-600 CE."}],"link":null,"evidence":"sparse","sources":[{"title":"Seidensticker et al., Population collapse in Congo rainforest from 400 CE urges reassessment of the Bantu Expansion (Science Advances 7, 2021)","publisher":"Science Advances (AAAS)","url":"https://www.science.org/doi/10.1126/sciadv.abd8352"}]},"Central African Rep.":{"polity":"Savanna and forest communities (poorly documented)","summary":"No written sources exist. Across the Congo rainforest to the south, radiocarbon evidence shows a widespread population collapse between c. 400 and 600 CE, followed by markedly low human activity until about 1000 CE; only 61 sites in the whole rainforest have well-dated evidence from 600-1000 CE.","events":[{"y":600,"approx":true,"t":"In the Congo rainforest to the south, human activity is very low after a collapse c. 400-600 CE."}],"link":null,"evidence":"sparse","sources":[{"title":"Seidensticker et al., Population collapse in Congo rainforest from 400 CE urges reassessment of the Bantu Expansion (Science Advances 7, 2021)","publisher":"Science Advances (AAAS)","url":"https://www.science.org/doi/10.1126/sciadv.abd8352"}]},"Congo":{"polity":"Forest and river communities (much reduced)","summary":"Early Iron Age communities had expanded across the Congo rainforest, including the western Congo basin, but radiocarbon evidence shows a widespread population collapse c. 400-600 CE, followed by markedly low human activity until about 1000 CE, when new pottery groups and a second expansion phase appear.","events":[{"y":600,"approx":true,"t":"After a rainforest-wide population collapse c. 400-600 CE, human activity stays low until about 1000 CE."}],"link":null,"evidence":"sparse","sources":[{"title":"Seidensticker et al., Population collapse in Congo rainforest from 400 CE urges reassessment of the Bantu Expansion (Science Advances 7, 2021)","publisher":"Science Advances (AAAS)","url":"https://www.science.org/doi/10.1126/sciadv.abd8352"}]},"Côte d'Ivoire":{"polity":"Unrecorded local communities (no known state)","summary":"No written records survive for this land in 570–632, and its peoples are known only in general terms. The states later found here came long afterwards: the Senufo founded the kingdom of Kong in the 11th century, and Akan and Anyi peoples migrated in and founded kingdoms much later still. Across Africa, iron smelting, known since the first millennium BCE, was still spreading.","events":[{"y":600,"approx":true,"t":"Iron and copper smelting, known in Africa since the first millennium BCE, continues to spread; by c. 1000 it is found across the continent."}],"link":null,"evidence":"sparse","sources":[{"title":"Côte d'Ivoire (Britannica Students)","publisher":"Encyclopaedia Britannica","url":"https://kids.britannica.com/students/article/C%C3%B4te-dIvoire/273828"},{"title":"Guinea Coast, 500–1000 A.D. (Heilbrunn Timeline of Art History)","publisher":"The Metropolitan Museum of Art","url":"https://www.metmuseum.org/toah/ht/06/afg.html"}]},"Dem. Rep. Congo":{"polity":"Farming and foraging communities; Kamilambian iron-users in the Upemba","summary":"Across the Congo rainforest, including the inner Congo basin, radiocarbon evidence shows a population collapse c. 400-600 CE and low activity until c. 1000. In the Upemba Depression in the south-east, the Kamilambian, the area's earliest ironworking culture (c. 6th-8th century), relied on farming and fishing and preceded the Kisalian, which began c. mid-8th century.","events":[{"y":600,"approx":true,"t":"Kamilambian communities, the Upemba Depression's earliest ironworking culture (c. 6th-8th century), occupy sites such as Kamilamba and Sanga."}],"link":null,"evidence":"sparse","sources":[{"title":"Nicolas Nikis, Upemba Depression (The Encyclopedia of Ancient History, 2021)","publisher":"Wiley-Blackwell; author copy via Royal Museum for Central Africa","url":"https://www.africamuseum.be/publication_docs/Nikis 2021 Upemba depression.pdf"},{"title":"Seidensticker et al., Population collapse in Congo rainforest from 400 CE urges reassessment of the Bantu Expansion (Science Advances 7, 2021)","publisher":"Science Advances (AAAS)","url":"https://www.science.org/doi/10.1126/sciadv.abd8352"}]},"Eq. Guinea":{"polity":"Forest communities (poorly documented)","summary":"The mainland lies within the Congo rainforest between southern Cameroon and Gabon, where radiocarbon studies show a population collapse c. 400-600 CE and very low human activity for centuries afterwards. No written sources exist.","events":[{"y":600,"approx":true,"t":"Rainforest communities in the region are much reduced after a population collapse c. 400-600 CE."}],"link":null,"evidence":"sparse","sources":[{"title":"Seidensticker et al., Population collapse in Congo rainforest from 400 CE urges reassessment of the Bantu Expansion (Science Advances 7, 2021)","publisher":"Science Advances (AAAS)","url":"https://www.science.org/doi/10.1126/sciadv.abd8352"}]},"Gabon":{"polity":"Forest communities (much reduced)","summary":"Iron working had reached Central Africa about 3,000 years ago, but radiocarbon evidence shows a sharp population collapse in Gabon c. 400-600 CE and very low human activity until about 1000 CE. Genetic data suggest that today's Bantu-speaking communities of Gabon arrived only in the second expansion phase (1000-1500 CE).","events":[{"y":600,"approx":true,"t":"Gabon's forest is thinly occupied after a population collapse c. 400-600 CE; resettlement follows from about 1000."}],"link":null,"evidence":"sparse","sources":[{"title":"Seidensticker et al., Population collapse in Congo rainforest from 400 CE urges reassessment of the Bantu Expansion (Science Advances 7, 2021)","publisher":"Science Advances (AAAS)","url":"https://www.science.org/doi/10.1126/sciadv.abd8352"},{"title":"Central Africa: The Iron Age","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/place/central-Africa/The-Iron-Age"}]},"Gambia":{"polity":"Communities of the Senegambian megalithic zone","summary":"Along the Gambia River, communities raised circles of laterite pillars, quarried with iron tools, beside burial mounds, as at Wassu and Kerbatch. Excavated material from the sites suggests dates from the 3rd century BCE to the 16th century CE. Nothing is known of their rulers or languages from writing.","events":[{"y":600,"approx":true,"t":"The Senegambian stone-circle tradition, spanning the 3rd century BCE to the 16th century CE, is in use at sites such as Wassu."}],"link":null,"evidence":"sparse","sources":[{"title":"Stone Circles of Senegambia","publisher":"UNESCO World Heritage Centre","url":"https://whc.unesco.org/en/list/1226/"}]},"Ghana":{"polity":"Farming communities (not the medieval Ghana empire)","summary":"Modern Ghana lies far from the medieval Ghana (Wagadu) empire, which was in southeastern Mauritania and Mali. In the Koma area of the north, stone-circle mounds with terracotta figurines were once dated to the 13th-19th centuries, but newer radiocarbon and thermoluminescence dates place occupation and mound building between the 6th and 10th centuries; they may have been shrines.","events":[{"y":600,"approx":true,"t":"Koma Land mounds with terracotta figurines, possibly shrines, are being built in northern Ghana; dates span the 6th-10th centuries."}],"link":null,"evidence":"sparse","sources":[{"title":"Kankpeyeng & Nkumbaan, Ancient Shrines? New Insights on the Komaland Sites of Northern Ghana (2009)","publisher":"University of Ghana (UGSpace)","url":"https://ugspace.ug.edu.gh/items/c592f7c2-448f-4cae-92af-16e24867e66d"},{"title":"Ghana (historical West African empire)","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/place/Ghana-historical-West-African-empire"}]},"Guinea":{"polity":null,"evidence":"sparse","pending":true,"sources":[],"events":[],"link":null},"Guinea-Bissau":{"polity":"Unrecorded local communities (no known state)","summary":"The precolonial history of this coast has not been fully documented in the archaeological record, and no written sources exist for 570–632. Little can be said with confidence about its communities in this period. Across Africa, iron smelting, known since the first millennium BCE, was still spreading.","events":[{"y":600,"approx":true,"t":"Iron and copper smelting, known in Africa since the first millennium BCE, continues to spread; by c. 1000 it is found across the continent."}],"link":null,"evidence":"sparse","sources":[{"title":"Guinea-Bissau: History","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/place/Guinea-Bissau/History"},{"title":"Guinea Coast, 500–1000 A.D. (Heilbrunn Timeline of Art History)","publisher":"The Metropolitan Museum of Art","url":"https://www.metmuseum.org/toah/ht/06/afg.html"}]},"Lesotho":{"polity":"San hunter-gatherers","summary":"The mountains were home to San hunter-gatherers. The caves and rock shelters of the Maloti-Drakensberg, including Sehlabathebe National Park in Lesotho, hold the largest and most concentrated group of rock paintings in Africa south of the Sahara, representing the spiritual life of the San, who lived in the area over 4,000 years. Evidence is archaeological and rock art.","events":[],"link":null,"evidence":"sparse","sources":[{"title":"Maloti-Drakensberg Park","publisher":"UNESCO World Heritage Centre","url":"https://whc.unesco.org/en/list/985"}]},"Liberia":{"polity":"Unrecorded local communities (no known state)","summary":"Almost nothing is known of this land in 570–632; no written records exist. The ancestors of most of Liberia's present indigenous peoples, such as the Kpelle, Bassa, Grebo, Kru and Mano, migrated here from the western Sudan only in the late Middle Ages, long after this period. Across Africa, iron smelting, known since the first millennium BCE, was still spreading.","events":[{"y":600,"approx":true,"t":"Iron and copper smelting, known in Africa since the first millennium BCE, continues to spread; by c. 1000 it is found across the continent."}],"link":null,"evidence":"sparse","sources":[{"title":"Liberia (Britannica Students)","publisher":"Encyclopaedia Britannica","url":"https://kids.britannica.com/students/article/Liberia/275461"},{"title":"Guinea Coast, 500–1000 A.D. (Heilbrunn Timeline of Art History)","publisher":"The Metropolitan Museum of Art","url":"https://www.metmuseum.org/toah/ht/06/afg.html"}]},"Malawi":{"polity":"BaTwa foragers and Iron Age farmers","summary":"BaTwa hunter-gatherers, present since the Late Stone Age, painted rock shelters such as those at Chongoni, the richest concentration of rock art in Central Africa. Farming peoples also made rock art there; the Chewa, whose ancestors lived in the area from the Iron Age, painted until the 20th century. Specific evidence for 570-632 is scarce.","events":[],"link":null,"evidence":"sparse","sources":[{"title":"Chongoni Rock-Art Area","publisher":"UNESCO World Heritage Centre","url":"https://whc.unesco.org/en/list/476/"}]},"Namibia":{"polity":"Hunter-gatherers and herders","summary":"The drier western half of southern Africa, including Namibia, shows an enduring presence of herders with sheep and some cattle, ahead of and during the spread of farming. Directly dated sheep bones and pottery come from Leopard Cave, and other sites have yielded metal-working and metal artefacts, though their occupants are unclassified. Evidence is archaeological.","events":[],"link":null,"evidence":"sparse","sources":[{"title":"Lander & Russell, The archaeological evidence for the appearance of pastoralism and farming in southern Africa (PLoS ONE 13, 2018)","publisher":"PLoS ONE, via PubMed Central","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC6002040/"}]},"Nigeria":{"polity":"Farming communities and the early town of Ife; Nok culture long ended","summary":"The Nok terracotta culture (c. 500 BCE–200 CE), one of Africa's earliest ironworking centres, had ended centuries before. Ife in the southwest, occupied since c. 350, was growing into an important urban centre in its Archaic period (to c. 800). Near Lake Chad, settlement mounds such as Daima record long-lived Iron Age farming villages. Igbo-Ukwu's famous copper-alloy castings date to about the 10th century, after this period.","events":[{"y":600,"approx":true,"t":"Ife, in its Archaic period (to c. 800), develops as an important urban centre with sedentary farming and stone monoliths."}],"link":null,"evidence":"sparse","sources":[{"title":"Guinea Coast, 500–1000 A.D. (Heilbrunn Timeline of Art History)","publisher":"The Metropolitan Museum of Art","url":"https://www.metmuseum.org/toah/ht/06/afg.html"},{"title":"Nok Terracottas (500 B.C.–200 A.D.) (Heilbrunn Timeline of Art History)","publisher":"The Metropolitan Museum of Art","url":"https://www.metmuseum.org/essays/nok-terracottas-500-b-c-200-a-d"},{"title":"Graham Connah, 'The Daima Sequence and the Prehistoric Chronology of the Lake Chad Region of Nigeria', Journal of African History","publisher":"Cambridge University Press","url":"https://resolve.cambridge.org/core/journals/journal-of-african-history/article/abs/daima-sequence-and-the-prehistoric-chronology-of-the-lake-chad-region-of-nigeria/CFBDEAA1165E352C8D7A4BC85CAF4F2C"}]},"Rwanda":{"polity":"Early Iron Age farming communities (Urewe culture and successors)","summary":"Rwanda's Central Plateau, with good farming soils and easy access to iron ore and wood, was home to Early Iron Age communities of the Urewe culture. Iron smelting began here early in the first millennium BCE at the latest and flourished until about the 7th century CE. Non-Urewe Early Iron Age furnaces in the region date to about the 6th century. No written sources exist.","events":[{"y":600,"approx":true,"t":"Early Iron Age iron smelting continues in the region; non-Urewe furnaces such as Kabuye II date to about the 6th century."}],"link":null,"evidence":"sparse","sources":[{"title":"P. Craddock, I. Freestone, A. Middleton and M.-C. Van Grunderbeek, 'Early Iron Age iron-smelting debris from Rwanda and Burundi, East Africa', Historical Metallurgy 41(1), 2007","publisher":"Historical Metallurgy Society","url":"https://hmsjournal.org/index.php/home/article/download/218/212"}]},"Senegal":{"polity":"Communities of the Senegambian megalithic zone","summary":"Communities in the Gambia river region raised circles of laterite pillars, quarried with iron tools, beside burial mounds, as at Sine Ngayene and Wanar. Excavated material suggests dates from the 3rd century BCE to the 16th century CE. No written sources describe them.","events":[{"y":600,"approx":true,"t":"The Senegambian stone-circle tradition is in use at sites such as Sine Ngayene and Wanar."}],"link":null,"evidence":"sparse","sources":[{"title":"Stone Circles of Senegambia","publisher":"UNESCO World Heritage Centre","url":"https://whc.unesco.org/en/list/1226/"}]},"Sierra Leone":{"polity":"Unrecorded local communities (no known state)","summary":"People had lived in what is now Sierra Leone for thousands of years, and the Bulom, Temne and Limba of the coast were probably its earliest inhabitants among present-day peoples. No written records exist for 570–632, and its communities in this period are known only in general terms. Across Africa, iron smelting, known since the first millennium BCE, was still spreading.","events":[{"y":600,"approx":true,"t":"Iron and copper smelting, known in Africa since the first millennium BCE, continues to spread; by c. 1000 it is found across the continent."}],"link":null,"evidence":"sparse","sources":[{"title":"Sierra Leone (Britannica Kids)","publisher":"Encyclopaedia Britannica","url":"https://kids.britannica.com/kids/article/Sierra-Leone/345782"},{"title":"Guinea Coast, 500–1000 A.D. (Heilbrunn Timeline of Art History)","publisher":"The Metropolitan Museum of Art","url":"https://www.metmuseum.org/toah/ht/06/afg.html"}]},"South Africa":{"polity":"Iron-using farmers in the east; herders and foragers in the west","summary":"Iron-using farmers, directly ancestral to the Bantu-speaking peoples who form South Africa's majority today, had arrived from about 200 CE. Their sites in the east show pottery, metal-working, cultivation and livestock. The Lydenburg Heads, the earliest sculpture found in southern Africa, date to c. 500-700 CE. Herders held an enduring presence in the drier west.","events":[{"y":600,"approx":true,"t":"The Lydenburg Heads, terracotta heads found near Lydenburg, are made; they are dated c. 500-700 CE."}],"link":null,"evidence":"sparse","sources":[{"title":"South Africa: The Iron Age","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/place/South-Africa/The-Iron-Age"},{"title":"Lydenburg heads","publisher":"University of Cape Town, Centre for Curating the Archive","url":"https://humanities.uct.ac.za/node/272910"},{"title":"Lander & Russell, The archaeological evidence for the appearance of pastoralism and farming in southern Africa (PLoS ONE 13, 2018)","publisher":"PLoS ONE, via PubMed Central","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC6002040/"}]},"Togo":{"polity":"Iron-working farming communities","summary":"In the Bassar region of the north, an iron production industry flourished from as early as the Early Iron Age; the large village of Dekpassanware worked iron through the Early and Later Iron Ages. Production grew rapidly in the Later Iron Age, feeding regional trade. Written sources do not exist, and much of the period is undated.","events":[{"y":600,"approx":true,"t":"Bassar communities continue an iron-working tradition begun in the Early Iron Age; large-scale production comes later."}],"link":null,"evidence":"sparse","sources":[{"title":"de Barros et al., The early iron metallurgy of Bassar, Togo (Azania 55, 2020)","publisher":"Azania (Taylor & Francis); White Rose eprints","url":"https://eprints.whiterose.ac.uk/158986"}]},"Uganda":{"polity":null,"evidence":"sparse","pending":true,"sources":[],"events":[],"link":null},"Zambia":{"polity":"Early Iron Age farmers and foragers","summary":"Early farming in Zambia is attested by decorated pottery, though radiocarbon dating is often poor; rectangular hut floors are known from southern Zambia, and Kalambo Falls in the far north is among the recorded early sites. Pottery of ironworking groups in the Copperbelt and northern Zambia resembles that of the Kamilambian culture (c. 6th-8th century) of the Upemba. No written sources exist.","events":[],"link":null,"evidence":"sparse","sources":[{"title":"Lander & Russell, The archaeological evidence for the appearance of pastoralism and farming in southern Africa (PLoS ONE 13, 2018)","publisher":"PLoS ONE, via PubMed Central","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC6002040/"},{"title":"Nicolas Nikis, Upemba Depression (The Encyclopedia of Ancient History, 2021)","publisher":"Wiley-Blackwell; author copy via Royal Museum for Central Africa","url":"https://www.africamuseum.be/publication_docs/Nikis 2021 Upemba depression.pdf"}]},"Zimbabwe":{"polity":"Early farming communities and foragers","summary":"Across the eastern half of southern Africa, early farmers left sites with pottery, metal-working, cultivation and livestock. In Zimbabwe, the granite shelters of the Matobo Hills, occupied from the Early Stone Age into historical times, hold an outstanding collection of rock paintings. Great Zimbabwe flourished only from the 11th to the 15th century. Evidence is archaeological.","events":[],"link":null,"evidence":"sparse","sources":[{"title":"Lander & Russell, The archaeological evidence for the appearance of pastoralism and farming in southern Africa (PLoS ONE 13, 2018)","publisher":"PLoS ONE, via PubMed Central","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC6002040/"},{"title":"Matobo Hills","publisher":"UNESCO World Heritage Centre","url":"https://whc.unesco.org/en/list/306"},{"title":"Great Zimbabwe","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/place/Great-Zimbabwe"}]},"eSwatini":{"polity":"Iron-using farmers and San foragers (poorly documented)","summary":"Iron-using farmers, ancestors of South Africa's Bantu-speaking majority, had settled South Africa from about 200 CE, and decorated pottery and iron-working appear along the coast from southern Mozambique to KwaZulu-Natal. San hunter-gatherers lived in the nearby Drakensberg. No site in eSwatini itself is discussed in the sources consulted.","events":[],"link":null,"evidence":"sparse","sources":[{"title":"South Africa: The Iron Age","publisher":"Encyclopaedia Britannica","url":"https://www.britannica.com/place/South-Africa/The-Iron-Age"},{"title":"Lander & Russell, The archaeological evidence for the appearance of pastoralism and farming in southern Africa (PLoS ONE 13, 2018)","publisher":"PLoS ONE, via PubMed Central","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC6002040/"},{"title":"Maloti-Drakensberg Park","publisher":"UNESCO World Heritage Centre","url":"https://whc.unesco.org/en/list/985"}]},"Canada":{"polity":"Hunter-gatherer and fishing peoples (Dorset Paleo-Inuit in the eastern Arctic, Plains bison hunters, Northwest Coast societies)","summary":"No states or writing; everything known comes from archaeology. The eastern Arctic was home to the Dorset Paleo-Inuit, then in their Late Dorset period; the early Inuit (Thule) arrived only centuries later. On the northern Plains, bison hunters had used the bow and arrow since about 200 CE. Northwest Coast peoples lived in permanent settlements built on salmon and cedar, with considerable wealth and political complexity.","events":[{"y":600,"approx":true,"t":"Late Dorset period (from c. 500): Dorset exchange networks span the eastern Arctic, though they have left Newfoundland and much of southern Labrador."},{"y":600,"approx":true,"t":"On the northern Plains, bison hunting with the bow and arrow, associated with the Avonlea people since about 200 CE, continues."},{"y":600,"approx":true,"t":"Northwest Coast peoples live in permanent settlements supported by salmon runs and cedar, without farming."}],"link":null,"evidence":"sparse","sources":[{"title":"Geographic Distribution of the Dorset Culture","publisher":"The Canadian Encyclopedia","url":"https://www.thecanadianencyclopedia.ca/en/article/geographic-distribution-of-the-dorset-culture"},{"title":"Plains Indigenous Peoples in Canada","publisher":"The Canadian Encyclopedia","url":"https://thecanadianencyclopedia.ca/en/article/aboriginal-people-plains"},{"title":"Northwest Coast Indigenous Peoples in Canada","publisher":"The Canadian Encyclopedia","url":"https://thecanadianencyclopedia.ca/en/article/aboriginal-people-northwest-coast"}]},"United States of America":{"polity":"Diverse Native American societies (Late Woodland, Basketmaker III Ancestral Puebloans, Hohokam, Weeden Island and others)","summary":"No states, cities or writing. In the East, Late Woodland peoples (c. 600–900) built fewer burial mounds and long-distance trade declined, but the bow and arrow and new crop varieties spread and sites multiplied. On the Colorado Plateau, Basketmaker III Ancestral Puebloans farmed and lived in pithouse villages. Hohokam farmers lived along the Salt and Gila rivers. Weeden Island villages in north Florida and Georgia built mounds.","events":[{"y":600,"approx":true,"t":"Late Woodland period begins in the Southeast: Middle Woodland mound building and long-distance trade decline, while settlements become more numerous."},{"y":600,"approx":true,"t":"The bow and arrow spreads in the East and replaces the atlatl among Ancestral Puebloans; new varieties of maize, beans and squash gain importance."},{"y":600,"approx":true,"t":"Basketmaker III Ancestral Puebloans (settled at Mesa Verde from c. 550) live in pithouse villages, farm corn, beans and squash, and make pottery."},{"y":600,"approx":true,"t":"Hohokam farming villages occupy the Phoenix Basin along the Salt and Gila rivers, a culture famed for extensive irrigation canals."},{"y":600,"approx":true,"t":"Weeden Island I culture (c. 250–700) in north Florida and south Georgia: villages with mounds, charnel houses and elaborate ceremonial pottery."}],"link":null,"evidence":"sparse","sources":[{"title":"Woodland Culture","publisher":"US National Park Service, Ocmulgee Mounds National Historical Park","url":"https://www.nps.gov/ocmu/learn/historyculture/woodland-culture.htm"},{"title":"Ancestral Pueblo People and Their World","publisher":"US National Park Service, Mesa Verde National Park","url":"https://www.nps.gov/meve/learn/historyculture/upload/ancestral_pueblo_people_2018_508_01-24-18-2.pdf"},{"title":"Hohokam Culture","publisher":"US National Park Service","url":"https://home.nps.gov/articles/hohokam-culture.htm"},{"title":"McKeithen Weeden Island: The Culture of Northern Florida, A.D. 200-900 (Milanich et al., Academic Press, 1984), eHRAF summary","publisher":"eHRAF Archaeology, Yale University","url":"https://ehrafarchaeology.yale.edu/traditions/nn64/documents/008"}]},"Mexico":{"polity":"Teotihuacan in decline; Maya kingdoms such as Palenque and the Kaanul (Snake) kingdom","summary":"Teotihuacan, once the largest city in the Americas, had its major buildings deliberately burned around 600 and lost its regional dominance, though people kept living there. In the Maya south, the Kaanul (Snake) kingdom, then based at Dzibanché, attacked Palenque in 599 and again in 611. Pakal, born 603, became king of Palenque aged twelve in 615. In the 630s the Kaanul royal seat shifted to Calakmul.","events":[{"y":599,"approx":false,"t":"Kaanul (Snake) forces from Dzibanché attack Palenque; the attack is credited to the Kaanul king Sky Witness, though this placement is chronologically puzzling."},{"y":600,"approx":true,"t":"Teotihuacan's major buildings are deliberately burned and sculptures smashed; the city stays inhabited but loses its regional dominance."},{"y":603,"approx":false,"t":"K'inich Janaab Pakal, the future king of Palenque, is born."},{"y":611,"approx":false,"t":"The Kaanul king Scroll Serpent attacks Palenque, the second Kaanul assault there, as recorded in Palenque's Temple of the Inscriptions."},{"y":612,"approx":false,"t":"Muwaan Mat becomes ruler of Palenque after the death of Aj Ne' Yohl Mat."},{"y":615,"approx":false,"t":"Pakal, aged twelve, becomes king of Palenque; he rules until 683."},{"y":636,"approx":false,"t":"After a Kaanul civil war (630–640), Yuknoom Ch'een II accedes as founder of a reconstituted Kaanul kingdom whose capital has shifted from Dzibanché to Calakmul."}],"link":null,"evidence":"moderate","sources":[{"title":"Table of Palenque Rulers","publisher":"Mesoweb","url":"https://www.mesoweb.com/palenque/resources/rulers/rulers_table.html"},{"title":"In search of the serpent kings: From Dzibanche to Calakmul","publisher":"Ancient Mesoamerica (Cambridge University Press)","url":"https://www.cambridge.org/core/journals/ancient-mesoamerica/article/in-search-of-the-serpent-kings-from-dzibanche-to-calakmul/CA64F5753086F211D772C2B38DFF46CF"},{"title":"Teotihuacan","publisher":"World History Encyclopedia","url":"https://www.worldhistory.org/Teotihuacan/"}]},"Guatemala":{"polity":"Maya kingdoms (Tikal, Naranjo and others) under pressure from the Kaanul (Snake) kingdom and Caracol","summary":"The Petén lowlands were divided among rival Maya kingdoms that recorded dynastic history in hieroglyphic inscriptions. Tikal's king Wak Chan K'awiil suffered a 'star war' defeat in 562, after which no monuments are known at Tikal for about 130 years. The Kaanul (Snake) kingdom and its ally Caracol dominated the region; Caracol attacked Naranjo from 626, and Naranjo fell in 631.","events":[{"y":575,"approx":true,"t":"Tikal's long monument hiatus continues after its 562 defeat: no monuments are known there for about 130 years."},{"y":625,"approx":false,"t":"B'ajlaj Chan K'awiil, a Tikal prince who later rules from Dos Pilas and submits to Calakmul, is born at Tikal."},{"y":626,"approx":false,"t":"Caracol's king K'an II attacks Naranjo, the first of three assaults recorded for 626–627."},{"y":631,"approx":false,"t":"Naranjo is conquered; inscriptions credit Caracol's K'an II with a 'star war' and the Kaanul lord Yuknoom Head, aided by fighters from Calakmul, with its seizure."}],"link":null,"evidence":"moderate","sources":[{"title":"In search of the serpent kings: From Dzibanche to Calakmul","publisher":"Ancient Mesoamerica (Cambridge University Press)","url":"https://www.cambridge.org/core/journals/ancient-mesoamerica/article/in-search-of-the-serpent-kings-from-dzibanche-to-calakmul/CA64F5753086F211D772C2B38DFF46CF"},{"title":"Stanley Guenter, The Inscriptions of Dos Pilas Associated with B'ajlaj Chan K'awiil","publisher":"Mesoweb","url":"https://www.mesoweb.com/features/guenter/DosPilas.pdf"},{"title":"A. F. Chase and D. Z. Chase, The Materialization of Classic Period Maya Warfare: Caracol Stranger-Kings at Tikal","publisher":"Caracol Archaeological Project (book chapter)","url":"https://caracol.org/wp-content/uploads/2020/04/Chases20war.pdf"},{"title":"Time of Kings and Queens","publisher":"Expedition Magazine, Penn Museum","url":"https://www.penn.museum/sites/expedition/time-of-kings-and-queens/"}]},"Belize":{"polity":"Maya kingdom of Caracol, ally of the Kaanul (Snake) kingdom","summary":"Caracol was a rising Maya kingdom. Its inscriptions record the 562 'star war' defeat of Tikal, though the damaged victor's name on Caracol Altar 21 may be that of a Kaanul (Snake) king. Under K'an II, who ruled 618–658, Caracol repeatedly attacked Naranjo. Archaeology shows prosperity and rapid population growth at the start of the Late Classic period, when most of Caracol's causeways were built.","events":[{"y":599,"approx":true,"t":"Caracol Stela 6 records the seating of a figure called Flame Ajaw for a bloodletting rite, during an interregnum before K'an II's accession."},{"y":618,"approx":false,"t":"K'an II, son of Yajaw Te' K'inich II, becomes king of Caracol; he rules until his death in 658."},{"y":626,"approx":false,"t":"K'an II's forces make the first of three attacks on Naranjo (626–627), recorded at both Naranjo and Caracol."},{"y":631,"approx":false,"t":"Caracol under K'an II defeats Naranjo in a 'star war', probably bringing it under his direct control."}],"link":null,"evidence":"moderate","sources":[{"title":"A. F. Chase and D. Z. Chase, The Materialization of Classic Period Maya Warfare: Caracol Stranger-Kings at Tikal","publisher":"Caracol Archaeological Project (book chapter)","url":"https://caracol.org/wp-content/uploads/2020/04/Chases20war.pdf"},{"title":"In search of the serpent kings: From Dzibanche to Calakmul","publisher":"Ancient Mesoamerica (Cambridge University Press)","url":"https://www.cambridge.org/core/journals/ancient-mesoamerica/article/in-search-of-the-serpent-kings-from-dzibanche-to-calakmul/CA64F5753086F211D772C2B38DFF46CF"}]},"Honduras":{"polity":"Maya kingdom of Copán","summary":"Copán, in western Honduras on the southeastern frontier of the Maya world, was a royal city whose dynasty traced its founding to K'inich Yax K'uk' Mo', inaugurated in 426. With its subordinate centre Quiriguá, Copán controlled the Motagua River trade route. In 628 K'ahk' Uti' Witz' K'awiil, the 12th ruler, began a reign that lasted until 695.","events":[{"y":628,"approx":false,"t":"K'ahk' Uti' Witz' K'awiil (also called 'Smoke Imix'), the 12th ruler, becomes king of Copán; he reigns until 695."}],"link":null,"evidence":"moderate","sources":[{"title":"Copan Monument Manual, Part 2 (Stela E)","publisher":"FAMSI","url":"https://www.famsi.org/research/copan/monuments/CopanMonumentManualPart2.pdf"},{"title":"Time of Kings and Queens","publisher":"Expedition Magazine, Penn Museum","url":"https://www.penn.museum/sites/expedition/time-of-kings-and-queens/"}]},"El Salvador":{"polity":"Maya and other farming communities (e.g., San Andrés, Joya de Cerén)","summary":"The region had recovered from the huge Tierra Blanca Joven eruption of Ilopango, now dated to 431 ± 2 CE (it was once linked to c. 540). Ash-covered land was resettled once it weathered into fertile soil. San Andrés was reoccupied and urbanised, becoming the centre of the Zapotitán valley. Around 600 the farming village of Joya de Cerén was buried by the Loma Caldera eruption, preserving houses, fields and tools.","events":[{"y":575,"approx":true,"t":"San Andrés, reoccupied after the Ilopango eruption (431 CE), grows into the political, economic and religious centre of the Zapotitán valley."},{"y":600,"approx":true,"t":"Loma Caldera erupts and buries Joya de Cerén, preserving buildings, maize fields and household goods (dated c. 600; also given as 590 ± 90)."}],"link":null,"evidence":"sparse","sources":[{"title":"Joya de Cerén Archaeological Site","publisher":"UNESCO World Heritage Centre","url":"https://whc.unesco.org/en/list/675"},{"title":"The magnitude and impact of the 431 CE Tierra Blanca Joven eruption of Ilopango, El Salvador (Smith et al. 2020)","publisher":"Proceedings of the National Academy of Sciences (PMC)","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC7584997"},{"title":"Investigaciones recientes en el sitio arqueológico San Andrés, El Salvador (Ichikawa and Camacho 2016)","publisher":"XXIX Simposio de Investigaciones Arqueológicas en Guatemala, Museo Nacional de Arqueología y Etnología (Mesoweb)","url":"https://www.mesoweb.com/Simposio/pdf/29/Ichikawa_y_Camacho.2016.pdf"}]},"Nicaragua":{"polity":"Farming communities of the Greater Nicoya cultural area (Pacific side)","summary":"There were no states or writing, and everything known comes from archaeology. Pacific Nicaragua belonged to the Greater Nicoya cultural area. During the Bagaces period its potters made Tola Trichrome, painted pottery whose designs are closely linked to Carrillo Polychrome from neighbouring Costa Rica. The Caribbean side is little known.","events":[{"y":600,"approx":true,"t":"Bagaces period: potters in Pacific Nicaragua produce Tola Trichrome painted pottery, linked in style to Costa Rican wares."}],"link":null,"evidence":"sparse","sources":[{"title":"Tripod Jar with Costumed Bat-Man (Carrillo Polychrome, Greater Nicoya, AD 500-800)","publisher":"Denver Art Museum","url":"https://denverartmuseum.org/object/1993.728"}]},"Costa Rica":{"polity":"Ranked farming societies of Greater Nicoya, the central and eastern regions, and Greater Chiriquí in the south","summary":"Settlements grew in number and size, and rich elite burials show growing social distinctions, with contacts to Mesoamerica and Colombia. Jade carving, a status marker for a thousand years, died out (by about 700) as gold became the preferred prestige material. Polychrome pottery and finely carved effigy metates flourished. Near Arenal, villagers wore deep footpaths walking to distant cemeteries for generations. Evidence is archaeological.","events":[{"y":600,"approx":true,"t":"Gold replaces jade as the main prestige material; Maya jade is still traded in and recarved (jade use ends c. 700)."},{"y":600,"approx":true,"t":"Improved stone carving produces elaborate effigy metates with human, animal and composite figures."},{"y":600,"approx":true,"t":"Near Arenal volcano, generations of walking between villages and cemeteries such as Silencio wear footpaths metres deep."}],"link":null,"evidence":"sparse","sources":[{"title":"Central America and the Caribbean, 500–1000 A.D.","publisher":"The Metropolitan Museum of Art, Heilbrunn Timeline of Art History","url":"https://www.metmuseum.org/toah/ht/06/cac"},{"title":"Jade in Costa Rica","publisher":"The Metropolitan Museum of Art","url":"https://www.metmuseum.org/essays/jade-in-costa-rica"},{"title":"Modern Technology Reveals Ancient Footpaths Buried in 2,500 Years Worth of Volcanic Ash","publisher":"US National Science Foundation","url":"https://www.nsf.gov/news/modern-technology-reveals-ancient-footpaths-buried"}]},"Panama":{"polity":"Ranked societies of the Conte phase (central Panama)","summary":"Central Panama was in the Conte phase (c. 500–800). Goldworking was fully established, and boldly drawn Conte polychrome pottery showed creatures perhaps linked to myth or cosmology. Elite burials grew richer: the El Hatillo cemetery came into use around 700, and the famous chiefly burial at Sitio Conte dates to about 750. There was no writing; all knowledge comes from excavation.","events":[{"y":600,"approx":true,"t":"Conte polychrome pottery, boldly painted with mythical creatures, is made in central Panama, where goldworking is well established."}],"link":null,"evidence":"sparse","sources":[{"title":"Central America and the Caribbean, 500–1000 A.D.","publisher":"The Metropolitan Museum of Art, Heilbrunn Timeline of Art History","url":"https://www.metmuseum.org/toah/ht/06/cac"}]},"Cuba":{"polity":"Archaic (Casimiroid) peoples; Ostionoid farmers beginning to arrive in the east","summary":"Cuba had long been home to Archaic (Casimiroid) peoples whose ancestors came from Central America. From about 600, pottery-making Ostionoid farmers expanding from Hispaniola began to colonise eastern Cuba, the start of the line that led to the Taíno. Whether the Ostionoids grew mainly from Saladoid or from Archaic roots is debated. Little can be dated precisely.","events":[{"y":600,"approx":true,"t":"Ostionoid peoples expanding through northern Hispaniola begin to colonise eastern Cuba; Archaic communities continue elsewhere on the island."}],"link":null,"evidence":"sparse","sources":[{"title":"The Ostionoids (Basil A. Reid)","publisher":"Florida International University, Island Luminous","url":"https://islandluminous.fiu.edu/part01-slide02.html"},{"title":"The Native Peoples of Turks and Caicos","publisher":"Florida Museum of Natural History, Caribbean Archaeology Program","url":"https://www.floridamuseum.ufl.edu/caribarch/education/tc-peoples/"}]},"Bahamas":{"polity":"Not yet settled, or only just being reached","summary":"The Bahamas were the last part of the Caribbean to be settled. Ancestors of the Lucayans began colonising the Turks and Caicos and the Bahamas from about 600, coming from the Greater Antilles. The oldest sites, in the Turks and Caicos, suggest arrival by about 700; on Great Abaco, burning for farming appears around 830. Dates of first settlement remain debated.","events":[{"y":630,"approx":true,"t":"Ostionoid seafarers from the Greater Antilles may be starting to reach the southern Bahama islands; secure evidence of settlement dates from c. 700."}],"link":null,"evidence":"sparse","sources":[{"title":"The Native Peoples of Turks and Caicos","publisher":"Florida Museum of Natural History, Caribbean Archaeology Program","url":"https://www.floridamuseum.ufl.edu/caribarch/education/tc-peoples/"},{"title":"Humans settled the Bahamas earlier than we thought","publisher":"Futurity (Texas A&M University)","url":"https://www.futurity.org/?p=2526542"}]},"Jamaica":{"polity":"Probably uninhabited until the first Ostionan settlers in the 7th century","summary":"Jamaica is believed to have been uninhabited until the 7th century, when it was colonised by Ostionan Ostionoids, probably moving along the south coast of Hispaniola. Known locally as the Little River Complex or 'Redware' people for their red pottery, they lived mainly near the coast and depended heavily on marine resources. Exact dates are uncertain.","events":[{"y":630,"approx":true,"t":"First known settlers, Ostionan 'Redware' potters, colonise Jamaica in the 7th century (exact date uncertain)."}],"link":null,"evidence":"sparse","sources":[{"title":"Predictive Modeling of Pre-Columbian Sites in Jamaica Using Multi-Criteria Analysis (James-Williamson et al. 2022)","publisher":"Journal of Caribbean Archaeology (Florida Museum of Natural History)","url":"https://www.floridamuseum.ufl.edu/wp-content/uploads/sites/44/2022/07/JCA-James-Williamson-Predictive.pdf"},{"title":"The Native Peoples of Turks and Caicos","publisher":"Florida Museum of Natural History, Caribbean Archaeology Program","url":"https://www.floridamuseum.ufl.edu/caribarch/education/tc-peoples/"}]},"Haiti":{"polity":"Archaic (Casimiroid) peoples and expanding Ostionoid farmers","summary":"Western Hispaniola had long been home to Archaic (Casimiroid) peoples. By about 600, pottery-making Ostionoid farmers were expanding along both coasts of Hispaniola, the line that led to the Taíno. Their simple red-slipped Ostionan pottery is called redware. Scholars debate whether the Ostionoids derived mainly from Saladoid settlers or from local Archaic peoples. Detailed dates are scarce.","events":[{"y":600,"approx":true,"t":"Ostionoid peoples expand westward along both coasts of Hispaniola, alongside long-established Archaic communities."}],"link":null,"evidence":"sparse","sources":[{"title":"The Ostionoids (Basil A. Reid)","publisher":"Florida International University, Island Luminous","url":"https://islandluminous.fiu.edu/part01-slide02.html"},{"title":"The Native Peoples of Turks and Caicos","publisher":"Florida Museum of Natural History, Caribbean Archaeology Program","url":"https://www.floridamuseum.ufl.edu/caribarch/education/tc-peoples/"}]},"Dominican Rep.":{"polity":"Ostionoid farming villages and Archaic (Casimiroid) peoples","summary":"Eastern Hispaniola was the western limit of the earlier Saladoid expansion, whose advance stalled there, perhaps because of established Archaic populations. By about 600, Ostionoid farmers with simpler red-slipped pottery were expanding across Hispaniola. These communities were ancestors of the Taíno whom the Spanish met. Whether they grew from Saladoid or Archaic roots is debated.","events":[{"y":600,"approx":true,"t":"Ostionoid farming communities spread through Hispaniola from the east, beside older Archaic groups; Ostionoid origins are debated."}],"link":null,"evidence":"sparse","sources":[{"title":"The Native Peoples of Turks and Caicos","publisher":"Florida Museum of Natural History, Caribbean Archaeology Program","url":"https://www.floridamuseum.ufl.edu/caribarch/education/tc-peoples/"},{"title":"The Ostionoids (Basil A. Reid)","publisher":"Florida International University, Island Luminous","url":"https://islandluminous.fiu.edu/part01-slide02.html"},{"title":"Caribbean Trade and Networks","publisher":"US National Park Service","url":"https://www.nps.gov/articles/caribbean-trade-and-networks.htm"}]},"Puerto Rico":{"polity":"Village societies in transition from Saladoid to Ostionoid","summary":"Puerto Rico had been farmed for about a thousand years by Saladoid peoples from South America, who lived in villages around central plazas and made fine white-on-red pottery. Around 600, archaeologists see major social reorganisation and a shift to the Ostionoid tradition, named after the Ostiones site in western Puerto Rico, with plainer red-slipped pottery. Ball courts and plazas belong to this Ostionoid era and later Taíno society.","events":[{"y":600,"approx":true,"t":"The Saladoid tradition gives way to the Ostionoid; pottery decoration simplifies and leadership and social status are reorganised."},{"y":620,"approx":true,"t":"Ball court and plaza sites begin in the Early Ostionoid period (c. 600–1200); centres such as Tibes develop over the following centuries."}],"link":null,"evidence":"sparse","sources":[{"title":"The Native Peoples of Turks and Caicos","publisher":"Florida Museum of Natural History, Caribbean Archaeology Program","url":"https://www.floridamuseum.ufl.edu/caribarch/education/tc-peoples/"},{"title":"Caribbean Trade and Networks","publisher":"US National Park Service","url":"https://www.nps.gov/articles/caribbean-trade-and-networks.htm"},{"title":"Ball Court / Plaza Sites of Puerto Rico and the U.S. Virgin Islands, National Re
