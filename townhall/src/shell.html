<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__APP_NAME__</title>
<meta name="description" content="Step-by-step help for bills, letters, complaints and forms, using free AI tools. Tips shared by people, guides tested by us.">
<link rel="icon" type="image/png" href="data:image/png;base64,__FAVICON__"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
@font-face{font-family:"Atkinson";font-weight:400;src:url(data:font/woff2;base64,__ATK400__) format("woff2");font-display:swap}
@font-face{font-family:"Atkinson";font-weight:700;src:url(data:font/woff2;base64,__ATK700__) format("woff2");font-display:swap}
@font-face{font-family:"Young Serif";font-weight:400;src:url(data:font/woff2;base64,__YS400__) format("woff2");font-display:swap}
@font-face{font-family:"Lexend";font-weight:400;src:url(data:font/woff2;base64,__LEX400__) format("woff2");font-display:swap}
@font-face{font-family:"Lexend";font-weight:700;src:url(data:font/woff2;base64,__LEX700__) format("woff2");font-display:swap}
/* Colours come from the logo: deep teal for actions (the logo teal #1da09a is too light for text), navy, and the orange sparkle.
   Layout: one calm reading column (max 760px) under a plain top bar; home uses a tile grid. Light only, with a Large text mode.
   Type: Young Serif for headings (one weight, warm and solid), Lexend for text (built for reading fluency); Large mode uses Atkinson Hyperlegible. */
:root{
  --bg:#f6f7f4;--surface:#ffffff;--sunk:#eef1ec;--line:#d9dfd8;--line2:#b9c3bb;
  --ink:#1b231f;--muted:#4f5a54;--faint:#5c665f;
  --accent:#0e6f6a;--accent-hover:#0a5551;--accent-ink:#ffffff;--accent-soft:#e2f2f0;--mark:#f28c28;--brand:#364353;--logo-teal:#1da09a;
  --warn-bg:#fff5d6;--warn-line:#e7cf82;--warn-ink:#6b4a00;
  --stop-bg:#fdeeec;--stop-line:#eec0ba;--stop-ink:#9a2318;
  --good:#1a7438;--bad:#b42318;
  --body:"Lexend",Verdana,"Segoe UI",sans-serif;--head:"Young Serif",Georgia,serif;--mono:ui-monospace,Menlo,Consolas,monospace;
  --r:14px;--r-sm:10px;--wrap:1040px;--read:760px;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:48px;
  color-scheme:light
}
body.f-large{--body:"Atkinson",Verdana,sans-serif;--ink:#000;--muted:#222;--faint:#333;--line:#888;--line2:#555;--bg:#fff;--sunk:#f2f2f2;--accent:#0a4f4b;font-size:21px}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-underline-offset:3px}
a:hover{color:var(--accent-hover)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
h1,h2,h3{font-family:var(--head);font-weight:400;line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:2.1rem}h2{font-size:1.45rem}h3{font-size:1.15rem}
p{margin:0}
.wrap{max-width:var(--wrap);margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.read{max-width:var(--read)}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:8px;background:var(--surface);padding:8px 12px;z-index:50}.skip:focus{left:12px}
.muted{color:var(--muted)}.small{font-size:.85em}.center{text-align:center}
.stack{display:flex;flex-direction:column;gap:var(--s4)}
.row{display:flex;flex-wrap:wrap;gap:var(--s3);align-items:center}

/* top bar */
.top{background:var(--surface);border-bottom:1px solid var(--line)}
.topin{display:flex;align-items:center;gap:var(--s4);min-height:68px;flex-wrap:wrap;padding-block:6px}
.logo{display:inline-flex;align-items:center;margin-right:auto;border-radius:8px}
.logo img{display:block;height:54px;width:auto}
.footlogo{display:block;height:auto;width:min(300px,100%)}
@media (max-width:640px){.logo img{height:44px}}
.nav{display:flex;gap:var(--s1);flex-wrap:wrap}
.nav a{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border-radius:999px;color:var(--ink);text-decoration:none;font-weight:700}
.nav a:hover{background:var(--sunk)}
.nav a.on{background:var(--accent-soft);color:var(--accent)}
.acct{display:flex;gap:var(--s2);align-items:center}
.bell{position:relative;display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:999px;color:var(--ink)}
.bell:hover{background:var(--sunk)}
.bell svg{width:22px;height:22px}
.bell .dot{position:absolute;top:4px;right:2px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--bad);color:#fff;font-size:12px;font-weight:700;line-height:20px;text-align:center}
@media (max-width:640px){.hero h1{font-size:2rem}h1{font-size:1.75rem}.topin{gap:var(--s2)}.nav{order:3;width:100%;justify-content:space-between}.nav a{padding:0 10px;font-size:.95rem}}

#view{padding-block:var(--s6) var(--s7);outline:none;min-height:60vh}
#status:empty{display:none}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:999px;border:2px solid var(--line2);background:var(--surface);color:var(--ink);font:inherit;font-weight:700;text-decoration:none;cursor:pointer;line-height:1.2;text-align:center}
.btn:hover{border-color:var(--ink);color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:var(--stop-line)}
.btn.quiet{border-color:transparent;background:transparent;color:var(--accent);padding:0 10px;text-decoration:underline}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.btn.sm{min-height:40px;padding:0 14px;font-size:.9em}
.btn.big{min-height:56px;padding:0 26px;font-size:1.05em}
.btn svg{width:20px;height:20px}
.btn[disabled]{opacity:.55;cursor:default}
.btn.busy{position:relative;color:transparent!important}
.btn.busy::after{content:"";position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;border:2px solid var(--ink);border-right-color:transparent;animation:spin .7s linear infinite}
.btn.primary.busy::after{border-color:#fff;border-right-color:transparent}
@keyframes spin{to{transform:rotate(360deg)}}

/* notices */
.notice{border:1px solid var(--warn-line);background:var(--warn-bg);color:var(--ink);border-radius:var(--r-sm);padding:12px 16px}
.notice.stop{border-color:var(--stop-line);background:var(--stop-bg)}
.notice.ok{border-color:#a9d9d4;background:var(--accent-soft)}
.notice.plain{border-color:var(--line);background:var(--sunk)}
.notice b:first-child{display:block;margin-bottom:2px}
.err{color:var(--bad);font-weight:700}
.okmsg{color:var(--good);font-weight:700}

/* home */
.hero{display:flex;flex-direction:column;gap:var(--s4);margin-bottom:var(--s6)}
.hero h1{font-size:2.5rem}
.hero .lead{font-size:1.15rem;color:var(--muted);max-width:44ch}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s3)}
@media (max-width:860px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.tiles{grid-template-columns:1fr}.tile{min-height:0}}
.tile{display:flex;gap:var(--s3);align-items:flex-start;padding:18px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink);text-decoration:none;min-height:96px}
.tile:hover{border-color:var(--accent);box-shadow:0 2px 0 var(--accent);color:var(--ink)}
.tile .ic{flex:none;width:40px;height:40px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center}
.tile .ic svg{width:22px;height:22px}
.tile b{display:block;font-size:1.05rem;line-height:1.3}
.tile span{display:block;color:var(--muted);font-size:.88rem;margin-top:2px;line-height:1.4}
.section{margin-top:var(--s7)}
.section>h2{margin-bottom:var(--s3)}
.howto{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:var(--s4);counter-reset:how;padding:0;margin:0;list-style:none}
.howto li{counter-increment:how;display:flex;gap:var(--s3)}
.howto li::before{content:counter(how);flex:none;width:34px;height:34px;border-radius:999px;background:var(--brand);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:var(--s6)}
.two>*{min-width:0}

/* lists of guides and tips */
.items{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.items li{border-bottom:1px solid var(--line)}
.item{display:block;padding:14px 4px;color:var(--ink);text-decoration:none}
.item:hover{background:var(--surface)}
.item .t{display:block;font-weight:700;font-size:1.05rem;color:var(--accent);text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.item .d{display:block;color:var(--muted);font-size:.92rem;margin-top:2px}
.item .m{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:6px;font-size:.85rem;color:var(--faint)}
.empty{padding:var(--s4);border:1px dashed var(--line2);border-radius:var(--r-sm);color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:.78rem;font-weight:700;border-radius:999px;padding:2px 10px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.badge.guide{background:var(--accent-soft);color:var(--accent)}
.badge.tip{background:#e9eef7;color:#2a4a7a}
.badge.warn{background:var(--warn-bg);color:var(--warn-ink)}
.badge.stop{background:var(--stop-bg);color:var(--stop-ink)}
.badge.ok{background:#e3f3e8;color:var(--good)}
.crumb{display:inline-block;margin-bottom:var(--s3);font-weight:700}

/* guide and tip pages */
.page{max-width:var(--read)}
.page-head{display:flex;flex-direction:column;gap:var(--s3);margin-bottom:var(--s5)}
.byline{color:var(--muted);font-size:.92rem}
.steps{list-style:none;margin:var(--s5) 0 0;padding:0;display:flex;flex-direction:column;gap:var(--s5);counter-reset:st}
.steps>li{counter-increment:st;display:grid;grid-template-columns:44px minmax(0,1fr);gap:var(--s3)}
.steps>li::before{content:counter(st);width:40px;height:40px;border-radius:999px;background:var(--accent);color:#fff;font-weight:700;font-size:1.1rem;display:flex;align-items:center;justify-content:center}
.steps h2{font-size:1.15rem;margin:6px 0 var(--s2)}
.copybox{border:2px solid var(--line2);border-radius:var(--r);background:var(--surface);overflow:hidden}
.copybox pre{margin:0;padding:14px 16px;white-space:pre-wrap;word-break:break-word;font-family:var(--body);font-size:1rem;line-height:1.5}
.copybox .bar{display:flex;justify-content:space-between;align-items:center;gap:var(--s2);padding:8px 8px 8px 16px;background:var(--sunk);border-top:1px solid var(--line);font-size:.85rem;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px}
.toolbar .chip{min-height:44px;padding:8px 16px;color:var(--ink);text-decoration:none;font-weight:600}
.toolbar .chip:hover{border-color:var(--accent);color:var(--accent)}
.toolbar .chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chips a.chip{min-height:44px;color:var(--ink);text-decoration:none}
.chips a.chip:hover{border-color:var(--accent);color:var(--accent)}
.forum{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.forum li+li{border-top:1px solid var(--line)}
.cat{display:grid;grid-template-columns:40px minmax(0,1fr) 90px minmax(0,34%);gap:6px 16px;align-items:center;padding:14px 16px;color:var(--ink);text-decoration:none;min-height:48px}
.cat:hover{background:var(--accent-soft);color:var(--ink)}
.cat .ic{width:40px;height:40px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center}
.cat:hover .ic{background:var(--surface)}
.cat .ic svg{width:22px;height:22px}
.cat .cname b{display:block;font-size:1.05rem;color:var(--accent)}
.cat .cname span,.cat .clast span{display:block;color:var(--muted);font-size:.86rem;line-height:1.4}
.cat .ccount{font-size:.9rem;color:var(--muted);white-space:nowrap}
.cat .clast .lt{color:var(--ink);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:720px){.cat{grid-template-columns:40px minmax(0,1fr)}.cat .ccount,.cat .clast{grid-column:2}.cat .clast .lt{white-space:normal}}
.item .m .stat{display:inline-flex;align-items:center;gap:4px}
.item .m .stat svg,.likebtn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2}
.item .m .toolname{font-weight:700;color:var(--muted)}
.likebtn .n{font-variant-numeric:tabular-nums;color:var(--muted)}
.likebtn.on{border-color:var(--mark);color:var(--ink)}
.likebtn.on svg{fill:var(--mark);stroke:var(--mark)}
.chip{display:inline-flex;align-items:center;padding:4px 12px;border-radius:999px;border:1px solid var(--line2);background:var(--surface);font-size:.92rem}
.facts{display:grid;grid-template-columns:minmax(150px,220px) minmax(0,1fr);gap:0;border-top:1px solid var(--line);margin:0}
.facts dt,.facts dd{margin:0;padding:10px 0;border-bottom:1px solid var(--line)}
.facts dt{color:var(--muted);font-weight:700;padding-right:var(--s3)}
.facts dd{white-space:pre-wrap}
@media (max-width:560px){.facts{grid-template-columns:1fr}.facts dt{border-bottom:0;padding-bottom:0}}
.prose{white-space:pre-wrap}
details.more{border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface)}
details.more>summary{cursor:pointer;padding:12px 16px;font-weight:700;color:var(--accent);list-style-position:inside}
details.more>div{padding:0 16px 16px}
.feedback{border:2px solid var(--accent);border-radius:var(--r);padding:var(--s5);background:var(--surface);display:flex;flex-direction:column;gap:var(--s3)}
.choice{display:flex;flex-wrap:wrap;gap:var(--s2)}
.choice label{display:inline-flex;align-items:center;gap:8px;min-height:52px;padding:0 18px;border:2px solid var(--line2);border-radius:999px;font-weight:700;cursor:pointer;background:var(--surface)}
.choice input{width:20px;height:20px;accent-color:var(--accent)}
.choice label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.counts{display:flex;gap:var(--s4);flex-wrap:wrap;font-weight:700}
.counts .y{color:var(--good)}.counts .n{color:var(--bad)}
.counts svg,.badge svg{width:1em;height:1em;flex:none;vertical-align:-2px}
.shots{display:flex;flex-wrap:wrap;gap:var(--s2)}
.shots img{max-height:220px;border:1px solid var(--line);border-radius:var(--r-sm)}
.actions{display:flex;flex-wrap:wrap;gap:var(--s2);align-items:center;padding-top:var(--s4);border-top:1px solid var(--line)}
.admin{border:1px dashed var(--line2);border-radius:var(--r-sm);padding:var(--s3) var(--s4);display:flex;flex-wrap:wrap;gap:var(--s2);align-items:center;background:var(--sunk)}
.admin>b{margin-right:var(--s2)}
.comment{display:flex;flex-direction:column;gap:4px;padding:var(--s3) 0;border-bottom:1px solid var(--line)}
.comment .meta{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:.85rem;color:var(--faint)}
.comment pre{margin:0;white-space:pre-wrap;font-family:var(--body)}
.printonly{display:none}

/* forms */
label{font-weight:700}
.field{display:flex;flex-direction:column;gap:6px}
.field .hint{color:var(--muted);font-size:.9rem;font-weight:400}
input[type=text],input[type=email],input[type=password],input[type=date],input[type=search],select,textarea{font:inherit;font-size:1rem;color:var(--ink);background:var(--surface);border:2px solid var(--line2);border-radius:var(--r-sm);padding:10px 12px;min-height:48px;width:100%}
textarea{min-height:120px;resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:3px solid var(--accent-soft);outline-offset:0}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:400}
.check input{width:22px;height:22px;flex:none;margin-top:2px;accent-color:var(--accent)}
.qnum{display:grid;grid-template-columns:36px minmax(0,1fr);gap:var(--s3)}
.qnum>.n{width:32px;height:32px;border-radius:999px;background:var(--sunk);border:1px solid var(--line2);font-weight:700;display:flex;align-items:center;justify-content:center}
.formcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:var(--s5);display:flex;flex-direction:column;gap:var(--s5)}
.repeat{display:flex;flex-direction:column;gap:var(--s3)}
.repeat .r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--s2);align-items:start;padding:var(--s3);border:1px solid var(--line);border-radius:var(--r-sm);background:var(--sunk)}
.repeat .r>div{display:flex;flex-direction:column;gap:var(--s2);min-width:0}
.shotprev{display:flex;flex-wrap:wrap;gap:var(--s2)}
.shotprev .shot{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.shotprev img{max-height:120px;border:1px solid var(--line);border-radius:8px}

/* last check before sending: a slip that rises from the bottom edge */
.confirmbar{position:fixed;left:0;right:0;bottom:0;z-index:70;background:#fffaf0;border-top:4px solid var(--accent);box-shadow:0 -12px 32px rgba(27,35,31,.18);padding-bottom:env(safe-area-inset-bottom,0px);animation:rise .28s cubic-bezier(.2,.8,.2,1)}
.confirmin{display:flex;gap:var(--s5);align-items:center;justify-content:space-between;padding-block:var(--s5);flex-wrap:wrap}
.confirmin h2{font-size:1.35rem}
.confirmin p{max-width:62ch}
.confirmin .flag{margin-top:6px;font-weight:700;color:var(--stop-ink)}
.confirmbtns{flex:none}
@keyframes rise{from{transform:translateY(100%)}}
@media (max-width:640px){.confirmin{flex-direction:column;align-items:stretch}.confirmbtns .btn{width:100%}}

mark.ph{background:#ffe98a;color:var(--ink);border-radius:4px;padding:0 3px;font-weight:700;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.rules{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--mark);border-radius:var(--r);padding:var(--s5);display:flex;flex-direction:column;gap:var(--s3)}
.rulelist{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:var(--s2)}
.rulelist li::marker{font-weight:700;color:var(--accent)}
.ba{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
.ba>div{border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;background:var(--surface)}
.ba>div.after{border-color:#a9d9d4;background:var(--accent-soft)}
.ba .lbl{display:block;font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.ba .after .lbl{color:var(--accent)}
.ba-note{grid-column:1/-1}
.ba-line b{color:var(--ink)}
@media (max-width:560px){.ba{grid-template-columns:1fr}}

/* tables (admin) */
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:700;color:var(--muted)}

/* feedback */
#toasts{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;z-index:60;pointer-events:none}
.toast{display:flex;align-items:center;gap:8px;background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.18);animation:tin .2s ease-out}
.toast.err{background:var(--bad)}
.toast.out{opacity:0;transition:opacity .25s}
.toast svg{width:18px;height:18px;color:var(--mark)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
.sk{background:var(--sunk);border-radius:8px;height:18px;margin:10px 0;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5}}

/* footer */
.foot{border-top:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:.9rem}
.foot .wrap{padding-block:var(--s5);display:flex;flex-direction:column;gap:var(--s3)}
.foot nav{display:flex;flex-wrap:wrap;gap:6px 18px}
.foot a{color:var(--muted)}
