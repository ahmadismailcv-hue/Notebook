<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Badge source</title>
<!-- Source for static/badge.png and static/badge-icon.png. Render with: python3 logo/badge.py -->
<style>
@font-face { font-family: "Lexend"; font-weight: 700; src: url("../node_modules/@fontsource/lexend/files/lexend-latin-700-normal.woff2") format("woff2"); }
@font-face { font-family: "Young Serif"; font-weight: 400; src: url("../node_modules/@fontsource/young-serif/files/young-serif-latin-400-normal.woff2") format("woff2"); }
body { margin: 0; padding: 4px; background: transparent; }
svg { display: block; margin-bottom: 4px; }
</style>
</head>
<body>
<!-- 88 by 31 badge -->
<svg id="b" width="88" height="31" viewBox="0 0 88 31" xmlns="http://www.w3.org/2000/svg">
  <rect width="88" height="31" rx="4" fill="#364353"/>
  <image href="brand/icon-src.png" x="3" y="3" width="25" height="25"/>
  <text x="30" y="13" font-family="Lexend" font-weight="700" font-size="6" letter-spacing="0.4" fill="#6fd8cf">FEATURED ON</text>
  <text id="name" x="30" y="24.5" font-family="Young Serif" font-weight="400" font-size="12" fill="#ffffff"></text>
</svg>
<!-- 64 by 64 icon -->
<svg id="i" width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <rect width="64" height="64" rx="14" fill="#ffffff"/>
  <image href="brand/icon-src.png" x="4" y="4" width="56" height="56"/>
</svg>
<script>
// The product name. Change it here, then rerun python3 logo/badge.py.
const NAME = "The Boring Bits";
const el = document.getElementById("name");
el.textContent = NAME;
// Shrink the name until it fits between the mark and the right edge (x 30 to 84).
document.fonts.ready.then(() => { let fs = 12; while (el.getComputedTextLength() > 54 && fs > 7) { fs -= 0.25; el.setAttribute("font-size", fs); } });
</script>
</body>
</html>
